<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="wren-edition" content="admin">
  <meta name="theme-color" content="#080f1e">
  <!-- PWA installability (b-pwa): declared directly here (not left to
       wren-shell-v2.js's generic fallback injection) so Roost gets its own
       square icon instead of the raw non-square /little-angels-logo.png.
       wren-shell-v2.js's _ensurePWA() is idempotent (querySelector guard),
       so it will skip these once it sees them already present. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Roost">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Wren — Admin</title>
  <link rel="stylesheet" href="/css/wren.css">
  <link rel="stylesheet" href="/css/wren-shell-v2.css?v=20260828-b242">
  <!-- b351 — the appearance engine, synchronous so a saved palette is on the page before first paint -->
  <script src="/js/wren-theme.js?v=b351"></script>
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <script src="/js/device-detect.js" defer></script>
  <!-- wren-shell-v2.js bootstraps the SPA: auth, sidebar, routing, section loading -->
  <script src="/icons/wren-icons.js?v=b146" defer></script>
  <!-- b273 — the EY More menu declaration, so Settings → Permissions → Navigation
       can arrange it like any other edition. Read lazily by the shell, so this only
       has to load before the matrix screen is opened; the order here is belt-and-braces. -->
  <script src="/js/wren-ey-more-nav.js?v=20261001" defer></script>
  <!-- b525 — the HR app nav, so Settings → Permissions → Navigation lists the real
       HR menu for edition "hr" instead of the dead NAV_MPA.hr sidebar. -->
  <script src="/js/wren-hr-nav.js?v=b525" defer></script>
  <script src="/js/wren-shell-v2.js?v=b504" defer></script>
  <!-- b296 — one implementation of the embedded-page frame sizing, shared by every
       section that embeds a Wren page. `defer` keeps it ordered before the sections'
       own inline scripts. -->
  <script src="/js/wren-embed-frame.js?v=b296" defer></script>
</head>
<body>
  <!-- Shell JS injects #wren-topbar, #wren-sidebar, and #wren-main around this -->
  <div id="section-content" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
