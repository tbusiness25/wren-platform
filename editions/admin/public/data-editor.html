<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Editor · Roost</title>
  <link rel="stylesheet" href="/css/wren.css">
<!-- b351 — the appearance engine, synchronous so a saved palette is on the page before first paint -->
<script src="/js/wren-theme.js?v=b351"></script>
  <link rel="stylesheet" href="/css/wren-shell-v2.css">
  <script src="/icons/wren-icons.js?v=b146" defer></script>
  <script src="/js/wren-shell-v2.js" defer></script>
  <style>
    .de-wrap { padding: 18px 22px; }
    .de-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
    .de-head h1 { font-size:20px; margin:0; }
    .de-tables { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .de-tab { padding:7px 14px; border:1px solid #cbd5e1; border-radius:20px; background:#fff; cursor:pointer; font-size:13px; font-weight:600; color:#334155; }
    .de-tab.active { background:#4a9abf; color:#fff; border-color:#4a9abf; }
    .de-note { font-size:12px; color:#64748b; margin-bottom:10px; }
    .de-table-wrap { overflow-x:auto; border:1px solid #e2e8f0; border-radius:10px; background:#fff; }
    table.de { border-collapse:collapse; width:100%; font-size:13px; }
    table.de th { position:sticky; top:0; background:#f1f5f9; text-align:left; padding:9px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#475569; cursor:pointer; white-space:nowrap; border-bottom:1px solid #e2e8f0; user-select:none; }
    table.de th .arrow { opacity:.4; font-size:10px; }
    table.de th.sorted .arrow { opacity:1; color:#4a9abf; }
    table.de td { padding:8px 12px; border-bottom:1px solid #f1f5f9; white-space:nowrap; }
    table.de td.editable { cursor:text; }
    table.de td.editable:hover { background:#f0f9ff; outline:1px dashed #7dd3fc; }
    table.de td.readonly { color:#94a3b8; }
    table.de tr:hover td { background:#fafcff; }
    .de-cell-input { width:100%; box-sizing:border-box; border:1px solid #4a9abf; border-radius:5px; padding:4px 6px; font-size:13px; }
    .de-saved { animation: deflash 1.1s ease; }
    @keyframes deflash { 0%{background:#bbf7d0;} 100%{background:transparent;} }
    .de-err { animation: deflasherr 1.6s ease; }
    @keyframes deflasherr { 0%{background:#fecaca;} 100%{background:transparent;} }
    .de-toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; z-index:50; }
    .de-toast.show { opacity:1; }
  </style>
</head>
<body>
<div class="de-wrap">
  <div class="de-head">
    <h1>🗂️ Data Editor</h1>
    <span class="de-note">Edit any table straight from Roost — click a column header to sort, double-click a cell to edit. Changes save instantly and are audited.</span>
  </div>
  <div class="de-tables" id="de-tables"></div>
  <div class="de-note" id="de-meta"></div>
  <div class="de-table-wrap"><table class="de" id="de-grid"><thead></thead><tbody></tbody></table></div>
</div>
<div class="de-toast" id="de-toast"></div>

<script>
let deTables = [];
let deCurrent = null;
let deSort = { col: 'id', dir: 'asc' };
let deCols = [];

function toast(msg) {
  const t = document.getElementById('de-toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function loadTables() {
  deTables = await Wren.api('/api/admin-crud/tables');
  const wrap = document.getElementById('de-tables');
  wrap.innerHTML = deTables.map(t =>
    `<button class="de-tab" data-table="${t.table}">${t.label}</button>`).join('');
  wrap.querySelectorAll('[data-table]').forEach(b =>
    b.addEventListener('click', () => selectTable(b.dataset.table)));
  if (deTables.length) selectTable(deTables[0].table);
}

async function selectTable(table) {
  deCurrent = table;
  deSort = { col: 'id', dir: 'asc' };
  document.querySelectorAll('.de-tab').forEach(b => b.classList.toggle('active', b.dataset.table === table));
  await loadGrid();
}

async function loadGrid() {
  const data = await Wren.api(`/api/admin-crud/${deCurrent}?sort=${encodeURIComponent(deSort.col)}&dir=${deSort.dir}`);
  deCols = data.columns;
  document.getElementById('de-meta').textContent =
    `${data.label} — ${data.rows.length} rows · ${deCols.filter(c=>c.editable).length} editable columns`;

  const thead = document.querySelector('#de-grid thead');
  thead.innerHTML = '<tr>' + deCols.map(c => {
    const sorted = c.name === deSort.col;
    const arrow = sorted ? (deSort.dir === 'asc' ? '▲' : '▼') : '↕';
    return `<th data-col="${c.name}" class="${sorted?'sorted':''}">${c.name}${c.editable?'':' 🔒'} <span class="arrow">${arrow}</span></th>`;
  }).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (deSort.col === col) deSort.dir = deSort.dir === 'asc' ? 'desc' : 'asc';
    else { deSort.col = col; deSort.dir = 'asc'; }
    loadGrid();
  }));

  const tbody = document.querySelector('#de-grid tbody');
  tbody.innerHTML = data.rows.map(row => {
    const id = row.id;
    return '<tr data-id="' + id + '">' + deCols.map(c => {
      const v = row[c.name];
      const disp = v === null || v === undefined ? '' : (v === true ? '✓' : v === false ? '—' : String(v));
      const cls = c.editable ? 'editable' : 'readonly';
      return `<td class="${cls}" data-col="${c.name}" data-raw="${v===null||v===undefined?'':String(v).replace(/"/g,'&quot;')}">${disp}</td>`;
    }).join('') + '</tr>';
  }).join('');

  tbody.querySelectorAll('td.editable').forEach(td =>
    td.addEventListener('dblclick', () => beginEdit(td)));
}

function beginEdit(td) {
  if (td.querySelector('input')) return;
  const col = td.dataset.col;
  const raw = td.dataset.raw || '';
  const tr = td.closest('tr');
  const id = tr.dataset.id;
  const input = document.createElement('input');
  input.className = 'de-cell-input';
  input.value = raw;
  td.textContent = '';
  td.appendChild(input);
  input.focus();
  input.select();

  const commit = async () => {
    const value = input.value;
    if (value === raw) { td.textContent = displayVal(raw); return; }
    try {
      await Wren.api(`/api/admin-crud/${deCurrent}/${id}`, {
        method: 'PATCH', body: JSON.stringify({ column: col, value })
      });
      td.dataset.raw = value;
      td.textContent = displayVal(value);
      td.classList.add('de-saved');
      setTimeout(() => td.classList.remove('de-saved'), 1100);
      toast('Saved');
    } catch (e) {
      td.textContent = displayVal(raw);
      td.classList.add('de-err');
      setTimeout(() => td.classList.remove('de-err'), 1600);
      toast('Error: ' + (e.message || 'save failed'));
    }
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { td.textContent = displayVal(raw); }
  });
}
function displayVal(v) {
  if (v === '' || v === null) return '';
  if (v === 'true') return '✓'; if (v === 'false') return '—';
  return String(v);
}

document.addEventListener('wren:ready', () => {
  loadTables().catch(e => toast('Load failed: ' + e.message));
});
</script>
</body>
</html>
