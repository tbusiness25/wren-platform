<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox · Roost</title>
  <link rel="stylesheet" href="/css/wren.css">
  <script src="/js/wren-theme.js"></script>
  <link rel="stylesheet" href="/css/wren-shell-v2.css">
  <link rel="stylesheet" href="/css/wren-hermes-inbox.css?v=b364">
  <!--
    b364 (2026-09-29) — the inbox, run by Hermes on the local models.

    Toby, 2026-09-24: "Hermes would send notifications when it receives them, and
    give context, a suggested reply, and options, and explain its reasoning …
    Can be used by myself and the office manager at any time."
    Toby, 2026-09-28: "I'd like to view in sections based on who it's addressed
    to, or what it's about."

    A STANDALONE Roost page rather than a thirteenth tab on Communications. The
    Comms page is a set of screens you glance at; this is one you sit in for an
    hour, and a tab strip that already scrolls sideways is not where that goes.
    The sidebar entry is registered in public/js/wren-shell-v2.js under the Comms
    group, appended so nothing moves.

    It reads the SAME comms_email_queue the b338 shared inbox does. There is no
    second mailbox and no second Gmail connection, and sending a reply is the same
    POST /api/comms/emails/:id/send-draft the comms hub has always used — which
    means there is exactly one code path in Wren that can put an email on the
    wire, and it takes a person's click.

    Access is NOT a role check. src/lib/inbox-access.js requires the Roost portal
    AND membership of settings.comms_manager_staff_ids AND a comms_mailbox_access
    grant: Toby, the office manager and the admissions lead, plus anyone Toby adds. A manager who is not on
    that list gets a 403 that says what to do about it.
  -->
  <style>
    body { background: var(--c-bg, #0f172a); color: var(--c-text, #f1f5f9);
           font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; margin: 0; }
  </style>
  <meta name="wren-edition" content="admin">
</head>
<body data-portal="admin">

<div id="hi-mount">
  <div class="hi-wrap"><div class="hi-skel"><div></div><div></div><div></div><div></div></div></div>
</div>

<script src="/js/wren-core.js?v=20260904-devbanner"></script>
<!-- 2026-10-05 (Toby): "the new inbox page doesn't have the sidebar". It never loaded the
     Roost shell; the shell wraps this page's own content (it moves #hi-mount, so the
     inbox mounted below keeps working) and adds the sidebar + top bar. -->
<script src="/icons/wren-icons.js?v=b146"></script>
<script src="/js/wren-shell-v2.js"></script>
<script src="/js/wren-hermes-inbox.js?v=b364"></script>
<script>
  // Roost standalone pages have no wren:ready — they are not the SPA shell. Mount
  // on DOMContentLoaded, which is what the other standalone Roost pages do.
  (function () {
    function go() { window.WrenHermesInbox.mount('hi-mount'); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
    else go();
  })();
</script>
</body>
</html>
