<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="wren-edition" content="admin">
<title>Morning Board — Wren Admin</title>
<link rel="stylesheet" href="/css/wren.css">
<!-- b351 — the appearance engine, synchronous so a saved palette is on the page before first paint -->
<script src="/js/wren-theme.js?v=b351"></script>
<link rel="stylesheet" href="/css/wren-shell-v2.css">
<link rel="stylesheet" href="/css/wren-morning-board.css?v=b286">
<script src="/icons/wren-icons.js?v=b146" defer></script>
<script src="/js/wren-shell-v2.js" defer></script>
<script src="/js/wren-morning-board.js?v=b286" defer></script>
<style>
  /* b286 §"Where it lives" — the SAME board a practitioner sees at
     /ey/my-morning, on Roost, with the practitioner filter free to change so a
     manager can look at anyone's list. Chrome only: the board itself is
     /js/wren-morning-board.js and /css/wren-morning-board.css, shared with the
     EY page so the two can never disagree.
     Roost opens on the whole setting rather than "my children" — a manager is
     not usually a key person, and an empty board would read as "nothing to do". */
  .mb-page-head { max-width: 1200px; margin: 0 auto; padding: 18px 12px 0; }
  .mb-page-head h1 { font-size: 1.35rem; margin: 0 0 4px; color: var(--c-text); }
  .mb-page-head p  { margin: 0; font-size: .85rem; color: var(--c-muted); line-height: 1.5; max-width: 68ch; }
</style>
</head>
<body>

<div class="mb-page-head">
  <h1>Morning Board</h1>
  <p>What is outstanding across the eight strands a practitioner is asked to keep up with. This is the same
     page they open at 8am — pick a key person to see exactly their list. Read-only; a row opens the child’s record.</p>
</div>

<div class="mb-wrap">
  <div id="mb-root"></div>
</div>

<script>
(function () {
  // Both the shell (for the token) and wren-morning-board.js (a defer script,
  // so not necessarily executed when this inline block runs) have to be in
  // place. Whichever lands second triggers the mount; the flag stops a double.
  var shell = !!(window.Wren && window.Wren.user), mounted = false;
  function go() {
    if (mounted || !shell || !window.WrenMorningBoard) return;
    mounted = true;
    WrenMorningBoard.mount({ portal: 'admin', root: '#mb-root' });
  }
  document.addEventListener('wren:ready', function () { shell = true; go(); });
  window.addEventListener('load', go);
  go();
})();
</script>
</body>
</html>
