<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="wren-edition" content="admin">
  <title>Notification Settings — Wren Admin</title>
  <link rel="stylesheet" href="/css/wren.css">
<!-- b351 — the appearance engine, synchronous so a saved palette is on the page before first paint -->
<script src="/js/wren-theme.js?v=b351"></script>
  <link rel="stylesheet" href="/css/wren-shell-v2.css">
  <script src="/icons/wren-icons.js?v=b146" defer></script>
  <script src="/js/wren-shell-v2.js" defer></script>
  <script src="/js/wren-notification-matrix.js?v=b230" defer></script>
  <style>
    /* Page chrome only — every control below comes from the shared matrix
       component, which brings its own (token-based) styles. */
    .ns-head { margin-bottom:18px; }
    .ns-head .page-title { display:flex; align-items:center; gap:9px; }
    .ns-note { font-size:.8rem; color:var(--c-text-muted); line-height:1.55; margin-top:4px; max-width:70ch; }
    .ns-note a { color:var(--c-blue); }
    .ns-wrap { max-width:1100px; }
    @media (max-width:640px) { .ns-head .page-title { font-size:1.15rem; } }
  </style>
</head>
<body>
<!-- ============================================================================
     b230 (2026-08-25).

     This page existed since b212 but was linked from NOWHERE — no admin nav
     entry, no reference in wren-shell-v2.js, nothing. That is exactly why Toby
     said "i thought you had already set that up for me, but i couldnt see it".

     Two things changed:
       1. It is reachable: Roost sidebar → Notifications → Settings & devices,
          Settings → System Tools, and System → Notifications all lead here or
          to the same component.
       2. It no longer speaks to the OLD /api/notifications/prefs/* endpoints.
          It mounts /js/wren-notification-matrix.js, which uses
          /api/notification-matrix — the single source of truth. The old
          endpoints still exist for anything else calling them, but they now
          write through the same server-side store, so nothing can disagree.
     ========================================================================= -->
<div id="wren-content">
  <div class="ns-wrap">
    <div class="page-header ns-head">
      <div>
        <div class="page-title">🔔 Notification settings</div>
        <div class="ns-note">
          Every notification Wren can send, per member of staff, per portal — and which device it reaches.
          The same screen lives inside Roost at <a href="/admin/notifications/settings">Notifications → Settings &amp; devices</a>,
          alongside the categorised list of everything that has already fired.
        </div>
      </div>
    </div>

    <div id="ns-device"></div>
    <div id="ns-matrix" style="margin-top:18px"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function boot() {
    if (!window.WrenNotificationMatrix) return setTimeout(boot, 120);
    WrenNotificationMatrix.mountDeviceCard(document.getElementById('ns-device'));
    WrenNotificationMatrix.mount(document.getElementById('ns-matrix'));
  }
  // wren:ready fires at the end of buildShell(); on a chrome-only page it may
  // already have fired by the time this inline script runs, so cover both.
  if (window.Wren && window.Wren.user) boot();
  else document.addEventListener('wren:ready', boot);
})();
</script>
</body>
</html>
