<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="wren-edition" content="admin">
<title>Forms waiting for parents — Wren Admin</title>
<link rel="stylesheet" href="/css/wren.css">
<!-- b351 — the appearance engine, synchronous so a saved palette is on the page before first paint -->
<script src="/js/wren-theme.js?v=b351"></script>
<link rel="stylesheet" href="/css/wren-shell-v2.css">
<script src="/icons/wren-icons.js?v=b146" defer></script>
<script src="/js/wren-shell-v2.js" defer></script>
<style>
/* b343 (2026-09-21) — the office's list behind the "forms waiting more than a week" card. Chase-up only: the parents' app
   never locks anyone out. Tokens only (var(--c-*)), checked light AND dark. */
.pf-panel { border: 1px solid var(--c-border); border-radius: 12px; background: var(--c-surface); padding: 14px; margin-bottom: 12px; }
.pf-sum { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.pf-chip { border: 1px solid var(--c-border); border-radius: 999px; padding: 4px 12px; font-size: .8rem; color: var(--c-text); background: var(--c-surface); }
.pf-chip b { color: var(--c-blue); }
.pf-tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.pf-tbl th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--c-muted); padding: 6px 8px; border-bottom: 1px solid var(--c-border); }
.pf-tbl td { padding: 8px; border-bottom: 1px solid var(--c-border); color: var(--c-text); vertical-align: top; }
.pf-tbl a { color: var(--c-blue); text-decoration: none; font-weight: 600; }
.pf-tbl a:hover { text-decoration: underline; }
.pf-old { color: var(--c-amber); font-weight: 700; }
.pf-none { color: var(--c-red); font-weight: 700; }
.pf-empty { text-align: center; padding: 28px 12px; color: var(--c-muted); }
@media (max-width: 640px) { .pf-tbl thead { display: none; } .pf-tbl tr { display: block; padding: 6px 0; } .pf-tbl td { display: block; border: 0; padding: 2px 8px; } }
</style>
</head>
<body>
<div id="wren-content">

  <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    <div>
      <div class="page-title" style="font-size:1.05rem">Forms waiting for parents</div>
      <div style="font-size:.78rem;color:var(--c-muted);margin-top:2px;max-width:640px">
        Medicine forms, accident forms, reports and two-year checks a parent has been asked to sign in the app and has not yet. The app keeps asking
        (and never locks a family out); this is your list to chase at the door or by phone. Oldest first.
      </div>
    </div>
  </div>

  <div class="pf-sum" id="pf-sum"></div>
  <div class="pf-panel" id="pf-body"><div class="pf-empty">Loading…</div></div>

</div>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function errText(e, fb) { return (e && (e.error || e.message)) || fb; }      // Wren.api rejects with the response BODY, not an Error
  function days(iso) { return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000)); }
  function when(iso) { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Europe/London' }); }

  function draw(d) {
    var body = document.getElementById('pf-body'), sum = document.getElementById('pf-sum');
    if (!d.forms.length) { sum.innerHTML = ''; body.innerHTML = '<div class="pf-empty">Nothing is waiting for a parent’s signature.</div>'; return; }
    var by = {}; d.forms.forEach(function (f) { by[f.kind_label] = (by[f.kind_label] || 0) + 1; });
    var over = d.forms.filter(function (f) { return days(f.waiting_since) >= 7; }).length;
    sum.innerHTML = '<span class="pf-chip"><b>' + d.total + '</b> waiting</span><span class="pf-chip"><b>' + over + '</b> for a week or more</span>' +
      Object.keys(by).map(function (k) { return '<span class="pf-chip"><b>' + by[k] + '</b> ' + esc(k.toLowerCase()) + '</span>'; }).join('');
    body.innerHTML = '<table class="pf-tbl"><thead><tr><th>Child</th><th>Form</th><th>Waiting since</th><th>Reminders sent</th><th>Can sign in?</th></tr></thead><tbody>' +
      d.forms.map(function (f) {
        var n = days(f.waiting_since);
        return '<tr><td><a href="/child-profile.html?id=' + f.child_id + '">' + esc(f.child_name) + '</a></td><td>' + esc(f.kind_label) + '</td>' +
          '<td>' + esc(when(f.waiting_since)) + ' <span class="' + (n >= 7 ? 'pf-old' : '') + '">(' + n + ' day' + (n === 1 ? '' : 's') + ')</span></td>' +
          '<td>' + f.nudges + '</td><td>' + (f.can_sign_in ? 'Yes' : '<span class="pf-none">No login — the family cannot see it</span>') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function boot() {
    Wren.api('/api/parent-forms/outstanding').then(draw).catch(function (e) {
      document.getElementById('pf-body').innerHTML = '<div class="pf-empty">' + esc(errText(e, 'Could not load.')) + '</div>';
    });
  }
  if (window.Wren && Wren.user) boot(); else document.addEventListener('wren:ready', boot);
})();
</script>
</body>
</html>
