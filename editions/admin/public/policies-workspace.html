<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="wren-edition" content="admin">
  <title>Policies — Wren</title>
  <link rel="stylesheet" href="/css/wren.css">
  <link rel="stylesheet" href="/css/wren-shell-v2.css">
  <script src="/icons/wren-icons.js?v=b146" defer></script>
  <script src="/js/wren-shell-v2.js" defer></script>
  <style>
    .pw-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
    @media(max-width:800px){.pw-wrap{grid-template-columns:1fr}}
    .pw-list{background:#0f172a;border:1px solid #2d3748;border-radius:12px;max-height:78vh;overflow-y:auto}
    .pw-cat{font-size:.7rem;text-transform:uppercase;color:#64748b;padding:10px 12px 4px;letter-spacing:.04em}
    .pw-item{padding:8px 12px;border-top:1px solid #1e293b;cursor:pointer;color:#cbd5e1;font-size:.85rem}
    .pw-item:hover{background:#162133}
    .pw-item.active{background:#1e3a5f;color:#fff}
    .pw-main{background:#0f172a;border:1px solid #2d3748;border-radius:12px;padding:16px;min-height:60vh}
    .pw-body{white-space:pre-wrap;font-size:.85rem;color:#cbd5e1;line-height:1.55;max-height:34vh;overflow-y:auto;background:#0b1220;border:1px solid #1e293b;border-radius:8px;padding:12px;margin:8px 0}
    .pw-ai{background:#0b1220;border:1px solid #1e293b;border-radius:8px;padding:12px;margin-top:8px}
    .pw-review{background:#0b1220;border:1px solid #1e293b;border-radius:8px;padding:12px;margin-top:8px}
    .pw-review input{background:#1e293b;border:1px solid #334155;border-radius:7px;color:#f1f5f9;padding:7px;font-size:.85rem;margin-top:3px}
    .pw-ai textarea,.pw-ai input{width:100%;background:#1e293b;border:1px solid #334155;border-radius:7px;color:#f1f5f9;padding:8px;font-size:.85rem;margin-bottom:6px}
    .pw-answer{white-space:pre-wrap;font-size:.85rem;color:#e2e8f0;line-height:1.5;background:#0f1e17;border:1px solid #14532d;border-radius:8px;padding:12px;margin-top:8px}
    .pw-draft{white-space:pre-wrap;font-size:.82rem;color:#e2e8f0;line-height:1.5;background:#1a1408;border:1px solid #78350f;border-radius:8px;padding:12px;margin-top:8px;max-height:40vh;overflow-y:auto}
    .pw-src{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:.82rem;color:#94a3b8}
    .pw-src select{background:#1e293b;border:1px solid #334155;border-radius:7px;color:#f1f5f9;padding:5px 8px}
    .spin{opacity:.6}

    /* b231 — EYFS 2026 countdown + policy verdicts. Token-only (var(--c-*));
       tints via color-mix so they stay correct if the palette is retuned. */
    .fw-card{border:1px solid var(--c-border);border-radius:12px;padding:14px 16px;margin-bottom:14px;
             background:var(--c-card)}
    .fw-card.is-urgent{border-color:var(--c-red);
             background:color-mix(in srgb, var(--c-red) 10%, var(--c-card))}
    .fw-card.is-soon{border-color:var(--c-amber);
             background:color-mix(in srgb, var(--c-amber) 10%, var(--c-card))}
    .fw-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
    .fw-title{font-weight:700;color:var(--c-text);font-size:1rem}
    .fw-days{font-size:1.5rem;font-weight:800;line-height:1}
    .fw-days.is-urgent{color:var(--c-red)} .fw-days.is-soon{color:var(--c-amber)}
    .fw-days.is-ok{color:var(--c-green)}
    .fw-sub{font-size:.78rem;color:var(--c-muted);margin-top:2px}
    .fw-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .fw-stat{border:1px solid var(--c-border);border-radius:9px;padding:6px 10px;min-width:96px;
             background:var(--c-surface);cursor:pointer}
    .fw-stat:hover{border-color:var(--c-blue)}
    .fw-stat.active{border-color:var(--c-blue);
             background:color-mix(in srgb, var(--c-blue) 16%, var(--c-surface))}
    .fw-stat-n{font-size:1.15rem;font-weight:800;color:var(--c-text)}
    .fw-stat-l{font-size:.68rem;color:var(--c-muted);text-transform:uppercase;letter-spacing:.03em}
    .fw-note{font-size:.72rem;color:var(--c-muted);margin-top:9px;line-height:1.45}
    .fw-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

    .fw-badge{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.03em;
              padding:1px 6px;border-radius:5px;vertical-align:middle;margin-left:6px;white-space:nowrap}
    .v-must_change {background:var(--c-red);   color:var(--c-bg)}
    .v-needs_review{background:var(--c-amber); color:var(--c-bg)}
    .v-ok          {background:var(--c-green); color:var(--c-bg)}
    .v-error       {background:var(--c-muted); color:var(--c-bg)}

    .fw-check{border:1px solid var(--c-border);border-radius:8px;padding:12px;margin-top:8px;
              background:var(--c-surface)}
    .fw-check.v-border-must_change{border-left:4px solid var(--c-red)}
    .fw-check.v-border-needs_review{border-left:4px solid var(--c-amber)}
    .fw-check.v-border-ok{border-left:4px solid var(--c-green)}
    .fw-stmt{border:1px solid var(--c-border);border-radius:7px;padding:9px 10px;margin-top:7px;
             background:var(--c-bg)}
    .fw-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;color:var(--c-blue)}
    .fw-txt{font-size:.8rem;color:var(--c-text);line-height:1.5;margin-top:4px;white-space:pre-wrap}
    .fw-was{font-size:.75rem;color:var(--c-muted);line-height:1.45;margin-top:6px;
            padding-top:6px;border-top:1px dashed var(--c-border);white-space:pre-wrap}
    .fw-chg{font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:5px;
            background:color-mix(in srgb, var(--c-amber) 26%, transparent);color:var(--c-amber)}
    .fw-diff-list{max-height:56vh;overflow-y:auto;margin-top:10px}

    /* b236 — EYFS 2026 draft queue. Same rules as b231 above: var(--c-*) only,
       tints via color-mix so a palette retune carries. Wren ships one palette
       (a single :root in wren.css, no prefers-color-scheme block), so there is
       no second theme to check against — but nothing here hard-codes a colour,
       so a light palette would carry through untouched. */
    .dq-group{margin-top:16px}
    .dq-group-h{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
                color:var(--c-text);margin-bottom:2px}
    .dq-group-s{font-size:.74rem;color:var(--c-muted);margin-bottom:8px;line-height:1.45}
    .dq-item{border:1px solid var(--c-border);border-radius:10px;padding:12px 14px;margin-bottom:10px;
             background:var(--c-surface)}
    .dq-item.d-new_2026{border-left:4px solid var(--c-red)}
    .dq-item.d-pre_existing{border-left:4px solid var(--c-amber)}
    .dq-item.d-record_defect{border-left:4px solid var(--c-muted)}
    .dq-item.is-decided{opacity:.72}
    .dq-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
    .dq-t{font-weight:700;color:var(--c-text);font-size:.92rem;line-height:1.35}
    .dq-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
    .dq-tag{font-size:.6rem;font-weight:800;letter-spacing:.03em;padding:2px 6px;border-radius:5px;
            border:1px solid var(--c-border);color:var(--c-muted);white-space:nowrap}
    .dq-tag.t-new_2026    {background:var(--c-red);   color:var(--c-bg);border-color:transparent}
    .dq-tag.t-pre_existing{background:var(--c-amber); color:var(--c-bg);border-color:transparent}
    .dq-tag.t-record_defect{background:var(--c-muted);color:var(--c-bg);border-color:transparent}
    .dq-tag.t-verify{background:color-mix(in srgb, var(--c-amber) 22%, transparent);
                     color:var(--c-amber);border-color:var(--c-amber)}
    .dq-tag.t-code{color:var(--c-blue);border-color:var(--c-blue);
                   font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .dq-why{font-size:.8rem;color:var(--c-text);line-height:1.5;margin-top:8px}
    .dq-red{display:grid;gap:8px;margin-top:10px}
    @media(min-width:900px){.dq-red.two-up{grid-template-columns:1fr 1fr}}
    .dq-side{border:1px solid var(--c-border);border-radius:8px;padding:9px 11px;background:var(--c-bg)}
    .dq-side.before{border-left:3px solid var(--c-red)}
    .dq-side.after {border-left:3px solid var(--c-green)}
    .dq-side-l{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
               color:var(--c-muted);margin-bottom:5px}
    .dq-side-t{font-size:.79rem;color:var(--c-text);line-height:1.55;white-space:pre-wrap}
    .dq-del{background:color-mix(in srgb, var(--c-red) 26%, transparent);
            text-decoration:line-through;text-decoration-thickness:1px;border-radius:3px;padding:0 1px}
    .dq-ins{background:color-mix(in srgb, var(--c-green) 26%, transparent);
            border-radius:3px;padding:0 1px}
    .dq-proc{border:1px solid var(--c-amber);border-radius:8px;padding:9px 11px;margin-top:9px;
             background:color-mix(in srgb, var(--c-amber) 10%, var(--c-bg))}
    .dq-proc-l{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
               color:var(--c-amber);margin-bottom:4px}
    .dq-proc-t{font-size:.78rem;color:var(--c-text);line-height:1.5}
    .dq-stat{border:1px solid var(--c-border);border-radius:8px;margin-top:9px;background:var(--c-bg)}
    .dq-stat summary{cursor:pointer;padding:7px 10px;font-size:.74rem;color:var(--c-blue);
                     list-style:none;user-select:none}
    .dq-stat summary::-webkit-details-marker{display:none}
    .dq-stat-b{padding:0 10px 10px;font-size:.78rem;color:var(--c-text);line-height:1.5}
    .dq-was{font-size:.74rem;color:var(--c-muted);line-height:1.45;margin-top:7px;padding-top:7px;
            border-top:1px dashed var(--c-border);white-space:pre-wrap}
    .dq-act{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
    .dq-act input,.dq-act textarea{background:var(--c-bg);border:1px solid var(--c-border);
            border-radius:7px;color:var(--c-text);padding:7px;font-size:.79rem;font-family:inherit}
    .dq-act input{flex:1;min-width:180px}
    .dq-edit{width:100%;min-height:150px;margin-top:9px;line-height:1.5}
    .dq-done{font-size:.76rem;color:var(--c-green);margin-top:9px;line-height:1.45}
    .dq-done.is-rejected{color:var(--c-muted)}
    .dq-warn{border:1px solid var(--c-amber);border-radius:9px;padding:9px 12px;margin-top:9px;
             font-size:.76rem;color:var(--c-text);line-height:1.5;
             background:color-mix(in srgb, var(--c-amber) 12%, var(--c-card))}
    .dq-q{width:100%;border-collapse:collapse;margin-top:9px;font-size:.78rem}
    .dq-q th{text-align:left;font-size:.63rem;text-transform:uppercase;letter-spacing:.04em;
             color:var(--c-muted);padding:5px 7px;border-bottom:1px solid var(--c-border);font-weight:800}
    .dq-q td{padding:6px 7px;border-bottom:1px solid var(--c-border);color:var(--c-text);
             vertical-align:top;line-height:1.45}
    .dq-q tr.is-short td{background:color-mix(in srgb, var(--c-red) 8%, transparent)}
    .dq-q .dq-q-t{cursor:pointer;color:var(--c-blue)}
    .dq-q-wrap{max-height:60vh;overflow-y:auto;margin-top:4px}

    /* b274 — parent acceptance roll for a parent-facing policy. Token-only,
       following b231/b236 rather than this file's older literal slate. */
    .pa-card{border:1px solid var(--c-border);border-radius:10px;padding:12px 14px;margin-top:8px;
             background:var(--c-surface)}
    .pa-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
    .pa-title{font-weight:700;color:var(--c-text);font-size:.92rem}
    .pa-stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
    .pa-stat{border:1px solid var(--c-border);border-radius:9px;padding:6px 10px;min-width:92px;
             background:var(--c-card)}
    .pa-stat.is-todo{border-color:var(--c-red);
             background:color-mix(in srgb, var(--c-red) 12%, var(--c-card))}
    .pa-stat.is-lapsed{border-color:var(--c-amber);
             background:color-mix(in srgb, var(--c-amber) 12%, var(--c-card))}
    .pa-stat.is-done{border-color:var(--c-green);
             background:color-mix(in srgb, var(--c-green) 12%, var(--c-card))}
    .pa-stat-n{font-size:1.15rem;font-weight:800;color:var(--c-text)}
    .pa-stat-l{font-size:.66rem;color:var(--c-muted);text-transform:uppercase;letter-spacing:.03em}
    .pa-roll{max-height:38vh;overflow-y:auto;margin-top:8px;border:1px solid var(--c-border);
             border-radius:8px;background:var(--c-card)}
    .pa-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
            padding:7px 11px;border-top:1px solid var(--c-border);font-size:.79rem;color:var(--c-text)}
    .pa-row:first-child{border-top:0}
    .pa-when{color:var(--c-muted);font-size:.72rem;text-align:right}
    .pa-pill{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.03em;
             padding:1px 7px;border-radius:5px;white-space:nowrap;margin-left:6px}
    .pa-pill.ok{background:var(--c-green);color:var(--c-bg)}
    .pa-pill.todo{background:var(--c-red);color:var(--c-bg)}
    .pa-pill.lapsed{background:var(--c-amber);color:var(--c-bg)}
    .pa-note{font-size:.72rem;color:var(--c-muted);margin-top:8px;line-height:1.45}

    /* ── b285 — the reviewer: order, edit, preview, publish, history ─────────
       Token-only (var(--c-*)), tints via color-mix, following b231/b236/b274
       rather than this file's older literal slate. Nothing here hard-codes a
       colour, so a retuned palette — including a light one applied by
       wren-theme.js — carries through untouched. */
    .rv-card{border:1px solid var(--c-border);border-radius:10px;padding:12px 14px;margin-top:8px;
             background:var(--c-surface)}
    .rv-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
    .rv-title{font-weight:700;color:var(--c-text);font-size:.92rem}
    .rv-sub{font-size:.74rem;color:var(--c-muted);line-height:1.45}
    .rv-note{font-size:.72rem;color:var(--c-muted);margin-top:8px;line-height:1.5}
    .rv-bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
    .rv-field{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--c-muted)}
    .rv-card input,.rv-card textarea,.rv-card select{background:var(--c-bg);border:1px solid var(--c-border);
             border-radius:7px;color:var(--c-text);padding:7px;font-size:.82rem;font-family:inherit}
    /* Fill the grid cell: a date input sizes itself to its placeholder otherwise,
       and the three fields end up ragged. The buttons in .rv-bar are excluded. */
    .rv-field input,.rv-field textarea,.rv-field select{width:100%}
    .rv-text{width:100%;min-height:340px;line-height:1.55;white-space:pre;overflow-wrap:normal;overflow-x:auto;
             font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem}
    .rv-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px}
    @media(min-width:760px){.rv-grid{grid-template-columns:2fr 1fr 1fr}}
    .rv-flag{border:1px solid var(--c-amber);border-radius:9px;padding:8px 11px;margin-top:8px;
             font-size:.76rem;color:var(--c-text);line-height:1.5;
             background:color-mix(in srgb, var(--c-amber) 12%, var(--c-card))}
    .rv-flag.is-live{border-color:var(--c-green);
             background:color-mix(in srgb, var(--c-green) 12%, var(--c-card))}
    .rv-flag.is-bad{border-color:var(--c-red);
             background:color-mix(in srgb, var(--c-red) 12%, var(--c-card))}
    .rv-pill{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.03em;
             padding:1px 7px;border-radius:5px;white-space:nowrap;margin-left:6px}
    .rv-pill.updated{background:var(--c-green);color:var(--c-bg)}
    .rv-pill.live{background:var(--c-blue);color:var(--c-bg)}
    .rv-pill.unchanged{background:var(--c-muted);color:var(--c-bg)}
    .rv-pill.not_configured{background:var(--c-amber);color:var(--c-bg)}
    .rv-pill.error{background:var(--c-red);color:var(--c-bg)}
    .rv-surface{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
                padding:7px 0;border-top:1px solid var(--c-border);font-size:.78rem;color:var(--c-text)}
    .rv-surface:first-child{border-top:0}
    .rv-prev{border:1px solid var(--c-border);border-radius:8px;background:var(--c-bg);padding:12px;
             margin-top:8px;max-height:46vh;overflow-y:auto}
    .rv-prev .accordion{border:1px solid var(--c-border);border-radius:7px;margin-bottom:6px;
             background:var(--c-surface)}
    .rv-prev .accordion-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
             padding:7px 10px;cursor:default}
    .rv-prev .accordion-head h4{margin:0;font-size:.8rem;color:var(--c-text);font-weight:700}
    .rv-prev .chevron{color:var(--c-muted);font-size:.7rem}
    .rv-prev .accordion-body{padding:0 10px 9px;font-size:.78rem;color:var(--c-muted);line-height:1.55}
    .rv-prev .accordion-body p{margin:6px 0}
    .rv-ver{border-top:1px solid var(--c-border);padding:8px 0;font-size:.79rem;color:var(--c-text)}
    .rv-ver:first-child{border-top:0}
    .rv-ver-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;cursor:pointer}
    .rv-ver-n{font-weight:800;color:var(--c-blue);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .rv-ver-w{color:var(--c-muted);font-size:.72rem}
    .rv-diff{display:grid;gap:8px;margin-top:8px}
    @media(min-width:900px){.rv-diff.two-up{grid-template-columns:1fr 1fr}}
    .rv-side{border:1px solid var(--c-border);border-radius:8px;padding:9px 11px;background:var(--c-bg);
             max-height:44vh;overflow-y:auto}
    .rv-side.before{border-left:3px solid var(--c-red)}
    .rv-side.after {border-left:3px solid var(--c-green)}
    .rv-side-l{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
               color:var(--c-muted);margin-bottom:5px}
    .rv-side-t{font-size:.77rem;color:var(--c-text);line-height:1.6;white-space:pre-wrap}

    /* the list, in the setting's order */
    .pw-item-cat{font-size:.66rem;color:var(--c-muted);margin-top:2px}
    .pw-item.is-dragging{opacity:.45}
    .pw-item.drop-above{box-shadow:inset 0 2px 0 0 var(--c-blue)}
    .pw-item.drop-below{box-shadow:inset 0 -2px 0 0 var(--c-blue)}
    .pw-order-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:9px 11px;
                  border-bottom:1px solid var(--c-border);background:var(--c-surface);
                  position:sticky;top:0;z-index:2}
    .pw-order-bar .rv-sub{flex-basis:100%}
    .pw-grip{color:var(--c-muted);cursor:grab;margin-right:6px;user-select:none}
  </style>
</head>
<body>
<div id="wren-content">
  <div class="page-header">
    <h1 class="page-title">Policies</h1>
    <div class="page-subtitle">Your policies, with AI to clarify and draft rewrites. Rewrites are drafts — you review and publish.</div>
  </div>

  <div class="pw-src">
    <span>Reference source for AI:</span>
    <select id="pw-source" onchange="setSource(this.value)">
      <option value="own">Our own policies only</option>
      <option value="dfe_ofsted">DfE / Ofsted statutory</option>
      <option value="eya">Early Years Alliance (our uploaded pack)</option>
    </select>
    <span style="color:#64748b">· AI uses your policy text + public statutory guidance. Nothing auto-publishes.</span>
  </div>

  <!-- b231 — EYFS 2026 state card. Sits ABOVE the legislation watcher panel:
       the watcher says "a gov.uk page changed", this says "and here is what it
       does to us, and when". -->
  <div id="fw-state"></div>
  <div id="fw-diff"></div>
  <!-- b236 — EYFS 2026 draft queue. Appended below b231's state + diff cards. -->
  <div id="fw-drafts"></div>

  <div id="pw-targets" style="margin-bottom:14px"></div>
  <div id="pw-legislation" style="margin-bottom:14px"></div>

  <div class="pw-wrap">
    <div class="pw-list" id="pw-list"><div style="padding:16px;color:#94a3b8">Loading…</div></div>
    <div class="pw-main" id="pw-main"><div style="color:#94a3b8">Select a policy to view it, ask the AI a question, or draft a rewrite.</div></div>
  </div>
</div>

<script>
let POLICIES = [], CUR = null;
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function load(){
  try{
    const d = await Wren.api('/api/policies');
    POLICIES = Array.isArray(d) ? d : (d.policies||[]);
    renderList();
  }catch(e){ document.getElementById('pw-list').innerHTML='<div style="padding:16px;color:#ef4444">Could not load policies</div>'; }
  try{ const s = await Wren.api('/api/policies-ai/source'); document.getElementById('pw-source').value = s.source||'own'; }catch{}
  loadLegislation();
  loadFrameworkState();
}

/* ── b231 — EYFS 2026 ───────────────────────────────────────────────────────
   The countdown, the verdict tally, and the old-vs-new diff. Everything here
   is READ-only apart from the sign-off, which is the whole point: the model's
   verdict is advice and a human records the decision. */
let FW_CHECKS = {}, FW_FILTER = null, FW_STATE = null;

function fwVerdictLabel(v){
  return {must_change:'MUST CHANGE', needs_review:'NEEDS REVIEW', ok:'OK', error:'CHECK FAILED'}[v] || v;
}

async function loadFrameworkState(){
  const host = document.getElementById('fw-state');
  try{
    const d = await Wren.api('/api/framework-compliance/state');
    FW_STATE = d;
    if(!d.ready){
      host.innerHTML = `<div class="fw-card"><div class="fw-title">EYFS 2026 not ingested</div>
        <div class="fw-sub">${esc(d.message||'')}</div></div>`;
      return;
    }
    const days = d.framework.days_until;
    const tone = days == null ? 'is-ok' : (days <= 14 ? 'is-urgent' : (days <= 60 ? 'is-soon' : 'is-ok'));
    const v = d.verdicts||{}, p = d.policies||{};
    const when = days > 0 ? `applies in ${days} day${days===1?'':'s'}`
               : (days === 0 ? 'applies TODAY' : `has applied for ${Math.abs(days)} day${Math.abs(days)===1?'':'s'}`);

    const stat = (key,n,label) => `<div class="fw-stat ${FW_FILTER===key?'active':''}" onclick="fwFilter('${key}')">
        <div class="fw-stat-n">${n}</div><div class="fw-stat-l">${label}</div></div>`;

    host.innerHTML = `
      <div class="fw-card ${tone==='is-ok'?'':tone}">
        <div class="fw-top">
          <div>
            <div class="fw-title">📕 EYFS 2026 ${esc(when)}</div>
            <div class="fw-sub">${esc(d.framework.document_title||'EYFS statutory framework')}
              · effective ${esc(String(d.framework.effective_from||'').slice(0,10))}
              · ${d.framework.statements} statements ingested
              ${d.framework.source_url?`· <a href="${esc(d.framework.source_url)}" target="_blank" rel="noopener" style="color:var(--c-blue)">source ↗</a>`:''}</div>
          </div>
          <div class="fw-days ${tone}">${days==null?'—':days}</div>
        </div>
        <div class="fw-stats">
          ${stat('must_change',  v.must_change||0,  'Must change')}
          ${stat('needs_review', v.needs_review||0, 'Need review')}
          ${stat('ok',           v.ok||0,           'Look OK')}
          ${v.error?stat('error', v.error, 'Check failed'):''}
          ${stat('__unchecked',  p.unchecked||0,    'Unchecked')}
        </div>
        <div class="fw-bar">
          <button class="btn btn-sm" style="background:var(--c-blue);color:var(--c-bg);border:none" onclick="fwLoadDiff()">
            What changed vs the old framework?</button>
          ${FW_FILTER?`<button class="btn btn-sm btn-ghost" onclick="fwFilter(null)">Clear filter</button>`:''}
        </div>
        <div class="fw-note">⚠️ ${esc(d.disclaimer||'')}
          ${d.last_checked_at?`<br>Last checked ${new Date(d.last_checked_at).toLocaleString('en-GB')}.`:''}</div>
      </div>`;

    // verdicts onto the policy list
    const c = await Wren.api('/api/framework-compliance/checks');
    FW_CHECKS = {};
    (c.policies||[]).forEach(r => { FW_CHECKS[r.policy_id] = r; });
    renderList();
  }catch(e){ host.innerHTML=''; }
}

function fwFilter(key){
  FW_FILTER = (FW_FILTER === key) ? null : key;
  renderList();
  loadFrameworkStateCardOnly();
}
/* Re-render just the card's active state without re-fetching everything. */
function loadFrameworkStateCardOnly(){
  document.querySelectorAll('.fw-stat').forEach(el=>{
    const k = (el.getAttribute('onclick')||'').match(/fwFilter\('([^']+)'\)/);
    el.classList.toggle('active', !!k && k[1]===FW_FILTER);
  });
  const bar = document.querySelector('.fw-bar');
  if(bar && !FW_FILTER){ const b=bar.querySelector('.btn-ghost'); if(b) b.remove(); }
  else if(bar && FW_FILTER && !bar.querySelector('.btn-ghost')){
    const b=document.createElement('button'); b.className='btn btn-sm btn-ghost';
    b.textContent='Clear filter'; b.onclick=()=>fwFilter(null); bar.appendChild(b);
  }
}

async function fwLoadDiff(){
  const host = document.getElementById('fw-diff');
  if(host.innerHTML){ host.innerHTML=''; return; }      // toggle
  host.innerHTML = '<div class="fw-card"><div class="fw-sub">Loading changes…</div></div>';
  try{
    const d = await Wren.api('/api/framework-compliance/diff?significance=material&limit=300');
    const byTopic = {};
    (d.changes||[]).forEach(r => (byTopic[r.topic]=byTopic[r.topic]||[]).push(r));
    const order = Object.keys(byTopic).sort((a,b)=>{
      const o=['ratios','qualifications','safeguarding','learning_development','other'];
      return o.indexOf(a)-o.indexOf(b);
    });
    host.innerHTML = `
      <div class="fw-card">
        <div class="fw-top">
          <div class="fw-title">📋 What changed — ${d.count} material changes</div>
          <button class="btn btn-sm btn-ghost" onclick="document.getElementById('fw-diff').innerHTML=''">Close</button>
        </div>
        <div class="fw-sub">Old framework vs the one effective 1 September 2026. This comparison is
          computed directly from the two published documents — no AI involved.</div>
        <div class="fw-diff-list">
        ${order.map(t=>`
          <div style="margin-top:12px">
            <div class="fw-stat-l" style="font-size:.72rem;color:var(--c-text);font-weight:800">
              ${esc((d.topic_labels||{})[t]||t)} (${byTopic[t].length})</div>
            ${byTopic[t].map(r=>`
              <div class="fw-stmt">
                <div>
                  <span class="fw-code">${esc(r.statement_code)}</span>
                  <span class="fw-chg">${esc(r.change_type.toUpperCase())}</span>
                  ${r.old_statement_code && r.old_statement_code!==r.statement_code
                    ? `<span class="fw-sub" style="display:inline"> · was ${esc(r.old_statement_code)}</span>`:''}
                  <span class="fw-sub" style="display:inline"> · ${esc(r.area||'')}${r.aspect?' / '+esc(r.aspect):''}</span>
                </div>
                ${r.new_text?`<div class="fw-txt">${esc(r.new_text)}</div>`:''}
                ${r.old_text?`<div class="fw-was"><b>Previously:</b> ${esc(r.old_text)}</div>`:''}
              </div>`).join('')}
          </div>`).join('')}
        </div>
      </div>`;
  }catch(e){ host.innerHTML='<div class="fw-card"><div class="fw-sub">Could not load the diff.</div></div>'; }
}

/* The EYFS 2026 verdict panel shown inside an open policy. */
async function fwPolicyPanel(policyId){
  const el = document.getElementById('fw-policy-check');
  if(!el) return;
  try{
    const d = await Wren.api('/api/framework-compliance/checks/'+policyId);
    const c = d.latest;
    if(!c){ el.innerHTML = `<div class="fw-check"><div class="fw-sub">Not yet checked against EYFS 2026.</div></div>`; return; }
    const byCode = {}; (d.statements||[]).forEach(s=>byCode[s.statement_code]=s);
    const findings = (c.findings||[]).length ? c.findings
                   : (c.statement_code?[{statement_code:c.statement_code,severity:c.verdict,reason:c.reason}]:[]);
    el.innerHTML = `
      <div class="fw-check v-border-${esc(c.verdict)}">
        <div class="fw-top">
          <div class="fw-title">📕 EYFS 2026 check
            <span class="fw-badge v-${esc(c.verdict)}">${esc(fwVerdictLabel(c.verdict))}</span></div>
          <span class="fw-sub">${c.checked_at?new Date(c.checked_at).toLocaleDateString('en-GB'):''}
            ${c.model?'· '+esc(c.model):''}</span>
        </div>
        ${c.reason?`<div class="fw-txt">${esc(c.reason)}</div>`:''}
        ${findings.map(f=>{
          const s = byCode[f.statement_code];
          return `<div class="fw-stmt">
            <div><span class="fw-code">${esc(f.statement_code||'')}</span>
              ${s&&s.change_type?`<span class="fw-chg">${esc(String(s.change_type).toUpperCase())} FOR 2026</span>`:''}
              ${s?`<span class="fw-sub" style="display:inline"> · ${esc(s.area||'')}${s.aspect?' / '+esc(s.aspect):''}</span>`:''}</div>
            ${f.reason?`<div class="fw-txt">${esc(f.reason)}</div>`:''}
            ${s?`<div class="fw-was"><b>Statutory text:</b> ${esc(s.statement_text)}</div>`:''}
          </div>`;
        }).join('')}
        <div class="fw-note">⚠️ AI-assisted finding from a local model — advice, not a compliance sign-off.
          Nothing in this policy has been changed automatically.</div>

          ? `<div class="fw-sub" style="margin-top:8px">✓ Signed off ${new Date(c.signed_off_at).toLocaleDateString('en-GB')}${c.sign_off_note?' — '+esc(c.sign_off_note):''}</div>`

/* ── b285 — the list, in the SETTING'S order ─────────────────────────────────
   It used to group by category and sort the group headings alphabetically, so
   "General policies" came before "Safeguarding & welfare" and the first thing on
   the screen was the green statement. the office manager: "Policies and procedures need to be
   put in order so safeguarding etc is first."

   The order now comes from the server — ladn.policies.sort_order, statutory-
   first — and this renders it flat, in exactly the sequence the API returned.
   The category is still shown, as a caption under each title, so nothing that
   was on the screen has been taken off it; it is just no longer what decides the
   sequence. Drag to reorder writes that sequence back. */
let PW_REORDER = false, PW_DRAG_ID = null;

function renderList(){
  // b231 — the list carries each policy's EYFS 2026 verdict, and the stat tiles
  // on the countdown card filter it. '__unchecked' means no check row at all.
  let list = POLICIES;
  if(FW_FILTER === '__unchecked') list = POLICIES.filter(p=>!(FW_CHECKS[p.id]&&FW_CHECKS[p.id].verdict));
  else if(FW_FILTER)              list = POLICIES.filter(p=>(FW_CHECKS[p.id]||{}).verdict===FW_FILTER);

  const host = document.getElementById('pw-list');
  const bar = `<div class="pw-order-bar">
      <button class="btn btn-xs ${PW_REORDER?'btn-primary':'btn-ghost'}" onclick="pwToggleReorder()">
        ${PW_REORDER ? 'Done reordering' : '↕ Reorder'}</button>
      ${PW_REORDER ? `<button class="btn btn-xs btn-ghost" onclick="pwResetOrder()">Statutory default</button>` : ''}
      ${PW_REORDER ? `<div class="rv-sub">Drag a policy onto another to move it. The order is saved as you drop,
        and it is the order staff and parents see too.</div>`
      : `<div class="rv-sub">Safeguarding first. This is the order every portal shows.</div>`}
    </div>`;

  if(!list.length){
    host.innerHTML = bar +
      '<div style="padding:16px;color:var(--c-muted);font-size:.85rem">No policies match this filter.</div>';
    return;
  }
  if(PW_REORDER && FW_FILTER){
    // Dragging a FILTERED list would write an order computed from a subset and
    // silently push everything hidden to the bottom. Say so instead.
    host.innerHTML = bar + '<div style="padding:14px;color:var(--c-amber);font-size:.8rem;line-height:1.5">'
      + 'Clear the EYFS filter above before reordering — dragging a filtered list would reorder only what you can see.'
      + '</div>';
    return;
  }

  host.innerHTML = bar + list.map(p=>{
    const v = (FW_CHECKS[p.id]||{}).verdict;
    const badge = v && v!=='ok' ? `<span class="fw-badge v-${esc(v)}">${esc(fwVerdictLabel(v))}</span>` : '';
    const flags = [p.parent_facing ? 'parents' : '', p.requires_acknowledgment ? 'must sign' : '']
      .filter(Boolean).join(' · ');
    return `<div class="pw-item" data-id="${p.id}" ${PW_REORDER?'draggable="true"':`onclick="openPolicy(${p.id})"`}>
        ${PW_REORDER?'<span class="pw-grip">⠿</span>':''}${esc(p.title)}${badge}
        <div class="pw-item-cat">${esc(p.category||'Uncategorised')}${flags?' · '+esc(flags):''}</div>
      </div>`;
  }).join('');

  if(PW_REORDER) pwWireDrag();
}

function pwToggleReorder(){ PW_REORDER = !PW_REORDER; renderList(); }

function pwWireDrag(){
  const items = Array.from(document.querySelectorAll('#pw-list .pw-item'));
  items.forEach(el=>{
    el.addEventListener('dragstart', e=>{
      PW_DRAG_ID = +el.dataset.id; el.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', String(PW_DRAG_ID)); }catch(_){}
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('is-dragging');
      items.forEach(x=>x.classList.remove('drop-above','drop-below'));
    });
    el.addEventListener('dragover', e=>{
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      const r = el.getBoundingClientRect();
      const above = (e.clientY - r.top) < r.height/2;
      el.classList.toggle('drop-above', above);
      el.classList.toggle('drop-below', !above);
    });
    el.addEventListener('dragleave', ()=>el.classList.remove('drop-above','drop-below'));
    el.addEventListener('drop', e=>{
      e.preventDefault();
      const targetId = +el.dataset.id;
      const r = el.getBoundingClientRect();
      const above = (e.clientY - r.top) < r.height/2;
      el.classList.remove('drop-above','drop-below');
      pwMove(PW_DRAG_ID, targetId, above);
    });
  });
}

/* Move `id` to just before/after `targetId` in POLICIES, then persist the whole
   sequence. The list is short (65 rows) so sending the full order is simpler and
   safer than computing a single new sort_order client-side. */
async function pwMove(id, targetId, above){
  if(!id || id===targetId) return;
  const from = POLICIES.findIndex(p=>p.id===id);
  if(from < 0) return;
  const moved = POLICIES.splice(from,1)[0];
  let to = POLICIES.findIndex(p=>p.id===targetId);
  if(to < 0){ POLICIES.splice(from,0,moved); return; }
  POLICIES.splice(above ? to : to+1, 0, moved);
  renderList();
  try{
    await Wren.api('/api/policies/reorder',{method:'POST', body:{order: POLICIES.map(p=>p.id)}});
    Wren.toast&&Wren.toast('Order saved','success');
  }catch(e){
    Wren.toast&&Wren.toast('Could not save the order','error');
    load();
  }
}

/* b186 — policy review cycle. review_due is new on ladn.policies; it drives the
   'policy_review' kind in /api/compliance/expiring and the nightly alert sweep. */
function reviewBadge(due){
  if(!due) return '<span style="color:#94a3b8">No review date set</span>';
  const d = new Date(String(due).slice(0,10)+'T00:00:00Z');
  const days = Math.round((d - new Date(new Date().toISOString().slice(0,10)+'T00:00:00Z'))/86400000);
  if(days < 0)  return `<span style="color:#ef4444">⚠️ Review overdue by ${Math.abs(days)} days</span>`;
  if(days <= 60) return `<span style="color:#f59e0b">Due in ${days} days</span>`;
  return `<span style="color:#22c55e">Due in ${days} days</span>`;
}
async function saveReview(){
  const due = document.getElementById('pw-review-due').value || null;
  const months = parseInt(document.getElementById('pw-review-int').value,10) || null;
  const msg = document.getElementById('pw-review-msg');
  msg.innerHTML = '<span style="color:#94a3b8">Saving\u2026</span>';
  try{
    const p = await Wren.api('/api/policies/'+CUR.id,{method:'PATCH',
      body:{review_due:due, review_interval_months:months}});
    CUR = Object.assign({}, CUR, p);
    msg.innerHTML = reviewBadge(p.review_due);
    Wren.toast&&Wren.toast('Review dates saved','success');
  }catch(e){ msg.innerHTML = '<span style="color:#ef4444">Could not save</span>'; }
}

/* ── b274 — parent acceptance ────────────────────────────────────────────────
   b249 added GET /api/policies/:id/parent-signatures and the parent signing
   page, but nothing ever rendered the manager's half, so "who has accepted the
   Terms & Conditions" was not answerable in Roost at all. This is that view.

   THE NUMBERS ARE PARENTS, NOT STAFF. b249 §4 kept parent signatures in their
   own table precisely because parent rows in policy_acknowledgments made the
   staff coverage figure read 40 of 18; the endpoint behind this panel counts
   parent_portal_access, and nothing here touches the staff roll.

   The middle number is the one that matters on a review. Bumping a version
   invalidates every acceptance — that is what the version in the UNIQUE key is
   for — so after a bump a family who signed the old text and a family who has
   never signed anything both read as outstanding. "Signed an older version"
   separates them, which is the difference between a reminder and a chase. */
function parentAcceptance(id, p){
  const host = document.getElementById('pw-parents');
  if(!host) return;
  if(!p || !p.parent_facing){ host.innerHTML=''; return; }
  host.innerHTML = '<div class="pa-card"><div class="pa-title">Parent acceptance</div>'
    + '<div class="pa-note">Loading…</div></div>';
  Wren.api('/api/policies/'+id+'/parent-signatures').then(function(d){
    var roll = d.parents || [];
    var accepted = d.accepted_count || 0;
    var todo = d.outstanding_count || 0;
    var lapsed = d.lapsed_count || 0;
    var never = Math.max(0, todo - lapsed);
    var vlabel = (p.version_label || p.version || 1);

    var rows = roll.length ? roll.map(function(r){
      var pill = r.accepted ? '<span class="pa-pill ok">Accepted</span>'
               : (r.prior_version != null ? '<span class="pa-pill lapsed">Older version</span>'
                                          : '<span class="pa-pill todo">Not accepted</span>');
      var when = r.accepted
        ? fmtWhen(r.accepted_at) + (r.source === 'enrolment' ? ' · at enrolment' : '')
        : (r.prior_version != null
            ? 'signed v' + r.prior_version + ' on ' + fmtWhen(r.prior_at)
            : 'never');
      return '<div class="pa-row"><div>' + esc(r.email) + pill
        + '<div class="pa-when" style="text-align:left">'
        + (r.children ? r.children + (r.children===1?' child':' children') : 'no child linked')
        + '</div></div><div class="pa-when">' + esc(when) + '</div></div>';
    }).join('') : '<div class="pa-row"><div style="color:var(--c-muted)">No active parent portal accounts yet.</div></div>';

    host.innerHTML = '<div class="pa-card">'
      + '<div class="pa-head"><div class="pa-title">Parent acceptance</div>'
      + '<div style="font-size:.72rem;color:var(--c-muted)">version ' + esc(String(vlabel))
      + (p.requires_parent_signature ? '' : ' · signature not required') + '</div></div>'
      + '<div class="pa-stats">'
      + '<div class="pa-stat ' + (accepted?'is-done':'') + '"><div class="pa-stat-n">' + accepted
      + '</div><div class="pa-stat-l">accepted</div></div>'
      + '<div class="pa-stat ' + (lapsed?'is-lapsed':'') + '"><div class="pa-stat-n">' + lapsed
      + '</div><div class="pa-stat-l">older version</div></div>'
      + '<div class="pa-stat ' + (never?'is-todo':'') + '"><div class="pa-stat-n">' + never
      + '</div><div class="pa-stat-l">never accepted</div></div>'
      + '<div class="pa-stat"><div class="pa-stat-n">' + (d.parent_count||0)
      + '</div><div class="pa-stat-l">parents</div></div>'
      + '</div>'
      + '<div class="pa-roll">' + rows + '</div>'
      + '<div class="pa-note">Counted against <b>active parent portal accounts</b>, one adult once '
      + 'however many children they have here — never against the staff list. Publishing a new '
      + 'version (Save review dates does not do this; a version bump does) invalidates every '
      + 'acceptance above and the parent hub asks each family again.</div>'
      + '</div>';
  }).catch(function(){
    host.innerHTML = '<div class="pa-card"><div class="pa-title">Parent acceptance</div>'
      + '<div class="pa-note" style="color:var(--c-red)">Could not load the acceptance roll.</div></div>';
  });
}

/* ── b236 — the EYFS 2026 draft queue ───────────────────────────────────────
   b231 put the verdicts on this page. This puts the DRAFTS on it: the actual
   proposed wording, as a redline, with Accept / Reject / Edit.

   Accepting STAGES a draft. It does not write ladn.policies, it does not bump a
   version and it does not publish. The API says the same thing back
   (staged_only:true) and the table's CHECK constraint has no 'published' value,
   so this is not a promise the front end is making on its own. */
let DQ = null, DQ_QUEUE_OPEN = false, DQ_QUEUE_ALL = false;

const DQ_GROUPS = [
  { key: 'new_2026', label: 'Driven by the 1 September change',
    sub: 'The framework text itself is new or changed here, so these are the ones with a real deadline. '
       + 'Each quotes the 2026 paragraph it comes from.' },
  { key: 'pre_existing', label: 'Pre-existing gaps the 2026 check surfaced',
    sub: 'Real gaps, but the wording of the framework did not change — checked against the published '
       + '2025 and 2026 documents, these paragraphs are identical or differ only by a typo fix. '
       + 'Worth fixing; not what makes 1 September a deadline.' },
  { key: 'record_defect', label: 'Not a drafting job — the stored record is broken',
    sub: 'The checker flagged these, but there is no policy text to redline: one is an annual review '
       + 'cover sheet, the other an unimported PDF stub. Drafting prose for them would paper over a '
       + 'records problem.' },
];
const DQ_DRIVER_LABEL = { new_2026: 'NEW FOR 2026', pre_existing: 'PRE-EXISTING', record_defect: 'RECORD DEFECT' };
const DQ_DELTA_LABEL = {
  new_requirement: 'new paragraph', obligation_change: 'obligation changed', removed: 'paragraph removed',
  wording_change: 'reworded', cosmetic: 'cosmetic only', renumber_only: 'renumbered only',
  unchanged: 'identical to 2025', no_citation: 'no citation',
};

/* Word-level redline. Small LCS — these are single paragraphs, not documents. */
function dqWordDiff(before, after){
  const a = String(before||'').split(/(\s+)/).filter(x=>x!=='');
  const b = String(after ||'').split(/(\s+)/).filter(x=>x!=='');
  const key = w => w.toLowerCase().replace(/[^a-z0-9]/g,'');
  const an = a.map(key), bn = b.map(key);
  const n = an.length, m = bn.length;
  if(n*m > 900000) return { before: esc(before), after: esc(after) };   // bail, show plain
  const L = [];
  for(let i=0;i<=n;i++) L.push(new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j] = an[i]===bn[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i=0,j=0; const outA=[], outB=[];
  const del = w => `<span class="dq-del">${esc(w)}</span>`;
  const ins = w => `<span class="dq-ins">${esc(w)}</span>`;
  while(i<n && j<m){
    if(an[i]===bn[j]){ outA.push(esc(a[i])); outB.push(esc(b[j])); i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]){ outA.push(a[i].trim()?del(a[i]):esc(a[i])); i++; }
    else { outB.push(b[j].trim()?ins(b[j]):esc(b[j])); j++; }
  }
  while(i<n){ outA.push(a[i].trim()?del(a[i]):esc(a[i])); i++; }
  while(j<m){ outB.push(b[j].trim()?ins(b[j]):esc(b[j])); j++; }
  return { before: outA.join(''), after: outB.join('') };
}

function dqItem(x){
  const decided = x.status !== 'draft';
  const target = x.kind === 'new_policy'
    ? `New policy · ${esc(x.new_category||'')}`
    : `Policy ${x.policy_id} · ${esc(x.policy_title||'')}`;
  const stmts = (x.statement_codes||[]).map(code => {
    const s = (DQ.statements||{})[code];
    if(!s) return '';
    const changed = s.change_type
      ? `<span class="fw-chg">${esc(String(s.change_type).toUpperCase())} FOR 2026</span>`
      : `<span class="fw-chg" style="background:color-mix(in srgb, var(--c-muted) 26%, transparent);color:var(--c-muted)">UNCHANGED SINCE 2025</span>`;
    return `<details class="dq-stat">
      <summary>📕 Read paragraph ${esc(code)} of the 2026 framework ${changed}</summary>
      <div class="dq-stat-b">${esc(s.statement_text)}
        ${s.old_text && s.old_text !== s.statement_text
          ? `<div class="dq-was"><b>The 2025 wording${s.old_statement_code && s.old_statement_code!==code ? ' (numbered '+esc(s.old_statement_code)+')' : ''}:</b> ${esc(s.old_text)}</div>` : ''}
      </div></details>`;
  }).join('');

  // A "no redline proposed" draft is a finding, not a rewrite — showing it as a
  // two-column diff against a cover sheet would be misleading, so it renders flat.
  const isFinding = /^NO REDLINE PROPOSED/.test(x.after_text||'');
  let redline;
  if(isFinding){
    redline = `<div class="dq-red"><div class="dq-side after" style="border-left-color:var(--c-muted)">
      <div class="dq-side-l">What to do instead</div>
      <div class="dq-side-t">${esc(x.after_text)}</div></div></div>`;
  } else if(x.kind === 'new_policy'){
    redline = `<div class="dq-red"><div class="dq-side after">
      <div class="dq-side-l">Proposed new policy — full text</div>
      <div class="dq-side-t">${esc(x.after_text)}</div></div></div>`;
  } else {
    const w = dqWordDiff(x.before_text, x.after_text);
    redline = `<div class="dq-red two-up">
      <div class="dq-side before"><div class="dq-side-l">Existing wording</div>
        <div class="dq-side-t">${w.before}</div></div>
      <div class="dq-side after"><div class="dq-side-l">Proposed wording</div>
        <div class="dq-side-t">${w.after}</div></div></div>`;
  }

  return `<div class="dq-item d-${esc(x.driver)} ${decided?'is-decided':''}" id="dq-${x.id}">
    <div class="dq-h">
      <div class="dq-t">${esc(x.title)}</div>
      <span class="fw-sub" style="white-space:nowrap">${target}</span>
    </div>
    <div class="dq-tags">
      <span class="dq-tag t-${esc(x.driver)}">${esc(DQ_DRIVER_LABEL[x.driver]||x.driver)}</span>
      ${(x.statement_codes||[]).map(c=>`<span class="dq-tag t-code">EYFS 2026 ¶${esc(c)}</span>`).join('')}
      ${x.confidence==='verify'?`<span class="dq-tag t-verify">DRAFT — VERIFY WITH OFSTED/LA</span>`:''}
      ${x.model?`<span class="dq-tag">${esc(x.model)}</span>`:`<span class="dq-tag">written by hand</span>`}
    </div>
    <div class="dq-why">${esc(x.rationale)}</div>
    ${stmts}
    ${redline}
    ${x.procedure_note?`<div class="dq-proc">
      <div class="dq-proc-l">A procedure, not prose</div>
      <div class="dq-proc-t">${esc(x.procedure_note)}</div></div>`:''}
    ${decided ? `
      <div class="dq-done ${x.status==='rejected'?'is-rejected':''}">
        ${x.status==='accepted'?'✓ Accepted — staged for your approval. The policy itself is unchanged.'
         :x.status==='edited' ?'✎ Edited and staged. Your wording is kept alongside the original draft.'
                              :'✕ Rejected.'}
        ${x.decided_at?` ${new Date(x.decided_at).toLocaleDateString('en-GB')}`:''}
        ${x.decision_note?` — ${esc(x.decision_note)}`:''}
      </div>
      ${x.edited_text?`<div class="dq-side after" style="margin-top:8px">
        <div class="dq-side-l">Your wording</div><div class="dq-side-t">${esc(x.edited_text)}</div></div>`:''}
      <div class="dq-act"><button class="btn btn-sm btn-ghost" onclick="dqReopen(${x.id})">Reopen</button></div>
    ` : `
      <div class="dq-act">
        <input id="dq-note-${x.id}" placeholder="Optional note — what you decided, and why">
        <button class="btn btn-sm" style="background:var(--c-green);color:var(--c-bg);border:none"
          onclick="dqDecide(${x.id},'accepted')">Accept</button>
        <button class="btn btn-sm btn-ghost" onclick="dqEdit(${x.id})">Edit</button>
        <button class="btn btn-sm btn-ghost" onclick="dqDecide(${x.id},'rejected')">Reject</button>
      </div>
      <div id="dq-editbox-${x.id}"></div>`}
  </div>`;
}

/* ═══ b285 — THE REVIEWER ═════════════════════════════════════════════════════
   Toby: "add a terms and conditions reviewer, so that when we update them there
   it automatically updates everywhere else it is, and make sure policies and
   terms and conditions reviewers are on admin portal."

   This page already had the AI half of a reviewer — ask a question, draft a
   rewrite, copy the draft — and no way to save an edit, publish one, or see what
   the previous wording was. "Copy draft" was the end of the road: the manager
   pasted it somewhere else, and ladn.policies was edited by hand or not at all.

   THE ONE RULE THIS ENFORCES. Everything a parent reads comes straight out of
   ladn.policies on the request, so writing that row IS publishing. An edit
   therefore goes to ladn.policy_edit_drafts, which nothing else reads, and
   nothing reaches a parent until Publish is pressed. The Publish button says so,
   and names every surface it reached afterwards.

   THE T&C IS NOT A SPECIAL CASE HERE. It is one row of ladn.policies like the
   other sixty-four, so it gets the same reviewer. The only thing that is special
   about it is that one of its surfaces — the public website — holds a copy that
   has to be regenerated, and that is handled server-side in
   src/lib/terms-publish.js, not here. */

let RV = { draft: null, live: null, stale: false, dirty: false };

function rvWhen(t){
  if(!t) return '—';
  try{ return new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return '—'; }
}
function rvDate(d){ return d ? String(d).slice(0,10) : ''; }

async function policyEditor(id, p){
  const host = document.getElementById('pw-editor');
  if(!host) return;
  host.innerHTML = '<div class="rv-card"><div class="rv-title">Edit &amp; publish</div>'
    + '<div class="rv-sub">Loading…</div></div>';
  let d;
  try{ d = await Wren.api('/api/policies/'+id+'/draft'); }
  catch(e){
    // A practitioner opening this page is not a bug — the API is manager-only.
    host.innerHTML = '<div class="rv-card"><div class="rv-title">Edit &amp; publish</div>'
      + '<div class="rv-sub">Editing a policy is manager-only. You can read this one above.</div></div>';
    return;
  }
  RV = { draft: d.draft, live: d.live, stale: !!d.stale, dirty: false };
  rvRenderEditor(id, p);
}

function rvRenderEditor(id, p){
  const host = document.getElementById('pw-editor');
  const dr = RV.draft;
  const src = dr || RV.live || p;
  const content = (dr ? dr.content : (RV.live||p).content) || '';

  const banner = dr
    ? `<div class="rv-flag ${RV.stale?'is-bad':''}">
        ${RV.stale
          ? `⚠️ <b>This draft was written against version ${esc(String(dr.base_version))}, and the live policy is now version ${esc(String((RV.live||p).version))}.</b>
             Somebody published in between. Read the live text above before you publish this, or discard the draft and start again.`
          : `✎ <b>There is an unpublished draft.</b> Saved ${esc(rvWhen(dr.updated_at))} by ${esc(dr.updated_by_name||'a manager')}.
             Nobody outside this screen can see it — parents and staff are still reading version ${esc(String((RV.live||p).version))}.`}
      </div>`
    : `<div class="rv-flag is-live">✓ <b>No unpublished draft.</b> What everyone is reading is version
        ${esc(String((RV.live||p).version))}${(RV.live||p).version_label?' ('+esc((RV.live||p).version_label)+')':''}.
        Editing below does not change that until you press Publish.</div>`;

  host.innerHTML = `
    <div class="rv-card" id="rv-editor">
      <div class="rv-head">
        <div class="rv-title">✍️ Edit &amp; publish</div>
        <div class="rv-sub">Draft is private · Publish is explicit</div>
      </div>
      ${banner}
      <div class="rv-grid" style="margin-top:10px">
        <label class="rv-field">Title
          <input id="rv-title" value="${esc(src.title || (RV.live||p).title || '')}"></label>
        <label class="rv-field">Version label <span style="opacity:.7">(what parents see)</span>
          <input id="rv-vlabel" placeholder="e.g. 1.1" value="${esc(src.version_label || (RV.live||p).version_label || '')}"></label>
        <label class="rv-field">In force from
          <input type="date" id="rv-eff" value="${esc(rvDate(src.effective_date || (RV.live||p).effective_date))}"></label>
      </div>
      <label class="rv-field">Category
        <input id="rv-cat" value="${esc(src.category || (RV.live||p).category || '')}"></label>
      <div class="rv-sub" style="margin:10px 0 4px">The document. Plain text — blank line between paragraphs, a
        heading on its own line IN CAPITALS. Every reader in Wren shows this as text, so a markdown
        <code>#</code> or <code>**</code> would appear on a parent's screen exactly as typed.</div>
      <textarea class="rv-text" id="rv-content" oninput="RV.dirty=true">${esc(content)}</textarea>
      <label class="rv-field" style="margin-top:8px">What changed, and why <span style="opacity:.7">(kept in the history)</span>
        <input id="rv-note" placeholder="e.g. Christmas closure dates updated for 2027-28"
               value="${esc((dr && dr.change_note) || '')}"></label>
      <div class="rv-bar">
        <button class="btn btn-sm btn-ghost" onclick="rvSaveDraft(${id})">Save draft</button>
        <button class="btn btn-sm btn-ghost" onclick="rvPreview(${id})">Preview</button>
        <button class="btn btn-sm" style="background:var(--c-green);color:var(--c-bg);border:none"
                onclick="rvPublish(${id})">Publish…</button>
        ${dr?`<button class="btn btn-sm btn-ghost" onclick="rvDiscard(${id})">Discard draft</button>`:''}
        <span class="rv-sub" id="rv-msg"></span>
      </div>
      <div id="rv-preview"></div>
      <div id="rv-result"></div>
      <div class="rv-note">Publishing bumps the version whenever the text or the title changed. A bump is what
        invalidates the signatures: every member of staff is asked to sign again, and every parent acceptance of
        the old version stops counting — which is deliberate, because a signature is against one version.</div>
    </div>`;
}

function rvBody(){
  return {
    title: (document.getElementById('rv-title')||{}).value || null,
    content: (document.getElementById('rv-content')||{}).value || '',
    category: (document.getElementById('rv-cat')||{}).value || null,
    version_label: (document.getElementById('rv-vlabel')||{}).value || null,
    effective_date: (document.getElementById('rv-eff')||{}).value || null,
    change_note: (document.getElementById('rv-note')||{}).value || null,
  };
}

async function rvSaveDraft(id){
  const msg = document.getElementById('rv-msg');
  msg.textContent = 'Saving…';
  try{
    await Wren.api('/api/policies/'+id+'/draft',{method:'PUT', body: rvBody()});
    msg.textContent = 'Draft saved — not published.';
    RV.dirty = false;
    await policyEditor(id, CUR);
  }catch(e){ msg.innerHTML = '<span style="color:var(--c-red)">Could not save the draft</span>'; }
}

async function rvDiscard(id){
  if(!confirm('Throw away the unpublished draft? The live policy is not affected.')) return;
  try{
    await Wren.api('/api/policies/'+id+'/draft',{method:'DELETE'});
    Wren.toast&&Wren.toast('Draft discarded','success');
    await policyEditor(id, CUR);
  }catch(e){ Wren.toast&&Wren.toast('Could not discard the draft','error'); }
}

/* Preview = what the text becomes on each surface. For the parents and staff
   readers that is the text itself (they render it as text, which is the point
   the markdown warning makes); for the public website it is the clause
   accordion, rendered here with the site's own class names so what you see is
   what gets written into index.html. */
async function rvPreview(id){
  const host = document.getElementById('rv-preview');
  if(host.innerHTML){ host.innerHTML=''; return; }
  host.innerHTML = '<div class="rv-sub" style="margin-top:8px">Rendering…</div>';
  try{
    const b = rvBody();
    const d = await Wren.api('/api/policies/preview',{method:'POST', body:b});
    const secs = d.sections || [];
    host.innerHTML = `
      <div class="rv-card" style="margin-top:10px">
        <div class="rv-head">
          <div class="rv-title">Preview</div>
          <button class="btn btn-xs btn-ghost" onclick="document.getElementById('rv-preview').innerHTML=''">Close</button>
        </div>
        ${d.markdown_found ? `<div class="rv-flag is-bad">⚠️ <b>This text contains markdown.</b> Wren shows a policy as
          plain text, so a parent would see the <code>#</code> and <code>**</code> characters themselves. Use a line
          IN CAPITALS for a heading and a blank line between paragraphs.</div>` : ''}
        <div class="rv-sub" style="margin-top:8px">${secs.length} section${secs.length===1?'':'s'} detected:
          ${esc(secs.slice(0,6).map(x=>x.display).join(' · '))}${secs.length>6?' …':''}</div>
        <div class="rv-sub" style="margin-top:10px;color:var(--c-text);font-weight:700">As the public website will show it</div>
        <div class="rv-prev">${d.accordion_html || '<div class="rv-sub">Nothing to render.</div>'}</div>
        <div class="rv-sub" style="margin-top:10px;color:var(--c-text);font-weight:700">As parents and staff will read it</div>
        <div class="pw-body" style="max-height:26vh">${esc(d.plain)}</div>
      </div>`;
  }catch(e){ host.innerHTML = '<div class="rv-flag is-bad">Could not render a preview.</div>'; }
}

async function rvPublish(id){
  const b = rvBody();
  if(!b.content.trim()){ Wren.toast&&Wren.toast('There is nothing to publish','error'); return; }
  const live = RV.live || CUR || {};
  const changing = b.content !== (live.content||'') || (b.title||'') !== (live.title||'');
  const who = live.parent_facing ? 'parents and staff' : 'staff';
  if(!confirm(
      (changing
        ? 'Publish this as version ' + ((live.version||1) + 1) + '?\n\n'
          + 'It becomes what ' + who + ' read immediately.\n'
          + 'Every existing signature against version ' + (live.version||1) + ' stops counting, and everyone is asked to sign again.'
        : 'Publish? The text has not changed, so the version stays at ' + (live.version||1)
          + ' and no signature is invalidated.')
      + '\n\nThis cannot be undone from here — the old version is kept in the history, but the new one goes live now.')) return;

  const msg = document.getElementById('rv-msg');
  msg.textContent = 'Publishing…';
  try{
    // from_draft:false — publish exactly what is on the screen, which may be
    // edited since the draft was saved. The server still snapshots and versions.
    const d = await Wren.api('/api/policies/'+id+'/publish',{method:'POST',
      body: Object.assign({}, b, { from_draft:false })});
    msg.textContent = '';
    RV.dirty = false;
    rvShowResult(d);
    Wren.toast&&Wren.toast(d.bumped ? ('Published version '+d.policy.version) : 'Published (version unchanged)','success');
    await load();                    // the list may have re-sorted
    await openPolicy(id);            // reload the whole panel from the server
    rvShowResult(d);                 // openPolicy wiped the host — put it back
  }catch(e){
    msg.innerHTML = '<span style="color:var(--c-red)">Publish failed — nothing was changed</span>';
  }
}

/* "report every surface that was updated" — this is that report. Statuses come
   from the server, not from what the button hoped would happen. */
function rvShowResult(d){
  const host = document.getElementById('rv-result');
  if(!host) return;
  const label = { updated:'updated', live:'live from the database', unchanged:'already current',
                  not_configured:'not set up', error:'FAILED' };
  const bad = (d.surfaces||[]).filter(s=>s.status==='error' || s.status==='not_configured');
  host.innerHTML = `
    <div class="rv-card" style="margin-top:10px">
      <div class="rv-head">
        <div class="rv-title">${d.bumped ? 'Published as version '+esc(String(d.policy.version)) : 'Published — version unchanged'}</div>
        <button class="btn btn-xs btn-ghost" onclick="document.getElementById('rv-result').innerHTML=''">Close</button>
      </div>
      <div class="rv-sub">${esc(rvWhen(d.version && d.version.published_at))}${d.bumped?' · was version '+esc(String(d.previous_version)):''}</div>
      <div style="margin-top:10px">
        ${(d.surfaces||[]).map(s=>`
          <div class="rv-surface">
            <div>${esc(s.label)}<span class="rv-pill ${esc(s.status)}">${esc(label[s.status]||s.status)}</span>
              <div class="rv-sub">${esc(s.detail||'')}</div></div>
          </div>`).join('')}
      </div>
      ${bad.length ? `<div class="rv-flag ${bad.some(x=>x.status==='error')?'is-bad':''}">
        ${bad.length} surface${bad.length===1?'':'s'} did not update. Everything else did — the policy itself is
        published and the portals are showing it.</div>` : ''}
    </div>`;
}

/* ── version history + diff ──────────────────────────────────────────────────

   ⚠️ dqWordDiff (b236) CANNOT be used on a whole policy. It is a word-level LCS
   with a `n*m > 900000` bail-out, sized for the single paragraphs the EYFS
   redline queue compares. The Terms & Conditions is ~2,600 words, so n*m is
   about 6.8 million: it bails and returns the two texts PLAIN. The panel then
   paints perfectly and shows no highlighting at all — a diff that looks like it
   worked and marked nothing. (Caught by scripts/b285-render-probe.js asserting
   on the count of .dq-ins marks rather than on the panel being present.)

   So a policy diff is done by LINE first — a document changes by lines, and 400
   lines square is a matrix a browser does not notice — and then dqWordDiff is
   run WITHIN a changed run, where it is the right size for its own guard. The
   b236 queue keeps calling dqWordDiff directly and is untouched. */

/* Line-level LCS. Returns {before, after} as escaped HTML with .dq-del/.dq-ins
   marks, the same classes the redline queue uses, so one set of styles covers
   both. */
function rvLineDiff(beforeText, afterText){
  const a = String(beforeText||'').split('\n');
  const b = String(afterText ||'').split('\n');
  const n = a.length, m = b.length;
  if(n*m > 4000000){                       // 2000x2000 lines — far beyond any policy
    return { before: esc(beforeText), after: esc(afterText), bailed: true };
  }
  const norm = l => l.replace(/\s+/g,' ').trim();
  const an = a.map(norm), bn = b.map(norm);
  const L = [];
  for(let i=0;i<=n;i++) L.push(new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j] = an[i]===bn[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);

  const outA=[], outB=[];
  let i=0, j=0;
  const flushRun = (del, ins) => {
    // A one-for-one replacement is where a word-level redline earns its keep,
    // and a single line is well inside dqWordDiff's own guard.
    if(del.length === ins.length && del.length && del.length <= 60){
      for(let k=0;k<del.length;k++){
        const w = dqWordDiff(del[k], ins[k]);
        outA.push(w.before); outB.push(w.after);
      }
      return;
    }
    del.forEach(l => outA.push(l.trim() ? '<span class="dq-del">'+esc(l)+'</span>' : esc(l)));
    ins.forEach(l => outB.push(l.trim() ? '<span class="dq-ins">'+esc(l)+'</span>' : esc(l)));
  };
  while(i<n && j<m){
    if(an[i]===bn[j]){ outA.push(esc(a[i])); outB.push(esc(b[j])); i++; j++; continue; }
    const del=[], ins=[];
    while(i<n && j<m && an[i]!==bn[j]){
      if(L[i+1][j] >= L[i][j+1]){ del.push(a[i]); i++; }
      else { ins.push(b[j]); j++; }
    }
    flushRun(del, ins);
  }
  const del=[], ins=[];
  while(i<n){ del.push(a[i]); i++; }
  while(j<m){ ins.push(b[j]); j++; }
  flushRun(del, ins);
  return { before: outA.join('\n'), after: outB.join('\n'), bailed: false };
}
async function policyHistory(id){
  const host = document.getElementById('pw-history');
  if(!host) return;
  let d;
  try{ d = await Wren.api('/api/policies/'+id+'/versions'); }
  catch(e){ host.innerHTML=''; return; }
  const vs = d.versions || [];
  host.innerHTML = `
    <div class="rv-card">
      <div class="rv-head">
        <div class="rv-title">🕘 Version history</div>
        <div class="rv-sub">${vs.length} version${vs.length===1?'':'s'}</div>
      </div>
      ${vs.length ? vs.map(v=>`
        <div class="rv-ver" id="rv-ver-${v.version}">
          <div class="rv-ver-h" onclick="rvOpenVersion(${id},${v.version})">
            <div><span class="rv-ver-n">v${esc(String(v.version))}</span>
              ${v.version_label?' <span class="rv-ver-w">labelled '+esc(v.version_label)+'</span>':''}
              <div class="rv-ver-w">${esc(v.change_note || 'No note left.')}</div></div>
            <div class="rv-ver-w" style="text-align:right">${esc(rvWhen(v.published_at))}<br>${esc(v.edited_by_name||'unknown')}</div>
          </div>
          <div id="rv-verbody-${v.version}"></div>
        </div>`).join('')
      : '<div class="rv-sub">No history yet.</div>'}
      <div class="rv-note">Every publish through this screen writes a row here with the full text, who published it
        and when. Versions from before the history existed are marked <i>before version history</i> — the text they
        replaced was never kept, so there is nothing to show for them and this does not pretend otherwise.</div>
    </div>`;
}

async function rvOpenVersion(id, version){
  const box = document.getElementById('rv-verbody-'+version);
  if(!box) return;
  if(box.innerHTML){ box.innerHTML=''; return; }
  box.innerHTML = '<div class="rv-sub">Loading…</div>';
  try{
    const d = await Wren.api('/api/policies/'+id+'/versions/'+version);
    const v = d.version, prev = d.previous;
    if(!prev){
      box.innerHTML = `<div class="rv-diff"><div class="rv-side after">
        <div class="rv-side-l">Version ${esc(String(v.version))} — the earliest kept</div>
        <div class="rv-side-t">${esc(v.content)}</div></div></div>
        <div class="rv-note">Nothing to compare against: this is the oldest version in the history.</div>`;
      return;
    }
    const w = rvLineDiff(prev.content, v.content);
    box.innerHTML = `
      ${w.bailed?`<div class="rv-flag">This document is too large to redline in the browser; both versions are
        shown in full instead.</div>`:''}
      <div class="rv-diff two-up">
        <div class="rv-side before"><div class="rv-side-l">Version ${esc(String(prev.version))} — what it said before</div>
          <div class="rv-side-t">${w.before}</div></div>
        <div class="rv-side after"><div class="rv-side-l">Version ${esc(String(v.version))} — ${esc(v.edited_by_name||'unknown')}, ${esc(rvWhen(v.published_at))}</div>
          <div class="rv-side-t">${w.after}</div></div>
      </div>
      ${v.surfaces && v.surfaces.length ? `<div class="rv-sub" style="margin-top:8px">Reached on publish:
        ${esc(v.surfaces.map(s=>s.label+' ('+s.status+')').join(' · '))}</div>` : ''}`;
  }catch(e){ box.innerHTML = '<div class="rv-sub" style="color:var(--c-red)">Could not load that version.</div>'; }
}

/* ── where publishing sends things ───────────────────────────────────────────
   The public website is the ONE surface that holds a copy rather than reading
   the database, so it is the one that can be out of step — and it can only be
   written to if somebody has said where it is. This card says plainly whether
   that is set up, rather than letting a publish quietly skip it.

   It is deliberately NOT defaulted server-side: wren-ladn AND wren-ladn-dev both
   bind-mount the live public site read-write at /app/website-live, so a default
   would let a publish on the dev container rewrite the real nursery website. */
async function loadTargets(){
  const host = document.getElementById('pw-targets');
  if(!host) return;
  let d;
  try{ d = await Wren.api('/api/policies/terms/target'); }
  catch(e){ host.innerHTML=''; return; }   // not a manager — nothing to configure
  const state = !d.configured ? 'not_configured' : (d.markers ? 'updated' : 'error');
  const line = !d.configured
    ? 'Not set. Publishing the Terms &amp; Conditions will update every surface except the public website.'
    : (d.markers
        ? 'Ready. Publishing the Terms &amp; Conditions regenerates the clause list on the website from this database.'
        : 'Set, but the page is not wired up yet.');
  host.innerHTML = `
    <div class="rv-card">
      <div class="rv-head">
        <div class="rv-title">🌐 Publishing targets<span class="rv-pill ${esc(state)}">${
          !d.configured ? 'not set up' : (d.markers ? 'ready' : 'needs one step')}</span></div>
        <button class="btn btn-xs btn-ghost" onclick="rvEditTarget()">Change</button>
      </div>
      <div class="rv-sub" style="margin-top:6px">${line}</div>
      ${d.configured?`<div class="rv-sub" style="margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">${esc(d.file||d.dir)}</div>`:''}
      ${d.hint?`<div class="rv-flag ${d.configured&&!d.markers?'':'is-live'}" style="${d.configured&&!d.markers?'':'display:none'}">${esc(d.hint)}</div>`:''}
      <div id="rv-target-edit"></div>
      <div class="rv-note">Everywhere else — the parents portal, the enrolment form, the parent guide, the fees page,
        the EY policy list — reads this database on every request, so those are current the moment you publish and
        there is nothing to configure for them.</div>
    </div>`;
}

function rvEditTarget(){
  const box = document.getElementById('rv-target-edit');
  if(!box) return;
  if(box.innerHTML){ box.innerHTML=''; return; }
  box.innerHTML = `
    <div class="rv-bar">
      <input id="rv-target-dir" style="flex:1;min-width:240px" placeholder="/opt/site-manager/data/sites/www">
      <button class="btn btn-sm btn-primary" onclick="rvSaveTarget()">Save</button>
      <button class="btn btn-sm btn-ghost" onclick="rvEditTarget()">Cancel</button>
    </div>
    <div class="rv-sub">The directory the public website is served from, as this server sees it. Leave it empty to
      turn the website surface off. An empty value is not a failure — it means publishing updates the portals and
      leaves the website alone.</div>`;
  Wren.api('/api/policies/terms/target').then(d=>{
    const el = document.getElementById('rv-target-dir'); if(el) el.value = d.dir || '';
  }).catch(()=>{});
}

async function rvSaveTarget(){
  const dir = (document.getElementById('rv-target-dir')||{}).value || '';
  try{
    await Wren.api('/api/policies/terms/target',{method:'PUT', body:{dir}});
    Wren.toast&&Wren.toast(dir?'Publishing target saved':'Website surface turned off','success');
    await loadTargets();
  }catch(e){ Wren.toast&&Wren.toast('Could not save that path','error'); }
}

document.addEventListener('wren:ready', load);
document.addEventListener('wren:ready', loadDrafts);   // b236 — EYFS 2026 draft queue
document.addEventListener('wren:ready', loadTargets);  // b285 — where publishing sends things
</script>
</body>
</html>
