<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recruitment · Wren</title>
<link rel="stylesheet" href="/css/wren.css">
<!-- b351 — the appearance engine, synchronous so a saved palette is on the page before first paint -->
<script src="/js/wren-theme.js?v=b351"></script><link rel="stylesheet" href="/css/wren-shell-v2.css">
<style>
 :root{--bg:#080f1e;--card:#0f1a34;--bd:rgba(255,255,255,.10);--txt:#f1f5f9;--mut:#94a3b8;
   --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--blue:#4a9abf;--orange:#e07820}
 .rc-wrap{padding:18px;max-width:1500px;margin:0 auto;color:var(--txt)}
 h1{font-size:1.3rem;margin:0 0 2px}.sub{color:var(--mut);font-size:.85rem;margin-bottom:12px}
 .banner{font-size:.82rem;color:var(--mut);margin:6px 0;min-height:1em}
 .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
 .tabs{display:flex;gap:6px}
 .tab{background:#0b1428;border:1px solid var(--bd);color:var(--mut);border-radius:9px;padding:8px 14px;
   font-size:.85rem;font-weight:600;cursor:pointer;min-height:40px}
 .tab.active{border-color:var(--blue);color:var(--txt);box-shadow:0 0 0 1px var(--blue) inset}
 .spacer{flex:1}
 select,input,textarea{background:#0b1428;border:1px solid var(--bd);color:var(--txt);border-radius:8px;
   padding:9px 10px;font-size:.85rem;font-family:inherit}
 textarea{width:100%;resize:vertical;line-height:1.5}
 label{display:block;font-size:.75rem;color:var(--mut);font-weight:600;text-transform:uppercase;
   letter-spacing:.04em;margin:10px 0 4px}
 .btn{background:var(--blue);border:1px solid var(--blue);color:#04121b;border-radius:9px;padding:9px 15px;
   font-size:.85rem;font-weight:700;cursor:pointer;min-height:40px}
 .btn:hover{filter:brightness(1.08)}
 .btn.ghost{background:transparent;color:var(--txt);border-color:var(--bd)}
 .btn.orange{background:var(--orange);border-color:var(--orange);color:#1a0d02}
 .btn.danger{background:transparent;color:var(--bad);border-color:rgba(239,68,68,.4)}
 .btn.sm{padding:6px 11px;font-size:.78rem;min-height:34px}
 .hide{display:none!important}
 .empty{text-align:center;color:var(--mut);padding:40px 0;font-size:.9rem}

 /* ── Kanban ── */
 .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
 .col{background:var(--card);border:1px solid var(--bd);border-radius:12px;min-width:230px;width:230px;
   flex:0 0 auto;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
 .col-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;
   align-items:center;font-weight:700;font-size:.82rem;position:sticky;top:0}
 .col-head .cnt{background:#0b1428;border:1px solid var(--bd);border-radius:999px;padding:1px 9px;
   font-size:.72rem;color:var(--mut)}
 .col-body{padding:8px;overflow-y:auto;flex:1;min-height:60px}
 .col.drop{outline:2px dashed var(--blue);outline-offset:-4px}
 .appcard{background:#0b1428;border:1px solid var(--bd);border-radius:9px;padding:9px 10px;margin-bottom:8px;
   cursor:grab;font-size:.82rem}
 .appcard:hover{border-color:var(--blue)}
 .appcard .nm{font-weight:700}
 .appcard .vc{color:var(--mut);font-size:.72rem;margin-top:2px}
 .appcard .row{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;align-items:center}
 .pill{display:inline-block;font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:999px;
   background:#132443;color:var(--mut);border:1px solid var(--bd)}
 .pill.on{background:rgba(34,197,94,.16);color:var(--ok);border-color:transparent}
 .src{font-size:.66rem;color:var(--mut)}
 .cv-dot{color:var(--blue);font-size:.72rem}

 /* stage accent bars */
 .s-applied .col-head{border-top:3px solid #64748b;border-radius:12px 12px 0 0}
 .s-shortlist .col-head{border-top:3px solid var(--blue);border-radius:12px 12px 0 0}
 .s-interview .col-head{border-top:3px solid #a855f7;border-radius:12px 12px 0 0}
 .s-offer .col-head{border-top:3px solid var(--orange);border-radius:12px 12px 0 0}
 .s-hired .col-head{border-top:3px solid var(--ok);border-radius:12px 12px 0 0}
 .s-rejected .col-head{border-top:3px solid var(--bad);border-radius:12px 12px 0 0}

 /* ── Vacancies list ── */
 .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
 .vcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
 .vcard h3{margin:0 0 3px;font-size:1rem}
 .vcard .vm{color:var(--mut);font-size:.76rem;margin-bottom:8px}
 .vcard .vrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
 .badge{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:999px}
 .b-open{background:rgba(34,197,94,.16);color:var(--ok)}
 .b-closed{background:rgba(148,163,184,.15);color:var(--mut)}
 .b-pub{background:rgba(74,154,191,.18);color:#7cc4e6}
 .b-draft{background:rgba(245,158,11,.15);color:var(--warn)}

 /* ── Modal + drawer ── */
 .scrim{position:fixed;inset:0;background:rgba(2,6,15,.6);z-index:50;display:flex}
 .modal{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:auto;
   width:min(560px,94vw);max-height:92vh;overflow-y:auto}
 .drawer{background:var(--card);border-left:1px solid var(--bd);width:min(520px,96vw);margin-left:auto;
   height:100%;overflow-y:auto;padding:18px}
 .modal h2,.drawer h2{margin:0 0 4px;font-size:1.15rem}
 .dclose{float:right;background:transparent;border:1px solid var(--bd);color:var(--txt);border-radius:8px;
   width:34px;height:34px;cursor:pointer;font-size:1rem}
 .field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .sec{border-top:1px solid var(--bd);margin-top:16px;padding-top:12px}
 .sec h4{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
 .chk{display:flex;align-items:center;gap:9px;background:#0b1428;border:1px solid var(--bd);border-radius:8px;
   padding:9px 11px;margin-bottom:7px;cursor:pointer;font-size:.85rem}
 .chk input{width:18px;height:18px;accent-color:var(--ok)}
 .evt{border-left:2px solid var(--bd);padding:0 0 10px 11px;margin-left:4px;font-size:.8rem;position:relative}
 .evt .et{color:var(--mut);font-size:.7rem}
 .evt .eb{margin-top:2px}
 .evt-tag{font-size:.62rem;font-weight:700;text-transform:uppercase;color:var(--blue)}
 .stagepick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
 @media (max-width:640px){.field2{grid-template-columns:1fr}}
 /* ── b213: qualification + the applicant's EYFS answers ── */
 .qual-pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;
   background:rgba(74,154,191,.16);color:var(--blue);border:1px solid rgba(74,154,191,.35)}
 .assess-note{font-size:.74rem;color:var(--mut);margin:0 0 10px;line-height:1.5}
 .qa{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:#0b1428}
 .qa .qa-topic{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--blue)}
 .qa .qa-prompt{font-size:.79rem;color:var(--mut);margin:3px 0 7px;line-height:1.45}
 .qa .qa-answer{font-size:.85rem;color:var(--txt);white-space:pre-wrap;line-height:1.55}
 .qa .qa-answer.blank{color:var(--mut);font-style:italic}
 .qa-words{font-size:.68rem;color:var(--mut);margin-top:6px}
</style></head>
<body data-portal="admin">
<div id="wren-shell"></div>
<div class="rc-wrap">
  <h1>🧑‍🍼 Recruitment</h1>
  <div class="sub">Vacancies, applicant pipeline &amp; hiring — Wren Recruit. Applicant data is manager-only and retained 6 months.</div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-view="pipeline">Pipeline</button>
      <button class="tab" data-view="vacancies">Vacancies</button>
    </div>
    <select id="vac-filter" title="Filter pipeline by vacancy"><option value="">All vacancies</option></select>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="btn-add-applicant">+ Add applicant</button>
    <button class="btn orange sm" id="btn-new-vacancy">+ New vacancy</button>
  </div>

  <div class="banner" id="msg"></div>

  <!-- PIPELINE (kanban) -->
  <div id="view-pipeline">
    <div class="board" id="board"></div>
  </div>

  <!-- VACANCIES -->
  <div id="view-vacancies" class="hide">
    <div class="vgrid" id="vgrid"></div>
    <div class="empty hide" id="v-empty">No vacancies yet. Click “New vacancy” to post one.</div>
  </div>
</div>

<div id="overlay"></div>

<script src="/js/wren-core.js"></script>
<script src="/icons/wren-icons.js?v=b146" defer></script>
<script src="/js/wren-shell-v2.js"></script>
<script>
(function(){
  'use strict';
  var API='/api/recruit';
  var TOKEN=function(){return sessionStorage.getItem('wrenToken');};
  var STAGES=[['applied','Applied'],['shortlist','Shortlist'],['interview','Interview'],
              ['offer','Offer'],['hired','Hired'],['rejected','Rejected']];
  var CHECKS=[['dbs','Enhanced DBS'],['rtw','Right to Work'],['references','2 references'],['quals','Quals verified']];
  var STATE={view:'pipeline',vacancies:[],applicants:[],vacFilter:'',current:null};

  function api(p,opts){opts=opts||{};
    return fetch(API+p,{method:opts.method||'GET',
      headers:Object.assign({'Authorization':'Bearer '+TOKEN()},
        opts.raw?{}:{'Content-Type':'application/json'}),
      body:opts.body?(opts.raw?opts.body:JSON.stringify(opts.body)):undefined})
    .then(function(r){return r.json().then(function(j){return{ok:r.ok,status:r.status,j:j};})
      .catch(function(){return{ok:r.ok,status:r.status,j:null};});});}
  function el(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){
    return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
  function msg(t){el('msg').textContent=t||'';}
  function fmtDate(s){if(!s)return'';var d=new Date(s);if(isNaN(d))return esc(s);
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
  function fmtDT(s){if(!s)return'';var d=new Date(s);if(isNaN(d))return esc(s);
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+
      d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
  function vacTitle(id){var v=STATE.vacancies.filter(function(x){return x.id===id;})[0];return v?v.title:'';}

  // ══ LOADERS ══
  function loadAll(){
    msg('Loading…');
    return Promise.all([api('/vacancies'),api('/applicants')]).then(function(res){
      var vr=res[0],ar=res[1];
      if(!vr.ok){msg(vr.status===403?'Manager access required.':'Could not load (HTTP '+vr.status+').');return;}
      STATE.vacancies=(vr.j&&vr.j.vacancies)||[];
      STATE.applicants=(ar.j&&ar.j.applicants)||[];
      msg(''); renderVacFilter(); renderBoard(); renderVacancies();
    });
  }
  function renderVacFilter(){
    var cur=STATE.vacFilter;
    el('vac-filter').innerHTML='<option value="">All vacancies</option>'+
      STATE.vacancies.map(function(v){return '<option value="'+v.id+'"'+(String(v.id)===String(cur)?' selected':'')+'>'+esc(v.title)+'</option>';}).join('');
  }

  // ══ KANBAN ══
  function renderBoard(){
    var filtered=STATE.applicants.filter(function(a){
      return !STATE.vacFilter||String(a.vacancy_id)===String(STATE.vacFilter);});
    el('board').innerHTML=STAGES.map(function(st){
      var key=st[0],items=filtered.filter(function(a){return a.stage===key;});
      return '<div class="col s-'+key+'" data-stage="'+key+'">'
        +'<div class="col-head"><span>'+st[1]+'</span><span class="cnt">'+items.length+'</span></div>'
        +'<div class="col-body" data-stage="'+key+'">'
        + items.map(cardHtml).join('')
        +'</div></div>';
    }).join('');
    wireDnD();
  }
  function cardHtml(a){
    var ck=a.checklist||{};
    var pills=CHECKS.map(function(c){return '<span class="pill'+(ck[c[0]]?' on':'')+'">'+c[1].split(' ')[0]+'</span>';}).join('');
    return '<div class="appcard" draggable="true" data-id="'+a.id+'">'
      +'<div class="nm">'+esc(a.name||'—')+(a.has_cv?' <span class="cv-dot" title="CV attached">📎</span>':'')
        // b213 — flag at a glance that there are EYFS answers waiting to be read.
        +(a.assessment_submitted_at?' <span class="cv-dot" title="EYFS answers to read">✍️</span>':'')+'</div>'
      +'<div class="vc">'+(a.vacancy_title?esc(a.vacancy_title):'<em>No vacancy</em>')
        +(a.source?' · <span class="src">'+esc(a.source)+'</span>':'')+'</div>'
      +'<div class="row">'+pills+'</div></div>';
  }
  function wireDnD(){
    var dragId=null;
    el('board').querySelectorAll('.appcard').forEach(function(c){
      c.addEventListener('dragstart',function(e){dragId=c.getAttribute('data-id');
        e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId);}catch(_){}});
      c.addEventListener('click',function(){openApplicant(c.getAttribute('data-id'));});
    });
    el('board').querySelectorAll('.col').forEach(function(col){
      col.addEventListener('dragover',function(e){e.preventDefault();col.classList.add('drop');});
      col.addEventListener('dragleave',function(){col.classList.remove('drop');});
      col.addEventListener('drop',function(e){e.preventDefault();col.classList.remove('drop');
        var id=dragId||(e.dataTransfer&&e.dataTransfer.getData('text/plain'));
        var stage=col.getAttribute('data-stage');
        if(id&&stage) moveStage(id,stage);});
    });
  }
  function moveStage(id,stage){
    var a=STATE.applicants.filter(function(x){return String(x.id)===String(id);})[0];
    if(!a||a.stage===stage) return;
    if(stage==='hired'){ return openApplicant(id,'hire'); } // hire needs the create-staff flow
    var note=null;
    if(stage==='rejected'){ if(!confirm('Move '+(a.name||'applicant')+' to Rejected? (retention clock starts — anonymised after 6 months)')) return; }
    msg('Updating…');
    api('/applicants/'+id,{method:'PATCH',body:{stage:stage,note:note}}).then(function(r){
      if(!r.ok){msg('Could not move (HTTP '+r.status+').');return;}
      var idx=STATE.applicants.map(function(x){return String(x.id);}).indexOf(String(id));
      if(idx>=0) STATE.applicants[idx]=r.j;
      msg(''); renderBoard();
      if(STATE.current&&String(STATE.current.id)===String(id)) openApplicant(id);
    });
  }

  // ══ VACANCIES ══
  function renderVacancies(){
    el('v-empty').classList.toggle('hide',STATE.vacancies.length>0);
    el('vgrid').innerHTML=STATE.vacancies.map(function(v){
      return '<div class="vcard">'
        +'<h3>'+esc(v.title)+'</h3>'
        +'<div class="vm">'+(v.room_role?esc(v.room_role):'—')
          +(v.hours?' · '+esc(v.hours):'')+(v.salary_range?' · '+esc(v.salary_range):'')+'</div>'
        +'<div class="vrow">'
          +'<span class="badge '+(v.status==='open'?'b-open':'b-closed')+'">'+esc(v.status)+'</span>'
          +'<span class="badge '+(v.published?'b-pub':'b-draft')+'">'+(v.published?'Published':'Draft')+'</span>'
          +'<span class="pill">'+(v.applicant_count||0)+' applicant'+(v.applicant_count===1?'':'s')+'</span>'
        +'</div>'
        +'<div class="vrow" style="margin-top:12px">'
          +'<button class="btn ghost sm" data-edit="'+v.id+'">Edit</button>'
          +'<button class="btn ghost sm" data-pub="'+v.id+'">'+(v.published?'Unpublish':'Publish')+'</button>'
          +'<button class="btn danger sm" data-del="'+v.id+'">Delete</button>'
        +'</div></div>';
    }).join('');
    el('vgrid').querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){vacancyModal(b.getAttribute('data-edit'));};});
    el('vgrid').querySelectorAll('[data-pub]').forEach(function(b){b.onclick=function(){togglePublish(b.getAttribute('data-pub'));};});
    el('vgrid').querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){delVacancy(b.getAttribute('data-del'));};});
  }
  function togglePublish(id){
    var v=STATE.vacancies.filter(function(x){return String(x.id)===String(id);})[0];if(!v)return;
    api('/vacancies/'+id,{method:'PATCH',body:{published:!v.published,status:'open'}}).then(function(r){
      if(!r.ok){msg('Could not update (HTTP '+r.status+').');return;} loadAll();});
  }
  function delVacancy(id){
    if(!confirm('Delete this vacancy? (If it has applicants it will be closed instead, keeping the audit trail.)'))return;
    api('/vacancies/'+id,{method:'DELETE'}).then(function(r){
      if(!r.ok){msg('Could not delete (HTTP '+r.status+').');return;}
      msg(r.j&&r.j.closed?'Vacancy had applicants — closed instead of deleted.':'Vacancy deleted.');loadAll();});
  }
  function vacancyModal(id){
    var v=id?STATE.vacancies.filter(function(x){return String(x.id)===String(id);})[0]:null;
    var et=['permanent','fixed_term','apprenticeship','bank'];
    open('<h2>'+(v?'Edit vacancy':'New vacancy')+'</h2>'
      +'<button class="dclose" data-close>&times;</button>'
      +'<label>Job title *</label><input id="f-title" value="'+esc(v?v.title:'')+'" style="width:100%">'
      +'<div class="field2"><div><label>Room / role</label><input id="f-room" value="'+esc(v?v.room_role:'')+'" style="width:100%"></div>'
      +'<div><label>Employment type</label><select id="f-emp" style="width:100%">'
        +et.map(function(t){return '<option value="'+t+'"'+(v&&v.employment_type===t?' selected':'')+'>'+t.replace('_',' ')+'</option>';}).join('')+'</select></div></div>'
      +'<div class="field2"><div><label>Hours</label><input id="f-hours" placeholder="e.g. 40 hrs/week, full-time" value="'+esc(v?v.hours:'')+'" style="width:100%"></div>'
      +'<div><label>Salary range</label><input id="f-sal" placeholder="e.g. £24,000–£27,000" value="'+esc(v?v.salary_range:'')+'" style="width:100%"></div></div>'
      +'<label>Description (Markdown)</label><textarea id="f-desc" rows="7" placeholder="About the role, who we are looking for, benefits…">'+esc(v?v.description_md:'')+'</textarea>'
      +'<div class="field2"><div><label>Status</label><select id="f-status" style="width:100%">'
        +'<option value="open"'+(!v||v.status==='open'?' selected':'')+'>Open</option>'
        +'<option value="closed"'+(v&&v.status==='closed'?' selected':'')+'>Closed</option></select></div>'
      +'<div><label>Published to careers page</label><select id="f-pub" style="width:100%">'
        +'<option value="false"'+(!v||!v.published?' selected':'')+'>Draft (hidden)</option>'
        +'<option value="true"'+(v&&v.published?' selected':'')+'>Published</option></select></div></div>'
      +'<div class="vrow" style="margin-top:16px;justify-content:flex-end">'
        +'<button class="btn ghost" data-close>Cancel</button>'
        +'<button class="btn orange" id="f-save">'+(v?'Save':'Create vacancy')+'</button></div>');
    el('f-save').onclick=function(){
      var body={title:el('f-title').value.trim(),room_role:el('f-room').value.trim(),
        employment_type:el('f-emp').value,hours:el('f-hours').value.trim(),
        salary_range:el('f-sal').value.trim(),description_md:el('f-desc').value,
        status:el('f-status').value,published:el('f-pub').value==='true'};
      if(!body.title){alert('Job title is required.');return;}
      var p=v?api('/vacancies/'+v.id,{method:'PATCH',body:body}):api('/vacancies',{method:'POST',body:body});
      p.then(function(r){if(!r.ok){alert('Save failed (HTTP '+r.status+').');return;}closeOverlay();loadAll();});
    };
  }

  // ══ ADD APPLICANT (manual) ══
  function addApplicantModal(){
    open('<h2>Add applicant</h2><button class="dclose" data-close>&times;</button>'
      +'<div class="sub" style="margin-top:6px">A walk-in or phone enquiry you are keying in by hand.</div>'
      +'<label>Name *</label><input id="a-name" style="width:100%">'
      +'<div class="field2"><div><label>Email</label><input id="a-email" style="width:100%"></div>'
      +'<div><label>Phone</label><input id="a-phone" style="width:100%"></div></div>'
      +'<label>Vacancy</label><select id="a-vac" style="width:100%"><option value="">— none —</option>'
        +STATE.vacancies.map(function(v){return '<option value="'+v.id+'">'+esc(v.title)+'</option>';}).join('')+'</select>'
      +'<label>Notes / cover</label><textarea id="a-cover" rows="3"></textarea>'
      +'<div class="vrow" style="margin-top:16px;justify-content:flex-end">'
        +'<button class="btn ghost" data-close>Cancel</button>'
        +'<button class="btn orange" id="a-save">Add</button></div>');
    el('a-save').onclick=function(){
      var name=el('a-name').value.trim();if(!name){alert('Name is required.');return;}
      api('/applicants',{method:'POST',body:{name:name,email:el('a-email').value.trim(),
        phone:el('a-phone').value.trim(),vacancy_id:el('a-vac').value||null,
        cover_text:el('a-cover').value,source:'manual'}}).then(function(r){
          if(!r.ok){alert('Add failed (HTTP '+r.status+').');return;}closeOverlay();loadAll();});
    };
  }

  // ══ APPLICANT DRAWER ══
  function openApplicant(id,focus){
    api('/applicants/'+id).then(function(r){
      if(!r.ok){msg('Could not load applicant (HTTP '+r.status+').');return;}
      STATE.current=r.j; drawApplicant(r.j,focus);
    });
  }
  // ══ b213 — qualification + EYFS answers ══
  // Level 2 and Level 3 applicants answer ten EYFS questions on the careers
  // page. They are shown here, in full, next to the CV. Nothing is scored and
  // nothing is ranked — you read them and you decide.
  var QUAL_LABELS={none:'No qualification yet',level_2:'Level 2',level_3:'Level 3',
    level_4:'Level 4 or above',eyt_qts:'EYT / QTS',other:'Other'};
  function words(s){return String(s||'').trim().split(/\s+/).filter(Boolean).length;}

  function assessHtml(a){
    var qual=a.qualification, asmt=a.assessment;
    var answers=(asmt&&Array.isArray(asmt.answers))?asmt.answers:[];
    if(!qual&&!answers.length) return '';

    var head='<div class="sec"><h4>Qualification &amp; EYFS answers</h4>';
    if(qual) head+='<div style="margin-bottom:8px"><span class="qual-pill">'
      +esc(QUAL_LABELS[qual]||qual)+'</span></div>';

    if(!answers.length){
      head+='<div class="assess-note">'
        +(qual==='level_2'||qual==='level_3'
          ? 'No EYFS answers on file — this application predates the questions, or was keyed in by hand.'
          : 'The EYFS questions are only asked of Level 2 and Level 3 applicants.')
        +'</div></div>';
      return head;
    }

    var total=answers.reduce(function(n,x){return n+words(x.answer);},0);
    head+='<div class="assess-note">Answered '+fmtDT(a.assessment_submitted_at)
      +' · '+answers.length+' questions · '+total+' words written. '
      +'<strong>Not scored</strong> — read them yourself and judge in the round.</div>';

    head+=answers.map(function(x,i){
      var blank=!String(x.answer||'').trim();
      return '<div class="qa">'
        +'<div class="qa-topic">'+(i+1)+'. '+esc(x.topic||x.id||'')+'</div>'
        +'<div class="qa-prompt">'+esc(x.prompt||'')+'</div>'
        +'<div class="qa-answer'+(blank?' blank':'')+'">'
          +(blank?'(left blank)':esc(x.answer))+'</div>'
        +(blank?'':'<div class="qa-words">'+words(x.answer)+' words</div>')
        +'</div>';
    }).join('');

    return head+'</div>';
  }

  function drawApplicant(a,focus){
    var ck=a.checklist||{};
    var events=a.events||[];
    var stageBtns=STAGES.map(function(st){
      var on=a.stage===st[0];
      return '<button class="btn '+(on?'':'ghost')+' sm" data-stage="'+st[0]+'"'+(on?' disabled':'')+'>'+st[1]+'</button>';
    }).join('');
    var checks=CHECKS.map(function(c){
      return '<label class="chk"><input type="checkbox" data-chk="'+c[0]+'"'+(ck[c[0]]?' checked':'')+'>'
        +'<span>'+c[1]+'</span></label>';}).join('');
    var evtHtml=events.length?events.map(function(e){
      return '<div class="evt"><div class="et"><span class="evt-tag">'+esc(e.type)+'</span> · '+fmtDT(e.at)
        +(e.by_name?' · '+esc(e.by_name):'')+'</div><div class="eb">'+esc(e.notes||'')+'</div></div>';
    }).join(''):'<div class="sub">No events yet.</div>';

    openDrawer('<button class="dclose" data-close>&times;</button>'
      +'<h2>'+esc(a.name||'—')+'</h2>'
      +'<div class="sub">'+(a.vacancy_title?esc(a.vacancy_title):'No vacancy')+' · applied '+fmtDate(a.created_at)
        +(a.source?' · '+esc(a.source):'')+'</div>'
      +'<div class="vrow" style="margin-top:6px">'
        +(a.email?'<a class="btn ghost sm" href="mailto:'+esc(a.email)+'">'+esc(a.email)+'</a>':'')
        +(a.phone?'<span class="pill">'+esc(a.phone)+'</span>':'')
        +(a.has_cv?'<button class="btn ghost sm" id="d-cv">📎 View CV</button>':'<span class="pill">No CV</span>')
      +'</div>'
      +(a.cover_text?'<div class="sec"><h4>Cover</h4><div style="font-size:.83rem;white-space:pre-wrap;color:var(--txt)">'+esc(a.cover_text)+'</div></div>':'')

      // b213 — what they said they hold, and (for Level 2/3) what they wrote.
      +assessHtml(a)

      +'<div class="sec"><h4>Stage</h4><div class="stagepick">'+stageBtns+'</div></div>'

      +'<div class="sec"><h4>Pre-employment checks</h4>'+checks+'</div>'

      +'<div class="sec"><h4>Email the candidate</h4>'
        +'<select id="d-tpl" style="width:100%"><option value="">— choose a template —</option></select>'
        +'<div id="d-mailbox" class="hide">'
          +'<label>Subject</label><input id="d-subj" style="width:100%">'
          +'<label>Message (edit before sending — nothing is sent automatically)</label>'
          +'<textarea id="d-body" rows="9"></textarea>'
          +'<div class="vrow" style="margin-top:8px;justify-content:flex-end">'
            +'<button class="btn" id="d-send">Send email</button></div>'
          +'<div class="sub" id="d-mailmsg"></div>'
        +'</div></div>'

      +'<div class="sec"><h4>Add event</h4>'
        +'<div class="field2"><div><label>Type</label><select id="d-etype" style="width:100%">'
          +'<option value="note">Note</option><option value="interview">Interview</option><option value="call">Call</option></select></div>'
        +'<div><label>When</label><input id="d-eat" type="datetime-local" style="width:100%"></div></div>'
        +'<label>Notes</label><textarea id="d-enotes" rows="2"></textarea>'
        +'<div class="vrow" style="margin-top:8px;justify-content:flex-end"><button class="btn ghost sm" id="d-eadd">Log event</button></div>'
      +'</div>'

      +'<div class="sec"><h4>Timeline</h4>'+evtHtml+'</div>'

      +'<div class="sec"><div class="vrow" style="justify-content:space-between">'
        +(a.hired_staff_id
          ? '<span class="badge b-open">Hired → staff #'+a.hired_staff_id+'</span>'
          : '<button class="btn orange" id="d-hire">✅ Hire &amp; create staff record</button>')
        +'<button class="btn danger sm" id="d-reject">Reject</button>'
      +'</div></div>');

    // stage buttons
    document.querySelectorAll('[data-stage]').forEach(function(b){
      b.onclick=function(){moveStage(a.id,b.getAttribute('data-stage'));};});
    // checklist toggles
    document.querySelectorAll('[data-chk]').forEach(function(cb){
      cb.onchange=function(){var patch={};patch[cb.getAttribute('data-chk')]=cb.checked;
        api('/applicants/'+a.id,{method:'PATCH',body:{checklist:patch}}).then(function(r){
          if(r.ok){var i=STATE.applicants.map(function(x){return String(x.id);}).indexOf(String(a.id));
            if(i>=0)STATE.applicants[i]=r.j;STATE.current=Object.assign(STATE.current,{checklist:r.j.checklist});renderBoard();}});};});
    // CV view (needs auth header → fetch as blob)
    if(el('d-cv'))el('d-cv').onclick=function(){viewCV(a.id);};
    // templates
    api('/email-templates?applicant_id='+a.id).then(function(r){
      if(!r.ok||!r.j)return;var tpls=r.j.templates||[];
      el('d-tpl').innerHTML='<option value="">— choose a template —</option>'
        +tpls.map(function(t,i){return '<option value="'+i+'">'+esc(t.name)+'</option>';}).join('');
      el('d-tpl').onchange=function(){var i=el('d-tpl').value;if(i===''){el('d-mailbox').classList.add('hide');return;}
        var t=tpls[i];el('d-subj').value=t.subject;el('d-body').value=t.body;
        el('d-mailbox').classList.remove('hide');el('d-tpl').setAttribute('data-key',t.template_key);};
    });
    if(el('d-send'))el('d-send').onclick=function(){
      if(!a.email){alert('This applicant has no email address on file.');return;}
      el('d-mailmsg').textContent='Sending…';
      api('/applicants/'+a.id+'/email',{method:'POST',body:{subject:el('d-subj').value,
        body:el('d-body').value,template_key:el('d-tpl').getAttribute('data-key')||null}}).then(function(r){
        if(!r.ok){el('d-mailmsg').textContent='Send failed: '+((r.j&&r.j.error)||('HTTP '+r.status));return;}
        el('d-mailmsg').textContent=r.j.dry_run?'Logged as draft (email gateway is in dry-run — nothing actually sent).':'Email sent ✔';
        openApplicant(a.id);});
    };
    // add event
    el('d-eadd').onclick=function(){
      var notes=el('d-enotes').value.trim();var type=el('d-etype').value;var at=el('d-eat').value;
      if(!notes&&type==='note'){alert('Add some notes.');return;}
      api('/applicants/'+a.id+'/events',{method:'POST',body:{type:type,notes:notes,at:at||null}}).then(function(r){
        if(!r.ok){alert('Could not log event (HTTP '+r.status+').');return;}openApplicant(a.id);});
    };
    // reject
    el('d-reject').onclick=function(){moveStage(a.id,'rejected');};
    // hire
    if(el('d-hire'))el('d-hire').onclick=function(){hireModal(a);};
    if(focus==='hire')setTimeout(function(){if(el('d-hire'))el('d-hire').scrollIntoView({behavior:'smooth'});},120);
  }

  function viewCV(id){
    msg('Opening CV…');
    fetch(API+'/applicants/'+id+'/cv',{headers:{'Authorization':'Bearer '+TOKEN()}}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);return r.blob();}).then(function(b){
        var u=URL.createObjectURL(b);window.open(u,'_blank');msg('');
        setTimeout(function(){URL.revokeObjectURL(u);},60000);
    }).catch(function(e){msg('Could not open CV: '+e.message);});
  }

  function hireModal(a){
    var parts=String(a.name||'').trim().split(/\s+/);
    var fn=parts.shift()||'';var ln=parts.join(' ');
    open('<h2>Create staff record</h2><button class="dclose" data-close>&times;</button>'
      +'<div class="sub" style="margin-top:6px">Creates a minimal active staff record from this application and auto-assigns the induction template. You refine the full profile in Staff afterwards.</div>'
      +'<div class="field2"><div><label>First name</label><input id="h-fn" value="'+esc(fn)+'" style="width:100%"></div>'
      +'<div><label>Last name</label><input id="h-ln" value="'+esc(ln)+'" style="width:100%"></div></div>'
      +'<div class="field2"><div><label>Role</label><input id="h-role" value="practitioner" style="width:100%"></div>'
      +'<div><label>Employment type</label><select id="h-emp" style="width:100%">'
        +'<option value="permanent">permanent</option><option value="fixed_term">fixed term</option>'
        +'<option value="apprenticeship">apprenticeship</option><option value="bank">bank</option></select></div></div>'
      +'<div class="vrow" style="margin-top:16px;justify-content:flex-end">'
        +'<button class="btn ghost" data-close>Cancel</button>'
        +'<button class="btn orange" id="h-go">Create staff &amp; hire</button></div>'
      +'<div class="sub" id="h-msg"></div>');
    el('h-go').onclick=function(){
      el('h-msg').textContent='Creating…';
      api('/applicants/'+a.id+'/hire',{method:'POST',body:{first_name:el('h-fn').value.trim(),
        last_name:el('h-ln').value.trim(),role:el('h-role').value.trim(),employment_type:el('h-emp').value}}).then(function(r){
        if(!r.ok){el('h-msg').textContent='Hire failed: '+((r.j&&r.j.error)||('HTTP '+r.status));return;}
        closeOverlay();msg('Hired '+esc(r.j.staff_name)+' → staff #'+r.j.staff_id+'. '+esc(r.j.induction_note||''));loadAll();});
    };
  }

  // ══ overlay helpers ══
  function open(html){el('overlay').innerHTML='<div class="scrim"><div class="modal">'+html+'</div></div>';wireClose();}
  function openDrawer(html){el('overlay').innerHTML='<div class="scrim"><div class="drawer">'+html+'</div></div>';wireClose();}
  function closeOverlay(){el('overlay').innerHTML='';STATE.current=null;}
  function wireClose(){
    el('overlay').querySelectorAll('[data-close]').forEach(function(b){b.onclick=closeOverlay;});
    var scrim=el('overlay').querySelector('.scrim');
    if(scrim)scrim.addEventListener('mousedown',function(e){if(e.target===scrim)closeOverlay();});
  }

  // ══ view switch ══
  function setView(v){
    STATE.view=v;
    document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-view')===v);});
    el('view-pipeline').classList.toggle('hide',v!=='pipeline');
    el('view-vacancies').classList.toggle('hide',v!=='vacancies');
  }

  function init(){
    document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){setView(t.getAttribute('data-view'));};});
    el('vac-filter').onchange=function(){STATE.vacFilter=el('vac-filter').value;renderBoard();};
    el('btn-new-vacancy').onclick=function(){vacancyModal(null);};
    el('btn-add-applicant').onclick=addApplicantModal;
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeOverlay();});
    loadAll();
  }
  document.addEventListener('wren:ready', init);
})();
</script>
</body></html>
