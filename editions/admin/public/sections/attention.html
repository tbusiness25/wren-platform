<div class="v2-section" data-section="attention">

  <!-- b504 — the way back. Your jobs live on My list; this board is Wren watching the nursery. -->
  <p style="margin:0 0 12px;font-size:.85rem"><a href="/admin/cockpit/mylist" style="color:var(--c-blue);font-weight:700;text-decoration:none" onclick="if(window.Wren&&Wren.navigate){Wren.navigate('cockpit','mylist');return false}">&larr; Back to My list</a>
    <span style="color:var(--c-muted)">&mdash; your jobs and the countdown live there; this board is what Wren is watching.</span></p>

  <nav class="wren-tab-bar" role="tablist" aria-label="Attention board tabs">
    <div class="tab-bar-track">
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="0"  data-tab="board" id="tab-att-board" aria-controls="panel-att-board">The board</button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="all"   id="tab-att-all"   aria-controls="panel-att-all">Everything</button>
    </div>
    <button class="tab-scroll-arrow left"  aria-hidden="true" tabindex="-1">‹</button>
    <button class="tab-scroll-arrow right" aria-hidden="true" tabindex="-1">›</button>
  </nav>

  <div class="wren-tab-panels">

    <!-- ── THE BOARD ───────────────────────────────────────────────────────── -->
    <div class="wren-tab-panel" role="tabpanel" id="panel-att-board" data-tab="board" aria-labelledby="tab-att-board">

      <!-- Start here. One card. Nothing on this screen is allowed to compete
           with it visually, because the failure mode is paralysis, not ignorance. -->
      <section id="att-start" class="att-start" aria-live="polite">
        <div class="tab-skeleton"><div class="tab-sk-card"></div></div>
      </section>

      <div class="att-bar">
        <form id="att-add" class="att-add" autocomplete="off">
          <input type="text" id="att-add-title" class="att-in att-in-grow" maxlength="300" placeholder="Something else on your mind…" aria-label="New item">
          <input type="date" id="att-add-due" class="att-in" aria-label="Due date (optional)">
          <input type="number" id="att-add-effort" class="att-in att-in-num" min="0" max="600" step="5" placeholder="mins" aria-label="Effort in minutes (optional)">
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <span class="att-spacer"></span>
        <button class="btn btn-secondary" id="att-refresh">Re-check everything</button>
      </div>
      <p class="att-note" id="att-refresh-note" hidden></p>

      <div class="att-columns" id="att-columns">
        <div class="tab-skeleton"><div class="tab-sk-card"></div><div class="tab-sk-card"></div></div>
      </div>
    </div>

    <!-- ── EVERYTHING ──────────────────────────────────────────────────────── -->
    <div class="wren-tab-panel" role="tabpanel" id="panel-att-all" data-tab="all" aria-labelledby="tab-att-all" hidden>
      <p class="att-note">Everything the board knows about, including what is snoozed and what has been cleared in the last week. Items are never deleted — a cleared one keeps its record.</p>
      <div id="att-all-body"><div class="tab-skeleton"><div class="tab-sk-card"></div><div class="tab-sk-card"></div></div></div>
    </div>

  </div><!-- /.wren-tab-panels -->
</div><!-- /.v2-section -->

<style>
/* b232 — the attention board. Tokens only; Roost is dark navy throughout and has
   no light variant, so every colour here resolves through var(--c-*). */
.att-note{font-size:.78rem;color:var(--c-muted);line-height:1.55;margin:0 0 14px}

/* ── Start here ─────────────────────────────────────────────────────────────
   Deliberately the loudest thing on the page: a full-width card with a 4px
   accent, one heading, one sentence, one button. */
.att-start{margin-bottom:20px}
.att-start-card{background:var(--c-card);border:1px solid var(--c-border);border-left:4px solid var(--c-red);
  border-radius:14px;padding:20px 22px}
.att-start-card.amber{border-left-color:var(--c-amber)}
.att-start-card.green{border-left-color:var(--c-green)}
.att-start-kicker{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--c-muted);margin-bottom:10px}
.att-start-title{font-size:1.22rem;line-height:1.35;font-weight:700;color:var(--c-text);margin:0 0 8px}
.att-start-why{font-size:.9rem;color:var(--c-muted);line-height:1.5;margin:0 0 16px}
.att-start-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.att-start-meta{font-size:.74rem;color:var(--c-muted);margin-left:auto;text-align:right}
.att-start-clear{background:var(--c-card);border:1px solid var(--c-border);border-left:4px solid var(--c-green);
  border-radius:14px;padding:20px 22px;color:var(--c-muted);font-size:.92rem}
.att-start-clear b{color:var(--c-text)}

/* ── the add bar ────────────────────────────────────────────────────────── */
.att-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.att-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 340px;min-width:0}
.att-spacer{flex:0 1 auto}
.att-in{background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;padding:8px 10px;
  color:var(--c-text);font-family:inherit;font-size:.86rem;min-width:0}
.att-in-grow{flex:1 1 200px}
.att-in-num{width:86px}
.att-in::placeholder{color:var(--c-muted)}

/* ── the three columns ──────────────────────────────────────────────────── */
.att-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.att-col{background:var(--c-card);border:1px solid var(--c-border);border-radius:12px;padding:12px;min-width:0}
.att-col-head{display:flex;align-items:center;gap:8px;font-size:.74rem;text-transform:uppercase;
  letter-spacing:.06em;color:var(--c-muted);margin-bottom:10px;padding:0 2px}
.att-col-head .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.att-col-head .n{margin-left:auto;font-size:.86rem;font-weight:700;color:var(--c-text);font-variant-numeric:tabular-nums}
.att-col.red   .att-col-head .dot{background:var(--c-red)}
.att-col.amber .att-col-head .dot{background:var(--c-amber)}
.att-col.green .att-col-head .dot{background:var(--c-green)}

.att-card{border:1px solid var(--c-border);border-radius:9px;background:var(--c-bg);margin-bottom:8px;overflow:hidden}
.att-card:last-child{margin-bottom:0}
.att-card-head{display:flex;gap:9px;align-items:flex-start;width:100%;background:none;border:0;
  padding:10px 11px;text-align:left;cursor:pointer;color:var(--c-text);font-family:inherit;font-size:.83rem;line-height:1.4}
.att-card-head:hover{background:rgba(255,255,255,.03)}
.att-card-head .chev{margin-left:auto;color:var(--c-muted);font-size:.7rem;flex:0 0 auto;padding-top:2px}
.att-card-t{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.att-card.done .att-card-t{text-decoration:line-through;color:var(--c-muted)}
.att-card-body{padding:0 11px 11px;border-top:1px solid var(--c-border);font-size:.8rem;color:var(--c-muted);line-height:1.55}
.att-card-body p{margin:10px 0}
.att-card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.att-ev{background:var(--c-navy-mid);border:1px solid var(--c-border);border-radius:7px;padding:9px 10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.7rem;color:var(--c-muted);
  overflow-x:auto;white-space:pre;margin:10px 0 0}
.att-mini{background:none;border:1px solid var(--c-border);border-radius:7px;color:var(--c-muted);
  font-family:inherit;font-size:.72rem;padding:5px 9px;cursor:pointer}
.att-mini:hover{color:var(--c-text);border-color:var(--c-muted)}
.att-chip{display:inline-block;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:20px;
  background:var(--c-navy-light);color:var(--c-muted);white-space:nowrap;margin-left:6px;vertical-align:1px}
.att-chip.overdue{background:rgba(248,113,113,.16);color:var(--c-red)}
.att-chip.soon{background:rgba(251,191,36,.16);color:var(--c-amber)}
.att-empty{color:var(--c-muted);font-size:.8rem;padding:14px 4px;text-align:center}

/* ── everything tab ─────────────────────────────────────────────────────── */
.att-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.att-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:620px}
.att-table th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c-muted);
  padding:8px 10px;border-bottom:1px solid var(--c-border);white-space:nowrap}
.att-table td{padding:8px 10px;border-bottom:1px solid var(--c-border);color:var(--c-text);vertical-align:top}
.att-table td.dim{color:var(--c-muted)}
.att-rag{display:inline-block;width:9px;height:9px;border-radius:50%}
.att-rag.red{background:var(--c-red)} .att-rag.amber{background:var(--c-amber)} .att-rag.green{background:var(--c-green)}

@media (max-width:900px){
  .att-columns{grid-template-columns:minmax(0,1fr)}
  .att-start-meta{margin-left:0;text-align:left;width:100%}
}
@media (max-width:420px){
  .att-start-card{padding:16px}
  .att-start-title{font-size:1.05rem}
  .att-in-grow{flex:1 1 100%}
  .att-add{gap:6px}
  .att-bar{gap:8px}
}
</style>

<script>
(function () {
  'use strict';

  var API = '/api/attention';
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  var state = { board: null, open: {} };

  // ── dates ────────────────────────────────────────────────────────────────
  function daysUntil(d) {
    if (!d) return null;
    var t = new Date(String(d).slice(0, 10) + 'T12:00:00Z');
    if (isNaN(t)) return null;
    var n = new Date();
    return Math.round((t - Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), 12)) / 86400000);
  }
  function dueChip(d) {
    var n = daysUntil(d);
    if (n == null) return '';
    if (n < 0)   return '<span class="att-chip overdue">' + Math.abs(n) + 'd late</span>';
    if (n === 0) return '<span class="att-chip overdue">today</span>';
    if (n <= 14) return '<span class="att-chip soon">' + n + 'd</span>';
    return '<span class="att-chip">' + new Date(String(d).slice(0, 10) + 'T12:00:00Z')
      .toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + '</span>';
  }
  function effortChip(m) {
    if (m == null) return '';
    if (m < 60) return '<span class="att-chip">' + m + ' min</span>';
    return '<span class="att-chip">' + Math.round(m / 60) + 'h</span>';
  }

  // ── Start here ───────────────────────────────────────────────────────────
  // One card, one action. If there is genuinely nothing, say so plainly rather
  // than showing an empty frame — "nothing needs you" is a real answer.
  function renderStart(item) {
    var el = document.getElementById('att-start');
    if (!el) return;
    if (!item) {
      el.innerHTML = '<div class="att-start-clear">Nothing needs you right now. '
        + '<b>The board is clear.</b> It re-checks itself, so it will say so when that changes.</div>';
      return;
    }
    var btn = item.action_url
      ? '<a class="btn btn-primary" href="' + esc(item.action_url) + '">Go and do it</a>'
      : '';
    el.innerHTML =
      '<div class="att-start-card ' + esc(item.rag) + '">'
      + '<div class="att-start-kicker">Start here</div>'
      + '<h2 class="att-start-title">' + esc(item.title) + '</h2>'
      + '<p class="att-start-why">' + esc(item.why || '') + '</p>'
      + '<div class="att-start-actions">'
      +   btn
      +   '<button class="att-mini" data-act="snooze" data-days="1" data-id="' + item.id + '">Not today</button>'
      +   '<button class="att-mini" data-act="resolve" data-id="' + item.id + '">Done</button>'
      +   '<span class="att-start-meta">' + (item.due_date ? 'Due ' + esc(String(item.due_date).slice(0, 10)) : 'No deadline')
      +     (item.effort_minutes != null ? ' · about ' + item.effort_minutes + ' min' : '') + '</span>'
      + '</div></div>';
  }

  // ── the columns ──────────────────────────────────────────────────────────
  function card(item) {
    var open = !!state.open[item.id];
    var body = open ? (
      '<div class="att-card-body">'
      + (item.why ? '<p><strong style="color:var(--c-text)">' + esc(item.why) + '</strong></p>' : '')
      + (item.detail ? '<p>' + esc(item.detail) + '</p>' : '')
      + (item.evidence && Object.keys(item.evidence).length
          ? '<div class="att-ev">' + esc(JSON.stringify(item.evidence, null, 2)) + '</div>' : '')
      + '<div class="att-card-actions">'
      +   (item.action_url ? '<a class="att-mini" href="' + esc(item.action_url) + '">Open →</a>' : '')
      +   (item.resolved_at ? '<button class="att-mini" data-act="reopen" data-id="' + item.id + '">Reopen</button>'
            : '<button class="att-mini" data-act="snooze" data-days="1" data-id="' + item.id + '">Snooze 1 day</button>'
              + '<button class="att-mini" data-act="snooze" data-days="7" data-id="' + item.id + '">Snooze 1 week</button>'
              + '<button class="att-mini" data-act="resolve" data-id="' + item.id + '">Done</button>')
      +   '<span class="att-chip">' + esc(item.source) + '</span>'
      + '</div></div>'
    ) : '';

    return '<div class="att-card' + (item.resolved_at ? ' done' : '') + '">'
      + '<button class="att-card-head" data-toggle="' + item.id + '" aria-expanded="' + open + '">'
      +   '<span class="att-card-t">' + esc(item.title) + dueChip(item.due_date) + effortChip(item.effort_minutes) + '</span>'
      +   '<span class="chev">' + (open ? '▲' : '▼') + '</span>'
      + '</button>' + body + '</div>';
  }

  function column(rag, label, items) {
    return '<div class="att-col ' + rag + '">'
      + '<div class="att-col-head"><span class="dot"></span>' + label + '<span class="n">' + items.length + '</span></div>'
      + (items.length ? items.map(card).join('') : '<div class="att-empty">Nothing here.</div>')
      + '</div>';
  }

  function renderBoard() {
    var d = state.board;
    var el = document.getElementById('att-columns');
    if (!el || !d) return;
    el.innerHTML =
        column('red',   'Now',       d.columns.red)
      + column('amber', 'This week', d.columns.amber)
      + column('green', 'On track',  d.columns.green);
  }

  // ── everything tab ───────────────────────────────────────────────────────
  function renderAll(d) {
    var el = document.getElementById('att-all-body');
    if (!el) return;
    var rows = []
      .concat(d.columns.red, d.columns.amber, d.columns.green, d.snoozed || [])
      .map(function (i) {
        return '<tr><td><span class="att-rag ' + esc(i.rag) + '"></span></td>'
          + '<td>' + esc(i.title) + '</td>'
          + '<td class="dim">' + esc(i.source) + '</td>'
          + '<td class="dim">' + (i.due_date ? esc(String(i.due_date).slice(0, 10)) : '—') + '</td>'
          + '<td class="dim">' + (i.snoozed_until ? 'snoozed' : i.resolved_at ? 'cleared' : 'open') + '</td>'
          + '<td class="dim">' + (i.blocked_on ? esc(i.blocked_on) : '—') + '</td></tr>';
      }).join('');
    el.innerHTML = '<div class="att-scroll"><table class="att-table">'
      + '<thead><tr><th></th><th>What</th><th>Found by</th><th>Due</th><th>State</th><th>Waiting on</th></tr></thead>'
      + '<tbody>' + (rows || '<tr><td colspan="6" class="dim">Nothing recorded.</td></tr>') + '</tbody></table></div>';
  }

  // ── loading + actions ────────────────────────────────────────────────────
  function load() {
    return Wren.api(API + '/items?include_snoozed=1').then(function (d) {
      if (!d) return;
      state.board = d;
      renderStart(d.start_here);
      renderBoard();
      renderAll(d);
    }).catch(function (e) {
      var el = document.getElementById('att-columns');
      if (el) el.innerHTML = '<div class="att-empty">Could not load the board: ' + esc(e && e.message || e && e.error || 'unknown') + '</div>';
    });
  }

  function act(id, action, days) {
    return Wren.api(API + '/items/' + id, { method: 'PATCH', body: { action: action, days: days } })
      .then(function () { return load(); })
      .then(function () { Wren.toast(action === 'resolve' ? 'Cleared' : action === 'reopen' ? 'Reopened' : 'Snoozed', 'success'); })
      .catch(function (e) { Wren.toast('Could not update: ' + (e && (e.message || e.error) || 'error'), 'error'); });
  }

  document.addEventListener('click', function (ev) {
    var sec = ev.target.closest && ev.target.closest('[data-section="attention"]');
    if (!sec) return;

    var toggle = ev.target.closest('[data-toggle]');
    if (toggle) {
      var tid = toggle.getAttribute('data-toggle');
      state.open[tid] = !state.open[tid];
      renderBoard();
      return;
    }
    var btn = ev.target.closest('[data-act]');
    if (btn) {
      ev.preventDefault();
      act(btn.getAttribute('data-id'), btn.getAttribute('data-act'),
          parseInt(btn.getAttribute('data-days') || '1', 10));
    }
  });

  var addForm = document.getElementById('att-add');
  if (addForm) addForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var t = document.getElementById('att-add-title');
    var title = (t.value || '').trim();
    if (!title) { t.focus(); return; }
    Wren.api(API + '/items', { method: 'POST', body: {
      title: title,
      due_date: document.getElementById('att-add-due').value || null,
      effort_minutes: document.getElementById('att-add-effort').value || null,
    } }).then(function () {
      t.value = ''; document.getElementById('att-add-due').value = '';
      document.getElementById('att-add-effort').value = '';
      Wren.toast('Added', 'success');
      return load();
    }).catch(function (e) { Wren.toast('Could not add: ' + (e && (e.message || e.error) || 'error'), 'error'); });
  });

  var refreshBtn = document.getElementById('att-refresh');
  if (refreshBtn) refreshBtn.addEventListener('click', function () {
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'Checking…';
    Wren.api(API + '/refresh', { method: 'POST' }).then(function (d) {
      var note = document.getElementById('att-refresh-note');
      if (note && d) {
        // Say plainly which collectors could not look, rather than implying the
        // board is complete when two of them are blind in here.
        note.textContent = d.note
          ? d.note
          : 'Everything re-checked — ' + d.inserted + ' new, ' + d.resolved + ' cleared.';
        note.hidden = false;
      }
      return load();
    }).catch(function (e) {
      Wren.toast('Re-check failed: ' + (e && (e.message || e.error) || 'error'), 'error');
    }).then(function () {
      refreshBtn.disabled = false;
      refreshBtn.textContent = 'Re-check everything';
    });
  });

  load();
  window['wrenLoadTab_attention_board'] = load;
  window['wrenLoadTab_attention_all'] = function () { if (!state.board) load(); };
})();
</script>
