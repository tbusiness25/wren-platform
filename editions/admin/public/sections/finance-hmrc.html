      <button class="wren-tab" role="tab" aria-selected="false" tabindex="0"  data-tab="calendar" id="tab-hd-calendar" aria-controls="panel-hd-calendar">Deadlines</button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="termly"   id="tab-hd-termly"   aria-controls="panel-hd-termly">Termly money report</button>

    <button class="tab-scroll-arrow left"  aria-hidden="true" tabindex="-1">‹</button>
    <button class="tab-scroll-arrow right" aria-hidden="true" tabindex="-1">›</button>

  <div class="wren-tab-panels">

    <!-- ── DEADLINES ─────────────────────────────────────────────────────── -->

    </div>

  </div><!-- /.wren-tab-panels -->
</div><!-- /.v2-section -->

<style>
/* b346 — HMRC & Deadlines. Tokens only; the portal is dark-navy. Prefix hd- so it cannot collide with fr- (finance reports). */
#hd-root .hd-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}

#hd-root .hd-field .hd-in{min-width:240px;width:auto;max-width:100%}
#hd-root .hd-btn, html body .wren-modal .hd-btn{min-height:44px;padding:0 16px;border-radius:12px;transition:all .2s ease}
#hd-root .hd-seg{display:flex;flex-wrap:wrap;gap:6px}
#hd-root .hd-segbtn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-card);
  color:var(--c-muted);font-family:inherit;font-size:.84rem;cursor:pointer;transition:all .2s ease}
#hd-root .hd-segbtn.on{background:var(--c-blue);border-color:var(--c-blue);color:var(--c-navy);font-weight:700}

#hd-root .hd-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
#hd-root .hd-tile{background:var(--c-card);border:1px solid var(--c-border);border-radius:12px;padding:14px 16px}
#hd-root .hd-tile .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c-muted);margin-bottom:6px}
#hd-root .hd-tile .v{font-size:1.3rem;font-weight:700;color:var(--c-text);font-variant-numeric:tabular-nums}
#hd-root .hd-tile .s{font-size:.74rem;color:var(--c-muted);margin-top:4px;line-height:1.4}
/* a button inside a tile fills the tile and wraps, rather than poking past its edge at phone width */
#hd-root .hd-tile .hd-btn{width:100%;box-sizing:border-box;white-space:normal;line-height:1.25;padding:8px 12px}
#hd-root .hd-tile.good .v{color:var(--c-green)} #hd-root .hd-tile.warn .v{color:var(--c-amber)} #hd-root .hd-tile.bad .v{color:var(--c-red)}

#hd-root .hd-note{background:color-mix(in srgb, var(--c-blue) 8%, transparent);border:1px solid var(--c-border);border-left:3px solid var(--c-blue);
  border-radius:8px;padding:11px 14px;font-size:.82rem;color:var(--c-muted);line-height:1.55;margin-bottom:14px}
#hd-root .hd-note.warn{background:color-mix(in srgb, var(--c-amber) 8%, transparent);border-left-color:var(--c-amber)}
#hd-root .hd-note.bad{background:color-mix(in srgb, var(--c-red) 9%, transparent);border-left-color:var(--c-red)}
#hd-root .hd-note b, #hd-root .hd-note strong{color:var(--c-text)}
#hd-root .hd-note ul{margin:8px 0 0;padding-left:18px}
#hd-root .hd-note li{margin:3px 0}

#hd-root h3.hd-h{font-size:.95rem;margin:22px 0 10px;color:var(--c-text);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#hd-root h3.hd-h small{font-weight:400;color:var(--c-muted);font-size:.76rem}
#hd-root .hd-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
#hd-root .hd-card{background:var(--c-card);border:1px solid var(--c-border);border-left:4px solid var(--c-border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#hd-root .hd-card.red{border-left-color:var(--c-red)} #hd-root .hd-card.amber{border-left-color:var(--c-amber)}
#hd-root .hd-card.green{border-left-color:var(--c-green)} #hd-root .hd-card.done{opacity:.86}
#hd-root .hd-card.marker{border-left-color:var(--c-blue)}
#hd-root .hd-card header{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
#hd-root .hd-title{font-weight:700;color:var(--c-text);font-size:.95rem;line-height:1.35}
#hd-root .hd-title .sub{display:block;font-weight:400;color:var(--c-muted);font-size:.78rem;margin-top:2px}
#hd-root .hd-pill{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;
  background:var(--c-navy-light);color:var(--c-muted)}
#hd-root .hd-pill.red{background:color-mix(in srgb, var(--c-red) 18%, transparent);color:var(--c-red)}
#hd-root .hd-pill.amber{background:color-mix(in srgb, var(--c-amber) 18%, transparent);color:var(--c-amber)}
#hd-root .hd-pill.green{background:color-mix(in srgb, var(--c-green) 18%, transparent);color:var(--c-green)}
#hd-root .hd-dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
#hd-root .hd-dates .k{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c-muted);margin-bottom:2px}
#hd-root .hd-dates b{color:var(--c-text);font-size:.88rem;font-variant-numeric:tabular-nums}
#hd-root .hd-dates select{background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;color:var(--c-text);
  font-family:inherit;font-size:.82rem;min-height:44px;padding:0 8px;width:100%}
#hd-root .hd-why{margin:0;font-size:.82rem;color:var(--c-muted);line-height:1.5}
#hd-root .hd-done{margin:0;font-size:.8rem;color:var(--c-muted);line-height:1.5;border-top:1px dashed var(--c-border);padding-top:8px}
#hd-root .hd-done b{color:var(--c-text)}
#hd-root details.hd-rule{font-size:.78rem;color:var(--c-muted)}
#hd-root details.hd-rule summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--c-blue)}
#hd-root details.hd-rule p{margin:6px 0;line-height:1.55}
#hd-root details.hd-rule a{color:var(--c-blue)}
#hd-root .hd-actions{display:flex;flex-wrap:wrap;gap:8px}

#hd-root details.hd-panel{background:var(--c-card);border:1px solid var(--c-border);border-radius:12px;margin-bottom:12px}
#hd-root details.hd-panel>summary{cursor:pointer;padding:14px 16px;min-height:44px;font-weight:700;color:var(--c-text);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
#hd-root details.hd-panel>summary::-webkit-details-marker{display:none}
#hd-root details.hd-panel>summary::before{content:"▸";color:var(--c-muted);transition:transform .2s ease}

#hd-root details.hd-panel>summary small{font-weight:400;color:var(--c-muted);font-size:.76rem}
#hd-root .hd-panel-body{padding:2px 16px 16px}
#hd-root .hd-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
#hd-root .hd-form label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--c-text)}
#hd-root .hd-form .hint{font-size:.72rem;color:var(--c-muted);line-height:1.4}
#hd-root .hd-md{display:flex;gap:8px}
#hd-root .hd-cond{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
#hd-root .hd-cond>div{border:1px dashed var(--c-border);border-radius:10px;padding:12px 14px;font-size:.8rem;color:var(--c-muted);line-height:1.55}
#hd-root .hd-cond b{display:block;color:var(--c-text);margin-bottom:3px}
#hd-root .hd-cond em{color:var(--c-amber);font-style:normal;font-weight:700}
#hd-root .hd-cond a{color:var(--c-blue)}
#hd-root .hd-empty{color:var(--c-muted);padding:22px;text-align:center;font-size:.86rem}
#hd-root .hd-more{margin:12px 0 0}

/* ── termly report ─────────────────────────────────────────────────────── */
#hd-root .hd-card.plain{border-left-color:var(--c-border)}
#hd-root .hd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#hd-root .hd-chip{font-size:.72rem;padding:4px 9px;border-radius:14px;border:1px solid var(--c-border);color:var(--c-muted)}
#hd-root .hd-chip.ok{border-color:var(--c-green);color:var(--c-green)}
#hd-root .hd-chip.no{border-color:var(--c-red);color:var(--c-red)}
#hd-root .hd-mover{background:var(--c-card);border:1px solid var(--c-border);border-left:4px solid var(--c-blue);border-radius:12px;padding:12px 16px;margin-bottom:10px;font-size:.86rem;line-height:1.6;color:var(--c-text)}
#hd-root .hd-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#hd-root table.hd-table{width:100%;border-collapse:collapse;font-size:.83rem}
#hd-root .hd-table th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c-muted);padding:8px 10px;border-bottom:1px solid var(--c-border);white-space:nowrap}
#hd-root .hd-table td{padding:8px 10px;border-bottom:1px solid var(--c-border);color:var(--c-text);vertical-align:top}
#hd-root .hd-table td.n,#hd-root .hd-table th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#hd-root .hd-table td small{display:block;color:var(--c-muted);font-size:.72rem}
#hd-root .hd-table tfoot td{font-weight:700;border-top:2px solid var(--c-border);border-bottom:none}
#hd-root .hd-table tr.hd-btl td{color:var(--c-muted)}
/* The td selector above (1,1,1) out-ranks a bare .up (1,1,0), so the colour rules carry the element too. Cost up = red, cost down = green; the +/− sign is always printed, colour is never the only signal. */
#hd-root .hd-table td.up{color:var(--c-red)} #hd-root .hd-table td.down{color:var(--c-green)} #hd-root .hd-table td.flat{color:var(--c-muted)}
#hd-root .hd-tag{display:inline-block;font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:10px;background:var(--c-navy-light);color:var(--c-muted);margin-left:6px;vertical-align:middle}

@media (max-width:640px){
  #hd-root .hd-field .hd-in{min-width:0;width:100%} #hd-root .hd-field{flex:1 1 100%}
  #hd-root .hd-tile .v{font-size:1.12rem}
  /* the spend table becomes stacked, labelled rows — a 9-column table is not a phone layout */
  #hd-root table.hd-stack thead{display:none}
  #hd-root table.hd-stack, #hd-root table.hd-stack tbody, #hd-root table.hd-stack tr, #hd-root table.hd-stack td, #hd-root table.hd-stack tfoot{display:block;width:100%}
  #hd-root table.hd-stack tr{border:1px solid var(--c-border);border-radius:10px;margin-bottom:10px;padding:6px 4px;background:var(--c-card)}
  #hd-root table.hd-stack td{border:none;display:flex;justify-content:space-between;gap:12px;padding:5px 10px;text-align:right}
  #hd-root table.hd-stack td::before{content:attr(data-label);color:var(--c-muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;text-align:left;flex:0 0 42%}
  #hd-root table.hd-stack td:first-child{font-weight:700;justify-content:flex-start;text-align:left}
  #hd-root table.hd-stack td:first-child::before{display:none}
  #hd-root table.hd-stack td small{display:inline;margin-left:6px}
}
</style>

<script>
(function () {
  'use strict';

  var CAL = '/api/finance/calendar';
  var TR  = '/api/finance/termly-report';

  // ── plumbing ───────────────────────────────────────────────────────────────
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  };
  /* Money: integer pence in, "£1,234.56" out, real minus sign. No float arithmetic — the server sends integers. */
  var money = function (p) {
    if (p == null) return '—';
    var a = Math.abs(Math.trunc(p));
    var s = '£' + String(Math.floor(a / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + String(a % 100).padStart(2, '0');
    return p < 0 ? '−' + s : s;
  };
  /* Integer tenths of a percent → "12.3%". A non-zero change that rounds to 0.0 says "<0.1%" with its sign, never "0%". */
  var pct = function (x10, delta, signed) {
    if (x10 == null) return '—';
    if (x10 === 0 && delta) return (delta < 0 ? '−' : '+') + '<0.1%';
    var a = Math.abs(x10), body = Math.floor(a / 10) + '.' + (a % 10) + '%';
    return x10 < 0 ? '−' + body : (signed !== false && x10 > 0 ? '+' + body : body);
  };
  var bpToX10 = function (bp) { return bp == null ? null : (bp < 0 ? -Math.round(-bp / 10) : Math.round(bp / 10)); };
  var day = function (d) {
    return d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
  };
  var plural = function (n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); };
  var api = function (path, opts) { return Wren.api(path, opts); };
  var fail = function (el, e) {
    var code = e && e.error, msg;
    if (code === 'not_migrated') msg = 'The finance-calendar tables have not been created on this database yet (scripts/migrations/2026-09-21-b346-…).';
    else if (code === 'forbidden_role' || code === 'forbidden_portal') msg = esc(e.message);
    else msg = 'Could not load this — ' + esc((e && (e.message || e.error)) || 'unknown error');
    el.innerHTML = '<div class="hd-empty">' + msg + '</div>';
  };
  function link(src) {
    if (!src) return '';
    return src.url ? '<a href="' + esc(src.url) + '" target="_blank" rel="noopener noreferrer">' + esc(src.label) + '</a>' : esc(src.label);
  }

  // ═══ 1. DEADLINES ══════════════════════════════════════════════════════════
  var cal = null, group = 'all', showAllUpcoming = false;
  var PARTY = { toby: 'You', accountant: 'The accountant', bank: 'The bank', hmrc: 'HMRC' };

  function ruleOf(code) { return (cal.rules || []).filter(function (r) { return r.code === code; })[0] || {}; }

  function dueWords(o) {
    if (o.status === 'done') return 'Done';
    if (o.status === 'not_applicable') return 'Not applicable';
    if (o.phase === 'upcoming') return 'Our date in ' + plural(o.days_to_internal, 'day');
    var d = o.statutory ? o.days_to_statutory : o.days_to_internal, own = o.statutory ? '' : ' (our own date)';
    if (d < 0) return 'Overdue by ' + plural(-d, 'day') + own;
    if (d === 0) return 'Due today' + own;
    return 'Due in ' + plural(d, 'day') + own;
  }

  function occCard(o) {
    var r = ruleOf(o.rule), isDone = o.status !== 'open';
    if (o.marker) {
      return '<article class="hd-card marker"><header><div class="hd-title">' + esc(o.title) + '<span class="sub">' + esc(o.label) + '</span></div>'
        + '<span class="hd-pill">A date to know</span></header>'
        + '<div class="hd-dates"><div><span class="k">Date</span><b>' + day(o.marker) + '</b></div></div>'
        + '<details class="hd-rule"><summary>What this is</summary><p>' + esc(r.rule) + '</p><p>Source: ' + link(r.source) + '</p></details></article>';
    }
    var tone = isDone ? 'done' : (o.rag || '');
    var pillTone = isDone ? 'green' : (o.phase === 'upcoming' ? '' : o.rag);
    var dates = '<div class="hd-dates">'
      + (o.statutory ? '<div><span class="k">Statutory date</span><b>' + day(o.statutory) + '</b></div>' : '<div><span class="k">Statutory date</span><b>None — our own rule</b></div>')
      + '<div><span class="k">Our own date</span><b>' + day(o.internal) + '</b></div>'
      + '<div><label class="k" for="hd-b-' + esc(o.key) + '">Waiting on</label>'
      + '<select class="hd-blk" id="hd-b-' + esc(o.key) + '" data-key="' + esc(o.key) + '"' + (isDone ? ' disabled' : '') + '>'
      + Object.keys(PARTY).map(function (k) { return '<option value="' + k + '"' + (o.blocked_on === k ? ' selected' : '') + '>' + PARTY[k] + '</option>'; }).join('')
      + '</select></div></div>';
    var doneLine = isDone
      ? '<p class="hd-done"><b>' + (o.status === 'done' ? 'Done' : 'Marked not applicable') + '</b>'
        + (o.done_at ? ' ' + day(o.done_at.slice(0, 10)) : '') + (o.done_by_name ? ' by ' + esc(o.done_by_name) : '')
        + (o.done_note ? ' — ' + esc(o.done_note) : '')
        + (o.evidence_location ? '<br>Evidence: ' + esc(o.evidence_location) : '')
        + (o.attested_through ? '<br>Bank accounts reconciled through <b>' + day(o.attested_through) + '</b>' : '') + '</p>'
      : '<p class="hd-why">' + esc(o.why || '') + (o.verify ? ' <b>Confirm this date against the Pensions Regulator’s letter.</b>' : '') + '</p>';
    var actions = isDone
      ? '<button type="button" class="btn btn-ghost hd-btn" data-act="reopen" data-key="' + esc(o.key) + '">Reopen</button>'
      : '<button type="button" class="btn btn-primary hd-btn" data-act="done" data-key="' + esc(o.key) + '">Mark done</button>'
        + '<button type="button" class="btn btn-ghost hd-btn" data-act="na" data-key="' + esc(o.key) + '">Not applicable</button>';
    return '<article class="hd-card ' + tone + '" data-key="' + esc(o.key) + '">'
      + '<header><div class="hd-title">' + esc(o.title) + '<span class="sub">' + esc(o.label) + '</span></div>'
      + '<span class="hd-pill ' + pillTone + '">' + esc(dueWords(o)) + '</span></header>'
      + dates + doneLine
      + '<details class="hd-rule"><summary>The rule, and where it comes from</summary>'
      + '<p>' + esc(r.rule) + '</p><p>Source: ' + link(r.source) + '</p>'
      + (r.evidence ? '<p>Evidence to keep: ' + esc(r.evidence) + '</p>' : '')
      + (o.lead_days != null ? '<p>Our own date is ' + plural(o.lead_days, 'day') + ' before the statutory one (a default — change it under Company dates), stepped back off weekends and bank holidays.</p>' : '')
      + '</details>'
      + '<div class="hd-actions">' + actions + '</div></article>';
  }

  function settingsPanel(s) {
    var v = s.values, ro = s.can_edit ? '' : ' disabled';
    function field(h) {
      var val = v[h.key] || '';
      var input;
      if (h.type === 'md') {
        var m = (val.match(/^(\d\d)-(\d\d)$/) || [null, '', '']);
        var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        input = '<div class="hd-md" data-md="' + esc(h.key) + '">'
          + '<select class="hd-in hd-md-m" aria-label="Month"' + ro + '><option value="">Month</option>'
          + months.map(function (n, i) { var mm = String(i + 1).padStart(2, '0'); return '<option value="' + mm + '"' + (m[1] === mm ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>'
          + '<select class="hd-in hd-md-d" aria-label="Day"' + ro + '><option value="">Day</option>'
          + Array.from({ length: 31 }, function (_, i) { var dd = String(i + 1).padStart(2, '0'); return '<option value="' + dd + '"' + (m[2] === dd ? ' selected' : '') + '>' + (i + 1) + '</option>'; }).join('') + '</select></div>';
      } else if (h.type === 'date') {
        input = '<input type="date" class="hd-in" data-key="' + esc(h.key) + '" value="' + esc(val) + '"' + ro + '>';
      } else {
        input = '<input type="number" inputmode="numeric" class="hd-in" data-key="' + esc(h.key) + '" min="' + h.min + '" max="' + h.max + '" value="' + esc(val) + '"' + ro + '>';
      }
      return '<label>' + esc(h.label) + input + '<span class="hint">' + esc(h.hint) + '</span></label>';
    }
    return '<details class="hd-panel" id="hd-settings"' + (cal.needs.length ? ' open' : '') + '><summary>Company dates <small>— everything is computed from these; Wren never guesses one</small></summary>'
      + '<div class="hd-panel-body">'
      + (s.can_edit ? '' : '<div class="hd-note warn">Company dates move every deadline on this page, so they can only be changed by the owner and finance roles.</div>')
      + '<div class="hd-form">' + s.help.map(field).join('') + '</div>'
      + (s.can_edit ? '<div class="hd-actions" style="margin-top:14px"><button type="button" class="btn btn-primary hd-btn" id="hd-save-settings">Save company dates</button></div>' : '')
      + '</div></details>';
  }

  function rulesPanel() {
    var rows = cal.rules.map(function (r) {
      return '<tr><td><b>' + esc(r.title) + '</b><small>' + (r.kind === 'statutory' ? 'Statutory' : r.kind === 'marker' ? 'A date to know' : 'Our own rule') + ' · ' + esc(r.recurrence) + '</small></td>'
        + '<td>' + esc(r.rule) + '</td><td>' + link(r.source) + '</td></tr>';
    }).join('');
    return '<details class="hd-panel"><summary>Every rule, and where it comes from <small>— the wording each date is computed from</small></summary>'
      + '<div class="hd-panel-body hd-scroll"><table class="hd-table"><thead><tr><th>Deadline</th><th>Rule</th><th>Source</th></tr></thead><tbody>' + rows + '</tbody></table></div></details>';
  }
  function conditionalPanel() {
    return '<details class="hd-panel"><summary>Only if… <small>— real obligations that depend on facts about the company, so no date is invented</small></summary>'
      + '<div class="hd-panel-body"><div class="hd-cond">' + cal.conditional.map(function (c) {
        return '<div><b>' + esc(c.title) + '</b><em>' + esc(c.when) + '</em><br>' + esc(c.rule) + '<br>Source: ' + link(c.source) + '</div>';
      }).join('') + '</div></div></details>';
  }
  function logPanel() {
    return '<details class="hd-panel" id="hd-log"><summary>Who did what <small>— the record of every mark-done, reopen and date change</small></summary>'
      + '<div class="hd-panel-body" id="hd-log-body"><div class="hd-empty">Open to load…</div></div></details>';
  }

  function renderCalendar() {
    var el = $('hd-cal-body'); if (!el || !cal) return;
    var inGroup = function (o) { return group === 'all' || o.group === group; };
    var occ = cal.occurrences.filter(inGroup);
    var todo = occ.filter(function (o) { return !o.marker && o.status === 'open' && o.phase !== 'upcoming'; });
    var upc  = occ.filter(function (o) { return o.marker ? o.marker >= cal.today : (o.status === 'open' && o.phase === 'upcoming'); });
    var done = occ.filter(function (o) { return !o.marker && o.status !== 'open'; }).slice().reverse();
    /* Ranked like the board: red before amber, then the earliest date first — so the statutory deadlines that are about to
       bite are not buried under older internal jobs that are merely late. */
    var ragW = { red: 0, amber: 1, green: 2 };
    var w = function (r) { return ragW[r] != null ? ragW[r] : 1; };      // NOT `ragW[r] || 1` — red's weight is 0, which is falsy
    todo.sort(function (a, b) { return (w(a.rag) - w(b.rag)) || (a.due < b.due ? -1 : a.due > b.due ? 1 : 0); });

    var rt = cal.reconciled_through, c = cal.counts;
    var tiles = '<div class="hd-tiles">'
      + '<div class="hd-tile ' + (c.red ? 'bad' : '') + '"><div class="k">Red</div><div class="v">' + c.red + '</div><div class="s">statutory date within 7 days or gone</div></div>'
      + '<div class="hd-tile ' + (c.amber ? 'warn' : '') + '"><div class="k">Needs doing</div><div class="v">' + (c.open - c.upcoming) + '</div><div class="s">our own date has arrived</div></div>'
      + '<div class="hd-tile"><div class="k">Coming up</div><div class="v">' + c.upcoming + '</div><div class="s">not yet at our own date</div></div>'
      + '<div class="hd-tile ' + (rt.through ? 'good' : 'warn') + '"><div class="k">Banks reconciled through</div><div class="v">' + (rt.through ? day(rt.through) : 'Not recorded') + '</div>'
      + '<div class="s">' + (rt.through ? 'recorded by ' + esc(rt.by || 'someone') + ' — the termly report trusts nothing later' : 'the termly report will not give a number until this is recorded') + '</div>'
      + '<button type="button" class="btn btn-secondary hd-btn" id="hd-recon" style="margin-top:10px">Record a reconciliation</button></div>'
      + '</div>';

    var needs = cal.needs.length
      ? '<div class="hd-note warn"><b>' + plural(cal.needs.length, 'deadline') + ' cannot be calculated yet.</b> Wren works dates out from facts only you hold, and will not guess them. Missing: '
        + esc(Array.from(new Set([].concat.apply([], cal.needs.map(function (n) { return n.missing; })))).join('; '))
        + '. <a href="#hd-settings" id="hd-goto-settings">Enter the company dates</a>.</div>' : '';
    var tracking = '<div class="hd-note">Tracking deadlines from <b>' + day(cal.tracking_from) + '</b>. Anything earlier is not shown. '
      + 'Wren files nothing and contacts nobody — a deadline is cleared only when a person says what they did.</div>';

    var upShown = showAllUpcoming ? upc : upc.slice(0, 10);
    var html = tiles + needs + tracking
      + '<h3 class="hd-h">Needs attention <small>' + todo.length + '</small></h3>'
      + (todo.length ? '<div class="hd-list">' + todo.map(occCard).join('') + '</div>' : '<div class="hd-empty">Nothing has reached its own date yet.</div>')
      + '<h3 class="hd-h">Coming up <small>' + upc.length + '</small></h3>'
      + (upc.length ? '<div class="hd-list">' + upShown.map(occCard).join('') + '</div>' : '<div class="hd-empty">Nothing further ahead in this view.</div>')
      + (upc.length > upShown.length ? '<p class="hd-more"><button type="button" class="btn btn-ghost hd-btn" id="hd-show-all">Show all ' + upc.length + ' coming up</button></p>' : '')
      + (done.length ? '<h3 class="hd-h">Done <small>' + done.length + '</small></h3><div class="hd-list">' + done.slice(0, 12).map(occCard).join('') + '</div>' : '')
      + '<h3 class="hd-h">Setup and reference</h3>'
      + settingsPanel(cal.settings) + conditionalPanel() + rulesPanel() + logPanel();
    el.innerHTML = html;
  }

  function loadCalendar() {
    var el = $('hd-cal-body'); if (!el) return;
    return api(CAL).then(function (d) { if (!d) return; cal = d; renderCalendar(); }).catch(function (e) { fail(el, e); });
  }

  // ── actions on an occurrence (popup-first) ─────────────────────────────────
  function find(key) { return cal.occurrences.filter(function (o) { return o.key === key; })[0]; }
  function post(o, verb, body) { return api(CAL + '/items/' + encodeURIComponent(o.rule) + '/' + encodeURIComponent(o.period) + '/' + verb, { method: 'POST', body: body || {} }); }
  function afterWrite(msg) { return function (r) { Wren.toast(msg + (r && r.board && r.board.closed ? ' — the card on the board has cleared' : ''), 'success'); return loadCalendar(); }; }
  function closeModal() { var b = document.querySelector('.wren-modal-overlay .modal-close'); if (b) b.click(); }

  function noteModal(o, opts) {
    var r = ruleOf(o.rule), wrap = document.createElement('div');
    wrap.innerHTML = '<p style="margin:0 0 12px;color:var(--c-muted);font-size:.85rem;line-height:1.5">' + esc(o.title) + ' — ' + esc(o.label) + '</p>'
      + '<label style="display:block;font-size:.8rem;margin-bottom:6px">' + esc(opts.noteLabel) + '</label>'
      + '<textarea class="hd-in" id="hd-m-note" rows="3" maxlength="1000" style="min-height:88px" placeholder="' + esc(opts.placeholder) + '"></textarea>'
      + (opts.evidence ? '<label style="display:block;font-size:.8rem;margin:12px 0 6px">Where is the evidence? (optional)</label>'
        + '<input type="text" class="hd-in" id="hd-m-evid" maxlength="300" placeholder="' + esc(r.evidence || '') + '">' : '')
      + (o.attests ? '<label style="display:block;font-size:.8rem;margin:12px 0 6px">Bank accounts reconciled through</label>'
        + '<input type="date" class="hd-in" id="hd-m-through" value="' + esc(o.month_end) + '" max="' + esc(cal.today) + '">'
        + '<p style="margin:6px 0 0;color:var(--c-muted);font-size:.74rem;line-height:1.45">This is cumulative: it covers every earlier month too. The termly money report only trusts months up to this date.</p>' : '')
      + '<p id="hd-m-err" style="color:var(--c-red);font-size:.8rem;margin:10px 0 0" role="alert"></p>';
    Wren.modal(esc(opts.title), wrap, [
      { label: 'Cancel', class: 'btn-ghost hd-btn' },
      { label: opts.button, class: 'btn-primary hd-btn', close: false, action: function () {
        var note = $('hd-m-note').value.trim();
        if (note.length < 3) { $('hd-m-err').textContent = opts.noteRequired; $('hd-m-note').focus(); return; }
        var body = { note: note };
        if (opts.evidence) body.evidence_location = $('hd-m-evid').value.trim();
        if (o.attests && $('hd-m-through')) body.attested_through = $('hd-m-through').value;
        post(o, opts.verb, body).then(function (res) { closeModal(); return afterWrite(opts.done)(res); })
          .catch(function (e) { $('hd-m-err').textContent = (e && e.message) || 'That did not save.'; });
      } },
    ]);
    setTimeout(function () { var n = $('hd-m-note'); if (n) n.focus(); }, 60);
  }

  /* "Bank accounts reconciled through <date>" — the ONLY thing the termly report will trust. Recorded on its own rather
     than as a scheduled job, because on day one there is no past month's job to tick, and history is what the report needs. */
  function reconModal() {
    var d = new Date(), last = new Date(d.getFullYear(), d.getMonth(), 0), p2 = function (n) { return String(n).padStart(2, '0'); };
    var def = last.getFullYear() + '-' + p2(last.getMonth() + 1) + '-' + p2(last.getDate());
    var todayLocal = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
    var wrap = document.createElement('div');
    wrap.innerHTML = '<p style="margin:0 0 12px;color:var(--c-muted);font-size:.85rem;line-height:1.5">Say the bank accounts are reconciled in Xero up to a date. '
      + 'It covers every earlier month too, and it is recorded with your name and the date. Wren cannot see a reconciliation for itself, so this is what the termly report relies on.</p>'
      + '<label style="display:block;font-size:.8rem;margin-bottom:6px">Reconciled through</label>'
      + '<input type="date" class="hd-in" id="hd-r-through" value="' + def + '" max="' + todayLocal + '">'
      + '<label style="display:block;font-size:.8rem;margin:12px 0 6px">Which accounts, and anything outstanding? (required)</label>'
      + '<textarea class="hd-in" id="hd-r-note" rows="3" maxlength="1000" style="min-height:88px" placeholder="e.g. Current account and savings, all reconciled in Xero; nothing outstanding"></textarea>'
      + '<p id="hd-r-err" style="color:var(--c-red);font-size:.8rem;margin:10px 0 0" role="alert"></p>';
    Wren.modal('Record a bank reconciliation', wrap, [
      { label: 'Cancel', class: 'btn-ghost hd-btn' },
      { label: 'Save', class: 'btn-primary hd-btn', close: false, action: function () {
        var note = $('hd-r-note').value.trim(), through = $('hd-r-through').value;
        if (!through) { $('hd-r-err').textContent = 'Choose the date you reconciled through.'; return; }
        if (note.length < 3) { $('hd-r-err').textContent = 'Say which accounts were reconciled — a few words is enough.'; $('hd-r-note').focus(); return; }
        api(CAL + '/reconciled-through', { method: 'POST', body: { through: through, note: note } }).then(function () {
          closeModal(); Wren.toast('Recorded — reconciled through ' + day(through), 'success');
          return Promise.all([cal ? loadCalendar() : null, tr ? (loadReport(), null) : null]);
        }).catch(function (e) { $('hd-r-err').textContent = (e && e.message) || 'That did not save.'; });
      } },
    ]);
    setTimeout(function () { var n = $('hd-r-note'); if (n) n.focus(); }, 60);
  }

  function onCalClick(e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.id === 'hd-recon') { reconModal(); return; }
    if (t.id === 'hd-show-all') { showAllUpcoming = true; renderCalendar(); return; }
    if (t.id === 'hd-save-settings') { saveSettings(); return; }
    var key = t.getAttribute('data-key'), act = t.getAttribute('data-act');
    if (!key || !act) return;
    var o = find(key); if (!o) return;
    if (act === 'done') noteModal(o, { title: 'Mark done', button: 'Save as done', verb: 'done', evidence: true,
      noteLabel: 'What was filed or done? (required)', placeholder: 'e.g. CT600 filed by the accountant, HMRC receipt in the finance folder',
      noteRequired: 'Say what was filed — a few words is enough.', done: 'Marked done' });
    else if (act === 'na') noteModal(o, { title: 'Not applicable', button: 'Save', verb: 'not-applicable', evidence: false,
      noteLabel: 'Why does this not apply? (required)', placeholder: 'e.g. no benefits in kind this year',
      noteRequired: 'Say why it does not apply.', done: 'Marked not applicable' });
    else if (act === 'reopen') post(o, 'reopen', {}).then(afterWrite('Reopened')).catch(function (er) { Wren.toast((er && er.message) || 'Could not reopen', 'error'); });
  }
  function onCalChange(e) {
    var s = e.target.closest('select.hd-blk'); if (!s) return;
    var o = find(s.getAttribute('data-key')); if (!o) return;
    post(o, 'blocked', { blocked_on: s.value }).then(afterWrite('Updated')).catch(function (er) { Wren.toast((er && er.message) || 'Could not update', 'error'); });
  }

  function saveSettings() {
    var vals = {};
    document.querySelectorAll('#hd-settings input[data-key]').forEach(function (i) { vals[i.getAttribute('data-key')] = i.value; });
    document.querySelectorAll('#hd-settings .hd-md').forEach(function (w) {
      var m = w.querySelector('.hd-md-m').value, d = w.querySelector('.hd-md-d').value;
      vals[w.getAttribute('data-md')] = (m && d) ? m + '-' + d : '';
    });
    api(CAL + '/settings', { method: 'PUT', body: { values: vals } }).then(function (r) {
      Wren.toast('Company dates saved', 'success');
      if (r && r.warning) Wren.toast(r.warning, 'error');
      return loadCalendar();
    }).catch(function (e) { Wren.toast((e && e.message) || 'Could not save', 'error'); });
  }

  function loadLog() {
    var el = $('hd-log-body'); if (!el || el.getAttribute('data-loaded')) return;
    api(CAL + '/log?limit=40').then(function (d) {
      el.setAttribute('data-loaded', '1');
      el.innerHTML = d.log.length ? '<div class="hd-scroll"><table class="hd-table"><thead><tr><th>When</th><th>Who</th><th>What</th><th>Note</th></tr></thead><tbody>'
        + d.log.map(function (l) {
          return '<tr><td>' + day(l.at.slice(0, 10)) + '</td><td>' + esc(l.by || '—') + '</td><td>' + esc(l.rule_code + ' · ' + l.period_key + ' · ' + l.action.replace('_', ' ')) + '</td><td>' + esc(l.note || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="hd-empty">Nothing recorded yet.</div>';
    }).catch(function (e) { fail(el, e); });
  }

  // ── printing the calendar: every date printed next to the rule it comes from ─
  function printView(title, subtitle, bodyHtml, notes) {
    var w = window.open('', '_blank', 'width=980,height=1000');
    if (!w) { Wren.toast('Allow pop-ups to print this', 'error'); return; }
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>'
      + 'body{font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:black;background:white;margin:28px;max-width:1000px}'
      + 'h1{font-size:1.3rem;margin:0 0 2px}h2{font-size:1rem;margin:18px 0 6px}.sub{color:dimgray;margin-bottom:6px;font-size:.9rem}'
      + '.stamp{color:gray;font-size:.76rem;margin-bottom:16px}'
      + 'table{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:.8rem}'
      + 'th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:dimgray;border-bottom:2px solid silver;padding:6px 5px}'
      + 'td{padding:6px 5px;border-bottom:1px solid gainsboro;vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}'
      + 'td small{display:block;color:dimgray;font-size:.72rem}tfoot td{font-weight:700;border-top:2px solid silver;border-bottom:none}'
      + 'td.d{white-space:nowrap}'
      + '.note{border-left:3px solid gray;background:whitesmoke;padding:8px 11px;margin:0 0 10px;font-size:.76rem;line-height:1.5}'
      + '.foot{margin-top:20px;border-top:1px solid silver;padding-top:10px;font-size:.7rem;color:dimgray;line-height:1.5}'
      + '@media print{body{margin:12mm}tr{page-break-inside:avoid}}'
      + '</style></head><body><h1>' + esc(title) + '</h1><div class="sub">' + esc(subtitle) + '</div>'
      + '<div class="stamp">Your Nursery · 123 Example Lane, London AB1 2CD · printed ' + new Date().toLocaleString('en-GB') + '</div>'
      + bodyHtml + '<div class="foot">' + (notes || []).map(function (n) { return '<div>' + n + '</div>'; }).join('')
      + '<div>Read-only sheet from Wren. Nothing on it was filed, paid or sent by producing it.</div></div></body></html>');
    w.document.close();
    setTimeout(function () { w.focus(); w.print(); }, 350);
  }
  function printCalendar() {
    if (!cal) return;
    var occ = cal.occurrences.filter(function (o) { return !o.marker && o.status === 'open' && (group === 'all' || o.group === group); });
    var rows = occ.map(function (o) {
      var r = ruleOf(o.rule);
      return '<tr><td><b>' + esc(o.title) + '</b><small>' + esc(o.label) + '</small></td>'
        + '<td class="d">' + (o.statutory ? day(o.statutory) : 'None') + '</td><td class="d">' + day(o.internal) + '</td><td>' + esc(PARTY[o.blocked_on] || '') + '</td>'
        + '<td>' + esc(r.rule) + '<small>' + esc(r.source && r.source.label) + (r.source && r.source.url ? ' — ' + esc(r.source.url) : '') + '</small></td></tr>';
    }).join('');
    printView('Tax and filing deadlines', 'Open deadlines, each with the rule it comes from — tracking from ' + day(cal.tracking_from),
      '<table><colgroup><col style="width:21%"><col style="width:13%"><col style="width:13%"><col style="width:9%"><col style="width:44%"></colgroup>'
        + '<thead><tr><th>Deadline</th><th>Statutory date</th><th>Our own date</th><th>Waiting on</th><th>The rule, and its source</th></tr></thead><tbody>' + rows + '</tbody></table>',
      cal.needs.length ? ['<b>Not calculated — company dates missing:</b> ' + esc(cal.needs.map(function (n) { return n.title; }).join(', '))] : []);
  }

  // ═══ 2. TERMLY MONEY REPORT ════════════════════════════════════════════════
  var tr = null, termsLoaded = false;

  function trTiles(d) {
    var I = d.income.current, V = d.volumes.current, S = d.spend.totals.current, N = d.net;
    var fh = V.funded_hours_x100;
    return [
      { k: 'Income (Xero)', v: money(I.xero_income_pence), s: d.income.prior ? 'was ' + money(d.income.prior.xero_income_pence) : 'no comparison available' },
      { k: 'Operating spend', v: money(S.operating_pence), s: d.spend.totals.prior ? 'was ' + money(d.spend.totals.prior.operating_pence) : (d.hidden.staff_costs ? 'excludes staff costs' : '') },
      N && N.current_pence != null
        ? { k: 'Result', v: (N.current_pence < 0 ? 'Deficit ' : N.current_pence > 0 ? 'Surplus ' : 'Break-even ') + money(Math.abs(N.current_pence)), tone: N.current_pence < 0 ? 'bad' : 'good', s: N.prior_pence != null ? 'was ' + (N.prior_pence < 0 ? 'a deficit of ' : 'a surplus of ') + money(Math.abs(N.prior_pence)) : '' }
        : { k: 'Result', v: 'Not shown', s: 'it would include staff costs' },
      { k: 'Children billed', v: String(V.child_months) + ' child-months', s: d.volumes.prior ? 'was ' + d.volumes.prior.child_months : '' },
      { k: 'Funded hours', v: Math.floor(fh / 100).toLocaleString('en-GB') + ' h', s: d.volumes.prior ? 'was ' + Math.floor(d.volumes.prior.funded_hours_x100 / 100).toLocaleString('en-GB') + ' h' : '' },
    ];
  }
  function tilesHtml(list) {
    return '<div class="hd-tiles">' + list.map(function (t) {
      return '<div class="hd-tile ' + (t.tone || '') + '"><div class="k">' + esc(t.k) + '</div><div class="v">' + esc(t.v) + '</div>' + (t.s ? '<div class="s">' + esc(t.s) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }

  function changeCell(delta, x10, costGood) {
    if (delta == null) return '<td class="n" data-label="Change">—</td>';
    var cls = delta === 0 ? 'flat' : (delta > 0 ? (costGood ? 'down' : 'up') : (costGood ? 'up' : 'down'));
    return '<td class="n ' + cls + '" data-label="Change">' + (delta > 0 ? '+' : '') + money(delta) + '<small>' + pct(x10, delta) + '</small></td>';
  }
  function shareCell(c, p) {
    if (c.share_bp == null) return '<td class="n" data-label="% of income">—</td>';
    return '<td class="n" data-label="% of income">' + pct(bpToX10(c.share_bp), 0, false) + (p && p.share_bp != null ? '<small>was ' + pct(bpToX10(p.share_bp), 0, false) + '</small>' : '') + '</td>';
  }
  function perCell(label, cur, pri) {
    if (cur == null) return '<td class="n" data-label="' + label + '">—</td>';
    return '<td class="n" data-label="' + label + '">' + money(cur) + (pri != null ? '<small>was ' + money(pri) + '</small>' : '') + '</td>';
  }

  function spendTable(d, forPrint) {
    var rows = d.spend.rows, hasPrior = !!d.spend.totals.prior;
    var head = '<tr><th>Category</th><th class="n">This term</th>' + (hasPrior ? '<th class="n">Same months last year</th><th class="n">Change</th>' : '')
      + '<th class="n">% of income</th><th class="n">Per child-month</th><th class="n">Per funded hour</th></tr>';
    var body = rows.map(function (r) {
      var btl = r.kind === 'non_operating' || r.kind === 'tax';
      var tag = r.kind === 'staff' ? '<span class="hd-tag">staff</span>' : btl ? '<span class="hd-tag">below the line</span>' : '';
      if (r.credit) tag += '<span class="hd-tag" title="Money came back into this account — a refund, reversal or reclassification. A change measured from a credit is not a change in cost.">net credit '
        + (r.credit === 'prior' ? 'last year' : r.credit === 'current' ? 'this term' : 'both years') + '</span>';
      return '<tr' + (btl ? ' class="hd-btl"' : '') + '><td data-label="Category">' + esc(r.category) + tag + '</td>'
        + '<td class="n" data-label="This term">' + money(r.current.pence) + '</td>'
        + (hasPrior ? '<td class="n" data-label="Last year">' + money(r.prior.pence) + '</td>' + changeCell(r.delta_pence, r.delta_pct_x10, false) : '')
        + shareCell(r.current, r.prior)
        + perCell('Per child-month', r.current.per_child_month_pence, r.prior && r.prior.per_child_month_pence)
        + perCell('Per funded hour', r.current.per_funded_hour_pence, r.prior && r.prior.per_funded_hour_pence) + '</tr>';
    }).join('');
    var T = d.spend.totals, foot = '<tr><td data-label="Category">Operating spend' + (d.hidden.staff_costs ? ' (excl. staff)' : '') + '</td><td class="n" data-label="This term">' + money(T.current.operating_pence) + '</td>'
      + (hasPrior ? '<td class="n" data-label="Last year">' + money(T.prior.operating_pence) + '</td>' + changeCell(T.current.operating_pence - T.prior.operating_pence,
          T.prior.operating_pence > 0 ? Math.round((T.current.operating_pence - T.prior.operating_pence) * 1000 / T.prior.operating_pence) : null, false) : '')
      + shareCell(T.current.operating, T.prior && T.prior.operating)
      + perCell('Per child-month', T.current.operating.per_child_month_pence, T.prior && T.prior.operating.per_child_month_pence)
      + perCell('Per funded hour', T.current.operating.per_funded_hour_pence, T.prior && T.prior.operating.per_funded_hour_pence) + '</tr>';
    return '<table class="hd-table' + (forPrint ? '' : ' hd-stack') + '"><thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table>';
  }

  function incomeTable(d, forPrint) {
    var c = d.income.current, p = d.income.prior, hasPrior = !!p;
    function row(label, a, b, memo, note) {
      var delta = (a != null && b != null) ? a - b : null;
      return '<tr' + (memo ? ' class="hd-btl"' : '') + '><td data-label="Income">' + esc(label) + (note ? '<small>' + esc(note) + '</small>' : '') + '</td>'
        + '<td class="n" data-label="This term">' + (a == null ? '<span title="Funding records are missing for some months">missing</span>' : money(a)) + '</td>'
        + (hasPrior ? '<td class="n" data-label="Last year">' + (b == null ? 'missing' : money(b)) + '</td>'
          + '<td class="n ' + (delta == null || delta === 0 ? 'flat' : delta > 0 ? 'down' : 'up') + '" data-label="Change">' + (delta == null ? '—' : (delta > 0 ? '+' : '') + money(delta)) + '</td>' : '') + '</tr>';
    }
    var g = function (k) { return p ? p[k] : null; };
    var body = row('Fees invoiced', c.fees_invoiced_pence, g('fees_invoiced_pence'), false, 'Wren invoices, by the month the care was delivered')
      + row('Funding claimed', c.funding_claimed_pence, g('funding_claimed_pence'), false, 'EyMan funding report')
      + row('Other income', c.other_income_pence, g('other_income_pence'), false, d.income.other_accounts.length ? 'Xero: ' + d.income.other_accounts.join(', ') : 'Xero income other than fees and funding')
      + row('Income — Wren basis', c.wren_income_pence, g('wren_income_pence'), false, 'the three above')
      + row('Fees collected (cash received)', c.fees_collected_pence, g('fees_collected_pence'), true, 'Payments ledger — cash, not income; not in the total')
      + row('Booked in Xero as income', c.xero_income_pence, g('xero_income_pence'), true, 'the basis for every “% of income” below');
    return '<table class="hd-table' + (forPrint ? '' : ' hd-stack') + '"><thead><tr><th>Income</th><th class="n">This term</th>' + (hasPrior ? '<th class="n">Same months last year</th><th class="n">Change</th>' : '') + '</tr></thead><tbody>' + body + '</tbody></table>';
  }

  function chipsFor(list, label) {
    return '<div><b style="font-size:.78rem;color:var(--c-muted)">' + esc(label) + '</b><div class="hd-chips">' + list.map(function (m) {
      return '<span class="hd-chip ' + (m.ok ? 'ok' : 'no') + '" title="' + esc(m.problems.map(function (p) { return p.text; }).join(' ')) + '">' + esc(m.label) + (m.ok ? ' ✓' : ' ✗') + '</span>';
    }).join('') + '</div></div>';
  }

  function warningHtml(d) {
    var w = d.warning; if (!w) return '';
    var byWin = { current: [], prior: [] };
    w.missing.forEach(function (m) { byWin[m.window].push(m); });
    function list(items) {
      return '<ul>' + items.map(function (m) { return '<li><b>' + esc(m.label) + '</b> — ' + esc(m.reasons.join(' ')) + '</li>'; }).join('') + '</ul>';
    }
    var u = w.unreconciled_bank;
    return '<div class="hd-note ' + (w.level === 'no_figures' ? 'bad' : 'warn') + '" role="alert"><strong>' + esc(w.headline) + '</strong><br>' + esc(w.detail)
      + (byWin.current.length ? '<br><br><b>Missing for this term</b>' + list(byWin.current) : '')
      + (byWin.prior.length ? '<br><b>Missing for the same months last year</b>' + list(byWin.prior) : '')
      + (u.lines ? '<br><b>Known unreconciled bank lines:</b> ' + u.lines + ' — ' + money(u.out_pence) + ' out, ' + money(u.in_pence) + ' in.' : '')
      + '<br><br><b>To fix it:</b> ' + esc(w.how_to_fix) + '<br><button type="button" class="btn btn-primary hd-btn" id="hd-recon-tr" style="margin-top:8px">Record a reconciliation</button> '
      + '<button type="button" class="btn btn-secondary hd-btn" id="hd-goto-cal" style="margin-top:8px">Open the calendar</button></div>';
  }

  function renderReport() {
    var el = $('hd-tr-body'); if (!el || !tr) return;
    var d = tr, rec = d.reconciliation;
    var strip = '<div class="hd-card plain" style="margin-bottom:14px"><div class="hd-why">'
      + (rec.reconciled_through ? 'Bank accounts recorded as reconciled through <b style="color:var(--c-text)">' + day(rec.reconciled_through) + '</b> by ' + esc(rec.recorded_by || 'someone') + (rec.note ? ' — “' + esc(rec.note) + '”' : '') + '.'
        : '<b style="color:var(--c-text)">Nobody has recorded a bank reconciliation.</b> Wren cannot see one for itself — Xero only tells it about transactions that are already reconciled.')
      + '</div>' + chipsFor(rec.months.filter(function (m) { return d.windows.current.some(function (w) { return w.month === m.month; }); }), 'This term — ' + d.term.name)
      + chipsFor(rec.months.filter(function (m) { return d.windows.prior.some(function (w) { return w.month === m.month; }); }), 'Same months last year') + '</div>';

    var head = '<p class="hd-why" style="margin:0 0 12px"><b style="color:var(--c-text)">' + esc(d.term.name) + '</b> · ' + day(d.term.start) + ' – ' + day(d.term.end)
      + (d.term.finished ? '' : ' · <b style="color:var(--c-amber)">in progress</b>') + ' · compared with ' + esc(d.windows.prior[0].label) + ' – ' + esc(d.windows.prior[d.windows.prior.length - 1].label) + '</p>';

    if (!d.income) { el.innerHTML = head + warningHtml(d) + strip; return; }

    var moversHtml = d.movers.length
      ? '<h3 class="hd-h">The biggest movers <small>largest change first — the arithmetic is stated in each</small></h3>' + d.movers.map(function (m) { return '<div class="hd-mover">' + esc(m.sentence) + '</div>'; }).join('') : '';
    var net = d.net && d.net.sentence ? '<div class="hd-note"><b>The result.</b> ' + esc(d.net.sentence) + ' <span style="opacity:.8">(' + esc(d.net.basis) + ')</span></div>'
      : (d.net && d.net.withheld ? '<div class="hd-note warn">' + esc(d.net.withheld) + '</div>' : '');
    var basis = '<div class="hd-note"><b>How to read this.</b> ' + esc(d.windows.basis) + ' ' + esc(d.income.xero_sales_note) + ' ' + esc(d.spend.basis)
      + ' ' + esc(d.volumes.child_months_note) + ' ' + esc(d.volumes.funded_hours_note) + (d.spend.note ? ' <b>' + esc(d.spend.note) + '</b>' : '')
      + ' Spend source: ' + esc(d.spend.sources.join('; ')) + '.</div>';

    el.innerHTML = head + warningHtml(d) + strip + tilesHtml(trTiles(d)) + net + moversHtml
      + '<h3 class="hd-h">Income</h3><div class="hd-scroll">' + incomeTable(d) + '</div>'
      + '<h3 class="hd-h">Where the money went <small>sorted by the size of the change, not alphabetically</small></h3><div class="hd-scroll">' + spendTable(d) + '</div>' + basis;
  }

  function loadReport() {
    var el = $('hd-tr-body'), sel = $('hd-term'); if (!el || !sel || !sel.value) return;
    el.innerHTML = '<div class="tab-skeleton"><div class="tab-sk-card"></div><div class="tab-sk-card"></div></div>';
    api(TR + '?term_id=' + encodeURIComponent(sel.value)).then(function (d) { if (!d) return; tr = d; renderReport(); }).catch(function (e) { fail(el, e); });
  }
  function loadTermly() {
    var el = $('hd-tr-body'), sel = $('hd-term'); if (!el || !sel) return;
    if (termsLoaded) { loadReport(); return; }
    api(TR + '/terms').then(function (d) {
      if (!d) return;
      sel.innerHTML = d.terms.map(function (t) {
        return '<option value="' + t.id + '">' + esc(t.name) + ' · ' + day(t.start) + ' – ' + day(t.end) + (t.finished ? '' : ' (in progress)') + '</option>';
      }).join('');
      if (d.default_term_id) sel.value = String(d.default_term_id);
      termsLoaded = true; loadReport();
    }).catch(function (e) { fail(el, e); });
  }
  function printReport() {
    if (!tr) return;
    var d = tr, body = warningHtml(d).replace(/<button[\s\S]*?<\/button>/, '').replace(/class="hd-note[^"]*"/, 'class="note"').replace(/<strong>/g, '<b>').replace(/<\/strong>/g, '</b>');
    var extra = '';
    if (d.income) {
      var tl = trTiles(d).map(function (t) { return esc(t.k) + ': ' + esc(t.v) + (t.s ? ' (' + esc(t.s) + ')' : ''); }).join(' · ');
      extra = '<div class="note">' + tl + '</div>'
        + (d.net && d.net.sentence ? '<div class="note"><b>The result.</b> ' + esc(d.net.sentence) + '</div>' : '')
        + (d.movers.length ? '<h2>The biggest movers</h2>' + d.movers.map(function (m) { return '<div class="note">' + esc(m.sentence) + '</div>'; }).join('') : '')
        + '<h2>Income</h2>' + incomeTable(d, true) + '<h2>Where the money went</h2>' + spendTable(d, true);
    }
    printView('Termly money report — ' + d.term.name, day(d.term.start) + ' – ' + day(d.term.end) + ', against the same months a year earlier', body + extra,
      d.income ? [esc(d.windows.basis), esc(d.income.xero_sales_note), esc(d.spend.basis), esc(d.volumes.child_months_note), esc(d.volumes.funded_hours_note)]
        .concat(d.spend.note ? [esc(d.spend.note)] : []) : []);
  }

  // ── wiring ─────────────────────────────────────────────────────────────────
  function goto(tab) { var b = document.querySelector('#hd-root .wren-tab[data-tab="' + tab + '"]'); if (b) b.click(); }
  var root = $('hd-root');
  if (root) {
    root.addEventListener('click', function (e) {
      var seg = e.target.closest('.hd-segbtn');
      if (seg) { group = seg.getAttribute('data-group'); document.querySelectorAll('#hd-groups .hd-segbtn').forEach(function (b) { b.classList.toggle('on', b === seg); }); renderCalendar(); return; }
      if (e.target.id === 'hd-goto-settings') { e.preventDefault(); var s = $('hd-settings'); if (s) { s.open = true; s.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
      if (e.target.id === 'hd-goto-cal') { goto('calendar'); return; }
      if (e.target.id === 'hd-recon-tr') { reconModal(); return; }
      if (e.target.closest('#hd-cal-body')) onCalClick(e);
    });
    root.addEventListener('change', function (e) { if (e.target.closest('#hd-cal-body')) onCalChange(e); });
    root.addEventListener('toggle', function (e) { if (e.target && e.target.id === 'hd-log' && e.target.open) loadLog(); }, true);
  }
  var pc = $('hd-cal-print'); if (pc) pc.addEventListener('click', printCalendar);
  var pt = $('hd-tr-print'); if (pt) pt.addEventListener('click', printReport);
  var ts = $('hd-term'); if (ts) ts.addEventListener('change', loadReport);

  /* Each tab loads when the shell opens it. The calendar is the landing tab. */
  window['wrenLoadTab_finance-hmrc_calendar'] = loadCalendar;
  window['wrenLoadTab_finance-hmrc_termly'] = loadTermly;
})();
</script>
