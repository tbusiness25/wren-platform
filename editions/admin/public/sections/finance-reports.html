<div class="v2-section" data-section="finance-reports">

  <nav class="wren-tab-bar" role="tablist" aria-label="Finance report tabs">
    <div class="tab-bar-track">
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="0"  data-tab="income"       id="tab-fr-income" aria-controls="panel-fr-income">Income summary</button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="aged-debtors" id="tab-fr-aged"   aria-controls="panel-fr-aged">Aged debtors</button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="chase-list"   id="tab-fr-chase"  aria-controls="panel-fr-chase">Chase list</button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="payments"     id="tab-fr-pay"    aria-controls="panel-fr-pay">Payments received</button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="funding"      id="tab-fr-fund"   aria-controls="panel-fr-fund">Funding reconciliation</button>
    </div>
    <button class="tab-scroll-arrow left"  aria-hidden="true" tabindex="-1">‹</button>
    <button class="tab-scroll-arrow right" aria-hidden="true" tabindex="-1">›</button>
  </nav>

  <div class="wren-tab-panels">

    <!-- ── INCOME SUMMARY ─────────────────────────────────────────────────── -->
    <div class="wren-tab-panel" role="tabpanel" id="panel-fr-income" data-tab="income" aria-labelledby="tab-fr-income">
      <div class="fr-bar">
        <label class="fr-field"><span>Months</span>
          <select id="fr-inc-months" class="fr-in">
            <option value="6">Last 6</option><option value="13" selected>Last 13</option>
            <option value="24">Last 24</option><option value="60">Last 60</option>
          </select>
        </label>
        <label class="fr-field"><span>Month means</span>
          <select id="fr-inc-basis" class="fr-in">
            <option value="service" selected>Month care was delivered</option>
            <option value="issued">Month recorded on the invoice</option>
          </select>
        </label>
        <label class="fr-check"><input type="checkbox" id="fr-inc-drafts"> Include drafts</label>
        <span class="fr-spacer"></span>
        <button class="btn btn-secondary" id="fr-inc-csv">Export CSV</button>
        <button class="btn btn-secondary" id="fr-inc-print">Print</button>
      </div>
      <div id="fr-inc-body"><div class="tab-skeleton"><div class="tab-sk-card"></div><div class="tab-sk-card"></div></div></div>
    </div>

    <!-- ── AGED DEBTORS ───────────────────────────────────────────────────── -->
    <div class="wren-tab-panel" role="tabpanel" id="panel-fr-aged" data-tab="aged-debtors" aria-labelledby="tab-fr-aged" hidden>
      <div class="fr-bar">
        <label class="fr-field"><span>As at</span><input type="date" id="fr-aged-date" class="fr-in"></label>
        <label class="fr-check"><input type="checkbox" id="fr-aged-drafts"> Include drafts</label>
        <span class="fr-spacer"></span>
        <button class="btn btn-secondary" id="fr-aged-csv">Export CSV</button>
        <button class="btn btn-secondary" id="fr-aged-print">Print</button>
      </div>
      <div id="fr-aged-body"><div class="tab-skeleton"><div class="tab-sk-card"></div><div class="tab-sk-card"></div></div></div>
    </div>

    <!-- ── CHASE LIST ─────────────────────────────────────────────────────── -->
    <div class="wren-tab-panel" role="tabpanel" id="panel-fr-chase" data-tab="chase-list" aria-labelledby="tab-fr-chase" hidden>
      <div class="fr-bar">
        <label class="fr-field"><span>Ignore under</span>
          <select id="fr-chase-min" class="fr-in">
            <option value="1" selected>Any amount</option>
            <option value="1000">£10</option><option value="5000">£50</option>
            <option value="10000">£100</option><option value="50000">£500</option>
          </select>
        </label>
        <span class="fr-spacer"></span>
        <button class="btn btn-secondary" id="fr-chase-csv">Export CSV</button>
        <button class="btn btn-secondary" id="fr-chase-print">Print</button>
      </div>
      <div id="fr-chase-body"><div class="tab-skeleton"><div class="tab-sk-card"></div><div class="tab-sk-card"></div></div></div>
    </div>

    <!-- ── PAYMENTS RECEIVED ──────────────────────────────────────────────── -->
    <div class="wren-tab-panel" role="tabpanel" id="panel-fr-pay" data-tab="payments" aria-labelledby="tab-fr-pay" hidden>
      <div class="fr-bar">
        <label class="fr-field"><span>Months</span>
          <select id="fr-pay-months" class="fr-in">
            <option value="6">Last 6</option><option value="13" selected>Last 13</option>
            <option value="24">Last 24</option><option value="60">Last 60</option>
          </select>
        </label>
        <span class="fr-spacer"></span>
        <button class="btn btn-secondary" id="fr-pay-csv">Export CSV</button>
        <button class="btn btn-secondary" id="fr-pay-print">Print</button>
      </div>
      <div id="fr-pay-body"><div class="tab-skeleton"><div class="tab-sk-card"></div><div class="tab-sk-card"></div></div></div>
    </div>

    <!-- ── FUNDING RECONCILIATION ─────────────────────────────────────────── -->
    <div class="wren-tab-panel" role="tabpanel" id="panel-fr-fund" data-tab="funding" aria-labelledby="tab-fr-fund" hidden>
      <div class="fr-bar">
        <label class="fr-field"><span>Term</span><select id="fr-fund-term" class="fr-in"><option value="">All terms</option></select></label>
        <label class="fr-check"><input type="checkbox" id="fr-fund-gaponly" checked> Only rows with a gap</label>
        <span class="fr-spacer"></span>
        <button class="btn btn-secondary" id="fr-fund-csv">Export CSV</button>
        <button class="btn btn-secondary" id="fr-fund-print">Print</button>
      </div>
      <div id="fr-fund-body"><div class="tab-skeleton"><div class="tab-sk-card"></div><div class="tab-sk-card"></div></div></div>
    </div>

  </div><!-- /.wren-tab-panels -->
</div><!-- /.v2-section -->

<style>
/* b227 — finance reports. Tokens only; the portal is dark-navy everywhere. */
.fr-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}
.fr-spacer{flex:1 1 auto}
.fr-field{display:flex;flex-direction:column;gap:4px}
.fr-field>span{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c-muted)}
.fr-in{background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;padding:8px 10px;
  color:var(--c-text);font-family:inherit;font-size:.88rem}
.fr-check{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--c-muted);padding-bottom:9px}
.fr-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.fr-tile{background:var(--c-card);border:1px solid var(--c-border);border-radius:12px;padding:14px 16px}
.fr-tile .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c-muted);margin-bottom:6px}
.fr-tile .v{font-size:1.35rem;font-weight:700;color:var(--c-text);font-variant-numeric:tabular-nums}
.fr-tile .s{font-size:.74rem;color:var(--c-muted);margin-top:4px;line-height:1.35}
.fr-tile.good .v{color:var(--c-green)} .fr-tile.warn .v{color:var(--c-amber)} .fr-tile.bad .v{color:var(--c-red)}
.fr-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:12px;padding:16px;margin-bottom:16px}
.fr-card h3{font-size:1rem;margin:0 0 4px;color:var(--c-text)}
.fr-card .fr-sub{font-size:.78rem;color:var(--c-muted);margin-bottom:12px;line-height:1.5}
.fr-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fr-table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:640px}
.fr-table th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c-muted);
  padding:8px 10px;border-bottom:1px solid var(--c-border);white-space:nowrap;position:sticky;top:0;background:var(--c-bg)}
.fr-table td{padding:8px 10px;border-bottom:1px solid var(--c-border);color:var(--c-text);vertical-align:top}
.fr-table td.n,.fr-table th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fr-table tbody tr:hover{background:rgba(255,255,255,.03)}
.fr-table tr.fr-partial td{color:var(--c-muted)}
.fr-table tfoot td{font-weight:700;border-top:2px solid var(--c-border);border-bottom:none;color:var(--c-text)}
.fr-note{background:rgba(91,143,255,.07);border:1px solid var(--c-border);border-left:3px solid var(--c-blue);
  border-radius:8px;padding:11px 14px;font-size:.79rem;color:var(--c-muted);line-height:1.55;margin-bottom:14px}
.fr-note.warn{background:rgba(251,191,36,.07);border-left-color:var(--c-amber)}
.fr-note b{color:var(--c-text)}
.fr-pill{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:20px;
  background:var(--c-navy-light);color:var(--c-muted);white-space:nowrap}
.fr-pill.amber{background:rgba(251,191,36,.16);color:var(--c-amber)}
.fr-pill.red{background:rgba(248,113,113,.16);color:var(--c-red)}
.fr-pill.green{background:rgba(52,211,153,.16);color:var(--c-green)}
.fr-tie{display:flex;align-items:center;gap:8px;font-size:.82rem;padding:10px 12px;border-radius:8px;
  border:1px solid var(--c-border);margin-bottom:14px}
.fr-tie.ok{background:rgba(52,211,153,.07);border-left:3px solid var(--c-green)}
.fr-tie.no{background:rgba(248,113,113,.09);border-left:3px solid var(--c-red)}
.fr-empty{color:var(--c-muted);padding:22px;text-align:center;font-size:.86rem}
.fr-kids{font-size:.74rem;color:var(--c-muted)}
.fr-bars{display:flex;gap:3px;align-items:flex-end;height:90px;margin:6px 0 10px}
.fr-bars .b{flex:1;min-width:8px;background:var(--c-blue);border-radius:3px 3px 0 0;opacity:.85}
.fr-bars .b.partial{background:repeating-linear-gradient(45deg,var(--c-muted),var(--c-muted) 3px,transparent 3px,transparent 6px)}
.fr-axis{display:flex;justify-content:space-between;gap:10px;font-size:.7rem;color:var(--c-muted);margin:-4px 0 12px}
@media (max-width:640px){ .fr-bar{gap:8px} .fr-tile .v{font-size:1.15rem} }
</style>

<script>
(function () {
  'use strict';

  // ── plumbing ───────────────────────────────────────────────────────────────
  var API = '/api/finance/reports';
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var money = function (p) {
    if (p == null) return '—';
    var neg = p < 0;
    var s = '£' + (Math.abs(p) / 100).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return neg ? '−' + s : s;
  };
  var day = function (d) {
    return d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
  };
  var num = function (n) { return (n == null ? '—' : Number(n).toLocaleString('en-GB')); };

  var tok = function () { return sessionStorage.getItem('wrenToken') || ''; };

  function get(path, params) {
    var qs = new URLSearchParams(params || {}).toString();
    return Wren.api(API + path + (qs ? '?' + qs : ''));
  }

  /* CSV: the shell's Wren.api parses JSON, so the download goes through a raw
     authenticated fetch and a blob. Same URL, same auth, ?format=csv. */
  function downloadCsv(path, params, filename) {
    var qs = new URLSearchParams(Object.assign({ format: 'csv' }, params || {})).toString();
    return fetch(API + path + '?' + qs, {
      headers: { Authorization: 'Bearer ' + tok() }, credentials: 'same-origin',
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.blob();
    }).then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      Wren.toast('CSV downloaded', 'success');
    }).catch(function (e) { Wren.toast('Export failed: ' + e.message, 'error'); });
  }

  /* Print: a plain white sheet in a new window, the same pattern the invoice
     print view uses. Deliberately NOT the dark portal palette — this one goes on
     paper, and the caveats print with the figures rather than being left behind
     on the screen. */
  function printView(title, subtitle, bodyHtml, notes) {
    var w = window.open('', '_blank', 'width=980,height=1000');
    if (!w) { Wren.toast('Allow pop-ups to print this report', 'error'); return; }
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>'
      + 'body{font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:#111;margin:28px;max-width:1000px}'
      + 'h1{font-size:1.35rem;margin:0 0 2px}.sub{color:#555;margin-bottom:6px;font-size:.9rem}'
      + '.stamp{color:#777;font-size:.76rem;margin-bottom:18px}'
      + 'table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:.82rem}'
      + 'th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:#666;'
      + 'border-bottom:2px solid #ddd;padding:6px 5px}'
      + 'td{padding:6px 5px;border-bottom:1px solid #eee}'
      + 'td.n,th.n{text-align:right;white-space:nowrap}'
      + 'tfoot td{font-weight:700;border-top:2px solid #ccc;border-bottom:none}'
      + 'tr.fr-partial td{color:#777;font-style:italic}'
      + '.tiles{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px}'
      + '.tile{border:1px solid #ddd;border-radius:8px;padding:10px 14px;min-width:150px}'
      + '.tile .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:#666}'
      + '.tile .v{font-size:1.1rem;font-weight:700}.tile .s{font-size:.7rem;color:#666}'
      + '.note{border-left:3px solid #999;background:#f6f6f6;padding:8px 11px;margin:0 0 10px;'
      + 'font-size:.75rem;color:#333;line-height:1.5}'
      + '.pill{font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:20px;background:#eee;color:#333}'
      + '.foot{margin-top:22px;border-top:1px solid #ddd;padding-top:10px;font-size:.7rem;color:#666;line-height:1.5}'
      + '@media print{body{margin:12mm}.no-print{display:none}}'
      + '</style></head><body>'
      + '<h1>' + esc(title) + '</h1><div class="sub">' + esc(subtitle) + '</div>'
      + '<div class="stamp">Your Nursery · 123 Example Lane, London AB1 2CD · printed '
      + new Date().toLocaleString('en-GB') + '</div>'
      + bodyHtml
      + '<div class="foot">' + (notes || []).map(function (n) { return '<div>' + n + '</div>'; }).join('')
      + '<div>Read-only report from Wren. Nothing on this sheet was charged, chased or changed by producing it.</div>'
      + '</div></body></html>');
    w.document.close();
    setTimeout(function () { w.focus(); w.print(); }, 350);
  }

  /* The screen tables and the print tables are the same markup, so a printed
     report can never quietly differ from the one on screen. */
  function table(cols, rows, foot, cls) {
    return '<table class="' + (cls || 'fr-table') + '"><thead><tr>'
      + cols.map(function (c) { return '<th' + (c.n ? ' class="n"' : '') + '>' + esc(c.label) + '</th>'; }).join('')
      + '</tr></thead><tbody>'
      + (rows.length ? rows.map(function (r) {
        return '<tr' + (r._cls ? ' class="' + r._cls + '"' : '') + '>'
          + cols.map(function (c) { return '<td' + (c.n ? ' class="n"' : '') + '>' + (r[c.key] == null ? '—' : r[c.key]) + '</td>'; }).join('')
          + '</tr>';
      }).join('') : '<tr><td colspan="' + cols.length + '" style="text-align:center;padding:20px;opacity:.7">Nothing to show</td></tr>')
      + '</tbody>'
      + (foot ? '<tfoot><tr>' + cols.map(function (c) {
        return '<td' + (c.n ? ' class="n"' : '') + '>' + (foot[c.key] == null ? '' : foot[c.key]) + '</td>';
      }).join('') + '</tr></tfoot>' : '')
      + '</table>';
  }

  function tiles(list) {
    return '<div class="fr-tiles">' + list.map(function (t) {
      return '<div class="fr-tile' + (t.tone ? ' ' + t.tone : '') + '"><div class="k">' + esc(t.k) + '</div>'
        + '<div class="v">' + t.v + '</div>' + (t.s ? '<div class="s">' + esc(t.s) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function printTiles(list) {
    return '<div class="tiles">' + list.map(function (t) {
      return '<div class="tile"><div class="k">' + esc(t.k) + '</div><div class="v">' + t.v + '</div>'
        + (t.s ? '<div class="s">' + esc(t.s) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  /* A 403 here is a policy answer, not a fault: the API is manager-only and
     Roost-only. Say which, so a deputy who can see this section in the sidebar is
     not left staring at "unknown error". */
  var fail = function (el, e) {
    var code = e && e.error;
    var msg = (code === 'forbidden_role' || code === 'forbidden_portal')
      ? esc(e.message)
      : 'Could not load this report — ' + esc((e && (e.message || e.error)) || 'unknown error');
    el.innerHTML = '<div class="fr-empty">' + msg + '</div>';
  };

  // ── 1. INCOME SUMMARY ──────────────────────────────────────────────────────
  var incData = null;
  function incParams() {
    return {
      months: document.getElementById('fr-inc-months').value,
      basis: document.getElementById('fr-inc-basis').value,
      include_drafts: document.getElementById('fr-inc-drafts').checked ? '1' : '0',
    };
  }
  var INC_COLS = [
    { key: 'label', label: 'Month' },
    { key: 'inv', label: 'Invoices', n: true },
    { key: 'gross', label: 'Gross', n: true },
    { key: 'disc', label: 'Discount', n: true },
    { key: 'net', label: 'Net', n: true },
    { key: 'funded', label: 'Funded', n: true },
    { key: 'billable', label: 'Billable', n: true },
  ];
  function incRows(d) {
    return d.months.map(function (m) {
      return {
        _cls: m.partial ? 'fr-partial' : '',
        label: esc(m.label) + (m.partial ? ' <span class="fr-pill amber">partial</span>' : ''),
        inv: num(m.invoices), gross: money(m.gross_pence), disc: money(m.discount_pence),
        net: money(m.net_pence), funded: money(m.funded_pence), billable: money(m.billable_pence),
      };
    });
  }
  function incFoot(d) {
    return { label: 'Total', inv: num(d.totals.invoices), gross: money(d.totals.gross_pence),
      disc: money(d.totals.discount_pence), net: money(d.totals.net_pence),
      funded: money(d.totals.funded_pence), billable: money(d.totals.billable_pence) };
  }
  function incTiles(d) {
    var a = d.averages;
    var drag = a.partial_month_effect_pence;
    return [
      { k: 'Average complete month', v: money(a.net_pence), s: a.months_used.length + ' complete months' },
      { k: 'If partials were counted', v: money(a.naive_average_including_partial_pence),
        tone: drag ? 'warn' : '',
        s: drag
          ? money(Math.abs(drag)) + (a.partial_month_effect_direction === 'inflates' ? ' higher' : ' lower')
            + ' — a part-traded month distorts the mean either way, so it is left out'
          : 'no partial months in range' },
      { k: 'Total net in range', v: money(d.totals.net_pence), s: num(d.totals.invoices) + ' invoices' },
      { k: 'Discount given', v: money(d.totals.discount_pence),
        s: d.discounts_available ? 'from invoice_discount_lines' : 'b225 table not present — shown as zero' },
    ];
  }
  function loadIncome() {
    var el = document.getElementById('fr-inc-body'); if (!el) return;
    get('/income', incParams()).then(function (d) {
      incData = d;
      var maxNet = Math.max.apply(null, d.months.map(function (m) { return m.net_pence; }).concat([1]));
      /* Bars are scaled from zero, so a flat trading year looks flat rather than
         being stretched into drama by a floating baseline. The scale is printed
         because a bar chart with no numbers on it can be read to mean anything. */
      var ordered = d.months.slice().reverse();
      var bars = '<div class="fr-bars">' + ordered.map(function (m) {
        return '<div class="b' + (m.partial ? ' partial' : '') + '" style="height:'
          + Math.max(2, Math.round(m.net_pence / maxNet * 100)) + '%" title="'
          + esc(m.label + ' — ' + money(m.net_pence)) + '"></div>';
      }).join('') + '</div>'
        + '<div class="fr-axis"><span>' + esc(ordered.length ? ordered[0].label : '') + '</span>'
        + '<span>scale 0 – ' + money(maxNet) + ' net per month</span>'
        + '<span>' + esc(ordered.length ? ordered[ordered.length - 1].label : '') + '</span></div>';
      el.innerHTML = tiles(incTiles(d))
        + '<div class="fr-note"><b>What "month" means here:</b> ' + esc(d.basis_note) + '</div>'
        + (d.basis_drift.service_one_month_later
          ? '<div class="fr-note warn"><b>Why that matters:</b> ' + esc(d.basis_drift.finding) + '</div>' : '')
        + '<div class="fr-card"><h3>Income by month</h3>'
        + '<div class="fr-sub">Striped bars are partial months. They are shown, but never averaged.</div>'
        + bars + '<div class="fr-scroll">' + table(INC_COLS, incRows(d), incFoot(d)) + '</div></div>'
        + '<div class="fr-card"><h3>By room</h3><div class="fr-sub">' + esc(d.room_coverage.note)
        + ' Only ' + d.room_coverage.children_with_room + ' of ' + d.room_coverage.children_total
        + ' children have a room on file, so treat this as indicative.</div><div class="fr-scroll">'
        + table([{ key: 'room', label: 'Room' }, { key: 'inv', label: 'Invoices', n: true }, { key: 'net', label: 'Net', n: true }],
          d.rooms.map(function (r) { return { room: esc(r.room), inv: num(r.invoices), net: money(r.net_pence) }; }))
        + '</div></div>'
        + '<div class="fr-note"><b>Billable vs funded:</b> ' + esc(d.funded_coverage.note) + '</div>'
        + (d.future_months ? '<div class="fr-note"><b>Invoiced ahead:</b> ' + esc(d.future_months_note)
          + ' ' + d.future_months.map(function (m) { return m.label + ' (' + money(m.net_pence) + ')'; }).join(', ')
          + '</div>' : '');
    }).catch(function (e) { fail(el, e); });
  }
  function printIncome() {
    if (!incData) return;
    var d = incData;
    printView('Income summary', d.months.length + ' months, ' + (d.basis === 'issued' ? 'by invoice month' : 'by month of care'),
      printTiles(incTiles(d)) + table(INC_COLS, incRows(d), incFoot(d), ''),
      ['<b>Month basis:</b> ' + esc(d.basis_note), '<b>Basis drift:</b> ' + esc(d.basis_drift.finding),
        '<b>Billable vs funded:</b> ' + esc(d.funded_coverage.note),
        '<b>Averages:</b> complete months only (' + esc(d.averages.months_used.join(', ')) + ').']);
  }

  // ── 2. AGED DEBTORS ────────────────────────────────────────────────────────
  var agedData = null;
  function agedParams() {
    var p = { include_drafts: document.getElementById('fr-aged-drafts').checked ? '1' : '0' };
    var dt = document.getElementById('fr-aged-date').value;
    if (dt) p.as_at = dt;
    return p;
  }
  var AGED_COLS = [
    { key: 'family', label: 'Family' },
    { key: 'invs', label: 'Invoices' },
    { key: 'oldest', label: 'Oldest due' },
    { key: 'worst', label: 'Worst bucket' },
    { key: 'total', label: 'Outstanding', n: true },
  ];
  var BUCKET_LABEL = { current: 'Not yet due', d1_30: '1–30 days', d31_60: '31–60 days', d61_90: '61–90 days', d90_plus: '90+ days' };
  function agedRows(d) {
    return d.families.map(function (f) {
      return {
        family: esc(f.payer || '(no email on file)')
          + (f.children.length ? '<div class="fr-kids">' + esc(f.children.join(', ')) + '</div>' : ''),
        invs: f.invoices.map(function (i) { return esc(i.invoice_number); }).join(', '),
        oldest: day(f.oldest_due),
        worst: '<span class="fr-pill ' + (f.worst_bucket === 'd90_plus' ? 'red' : f.worst_bucket === 'current' ? 'green' : 'amber')
          + '">' + esc(BUCKET_LABEL[f.worst_bucket] || f.worst_bucket) + '</span>',
        total: money(f.total_pence),
      };
    });
  }
  function agedTiles(d) {
    return d.buckets.map(function (b) {
      return { k: b.label, v: money(b.pence), tone: b.key === 'd90_plus' && b.pence > 0 ? 'bad' : (b.key === 'current' ? '' : (b.pence > 0 ? 'warn' : '')) };
    }).concat([{ k: 'Total outstanding', v: money(d.total_outstanding_pence), s: d.invoice_count + ' invoices, ' + d.family_count + ' families' }]);
  }
  function loadAged() {
    var el = document.getElementById('fr-aged-body'); if (!el) return;
    get('/aged-debtors', agedParams()).then(function (d) {
      agedData = d;
      var rec = d.reconciliation;
      el.innerHTML = tiles(agedTiles(d))
        + '<div class="fr-tie ' + (rec.ties ? 'ok' : 'no') + '">'
        + '<span>' + (rec.ties ? '✓' : '✕') + '</span><span>Bucket totals <b>' + money(rec.sum_of_bucket_totals_pence)
        + '</b> = sum of unpaid invoices <b>' + money(rec.sum_of_unpaid_invoice_outstanding_pence) + '</b> across '
        + rec.unpaid_invoice_count + ' invoices' + (rec.ties ? '. Tied.' : ' — difference ' + money(rec.difference_pence) + '. Investigate.') + '</span></div>'
        + '<div class="fr-note"><b>Source:</b> ' + esc(d.source) + '</div>'
        + '<div class="fr-card"><h3>Who owes what</h3><div class="fr-sub">Siblings are one family — grouped on the '
        + 'bill payer\'s address, so a household with three children is chased once, not three times.</div>'
        + '<div class="fr-scroll">' + table(AGED_COLS, agedRows(d),
          { family: 'Total', invs: '', oldest: '', worst: '', total: money(d.total_outstanding_pence) }) + '</div></div>'
        + '<div class="fr-note warn"><b>Deliberately excluded:</b> '
        + d.excluded.drafts.invoices + ' drafts (' + money(d.excluded.drafts.pence) + ') — not issued, so not owed. '
        + d.excluded.paid_but_not_fully_allocated.invoices + ' invoices marked paid but not fully allocated ('
        + money(d.excluded.paid_but_not_fully_allocated.pence) + ') — ' + esc(d.excluded.paid_but_not_fully_allocated.note)
        + '</div>';
    }).catch(function (e) { fail(el, e); });
  }
  function printAged() {
    if (!agedData) return;
    var d = agedData;
    printView('Aged debtors', 'As at ' + day(d.as_at),
      printTiles(agedTiles(d)) + table(AGED_COLS, agedRows(d),
        { family: 'Total', invs: '', oldest: '', worst: '', total: money(d.total_outstanding_pence) }, ''),
      ['<b>Source:</b> ' + esc(d.source),
        '<b>Ties:</b> buckets ' + money(d.reconciliation.sum_of_bucket_totals_pence) + ' = unpaid invoices '
        + money(d.reconciliation.sum_of_unpaid_invoice_outstanding_pence) + (d.reconciliation.ties ? ' ✓' : ' ✕'),
        '<b>Excluded:</b> ' + d.excluded.drafts.invoices + ' drafts, '
        + d.excluded.paid_but_not_fully_allocated.invoices + ' paid-but-unallocated invoices.']);
  }

  // ── 3. CHASE LIST ──────────────────────────────────────────────────────────
  var chaseData = null;
  var CHASE_COLS = [
    { key: 'family', label: 'Family' },
    { key: 'overdue', label: 'Overdue', n: true },
    { key: 'days', label: 'Days overdue', n: true },
    { key: 'worst', label: 'Worst bucket' },
    { key: 'invs', label: 'Invoices' },
    { key: 'last', label: 'Last contact' },
  ];
  function chaseRows(d) {
    return d.families.map(function (f) {
      return {
        family: esc(f.payer || '(no email on file)')
          + (f.children.length ? '<div class="fr-kids">' + esc(f.children.join(', ')) + '</div>' : ''),
        overdue: money(f.overdue_pence),
        days: f.days_overdue == null ? '—' : num(f.days_overdue),
        worst: '<span class="fr-pill ' + (/90/.test(f.worst_bucket) ? 'red' : 'amber') + '">' + esc(f.worst_bucket) + '</span>',
        invs: f.invoice_numbers.map(esc).join(', '),
        last: f.last_contact
          ? day(f.last_contact) + '<div class="fr-kids">' + esc(f.last_contact_source) + ', ' + f.days_since_contact + ' days ago</div>'
          : '<span class="fr-pill">no record</span>',
      };
    });
  }
  function chaseTiles(d) {
    return [
      { k: 'Families to chase', v: num(d.family_count) },
      { k: 'Total overdue', v: money(d.total_overdue_pence), tone: d.total_overdue_pence > 0 ? 'bad' : 'good' },
      { k: 'No contact on record', v: num(d.never_contacted), tone: d.never_contacted ? 'warn' : '' },
      { k: 'No email on file', v: num(d.no_email_on_file), tone: d.no_email_on_file ? 'warn' : '' },
    ];
  }
  function loadChase() {
    var el = document.getElementById('fr-chase-body'); if (!el) return;
    get('/chase-list', { min_pence: document.getElementById('fr-chase-min').value }).then(function (d) {
      chaseData = d;
      el.innerHTML = tiles(chaseTiles(d))
        + '<div class="fr-note"><b>' + esc(d.advisory) + '</b></div>'
        + '<div class="fr-card"><h3>Chase list</h3>'
        + '<div class="fr-sub">Longest overdue first, not largest — a small debt nobody has mentioned in four '
        + 'months is a worse sign than a big one that went out last week.</div><div class="fr-scroll">'
        + table(CHASE_COLS, chaseRows(d),
          { family: 'Total', overdue: money(d.total_overdue_pence), days: '', worst: '', invs: '', last: '' })
        + '</div></div>'
        + '<div class="fr-note warn"><b>About "last contact":</b> ' + esc(d.contact_note) + '</div>';
    }).catch(function (e) { fail(el, e); });
  }
  function printChase() {
    if (!chaseData) return;
    var d = chaseData;
    printView('Debtor chase list', 'As at ' + day(d.as_at) + ' · ' + d.family_count + ' families',
      printTiles(chaseTiles(d)) + table(CHASE_COLS, chaseRows(d),
        { family: 'Total', overdue: money(d.total_overdue_pence), days: '', worst: '', invs: '', last: '' }, ''),
      ['<b>Last contact:</b> ' + esc(d.contact_note), '<b>' + esc(d.advisory) + '</b>']);
  }

  // ── 4. PAYMENTS RECEIVED ───────────────────────────────────────────────────
  var payData = null;
  function payCols(d) {
    return [{ key: 'label', label: 'Month' }, { key: 'n', label: 'Payments', n: true },
      { key: 'recv', label: 'Received', n: true }, { key: 'alloc', label: 'Allocated', n: true },
      { key: 'unalloc', label: 'Unallocated', n: true }]
      .concat(d.methods.slice(0, 6).map(function (m) { return { key: 'm_' + m.method, label: m.method, n: true }; }));
  }
  function payRows(d) {
    return d.months.map(function (mo) {
      var r = {
        _cls: mo.partial ? 'fr-partial' : '',
        label: esc(mo.label) + (mo.partial ? ' <span class="fr-pill amber">partial</span>' : ''),
        n: num(mo.payments), recv: money(mo.received_pence), alloc: money(mo.allocated_pence),
        unalloc: money(mo.unallocated_pence),
      };
      d.methods.slice(0, 6).forEach(function (m) { r['m_' + m.method] = money(mo.methods[m.method] || 0); });
      return r;
    });
  }
  function payTiles(d) {
    var u = d.unallocated;
    return [
      { k: 'Average complete month', v: money(d.average_monthly_received_pence) },
      { k: 'Received, all time', v: money(u.total_received_pence) },
      { k: 'Unallocated', v: money(u.unallocated_pence), tone: u.unallocated_pence ? 'warn' : 'good',
        s: 'received but not matched to an invoice' },
      { k: 'Payments with no allocation', v: num(u.payments_with_no_allocation), tone: u.payments_with_no_allocation ? 'warn' : 'good',
        s: 'worth ' + money(u.no_allocation_pence) },
    ];
  }
  function loadPayments() {
    var el = document.getElementById('fr-pay-body'); if (!el) return;
    get('/payments', { months: document.getElementById('fr-pay-months').value }).then(function (d) {
      payData = d;
      var u = d.unallocated;
      el.innerHTML = tiles(payTiles(d))
        + '<div class="fr-note warn"><b>Unallocated money is shown, not dropped.</b> ' + esc(u.note)
        + (u.over_allocated_note ? ' ' + esc(u.over_allocated_note) : '') + '</div>'
        + '<div class="fr-card"><h3>By month and method</h3>'
        + '<div class="fr-sub">Top ' + Math.min(6, d.methods.length) + ' methods shown; the CSV carries all '
        + d.methods.length + '.</div><div class="fr-scroll">' + table(payCols(d), payRows(d)) + '</div></div>'
        + '<div class="fr-card"><h3>By method, all time</h3><div class="fr-scroll">'
        + table([{ key: 'method', label: 'Method' }, { key: 'n', label: 'Payments', n: true },
          { key: 'recv', label: 'Received', n: true }, { key: 'alloc', label: 'Allocated', n: true }],
        d.methods.map(function (m) {
          return { method: esc(m.method), n: num(m.payments), recv: money(m.received_pence), alloc: money(m.allocated_pence) };
        }),
        { method: 'Total', n: num(d.methods.reduce(function (s, m) { return s + m.payments; }, 0)),
          recv: money(u.total_received_pence), alloc: money(u.total_allocated_pence) })
        + '</div></div>';
    }).catch(function (e) { fail(el, e); });
  }
  function printPayments() {
    if (!payData) return;
    var d = payData;
    printView('Payments received', d.months.length + ' months',
      printTiles(payTiles(d)) + table(payCols(d), payRows(d), null, ''),
      ['<b>Unallocated:</b> ' + esc(d.unallocated.note),
        '<b>Unallocated total:</b> ' + money(d.unallocated.unallocated_pence) + ' across '
        + d.unallocated.payments_with_no_allocation + ' unmatched payments.']);
  }

  // ── 5. FUNDING RECONCILIATION ──────────────────────────────────────────────
  var fundData = null, fundTermsLoaded = false;
  var FUND_COLS = [
    { key: 'child', label: 'Child' },
    { key: 'term', label: 'Term' },
    { key: 'basis', label: 'Basis' },
    { key: 'weekly', label: 'Weekly hrs stored', n: true },
    { key: 'gen', label: 'Monthly hrs as billed', n: true },
    { key: 'str', label: 'Monthly hrs if stretched', n: true },
    { key: 'gaph', label: 'Gap (hrs/mth)', n: true },
    { key: 'gapp', label: 'Gap (£/mth)', n: true },
  ];
  function fundRows(d, gapOnly) {
    return d.children.filter(function (c) { return !gapOnly || c.monthly_gap_hours > 0; }).map(function (c) {
      return {
        child: esc(c.child_name) + (c.is_childs_latest_term ? ' <span class="fr-pill green">latest term</span>' : ''),
        term: esc(c.term_name || '—') + (c.term_dates_known ? '' : ' <span class="fr-pill amber">no dates</span>'),
        basis: esc(c.hours_basis),
        weekly: c.weekly_hours_stored,
        gen: c.claimed_monthly_hours_as_generated,
        str: c.claimed_monthly_hours_if_stretched == null ? '—' : c.claimed_monthly_hours_if_stretched,
        gaph: c.monthly_gap_hours,
        gapp: money(c.monthly_gap_pence),
      };
    });
  }
  function fundTiles(d) {
    var x = d.discrepancy;
    return [
      { k: 'Children affected', v: num(x.children_on_a_stretched_basis), s: 'on roll, latest term' },
      { k: 'Under-deducted / month', v: money(x.monthly_under_deduction_pence), tone: 'bad',
        s: x.monthly_under_deduction_hours + ' funded hours' },
      { k: 'Under-deducted / year', v: money(x.annual_under_deduction_pence), tone: 'bad' },
      { k: 'Terms with no dates', v: num(d.terms_without_dates.length), tone: d.terms_without_dates.length ? 'warn' : 'good' },
    ];
  }
  function loadFunding() {
    var el = document.getElementById('fr-fund-body'); if (!el) return;
    var termId = document.getElementById('fr-fund-term').value;
    get('/funding', termId ? { term_id: termId } : {}).then(function (d) {
      fundData = d;
      if (!fundTermsLoaded) {
        var sel = document.getElementById('fr-fund-term');
        d.terms.forEach(function (t) {
          var o = document.createElement('option');
          o.value = t.id; o.textContent = t.name + (t.dates_known ? '' : ' (no dates)');
          sel.appendChild(o);
        });
        fundTermsLoaded = true;
      }
      var gapOnly = document.getElementById('fr-fund-gaponly').checked;
      el.innerHTML = tiles(fundTiles(d))
        + '<div class="fr-note warn"><b>This report measures the gap. It does not close it.</b> '
        + esc(d.discrepancy.explanation) + '</div>'
        + '<div class="fr-note"><b>Counting:</b> ' + esc(d.discrepancy.counting_note)
        + ' With leavers included the figure is ' + money(d.discrepancy.including_children_who_have_left.monthly_under_deduction_pence)
        + '/month across ' + d.discrepancy.including_children_who_have_left.children + ' children.</div>'
        + d.data_quality.map(function (q) {
          return '<div class="fr-note warn"><b>' + esc(q.issue) + ':</b> ' + esc(q.detail) + '</div>';
        }).join('')
        + '<div class="fr-card"><h3>Claimed against billed, per child per term</h3>'
        + '<div class="fr-sub">Largest gap first. A child appears once per funding term, so the same child can '
        + 'show several rows — the headline above counts each child once, from their latest term.</div>'
        + '<div class="fr-scroll" id="fr-fund-table">' + table(FUND_COLS, fundRows(d, gapOnly)) + '</div></div>';
    }).catch(function (e) { fail(el, e); });
  }
  function printFunding() {
    if (!fundData) return;
    var d = fundData;
    printView('Funding reconciliation', 'Funded hours claimed against funded hours billed',
      printTiles(fundTiles(d)) + table(FUND_COLS, fundRows(d, document.getElementById('fr-fund-gaponly').checked), null, ''),
      ['<b>The gap:</b> ' + esc(d.discrepancy.explanation), '<b>Counting:</b> ' + esc(d.discrepancy.counting_note)]
        .concat(d.data_quality.map(function (q) { return '<b>' + esc(q.issue) + ':</b> ' + esc(q.detail); })));
  }

  // ── wiring ─────────────────────────────────────────────────────────────────
  function on(id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }
  var stamp = function () { return new Date().toISOString().slice(0, 10); };

  on('fr-inc-months', 'change', loadIncome);
  on('fr-inc-basis', 'change', loadIncome);
  on('fr-inc-drafts', 'change', loadIncome);
  on('fr-inc-csv', 'click', function () { downloadCsv('/income', incParams(), 'wren-income-summary-' + stamp() + '.csv'); });
  on('fr-inc-print', 'click', printIncome);

  on('fr-aged-date', 'change', loadAged);
  on('fr-aged-drafts', 'change', loadAged);
  on('fr-aged-csv', 'click', function () { downloadCsv('/aged-debtors', agedParams(), 'wren-aged-debtors-' + stamp() + '.csv'); });
  on('fr-aged-print', 'click', printAged);

  on('fr-chase-min', 'change', loadChase);
  on('fr-chase-csv', 'click', function () {
    downloadCsv('/chase-list', { min_pence: document.getElementById('fr-chase-min').value }, 'wren-debtor-chase-list-' + stamp() + '.csv');
  });
  on('fr-chase-print', 'click', printChase);

  on('fr-pay-months', 'change', loadPayments);
  on('fr-pay-csv', 'click', function () {
    downloadCsv('/payments', { months: document.getElementById('fr-pay-months').value }, 'wren-payments-received-' + stamp() + '.csv');
  });
  on('fr-pay-print', 'click', printPayments);

  on('fr-fund-term', 'change', loadFunding);
  on('fr-fund-gaponly', 'change', function () {
    var t = document.getElementById('fr-fund-table');
    if (fundData && t) {
      t.innerHTML = table(FUND_COLS, fundRows(fundData, document.getElementById('fr-fund-gaponly').checked));
    }
  });
  on('fr-fund-csv', 'click', function () {
    var termId = document.getElementById('fr-fund-term').value;
    downloadCsv('/funding', termId ? { term_id: termId } : {}, 'wren-funding-reconciliation-' + stamp() + '.csv');
  });
  on('fr-fund-print', 'click', printFunding);

  /* Each tab loads once, the first time it is opened — the shell calls
     wrenLoadTab_<section>_<tab> on activation and then clears it. Income loads
     immediately because it is the landing tab. */
  window['wrenLoadTab_finance-reports_aged-debtors'] = loadAged;
  window['wrenLoadTab_finance-reports_chase-list'] = loadChase;
  window['wrenLoadTab_finance-reports_payments'] = loadPayments;
  window['wrenLoadTab_finance-reports_funding'] = loadFunding;
  window['wrenLoadTab_finance-reports_income'] = loadIncome;
})();
</script>
