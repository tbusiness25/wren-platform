<!-- ============================================================================
     b230 (2026-08-25) — Roost notification centre.

     Toby: "I want wren admin full notifications similar to eylog … so it
     categorises into reg forms/safeguarding/warnings/etc for all of them. This
     can be where I switch the notifications matrix on and off."

     Both halves live here: the categorised list (tabs 1–10) and the matrix +
     device push (tab 11). The matrix itself is NOT re-implemented — it mounts
     /js/wren-notification-matrix.js, the same component /notification-settings.html
     mounts, so the two screens cannot drift apart again.

     Tabs come from src/services/notification-taxonomy.js via
     GET /api/notifications/centre, which returns the tab list AND its counts in
     the same response as the rows — so a count can never disagree with the list
     beneath it.
     ========================================================================= -->
<div class="v2-section" data-section="notifications">

  <nav class="wren-tab-bar" role="tablist" aria-label="Notification category tabs">
    <div class="tab-bar-track">
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="0"  data-tab="all"          id="tab-nc-all"    aria-controls="panel-nc-all">🔔 All <span class="nc-tabcount" data-count="all"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="safeguarding" id="tab-nc-sg"     aria-controls="panel-nc-safeguarding">🛡️ Safeguarding <span class="nc-tabcount" data-count="safeguarding"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="accidents"    id="tab-nc-acc"    aria-controls="panel-nc-accidents">🚑 Accidents &amp; incidents <span class="nc-tabcount" data-count="accidents"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="enquiries"    id="tab-nc-enq"    aria-controls="panel-nc-enquiries">📩 Enquiries <span class="nc-tabcount" data-count="enquiries"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="forms"        id="tab-nc-forms"  aria-controls="panel-nc-forms">📝 Registration &amp; Forms <span class="nc-tabcount" data-count="forms"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="payments"     id="tab-nc-pay"    aria-controls="panel-nc-payments">💷 Payments <span class="nc-tabcount" data-count="payments"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="absence"      id="tab-nc-abs"    aria-controls="panel-nc-absence">🌡️ Absence <span class="nc-tabcount" data-count="absence"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="children"     id="tab-nc-chi"    aria-controls="panel-nc-children">👶 Children &amp; Learning <span class="nc-tabcount" data-count="children"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="staff"        id="tab-nc-staff"  aria-controls="panel-nc-staff">👥 Staff &amp; Rota <span class="nc-tabcount" data-count="staff"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="messages"     id="tab-nc-msg"    aria-controls="panel-nc-messages">💬 Messages <span class="nc-tabcount" data-count="messages"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="system"       id="tab-nc-sys"    aria-controls="panel-nc-system">⚠️ Warnings &amp; System <span class="nc-tabcount" data-count="system"></span></button>
      <button class="wren-tab" role="tab" aria-selected="false" tabindex="-1" data-tab="settings"     id="tab-nc-set"    aria-controls="panel-nc-settings">⚙️ Settings &amp; devices</button>
    </div>
    <button class="tab-scroll-arrow left"  aria-hidden="true" tabindex="-1">‹</button>
    <button class="tab-scroll-arrow right" aria-hidden="true" tabindex="-1">›</button>
  </nav>

  <div class="wren-tab-panels">
    <!-- One panel per tab, because the shell shows/hides panels by matching
         data-tab — a single shared panel would be hidden for every tab but one.
         Each is an empty mount point; the script paints the visible one. -->
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-all" data-tab="all" aria-labelledby="tab-nc-all"></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-safeguarding" data-tab="safeguarding" aria-labelledby="tab-nc-sg" hidden></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-accidents" data-tab="accidents" aria-labelledby="tab-nc-acc" hidden></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-enquiries" data-tab="enquiries" aria-labelledby="tab-nc-enq" hidden></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-forms" data-tab="forms" aria-labelledby="tab-nc-forms" hidden></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-payments" data-tab="payments" aria-labelledby="tab-nc-pay" hidden></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-absence" data-tab="absence" aria-labelledby="tab-nc-abs" hidden></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-children" data-tab="children" aria-labelledby="tab-nc-chi" hidden></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-staff" data-tab="staff" aria-labelledby="tab-nc-staff" hidden></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-messages" data-tab="messages" aria-labelledby="tab-nc-msg" hidden></div>
    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-system" data-tab="system" aria-labelledby="tab-nc-sys" hidden></div>

    <div class="wren-tab-panel" role="tabpanel" id="panel-nc-settings" data-tab="settings" aria-labelledby="tab-nc-set" hidden>
      <div class="nc-wrap">
        <div id="nc-device"></div>
        <div id="nc-matrix" style="margin-top:18px"></div>
      </div>
    </div>
  </div>
</div>

<style>
/* Tokens only — no bare hex. Wren admin ships a single dark palette (there is
   no prefers-color-scheme / data-theme rule anywhere in public/css), so these
   follow whatever :root defines and would follow a light palette unchanged. */
.nc-wrap { padding:16px; max-width:1100px; }
.nc-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.nc-bar .nc-title { font-size:1rem; font-weight:700; color:var(--c-text); display:flex; align-items:center; gap:8px; }
.nc-bar .nc-spacer { flex:1 1 auto; }
.nc-sub { font-size:.78rem; color:var(--c-text-muted); line-height:1.5; }
.nc-search { font:inherit; font-size:.82rem; min-height:40px; padding:8px 12px; border-radius:var(--radius-sm,8px);
             border:1px solid var(--c-border); background:var(--c-bg); color:var(--c-text); min-width:0; flex:1 1 200px; max-width:340px; }
.nc-btn { font:inherit; font-size:.8rem; font-weight:600; min-height:40px; padding:8px 13px; border-radius:var(--radius-sm,8px);
          border:1px solid var(--c-border); background:var(--c-surface); color:var(--c-text); cursor:pointer; }
.nc-btn:hover:not(:disabled) { border-color:var(--c-blue); color:var(--c-blue); }
.nc-btn:disabled { opacity:.5; cursor:not-allowed; }

.nc-tabcount { display:inline-block; min-width:20px; padding:0 6px; margin-left:5px; border-radius:999px;
               font-size:.68rem; font-weight:700; line-height:18px; text-align:center;
               background:var(--c-navy-light); color:var(--c-text); }
.nc-tabcount:empty { display:none; }
.nc-tabcount.crit { background:var(--c-red); color:var(--c-navy); }

.nc-list { display:flex; flex-direction:column; gap:8px; }
.nc-item { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:start;
           padding:12px 14px; border:1px solid var(--c-border); border-left:3px solid var(--c-border);
           border-radius:var(--radius-sm,8px); background:var(--c-card); }
.nc-item.unread { background:var(--c-surface); }
.nc-item.tone-critical { border-left-color:var(--c-red); }
.nc-item.tone-warn     { border-left-color:var(--c-amber); }
.nc-item.tone-info     { border-left-color:var(--c-blue); }
.nc-item.tone-neutral  { border-left-color:var(--c-border); }
.nc-ico { font-size:1.1rem; line-height:1.3; }
.nc-body { min-width:0; }
.nc-t { font-size:.88rem; font-weight:600; color:var(--c-text); word-break:break-word; }
.nc-x { font-size:.8rem; color:var(--c-text-muted); margin-top:3px; line-height:1.45; word-break:break-word; }
.nc-meta { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:6px; }
/* Severity is never colour ALONE — every tinted row also carries this worded
   chip, so it reads the same to someone who cannot distinguish the tints. */
.nc-chip { font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
           padding:2px 7px; border-radius:999px; border:1px solid var(--c-border); color:var(--c-text-muted); }
.nc-chip.crit { color:var(--c-red);   border-color:var(--c-red); }
.nc-chip.warn { color:var(--c-amber); border-color:var(--c-amber); }
.nc-chip.info { color:var(--c-blue);  border-color:var(--c-blue); }
.nc-time { font-size:.72rem; color:var(--c-text-muted); white-space:nowrap; }
.nc-dismiss { background:none; border:1px solid transparent; color:var(--c-text-muted); font-size:1rem;
              width:34px; height:34px; border-radius:var(--radius-sm,8px); cursor:pointer; flex:0 0 auto; }
.nc-dismiss:hover { border-color:var(--c-red); color:var(--c-red); }
.nc-side { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.nc-empty { padding:44px 20px; text-align:center; color:var(--c-text-muted); font-size:.88rem; }
.nc-note { font-size:.75rem; color:var(--c-amber); margin-top:10px; }

/* Foldable (Honor Magic V5 ~400px folded / ~740–880 unfolded) and phones. */
@media (max-width:640px) {
  .nc-wrap { padding:12px; }
  .nc-item { grid-template-columns:auto minmax(0,1fr); }
  .nc-side { grid-column:1 / -1; flex-direction:row; align-items:center; justify-content:space-between; }
  .nc-search { max-width:none; }
}
</style>

<script>
(function () {
  'use strict';

  var state = { tab: 'all', page: 0, q: '', items: [], tabs: [], loading: false, hasMore: false };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // "9 days ago" — the EyLog reference reads in relative time, and so does the
  // bell dropdown, so the full list matches rather than inventing a new format.
  function rel(ts) {
    var m = Math.floor((Date.now() - new Date(ts)) / 60000);
    if (m < 1) return 'Just now';
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24); if (d < 31) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  var TAB_ICON = {
    all: '🔔', safeguarding: '🛡️', accidents: '🚑', enquiries: '📩', forms: '📝', payments: '💷',
    absence: '🌡️', children: '👶', staff: '👥', messages: '💬', system: '⚠️',
  };
  var TONE_CHIP = { critical: ['crit', 'Urgent'], warn: ['warn', 'Attention'], info: ['info', 'Info'], neutral: ['', 'Update'] };

  function api(path, opts) { return Wren.api(path, opts); }

  // Every category tab renders the same list into its own panel; we paint
  // whichever panel the shell has left visible.
  // NB the '.v2-section' prefix is load-bearing: the sidebar renders
  // <button class="v2-section-btn" data-section="notifications">, so a bare
  // [data-section="notifications"] selector matches the SIDEBAR BUTTON first
  // and every query below it comes back empty.
  function target() {
    var sec = document.querySelector('.v2-section[data-section="notifications"]');
    if (!sec) return null;
    return sec.querySelector('.wren-tab-panel[data-tab="' + state.tab + '"]')
        || sec.querySelector('.wren-tab-panel:not([hidden])');
  }

  function paintCounts(tabs) {
    state.tabs = tabs || [];
    state.tabs.forEach(function (t) {
      document.querySelectorAll('.nc-tabcount[data-count="' + t.key + '"]').forEach(function (el) {
        el.textContent = t.unread > 0 ? (t.unread > 999 ? '999+' : String(t.unread)) : '';
        el.classList.toggle('crit', t.key === 'safeguarding' && t.unread > 0);
      });
    });
  }

  function tabMeta(key) {
    for (var i = 0; i < state.tabs.length; i++) if (state.tabs[i].key === key) return state.tabs[i];
    return { key: key, label: key, count: 0, unread: 0 };
  }

  function render() {
    var el = target();
    if (!el) return;
    var meta = tabMeta(state.tab);
    var isSg = state.tab === 'safeguarding';

    var head =
      '<div class="nc-wrap">' +
        '<div class="nc-bar">' +
          '<div class="nc-title">' + (TAB_ICON[state.tab] || '🔔') + ' ' + esc(meta.label || 'All') +
            ' <span class="nc-sub">' + (meta.count || 0) + ' showing · ' + (meta.unread || 0) + ' unread</span></div>' +
          '<span class="nc-spacer"></span>' +
          '<input class="nc-search" id="nc-q" type="search" placeholder="Search these notifications…" value="' + esc(state.q) + '" aria-label="Search notifications">' +
          '<button class="nc-btn" id="nc-readall">Mark all read</button>' +
          '<button class="nc-btn" id="nc-dismissall">Dismiss all' + (state.tab === 'all' ? '' : ' in this tab') + '</button>' +
        '</div>' +
        (isSg
          ? '<div class="nc-sub" style="margin-bottom:12px">🛡️ Safeguarding is held apart from every other tab and is never cleared by a bulk "Dismiss all" elsewhere. Dismissing one here still asks first.</div>'
          : '');

    if (state.loading && !state.items.length) {
      return void (el.innerHTML = head + '<div class="nc-empty">Loading…</div></div>');
    }
    if (!state.items.length) {
      return void (el.innerHTML = head +
        '<div class="nc-empty">' + (state.q ? 'Nothing matches “' + esc(state.q) + '”.' : 'Nothing here — all caught up 👍') + '</div></div>');
    }

    var rows = state.items.map(function (n) {
      var chip = TONE_CHIP[n.tone] || TONE_CHIP.neutral;
      return '<div class="nc-item tone-' + esc(n.tone) + (n.read_at ? '' : ' unread') + '" data-nid="' + n.id + '"' +
             ' data-link="' + esc(n.link || '') + '" data-protected="' + (n.protected ? '1' : '0') + '">' +
        '<div class="nc-ico" aria-hidden="true">' + (TAB_ICON[n.tab] || '🔔') + '</div>' +
        '<div class="nc-body">' +
          '<div class="nc-t">' + esc(n.title) + '</div>' +
          (n.body ? '<div class="nc-x">' + esc(n.body) + '</div>' : '') +
          '<div class="nc-meta">' +
            '<span class="nc-chip ' + chip[0] + '">' + chip[1] + '</span>' +
            '<span class="nc-chip">' + esc(n.category_label) + '</span>' +
            (n.read_at ? '' : '<span class="nc-chip">Unread</span>') +
            (n.link ? '<span class="nc-chip">Opens a page</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="nc-side">' +
          '<span class="nc-time">' + esc(rel(n.created_at)) + '</span>' +
          '<button class="nc-dismiss" data-act="dismiss" aria-label="Dismiss: ' + esc(n.title) + '" title="Dismiss">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');

    el.innerHTML = head + '<div class="nc-list">' + rows + '</div>' +
      (state.hasMore ? '<div style="margin-top:14px;text-align:center"><button class="nc-btn" id="nc-more">Load more</button></div>' : '') +
      '</div>';
  }

  function load(reset) {
    if (reset) { state.page = 0; state.items = []; }
    state.loading = true;
    render();
    var url = '/api/notifications/centre?tab=' + encodeURIComponent(state.tab) +
              '&page=' + state.page + (state.q ? '&q=' + encodeURIComponent(state.q) : '');
    return api(url).then(function (d) {
      state.loading = false;
      state.items = state.page === 0 ? d.items : state.items.concat(d.items);
      state.hasMore = d.has_more;
      paintCounts(d.tabs);
      render();
      if (d.unmapped_categories && d.unmapped_categories.length) {
        console.warn('[notifications] categories with no explicit tab mapping (filed under Warnings & System):',
                     d.unmapped_categories.join(', '));
      }
    }).catch(function (e) {
      state.loading = false;
      var el = target();
      if (el) el.innerHTML = '<div class="nc-wrap"><div class="nc-empty">Could not load notifications — ' + esc(e.message || e) + '</div></div>';
    });
  }

  // ── interactions (delegated, so a repaint never loses its handlers) ────────
  document.addEventListener('click', function (ev) {
    var sec = ev.target.closest && ev.target.closest('.v2-section[data-section="notifications"]');
    if (!sec) return;

    var dis = ev.target.closest('[data-act="dismiss"]');
    if (dis) {
      ev.stopPropagation();
      var row = dis.closest('.nc-item');
      var id  = row.dataset.nid;
      if (row.dataset.protected === '1' &&
          !confirm('This is a safeguarding notification.\n\nDismissing it removes it from your list — the safeguarding record itself is untouched.\n\nDismiss it?')) return;
      api('/api/notifications/' + id + '/dismiss', { method: 'POST' })
        .then(function () { state.items = state.items.filter(function (n) { return String(n.id) !== String(id); }); return load(false); })
        .catch(function (e) { Wren.toast('Could not dismiss: ' + e.message, 'error'); });
      return;
    }

    if (ev.target.id === 'nc-more')    { state.page++; load(false); return; }
    if (ev.target.id === 'nc-readall') { api('/api/notifications/read-all', { method: 'POST' }).then(function () { load(true); }); return; }

    if (ev.target.id === 'nc-dismissall') {
      // Safeguarding is fenced off server-side; the response tells us how many
      // were held back so we can offer the deliberate second step.
      api('/api/notifications/dismiss-all', { method: 'POST', body: { tab: state.tab } })
        .then(function (r) {
          if (r.safeguarding_held_back > 0) {
            Wren.toast('Dismissed ' + r.dismissed + '. ' + r.safeguarding_held_back + ' safeguarding notification(s) kept.', 'info');
            if (confirm(r.safeguarding_held_back + ' safeguarding notification(s) were NOT dismissed.\n\n'
                      + 'Dismiss those as well? The safeguarding records themselves are not affected.')) {
              return api('/api/notifications/dismiss-all', { method: 'POST', body: { tab: state.tab, include_safeguarding: true } });
            }
          } else {
            Wren.toast('Dismissed ' + r.dismissed, 'success');
          }
        })
        .then(function () { load(true); })
        .catch(function (e) { Wren.toast('Dismiss all failed: ' + e.message, 'error'); });
      return;
    }

    var item = ev.target.closest('.nc-item');
    if (item) {
      var nid = item.dataset.nid, link = item.dataset.link;
      api('/api/notifications/' + nid + '/read', { method: 'POST' }).catch(function () {});
      if (link) window.location.href = link;
      else { item.classList.remove('unread'); load(false); }
    }
  });

  document.addEventListener('input', function (ev) {
    if (ev.target.id !== 'nc-q') return;
    var v = ev.target.value;
    clearTimeout(window.__ncQT);
    window.__ncQT = setTimeout(function () { state.q = v; load(true); }, 300);
  });

  // ── tab switching ─────────────────────────────────────────────────────────
  function show(tab) {
    if (tab === 'settings') return mountSettings();
    state.tab = tab; state.q = '';
    load(true);
  }

  var sectionEl = document.querySelector('.v2-section[data-section="notifications"]');
  var tabBar = sectionEl && sectionEl.querySelector('[role="tablist"]');
  if (tabBar) {
    tabBar.addEventListener('click', function (ev) {
      var t = ev.target.closest('[role="tab"]');
      if (t) show(t.dataset.tab);
    });
  }

  // The shell calls wrenLoadTab_<section>_<tab> once, the first time a tab is
  // shown (it nulls the hook afterwards) — so these cover a deep link straight
  // to /admin/notifications/payments, and the click handler covers the rest.
  ['all', 'safeguarding', 'accidents', 'enquiries', 'forms', 'payments', 'absence',
   'children', 'staff', 'messages', 'system'].forEach(function (t) {
    window['wrenLoadTab_notifications_' + t] = function () { show(t); };
  });

  var _settingsMounted = false;
  function mountSettings() {
    if (_settingsMounted) return;
    _settingsMounted = true;
    function go() {
      if (!window.WrenNotificationMatrix) return setTimeout(go, 120);
      WrenNotificationMatrix.mountDeviceCard(document.getElementById('nc-device'));
      WrenNotificationMatrix.mount(document.getElementById('nc-matrix'));
    }
    if (!document.getElementById('wnm-script')) {
      var s = document.createElement('script');
      s.id = 'wnm-script';
      s.src = '/js/wren-notification-matrix.js?v=b230';
      s.onload = go;
      document.head.appendChild(s);
    } else { go(); }
  }
  window.wrenLoadTab_notifications_settings = mountSettings;

  // First paint: whichever tab the shell has already made active.
  var active = sectionEl && sectionEl.querySelector('[role="tab"].wren-tab-active');
  show(active ? active.dataset.tab : 'all');
})();
</script>
