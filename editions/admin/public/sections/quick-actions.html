<div class="v2-section" data-section="quick-actions">
<style>
/* b212 (2026-08-21) — Quick actions. Theme tokens only (--c-*): the shell defines
   them for both light and dark, so nothing here is hard-coded to one theme. */
.qa-wrap{padding:24px;max-width:900px}
.qa-h{color:var(--c-text);font-size:1.3rem;margin:0 0 4px}
.qa-sub{color:var(--c-muted);font-size:.85rem;margin:0 0 18px;line-height:1.5}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.qa-btn{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--c-card);
  border:1px solid var(--c-border);border-radius:12px;padding:16px;cursor:pointer;
  color:var(--c-text);font-family:inherit;transition:border-color .15s,transform .15s}
.qa-btn:hover{border-color:var(--c-blue);transform:translateY(-1px)}
.qa-btn:focus-visible{outline:2px solid var(--c-blue);outline-offset:2px}
.qa-btn-icon{font-size:1.4rem}
.qa-btn-label{font-weight:700;font-size:.95rem}
.qa-btn-hint{font-size:.75rem;color:var(--c-muted);line-height:1.4}
.qa-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:12px;padding:18px}
.qa-card h3{margin:0 0 12px;color:var(--c-text);font-size:1rem}
.qa-row{margin-bottom:10px;display:flex;flex-direction:column}
.qa-row label{font-size:.72rem;color:var(--c-muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.qa-in{background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;padding:9px 11px;
  color:var(--c-text);font-family:inherit;font-size:.9rem;width:100%}
.qa-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.qa-effect{background:var(--c-bg);border:1px solid var(--c-border);border-left:3px solid var(--c-amber);
  border-radius:8px;padding:11px 13px;margin:12px 0;font-size:.85rem;color:var(--c-text);line-height:1.5}
.qa-effect em{color:var(--c-muted);font-style:normal;display:block;margin-top:4px;font-size:.78rem}
.qa-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qa-note{font-size:.78rem;color:var(--c-muted);margin:10px 0 0;line-height:1.5}
.qa-archived{margin-top:18px}
.qa-archived h4{margin:0 0 8px;font-size:.8rem;color:var(--c-muted);text-transform:uppercase;letter-spacing:.03em}
.qa-arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--c-border);flex-wrap:wrap}
.qa-arow:last-child{border-bottom:none}
.qa-aname{flex:1;min-width:140px;color:var(--c-text);font-size:.88rem}
.qa-adate{font-size:.76rem;color:var(--c-muted)}
.qa-empty{color:var(--c-muted);font-size:.85rem;padding:8px 0}
.qa-pin{background:var(--c-bg);border:1px solid var(--c-border);border-left:3px solid var(--c-green);
  border-radius:8px;padding:10px 12px;margin-top:10px;color:var(--c-text);font-size:.85rem;line-height:1.5}
.qa-pin strong{color:var(--c-green)}
</style>

<div class="qa-wrap">
  <h2 class="qa-h">⚡ Quick actions</h2>
  <p class="qa-sub">The four jobs that used to mean hunting through a long form: bring someone in, or close them off.
    Archiving keeps every record — it just stops the person appearing on registers, rotas and pickers.</p>

  <div class="qa-grid" id="qa-menu">
    <button class="qa-btn" data-qa="add-child">
      <span class="qa-btn-icon">👶</span>
      <span class="qa-btn-label">Add a child</span>
      <span class="qa-btn-hint">Name, date of birth, room — the rest can wait.</span>
    </button>
    <button class="qa-btn" data-qa="archive-child">
      <span class="qa-btn-icon">📁</span>
      <span class="qa-btn-label">Archive a child</span>
      <span class="qa-btn-hint">Set a last day. They roll off the registers after it.</span>
    </button>
    <button class="qa-btn" data-qa="add-staff">
      <span class="qa-btn-icon">🧑‍🍼</span>
      <span class="qa-btn-label">Add a member of staff</span>
      <span class="qa-btn-hint">Name and role, with an optional starting PIN.</span>
    </button>
    <button class="qa-btn" data-qa="archive-staff">
      <span class="qa-btn-icon">🗂️</span>
      <span class="qa-btn-label">Archive a member of staff</span>
      <span class="qa-btn-hint">Set a last working day. They roll off the rota after it.</span>
    </button>
  </div>

  <div id="qa-panel"></div>
</div>

<script>
(function () {
  'use strict';
  var root = document.querySelector('.v2-section[data-section="quick-actions"]');
  if (!root) return;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
    if (isNaN(d)) return String(iso).slice(0, 10);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  // Both children.leave_date and staff.termination_date mean LAST DAY — the row is
  // archived the day AFTER it (`< CURRENT_DATE` in the routes and both nightly rolls).
  // So the honest sentence to show a manager is "from <date + 1 day>".
  function dayAfter(iso) {
    var d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
    if (isNaN(d)) return '—';
    d.setDate(d.getDate() + 1);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function personName(p) {
    return ((p.first_name || '') + ' ' + (p.last_name || '')).trim() || p.name || ('#' + p.id);
  }
  function fail(e) { Wren.toast('Failed: ' + ((e && (e.error || e.message)) || 'unknown error'), 'error'); }

  var panel = root.querySelector('#qa-panel');
  var rooms = null;

  async function getRooms() {
    if (rooms) return rooms;
    try { rooms = await Wren.api('/api/staff/rooms'); } catch (e) { rooms = []; }
    return rooms;
  }
  function roomOptions(list) {
    return '<option value="">— none —</option>' +
      (list || []).map(function (r) { return '<option value="' + r.id + '">' + esc(r.name) + '</option>'; }).join('');
  }

  function close() { panel.innerHTML = ''; }

  // ── Add child ───────────────────────────────────────────────────────────────
  async function addChild() {
    var rs = await getRooms();
    panel.innerHTML =
      '<div class="qa-card"><h3>👶 Add a child</h3>' +
      '<div class="qa-grid2">' +
        '<div class="qa-row"><label for="qa-c-first">First name</label><input id="qa-c-first" class="qa-in" autocomplete="off"></div>' +
        '<div class="qa-row"><label for="qa-c-last">Last name</label><input id="qa-c-last" class="qa-in" autocomplete="off"></div>' +
        '<div class="qa-row"><label for="qa-c-dob">Date of birth</label><input id="qa-c-dob" type="date" class="qa-in"></div>' +
        '<div class="qa-row"><label for="qa-c-room">Room</label><select id="qa-c-room" class="qa-in">' + roomOptions(rs) + '</select></div>' +
        '<div class="qa-row"><label for="qa-c-pname">Parent name</label><input id="qa-c-pname" class="qa-in" autocomplete="off"></div>' +
        '<div class="qa-row"><label for="qa-c-pemail">Parent email</label><input id="qa-c-pemail" type="email" class="qa-in" autocomplete="off"></div>' +
      '</div>' +
      '<p class="qa-note">Allergies, funding, contacts and consents are all on the child\'s profile afterwards — this is just enough to create the record.</p>' +
      '<div class="qa-actions"><button class="btn btn-primary" id="qa-c-save">Add child</button>' +
      '<button class="btn btn-ghost" data-qa-close>Cancel</button></div></div>';
  }

  async function saveChild() {
    var first = root.querySelector('#qa-c-first').value.trim();
    var last = root.querySelector('#qa-c-last').value.trim();
    if (!first || !last) { Wren.toast('First and last name are required', 'warning'); return; }
    var room = root.querySelector('#qa-c-room').value;
    try {
      var c = await Wren.api('/api/children', { method: 'POST', body: {
        first_name: first,
        last_name: last,
        date_of_birth: root.querySelector('#qa-c-dob').value || null,
        room_id: room ? parseInt(room, 10) : null,
        parent_1_name: root.querySelector('#qa-c-pname').value.trim() || null,
        parent_1_email: root.querySelector('#qa-c-pemail').value.trim() || null,
      } });
      Wren.toast(personName(c) + ' added ✓', 'success');
      close();
    } catch (e) { fail(e); }
  }

  // ── Add staff ───────────────────────────────────────────────────────────────
  async function addStaff() {
    var rs = await getRooms();
    panel.innerHTML =
      '<div class="qa-card"><h3>🧑‍🍼 Add a member of staff</h3>' +
      '<div class="qa-grid2">' +
        '<div class="qa-row"><label for="qa-s-first">First name</label><input id="qa-s-first" class="qa-in" autocomplete="off"></div>' +
        '<div class="qa-row"><label for="qa-s-last">Last name</label><input id="qa-s-last" class="qa-in" autocomplete="off"></div>' +
        '<div class="qa-row"><label for="qa-s-email">Email</label><input id="qa-s-email" type="email" class="qa-in" autocomplete="off"></div>' +
        '<div class="qa-row"><label for="qa-s-role">Role</label><select id="qa-s-role" class="qa-in">' +
          '<option value="practitioner">Practitioner</option>' +
          '<option value="senior_practitioner">Senior practitioner</option>' +
          '<option value="room_leader">Room leader</option>' +
          '<option value="apprentice">Apprentice</option>' +
          '<option value="deputy_manager">Deputy manager</option>' +
          '<option value="manager">Manager</option>' +
        '</select></div>' +
        '<div class="qa-row"><label for="qa-s-room">Room</label><select id="qa-s-room" class="qa-in">' + roomOptions(rs) + '</select></div>' +
        '<div class="qa-row"><label for="qa-s-pin">Starting PIN (optional)</label><input id="qa-s-pin" class="qa-in" inputmode="numeric" maxlength="6" placeholder="4 or 6 digits"></div>' +
      '</div>' +
      '<p class="qa-note">Leave the PIN blank and tick below to have Wren generate one — it is shown to you once, here, and never stored in readable form. New staff start with observations going to the review queue until you grant publishing rights on their profile.</p>' +
      '<label style="display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--c-text);margin-top:6px">' +
        '<input type="checkbox" id="qa-s-genpin"> Generate a starting PIN for me</label>' +
      '<div class="qa-actions"><button class="btn btn-primary" id="qa-s-save">Add staff member</button>' +
      '<button class="btn btn-ghost" data-qa-close>Cancel</button></div>' +
      '<div id="qa-s-result"></div></div>';
  }

  async function saveStaff() {
    var first = root.querySelector('#qa-s-first').value.trim();
    var last = root.querySelector('#qa-s-last').value.trim();
    if (!first || !last) { Wren.toast('First and last name are required', 'warning'); return; }
    var pin = root.querySelector('#qa-s-pin').value.trim();
    if (pin && !/^(\d{4}|\d{6})$/.test(pin)) { Wren.toast('Starting PIN must be exactly 4 or 6 digits', 'warning'); return; }
    var room = root.querySelector('#qa-s-room').value;
    try {
      var s = await Wren.api('/api/staff', { method: 'POST', body: {
        first_name: first,
        last_name: last,
        email: root.querySelector('#qa-s-email').value.trim() || null,
        role: root.querySelector('#qa-s-role').value,
        room_id: room ? parseInt(room, 10) : null,
        pin: pin || undefined,
        generate_pin: !pin && root.querySelector('#qa-s-genpin').checked,
      } });
      Wren.toast(personName(s) + ' added ✓', 'success');
      if (s.generated_pin) {
        root.querySelector('#qa-s-result').innerHTML =
          '<div class="qa-pin"><strong>Starting PIN for ' + esc(personName(s)) + ': ' + esc(s.generated_pin) + '</strong>' +
          '<br>Write it down now — this is the only time it is shown. They can change it once they log in.</div>';
      } else { close(); }
    } catch (e) { fail(e); }
  }

  // ── Archive (shared by child + staff — same shape, different endpoints) ──────
  var ARCHIVE = {
    child: {
      icon: '📁', title: 'Archive a child',
      listUrl: '/api/children', inactiveUrl: '/api/children/inactive',
      dateField: 'leave_date', dateLabel: 'Last day at nursery',
      surface: 'registers, room lists and the diary',
      reactivate: function (id) { return Wren.api('/api/children/' + id + '/reactivate', { method: 'POST', body: {} }); },
      archive: function (id, date) { return Wren.api('/api/children/' + id, { method: 'PUT', body: { leave_date: date } }); },
    },
    staff: {
      icon: '🗂️', title: 'Archive a member of staff',
      listUrl: '/api/staff', inactiveUrl: '/api/staff/inactive',
      dateField: 'termination_date', dateLabel: 'Last working day',
      surface: 'the rota, ratios and key-person lists',
      reactivate: function (id) { return Wren.api('/api/staff/' + id + '/reactivate', { method: 'POST', body: {} }); },
      archive: function (id, date) { return Wren.api('/api/staff/' + id, { method: 'PUT', body: { termination_date: date } }); },
    },
  };

  async function archiveForm(kind) {
    var cfg = ARCHIVE[kind];
    panel.innerHTML = '<div class="qa-card"><h3>' + cfg.icon + ' ' + esc(cfg.title) + '</h3>' +
      '<div class="qa-empty">Loading…</div></div>';
    var people = [];
    try { people = await Wren.api(cfg.listUrl); } catch (e) { fail(e); return; }
    // 🔒 The owner account (id=1) can never be archived — the server refuses it, so
    // don't offer it here either.
    if (kind === 'staff') people = people.filter(function (p) { return Number(p.id) !== 1; });
    people.sort(function (a, b) { return personName(a).localeCompare(personName(b)); });

    panel.innerHTML =
      '<div class="qa-card"><h3>' + cfg.icon + ' ' + esc(cfg.title) + '</h3>' +
      '<div class="qa-grid2">' +
        '<div class="qa-row"><label for="qa-a-who">Who</label><select id="qa-a-who" class="qa-in">' +
          '<option value="">— choose —</option>' +
          people.map(function (p) { return '<option value="' + p.id + '">' + esc(personName(p)) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="qa-row"><label for="qa-a-date">' + esc(cfg.dateLabel) + '</label>' +
          '<input id="qa-a-date" type="date" class="qa-in" value="' + todayISO() + '"></div>' +
      '</div>' +
      '<div class="qa-effect" id="qa-a-effect"></div>' +
      '<div class="qa-actions"><button class="btn btn-primary" id="qa-a-save" disabled>Archive</button>' +
      '<button class="btn btn-ghost" data-qa-close>Cancel</button></div>' +
      '<div class="qa-archived" id="qa-a-archived"><h4>Already archived</h4><div class="qa-empty">Loading…</div></div>' +
      '</div>';

    panel.dataset.qaKind = kind;
    updateEffect();
    loadArchived(kind);
  }

  function updateEffect() {
    var kind = panel.dataset.qaKind;
    if (!kind) return;
    var cfg = ARCHIVE[kind];
    var sel = root.querySelector('#qa-a-who');
    var dateEl = root.querySelector('#qa-a-date');
    var box = root.querySelector('#qa-a-effect');
    var btn = root.querySelector('#qa-a-save');
    if (!sel || !dateEl || !box || !btn) return;
    var who = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
    var firstName = who.split(' ')[0];
    if (!sel.value || !dateEl.value) {
      box.innerHTML = 'Pick who is leaving and their last day, and this will spell out exactly what happens.';
      btn.disabled = true;
      return;
    }
    var past = new Date(dateEl.value + 'T00:00:00') < new Date(new Date().toDateString());
    box.innerHTML =
      '<strong>' + esc(firstName) + ' will stop showing on ' + esc(cfg.surface) + ' from ' + esc(dayAfter(dateEl.value)) + '.</strong>' +
      '<em>' + esc(fmtDate(dateEl.value)) + ' is counted as their last day. ' +
      (past ? 'That date has already passed, so this takes effect the moment you press Archive. '
            : 'Wren archives them automatically overnight once it passes. ') +
      'Nothing is deleted — every record is kept, and you can restore them from the list below.</em>';
    btn.disabled = false;
  }

  async function loadArchived(kind) {
    var cfg = ARCHIVE[kind];
    var box = root.querySelector('#qa-a-archived');
    if (!box) return;
    var rows = [];
    try { rows = await Wren.api(cfg.inactiveUrl); } catch (e) { rows = []; }
    var html = '<h4>Already archived</h4>';
    if (!rows.length) {
      html += '<div class="qa-empty">Nobody archived yet.</div>';
    } else {
      html += rows.slice(0, 25).map(function (p) {
        return '<div class="qa-arow"><span class="qa-aname">' + esc(personName(p)) + '</span>' +
          '<span class="qa-adate">' + esc(fmtDate(p[cfg.dateField])) + '</span>' +
          '<button class="btn btn-sm btn-ghost" data-qa-restore="' + p.id + '">Restore</button></div>';
      }).join('');
      if (rows.length > 25) html += '<div class="qa-empty">…and ' + (rows.length - 25) + ' more.</div>';
    }
    box.innerHTML = html;
  }

  async function doArchive() {
    var kind = panel.dataset.qaKind;
    var cfg = ARCHIVE[kind];
    var sel = root.querySelector('#qa-a-who');
    var date = root.querySelector('#qa-a-date').value;
    if (!sel.value || !date) return;
    var who = sel.options[sel.selectedIndex].text;
    var ok = await Wren.confirm('Archive ' + who + ' with a last day of ' + fmtDate(date) + '?');
    if (!ok) return;
    try {
      await cfg.archive(sel.value, date);
      Wren.toast(who + ' archived ✓', 'success');
      await archiveForm(kind);
    } catch (e) { fail(e); }
  }

  async function doRestore(id) {
    var kind = panel.dataset.qaKind;
    var cfg = ARCHIVE[kind];
    try {
      await cfg.reactivate(id);
      Wren.toast('Restored ✓', 'success');
      await archiveForm(kind);
    } catch (e) { fail(e); }
  }

  root.addEventListener('click', function (e) {
    var menu = e.target.closest('[data-qa]');
    if (menu) {
      var a = menu.dataset.qa;
      if (a === 'add-child') addChild();
      else if (a === 'add-staff') addStaff();
      else if (a === 'archive-child') archiveForm('child');
      else if (a === 'archive-staff') archiveForm('staff');
      return;
    }
    if (e.target.closest('[data-qa-close]')) { close(); return; }
    if (e.target.closest('#qa-c-save')) { saveChild(); return; }
    if (e.target.closest('#qa-s-save')) { saveStaff(); return; }
    if (e.target.closest('#qa-a-save')) { doArchive(); return; }
    var r = e.target.closest('[data-qa-restore]');
    if (r) { doRestore(r.dataset.qaRestore); }
  });

  root.addEventListener('change', function (e) {
    if (e.target.id === 'qa-a-who' || e.target.id === 'qa-a-date') updateEffect();
  });
  root.addEventListener('input', function (e) {
    if (e.target.id === 'qa-a-date') updateEffect();
  });

  // Tabless section: the shell calls wrenLoadTab_<section>_<tab> only when tabs
  // exist, so mirror access.html and self-init on wren:ready / late injection.
  function init() { /* menu is static — nothing to fetch until an action is picked */ }
  document.addEventListener('wren:ready', init);
  if (window.Wren && Wren.getToken) init();
})();
</script>
</div>
