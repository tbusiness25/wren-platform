<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What our families say — Your Nursery</title>
<style>
  :root{ --cream:#faf7f0; --card:#ffffff; --ink:#26332b; --green:#2f5741; --green2:#3d6b4f; --leaf:#eaf5ec; --line:#dbe6dd; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:22px 18px 80px}
  header.brand{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
  header.brand .leaf{font-size:2rem}
  header.brand h1{font-size:1.6rem;color:var(--green);margin:0}
  header.brand .sub{color:var(--green2);font-size:.95rem}
  .grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:24px}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 1px 4px rgba(47,87,65,.06)}
  .card blockquote{margin:0 0 10px;font-size:1rem;line-height:1.6}
  .card blockquote::before{content:'\201C'}
  .card blockquote::after{content:'\201D'}
  .card cite{display:block;font-style:normal;color:var(--green2);font-size:.88rem;font-weight:600}
  .empty{background:var(--leaf);border-radius:14px;padding:26px;text-align:center;color:var(--green2)}
  a.cta{display:inline-block;margin-top:8px;color:var(--green);font-weight:700}
  footer{text-align:center;color:#6b8f76;font-size:.85rem;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><span class="leaf">🌿</span><div><h1>What our families say</h1><div class="sub">Your Nursery, Ealing</div></div></header>
  <p>Every word here is a family's own, shared with their permission.</p>
  <div class="grid" id="tm-grid"><p>Loading…</p></div>
  <p><a class="cta" href="/">← Back to the nursery site</a></p>
  <footer>123 Example Lane, Your Town, AB1 2CD · 020 7946 0000</footer>
</div>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  fetch('/api/public/testimonials').then(function(r){return r.json();}).then(function(d){
    var grid = document.getElementById('tm-grid');
    var items = d.testimonials || [];
    if (!items.length){ grid.innerHTML = '<div class="empty">Testimonials are coming soon.</div>'; return; }
    grid.innerHTML = items.map(function(t){
      return '<div class="card"><blockquote>'+esc(t.body)+'</blockquote><cite>'+esc(t.display_name)+'</cite></div>';
    }).join('');
  }).catch(function(){ document.getElementById('tm-grid').innerHTML = '<div class="empty">Could not load testimonials right now.</div>'; });
})();
</script>
</body>
</html>
