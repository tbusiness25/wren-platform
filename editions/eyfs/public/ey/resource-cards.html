<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="wren-edition" content="ladn">
  <meta name="wren-app-page" content="resource-cards">
  <meta name="wren-app-title" content="Resource Cards">
  <title>Resource Cards · Wren</title>
  <link rel="stylesheet" href="/css/wren.css">
  <script src="/js/wren-theme.js"></script>
  <link rel="stylesheet" href="/css/wren-app-shell.css?v=20260727">
  <style>
    #ey-resource-cards-page { padding: 4px 2px 40px; }
    .card-list { list-style:none; padding:0; margin:0; }
    .card-item { margin-bottom:12px; border:1px solid var(--c-border,#2d3748); border-radius:8px; padding:8px 12px; background:var(--c-card,#1e293b); }
    .card-title { font-weight:600; font-size:1rem; color:var(--c-text,#e2e8f0); }
    .card-category { font-size:.85rem; color:var(--c-muted,#cbd5e1); }
  </style>
</head>
<body data-portal="ey">
  <div id="ey-resource-cards-page">
    <h1>Resource Cards</h1>
    <ul class="card-list" id="card-list"></ul>
  </div>
  <script src="/js/wren-core.js?v=20260704" defer></script>
  <script src="/icons/wren-icons.js?v=b146" defer></script>
  <script src="/js/wren-app-shell.js?v=20260717" defer></script>
  <script>
    (function(){
      'use strict';
      function load(){
        fetch('/api/resource-cards', {cache:'no-cache'}).then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
        .then(cards=>{
          const ul=document.getElementById('card-list');
          ul.innerHTML='';
          cards.forEach(c=>{
            const li=document.createElement('li');
            li.className='card-item';
            li.innerHTML=`<div class="card-title">${c.title}</div>`+
                         `<div class="card-category">${c.category||''}</div>`;
            ul.appendChild(li);
          });
        })
        .catch(()=>{document.getElementById('ey-resource-cards-page').innerHTML='<p>Could not load cards.</p>';});
      }
      document.addEventListener('wren:ready', load);
      setTimeout(()=>{ if(!document.getElementById('card-list').children.length) load(); },800);
    })();
  </script>
</body>
</html>
