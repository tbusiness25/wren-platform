<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline — Your Nursery</title>
<meta name="theme-color" content="#2d5a4a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2d5a4a;--green-d:#1e3d31;--orange:#f0a050;--cream:#fefcf8;--cream-d:#f5f0e8;--text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0}
body{font-family:'Nunito',system-ui,-apple-system,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
/* this page has no top bar or tab bar (the shell script is not loaded — the device is offline),
   so it opts out of the shell's body padding */
html.lap-shell body{padding:24px !important}
.logo{background:#fff;border-radius:14px;padding:10px 16px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.logo img{height:40px;display:block}
.small{margin-top:14px;font-size:.8rem;color:var(--text-m);text-align:center}
</style>
<!-- b339 (2026-09-18): this is the screen EYParent draws for "no internet" — an illustration and one line,
     in the parent's own light/dark choice. Precached by the service worker, so every file it needs
     (this stylesheet, lap-boot.js, wren-parent-empty.js) is precached too. -->
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
</head>
<body>
  <div class="logo"><img src="/little-angels-logo.png" alt="Your Nursery"></div>
  <div id="off"></div>
  <div class="small">Your Nursery · Ealing, AB1 2CD</div>
  <script src="/js/wren-parent-empty.js"></script>
  <script>
    WrenParentEmpty.render(document.getElementById('off'), 'offline', {
      text: 'We can’t reach Your Nursery right now. Check your connection — your child’s latest updates will load as soon as you’re back online.',
      action: { label: 'Try again', onClick: function () { location.reload(); } }
    });
    // Auto-retry the home page the moment connectivity returns.
    window.addEventListener('online', function () { location.href = '/welcome'; });
  </script>
</body>
</html>
