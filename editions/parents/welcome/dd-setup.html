<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Direct Debit Setup — Your Nursery</title>
<meta name="lap-title" content="Direct Debit">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d5a4a;--green-d:#1e3d31;--cream:#fefcf8;--cream-d:#f5f0e8;
  --text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0;--orange:#f0a050;
  /* b339 — a bad-news colour that is readable as TEXT on its tint; paler in dark */
  --iv-bad:#a8281c;
}
html.lap-dark{--iv-bad:#ff9d90}
body{font-family:'Nunito',system-ui,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
h1,h2,h3{font-family:'Crimson Pro',Georgia,serif}
.nav{background:var(--green);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:0 20px;height:60px}
.nav-logo img{height:40px;display:block}
.nav-link{color:rgba(255,255,255,.8);font-size:.9rem;font-weight:600;padding:6px 14px;border-radius:6px;transition:.15s}
.nav-link:hover{background:rgba(255,255,255,.1);color:#fff}
.container{max-width:640px;margin:16px auto;padding:0 20px 80px}
.card{background:var(--surface, #fff);border:1px solid var(--border);border-radius:18px;padding:24px 20px;text-align:center}
.card h2{font-size:1.4rem;line-height:1.25;color:var(--lap-ink,var(--green));margin-bottom:8px}
.card p{color:var(--text-m);font-size:.95rem;margin-bottom:18px}
.dd-ic{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;background:var(--lap-tint-green,#e4f3ea);color:var(--lap-ink,var(--green))}
.dd-ic svg{width:36px;height:36px}
.dd-ic.warn{background:var(--lap-tint-amber,#fef3c7);color:var(--text)}
.dd-ic.bad{background:var(--lap-tint-red,#fbe4e0);color:var(--iv-bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 28px;min-height:50px;border-radius:12px;font-family:inherit;font-size:1rem;font-weight:800;border:none;cursor:pointer;transition:.15s;text-decoration:none}
.card .btn{width:100%}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-d)}
.btn-outline{background:transparent;color:var(--lap-ink,var(--green));border:1.5px solid var(--green)}
.btn-outline:hover{background:var(--lap-tint-green, #f0f8f4)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.dd-err{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--lap-tint-red,#fbe4e0);border:1px solid #f0c4bc;color:var(--iv-bad);font-size:.88rem;line-height:1.45;text-align:left}
.mandate-box{background:var(--cream-d);border:1px solid var(--border);border-radius:12px;padding:6px 16px;text-align:left;margin:16px 0 18px}
.mandate-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.mandate-row:last-child{border-bottom:none}
.mandate-row span:first-child{color:var(--text-m)}
.mandate-row span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere}
footer{background:var(--green-d);color:rgba(255,255,255,.7);text-align:center;padding:24px 20px;font-size:.82rem;position:fixed;bottom:0;width:100%}
footer strong{color:#fff}
/* b339 — the shape of the card while the mandate loads, so the screen does not jump */
.dd-skel{margin:0 auto}
.dd-skel i{display:block;border-radius:14px;background:linear-gradient(90deg,var(--cream-d) 0%,var(--surface,#fff) 50%,var(--cream-d) 100%);background-size:200% 100%;animation:ddsk 1.2s ease-in-out infinite}
.dd-skel i:nth-child(1){width:72px;height:72px;border-radius:50%;margin:0 auto 16px}
.dd-skel i:nth-child(2){height:26px;width:70%;margin:0 auto 12px}
.dd-skel i:nth-child(3){height:44px;margin-bottom:18px}
.dd-skel i:nth-child(4){height:50px}
@keyframes ddsk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.dd-skel i,.spinner{animation:none}}
</style>
<script src="/pwa.js" defer></script>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/welcome" class="nav-logo">
      <img src="/little-angels-logo.png" alt="Your Nursery">
    </a>
    <a href="/welcome/payments" class="nav-link">← Back to Payments</a>
  </div>
</nav>

<!-- b339 (2026-09-18) — one card, and what it says first is the state of the Direct Debit and the one
     thing to do about it: the button. Nothing here is a long explanation; the screen is short by nature. -->
<div class="container">
  <div class="card" id="main-card">
    <div class="dd-skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
</div>

<footer>
  <strong>Your Nursery</strong> · 123 Example Lane, London AB1 2CD
</footer>

<script src="/js/wren-parent-empty.js"></script>
<script>
const params = new URLSearchParams(location.search);
const redirectFlowId = params.get('redirect_flow_id');

function ico(d){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';}
const ICON = {
  bank:  ico('<path d="M3.5 9.5L12 4l8.5 5.5z"/><path d="M6 10v7M10 10v7M14 10v7M18 10v7"/><path d="M4 19.5h16"/>'),
  check: ico('<circle cx="12" cy="12" r="8.5"/><path d="M8.4 12.3l2.5 2.5 4.7-5.2"/>'),
  clock: ico('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  cross: ico('<circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/>')
};

async function init() {
  const card = document.getElementById('main-card');

  if (!redirectFlowId) {
    // Not a return from GC — show mandate management
    await showMandates(card);
    return;
  }

  // Completing a redirect flow returned from GoCardless
  card.innerHTML = `<div class="dd-ic warn">${ICON.clock}</div><h2>Completing setup…</h2><p>Please wait while we confirm your Direct Debit.</p><div class="spinner"></div>`;

  try {
    const r = await fetch('/api/payments/gocardless/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ redirect_flow_id: redirectFlowId }),
    });
    const data = await r.json();

    if (!r.ok) throw new Error(data.error || 'Failed to complete setup');

    history.replaceState({}, '', '/welcome/dd-setup');
    card.innerHTML = `
      <div class="dd-ic">${ICON.check}</div>
      <h2>Direct Debit set up!</h2>
      <p>Your Direct Debit mandate is now active. Monthly nursery fees will be collected automatically on the due date.</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px">
        <a href="/welcome/payments" class="btn btn-green">Back to payments</a>
      </div>`;
  } catch(e) {
    card.innerHTML = `
      <div class="dd-ic bad">${ICON.cross}</div>
      <h2>Setup incomplete</h2>
      <p>There was a problem: ${esc(e.message)}</p>
      <a href="/welcome/payments" class="btn btn-outline" style="margin-top:8px">Try again</a>`;
  }
}

async function showMandates(card) {
  try {
    const r = await fetch('/api/payments/mandates');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { mandates } = await r.json();
    const active = mandates.filter(m => m.status === 'active');

    if (!active.length) {
      card.innerHTML = `
        <div class="dd-ic">${ICON.bank}</div>
        <h2>No active Direct Debit</h2>
        <p>You don't have an active Direct Debit mandate. Set one up to pay monthly fees automatically.</p>
        <button class="btn btn-green" data-action="start-dd">Set up Direct Debit</button>`;
      return;
    }

    const m = active[0];
    card.innerHTML = `
      <div class="dd-ic">${ICON.check}</div>
      <h2>Direct Debit active</h2>
      <div class="mandate-box">
        ${m.gc_bank_name ? `<div class="mandate-row"><span>Bank</span><span>${esc(m.gc_bank_name)}</span></div>` : ''}
        ${m.gc_account_number_end ? `<div class="mandate-row"><span>Account ending</span><span>${esc(m.gc_account_number_end)}</span></div>` : ''}
        ${m.gc_account_holder ? `<div class="mandate-row"><span>Account holder</span><span>${esc(m.gc_account_holder)}</span></div>` : ''}
        <div class="mandate-row"><span>Status</span><span>Active</span></div>
        <div class="mandate-row"><span>Set up</span><span>${fmtDate(m.created_at)}</span></div>
      </div>
      <p style="font-size:.85rem">To cancel your Direct Debit, contact Your Nursery directly.</p>
      <a href="/welcome/payments" class="btn btn-outline" style="margin-top:8px">Back to payments</a>`;
  } catch(e) {
    WrenParentEmpty.render(card, navigator.onLine === false ? 'offline' : 'error', {
      title: navigator.onLine === false ? undefined : 'Couldn’t load your Direct Debit',
      action: { label: 'Try again', onClick: function () {
        card.innerHTML = '<div class="dd-skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div>';
        showMandates(card);
      } }
    });
  }
}

async function startNew(btn) {
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const r = await fetch('/api/payments/gocardless/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Failed');
    window.location.href = data.redirect_url;
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Set up Direct Debit';
    // stays where the parent tapped, instead of a browser alert
    let er = btn.parentElement.querySelector('.dd-err');
    if (!er) { er = document.createElement('div'); er.className = 'dd-err'; er.setAttribute('role', 'alert'); btn.insertAdjacentElement('afterend', er); }
    er.textContent = 'Could not start: ' + e.message;
  }
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}

document.getElementById('main-card').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-action="start-dd"]');
  if (btn) startNew(btn);
});
init();
</script>
  <script src="/js/wren-lightbox.js" defer></script>
</body>
</html>
