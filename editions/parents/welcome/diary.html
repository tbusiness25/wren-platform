<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Nursery — Your Child's Daily Diary</title>
<meta name="lap-title" content="Diary">
<meta name="lap-action" content="+ Log" data-href="/welcome/baby-log">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2d5a4a;--orange:#f0a050;--cream:#fefcf8;--cream-d:#f5f0e8;--text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0}
body{font-family:'Nunito',system-ui,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
h1,h3{font-family:'Crimson Pro',Georgia,serif}a{color:var(--lap-ink,var(--green));text-decoration:none}
.nav{background:var(--green);position:sticky;top:0;z-index:100}.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px}
.nav-logo img{height:40px}.nav-links{display:flex;gap:4px;flex-wrap:wrap}.nav-link{color:rgba(255,255,255,.8);font-size:.9rem;font-weight:600;padding:6px 12px;border-radius:6px}
.nav-link.active{color:#fff;border-bottom:2px solid var(--orange);border-radius:0;padding-bottom:4px}.nav-link:hover{background:rgba(255,255,255,.1);color:#fff}
.hero{background:var(--green);color:#fff;padding:40px 20px 28px;text-align:center}.hero h1{font-size:2rem;margin-bottom:8px}.hero p{opacity:.88;max-width:560px;margin:0 auto}
/* loading skeleton — the shape of a row, so the page does not jump when the diary lands */
.dy-skel{display:flex;gap:13px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--border)}
.dy-skel i{display:block;border-radius:12px;background:var(--cream-d)}
.dy-skel i:first-child{width:42px;height:42px}
.dy-skel i:nth-child(2){flex:1;height:34px}
.dy-today-note{background:var(--cream-d);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--text-m);font-size:.88rem}
</style>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
<script src="/pwa.js" defer></script>
</head><body>
<nav class="nav"><div class="nav-inner">
  <a href="/welcome" class="nav-logo"><img src="/little-angels-logo.png" alt="Your Nursery"></a>
  <div class="nav-links">
    <a href="/welcome" class="nav-link">Home</a>
      <a href="/welcome/home-activities" class="nav-link">Home Activities</a>
    <a href="/welcome/baby-log" class="nav-link">Baby Log</a>
    <a href="/welcome/diary" class="nav-link active">Diary</a>
    <a href="/welcome/learning-journey" class="nav-link">Learning Journey</a>
  </div>
</div></nav>
<div class="hero"><h1>Daily Diary</h1><p>Feeds, naps and nappies — at nursery and at home, in one timeline.</p></div>

<!-- b339 (2026-09-18) — icon-led, like EYParent: one glyph per kind of entry, the
     time on the right, the detail underneath, a sticky header per day. Which child
     comes from the top bar (LapShell), not from a row of pills in the page, so the
     choice follows a parent from the Diary to the Learning Journey. The API is
     unchanged: /welcome/diary/api/days already shows today's shared entries live. -->
<div class="dy" id="dy">
  <div id="feed"><div class="dy-skel"><i></i><i></i></div><div class="dy-skel"><i></i><i></i></div><div class="dy-skel"><i></i><i></i></div></div>
</div>

<script src="/js/wren-parent-empty.js"></script>
<script>
(function () {
  'use strict';
  var DATA = null, cur = null, lastSig = '';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ico(d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; }
  // The glyphs. The data model has five kinds of entry (sleep, nappy, food, drink, note —
  // a CHECK constraint on diary_entries), so those are the five that exist here; a nappy
  // can be a toilet visit and a drink can be a bottle or a cup.
  var G = {
    bottle: ico('<path d="M12 2.6c-1 0-1.6.8-1.6 1.8v1.2h3.2V4.4c0-1-.6-1.8-1.6-1.8z"/><path d="M8.6 5.6h6.8v2H8.6z"/><path d="M9 7.6h6v11.6a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/><path d="M9 11.2h2.4M9 14.2h2.4M9 17.2h2.4"/>'),
    cup:    ico('<path d="M6.5 4.5h11l-1.3 14.2a1.8 1.8 0 0 1-1.8 1.6H9.6a1.8 1.8 0 0 1-1.8-1.6z"/><path d="M7.3 10h9.4"/>'),
    meal:   ico('<path d="M6.5 3.5v6a2 2 0 0 0 4 0v-6M8.5 3.5v17"/><path d="M17 20.5v-17c-2.2 1.2-3.2 3.6-3.2 6.2 0 1.7 1.2 2.7 3.2 2.7"/>'),
    nappy:  ico('<path d="M3.5 5.5h17v3.6c0 5.4-3.8 9.4-8.5 9.4S3.5 14.5 3.5 9.1z"/><path d="M3.5 9.4c2.8 0 4.3 1.4 5.2 3.3M20.5 9.4c-2.8 0-4.3 1.4-5.2 3.3"/><path d="M9 5.5v3.2h6V5.5"/>'),
    toilet: ico('<path d="M7 3.8h10v5.2H7z"/><path d="M5.5 9h13c0 4.4-2.6 7.4-6.5 7.4S5.5 13.4 5.5 9z"/><path d="M9.5 16.6v3.9h5v-3.9"/>'),
    moon:   ico('<path d="M19.6 14.4A7.7 7.7 0 0 1 9.6 4.4a7.7 7.7 0 1 0 10 10z"/><path d="M17 3.5v3M15.5 5h3"/>'),
    note:   ico('<path d="M5 19l1-4 9.5-9.5a1.9 1.9 0 0 1 2.7 2.7L8.7 17.7z"/><path d="M13.7 7.3l3 3"/>'),
    dot:    ico('<circle cx="12" cy="12" r="3"/>')
  };

  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dayLabel(key) {
    var now = new Date(), y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    var d = new Date(key + 'T00:00:00');
    var full = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    if (key === ymd(now)) return 'Today <em>' + full + '</em>';
    if (key === ymd(y)) return 'Yesterday <em>' + full + '</em>';
    return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  function mins(n) {
    n = Math.round(Number(n) || 0); if (!n) return '';
    var h = Math.floor(n / 60), m = n % 60;
    return (h ? h + ' h ' : '') + (m ? m + ' min' : '') ;
  }
  var AMOUNT = { all: 'Ate everything', most: 'Ate most', some: 'Ate some', refused: 'Didn’t eat' };
  var QUALITY = { sound: 'Slept soundly', restless: 'Restless', woke: 'Woke early' };
  var NAPPY = { clean: 'Clean', wet: 'Wet', soiled: 'Soiled', toilet: 'Used the toilet' };

  // entry -> { cls, glyph, title, detail }
  function describe(e) {
    var t = String(e.entry_type || ''), notes = e.notes ? esc(e.notes) : '';
    function join(a) { return a.filter(Boolean).join(' · '); }
    if (t === 'sleep')  return { cls: 'sleep', g: G.moon, title: 'Sleep', detail: join([mins(e.duration_minutes), QUALITY[e.sleep_quality] || '', notes]) };
    if (t === 'nappy')  return { cls: 'nappy', g: e.nappy_state === 'toilet' ? G.toilet : G.nappy, title: e.nappy_state === 'toilet' ? 'Toilet' : 'Nappy',
                                 detail: join([e.nappy_state === 'toilet' ? '' : (NAPPY[e.nappy_state] || ''), notes]) };
    if (t === 'food')   return { cls: 'food', g: G.meal, title: 'Meal', detail: join([AMOUNT[e.food_amount] || '', notes]) };
    if (t === 'drink') {
      var cup = e.drink_type === 'water' || e.drink_type === 'other';
      var vol = e.drink_ml ? e.drink_ml + ' ml' : '';
      var kind = { formula: 'formula', EBM: 'expressed milk', cow: 'cow’s milk', water: 'water', other: '' }[e.drink_type] || '';
      return { cls: 'drink', g: cup ? G.cup : G.bottle, title: cup ? 'Drink' : 'Bottle', detail: join([vol, kind, notes]) };
    }
    if (t === 'note')   return { cls: 'note', g: G.note, title: 'Note', detail: notes };
    return { cls: 'note', g: G.dot, title: t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Entry', detail: notes };
  }

  function kidName(id) {
    var k = (DATA.children || []).filter(function (c) { return c.id === id; })[0];
    return k ? k.first_name : '';
  }
  function render() {
    var feed = document.getElementById('feed');
    var many = (DATA.children || []).length > 1;
    var ents = (DATA.entries || []).filter(function (e) { return cur === null || e.child_id === cur; });
    // b405 (2026-10-06): today's staff-written entries only reach `entries` once this
    // child is signed out or closing_time has passed (server-side gate) — so this page
    // must say so explicitly rather than silently looking like nobody logged anything.
    var relevant = (cur !== null ? (DATA.children || []).filter(function (c) { return c.id === cur; }) : (DATA.children || []));
    var notRevealed = relevant.filter(function (c) { return !c.today_revealed; });
    var banner = '';
    if (notRevealed.length) {
      var names = notRevealed.map(function (c) { return c.first_name; }).join(' and ');
      banner = '<div class="dy-today-note">Today’s diary will appear when ' + esc(names) +
        (notRevealed.length > 1 ? ' go' : ' goes') + ' home.</div>';
    }
    if (!ents.length) {
      if (notRevealed.length) { feed.innerHTML = banner; return; }
      var who = cur !== null ? kidName(cur) : '';
      WrenParentEmpty.render(feed, 'diary', {
        title: who ? 'Nothing in ' + who + '’s diary yet' : undefined,
        action: { label: 'Log something from home', href: '/welcome/baby-log' }
      });
      return;
    }
    var by = {};
    ents.forEach(function (e) { var k = ymd(new Date(e.occurred_at)); (by[k] = by[k] || []).push(e); });
    feed.innerHTML = banner + Object.keys(by).sort().reverse().map(function (k) {
      return '<div class="dy-day">' + dayLabel(k) + '</div>' + by[k].map(function (e) {
        var d = describe(e);
        var tm = e.occurred_at ? new Date(e.occurred_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
        var tags = (many && cur === null && kidName(e.child_id) ? '<span class="dy-tag">' + esc(kidName(e.child_id)) + '</span>' : '') +
                   (e.source === 'parent' ? '<span class="dy-tag you">You</span>' : '');
        return '<div class="dy-row"><span class="dy-ic dy-' + d.cls + '">' + d.g + '</span>' +
          '<div class="dy-main"><div class="dy-t">' + d.title + tags + '</div>' + (d.detail ? '<div class="dy-d">' + d.detail + '</div>' : '') + '</div>' +
          '<span class="dy-time">' + tm + '</span></div>';
      }).join('');
    }).join('');
  }

  function load(quiet) {
    return fetch('/welcome/diary/api/days', { credentials: 'include' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        var sig = JSON.stringify(d);
        if (quiet && sig === lastSig) return;          // a live refresh that changed nothing repaints nothing
        lastSig = sig; DATA = d;
        if (!d.children || !d.children.length) { WrenParentEmpty.render(document.getElementById('feed'), 'nochild'); return; }
        if (window.LapShell) { LapShell.setKids(d.children); cur = LapShell.child(); }
        render();
      })
      .catch(function () {
        if (quiet) return;
        WrenParentEmpty.render(document.getElementById('feed'), navigator.onLine === false ? 'offline' : 'error',
          { action: { label: 'Try again', onClick: function () { load(false); } } });
      });
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.LapShell) {
      cur = LapShell.child();
      LapShell.onChild(function (id) { cur = id; if (DATA) render(); });
    }
    load(false);
    // b405: today's entries appear once this child is signed out (or at closing time) —
    // this poll just catches that reveal, and any later edits, while the page is open.
    setInterval(function () { if (document.visibilityState === 'visible') load(true); }, 60000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(true); });
  });
})();
</script>
<script src="/js/wren-lightbox.js" defer></script>
</body></html>
