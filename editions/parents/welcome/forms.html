<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Forms — Your Nursery</title>
<meta name="lap-title" content="Forms">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d5a4a;--green-d:#1e3d31;--green-l:#3d7a64;
  --orange:#f0a050;--orange-d:#d8823a;
  --cream:#fefcf8;--cream-d:#f5f0e8;
  --text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0;
}
body{font-family:'Nunito',system-ui,-apple-system,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
a{color:var(--lap-ink,var(--green));text-decoration:none}

/* b343 (2026-09-21) — paperwork a parent signs in the app. What is waiting comes from the server
   (src/lib/parent-forms.js); opening one shows exactly what will be stored beside the signature. It never blocks anything. */
.fm{max-width:700px;margin:0 auto;padding:14px 16px 28px}
.fm-lead{font-size:.92rem;line-height:1.5;color:var(--text);margin:2px 2px 14px}
.fm-h{font-size:1.05rem;line-height:1.3;color:var(--text);margin:18px 2px 8px;font-weight:800;display:flex;align-items:center;gap:8px}
.fm-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--orange);color:var(--lap-on-orange,#3a2a12);font-size:.8rem;font-weight:800}
.fm-list{list-style:none;display:grid;gap:10px}
.fm-item{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;text-align:left;background:var(--surface,#fff);border:1px solid var(--border);border-left:5px solid var(--orange);border-radius:14px;color:var(--text);font:inherit;cursor:pointer;text-decoration:none}
.fm-item:hover,.fm-item:active{border-color:var(--green);border-left-color:var(--orange)}
.fm-item:focus-visible,.fm-btn:focus-visible,.fm-tick input:focus-visible,.fm-name input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.fm-item .fm-ic{flex:0 0 auto;color:var(--lap-ink,var(--green))}
.fm-item .fm-main{flex:1 1 auto;min-width:0}
.fm-kind{font-size:.74rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-m)}
.fm-title{font-size:.98rem;font-weight:800;line-height:1.3;color:var(--text);overflow-wrap:anywhere}
.fm-sub{font-size:.84rem;color:var(--text-m);line-height:1.4}
.fm-go{flex:0 0 auto;color:var(--text-m)}
.fm-done{border-left-color:var(--lap-ink,var(--green));cursor:default;min-height:0}
.fm-done .fm-title{font-weight:700}
.fm-card{background:var(--surface,#fff);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.fm-card h2{font-size:1.15rem;line-height:1.3;color:var(--text);margin:0 0 2px;font-weight:800;overflow-wrap:anywhere}
.fm-when{font-size:.86rem;color:var(--text-m);margin-bottom:6px}
.fm-facts{margin-top:10px;display:grid;gap:0}
.fm-facts dt{font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text-m);margin-top:10px}
.fm-facts dd{font-size:1rem;font-weight:700;color:var(--text);overflow-wrap:anywhere}
.fm-sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.fm-sec h3{font-size:.95rem;font-weight:800;color:var(--text);margin-bottom:4px}
.fm-sec p{font-size:.93rem;line-height:1.6;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.fm-sign{border:1.5px solid var(--border);border-radius:12px;padding:6px 14px 14px;margin-top:16px;background:var(--cream)}
.fm-tick{display:flex;gap:12px;align-items:flex-start;margin-top:12px;min-height:48px;cursor:pointer}
.fm-tick input{flex:0 0 auto;width:24px;height:24px;margin-top:2px;accent-color:var(--green)}
.fm-tick span{font-size:.95rem;font-weight:700;color:var(--text);line-height:1.45}
.fm-name{margin-top:12px}
.fm-name label{display:block;font-size:.86rem;font-weight:800;color:var(--text);margin-bottom:5px}
.fm-name input{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface,#fff);color:var(--text);font:600 1rem Nunito,system-ui,sans-serif}
.fm-hint{font-size:.82rem;color:var(--text-m);margin-top:6px;line-height:1.45}
.fm-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:14px;padding:0 16px;border:1.5px solid var(--green);border-radius:12px;background:var(--green);color:#fff;font:800 .95rem Nunito,system-ui,sans-serif;cursor:pointer}
.fm-btn.quiet{background:var(--cream);color:var(--lap-ink,var(--green));border-color:var(--border)}
.fm-btn:disabled{opacity:.55;cursor:default}
.fm-err{font-size:.86rem;color:var(--text);background:var(--lap-tint-orange,#fdf5e8);border-left:3px solid var(--orange);border-radius:8px;padding:9px 11px;margin-top:10px;line-height:1.5}
.fm-ok{display:flex;gap:10px;align-items:center;color:var(--lap-ink,var(--green))}
.fm-ok h2{color:var(--text)}
.fm-note{font-size:.82rem;line-height:1.5;color:var(--text-m);margin-top:12px}
.fm-skel{height:84px;margin-top:10px;border-radius:14px;background:linear-gradient(90deg,var(--cream-d) 0%,var(--surface,#fff) 50%,var(--cream-d) 100%);background-size:200% 100%;animation:fmsk 1.2s ease-in-out infinite}
@keyframes fmsk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.fm-skel{animation:none}}
</style>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
<script src="/pwa.js" defer></script>
</head>
<body>

<main class="fm" id="fm">
  <div id="fm-body"><div class="fm-skel" aria-hidden="true"></div><div class="fm-skel" aria-hidden="true"></div></div>
</main>

<script src="/js/wren-parent-empty.js"></script>
<script>
(function () {
  'use strict';
  var API = '/welcome/forms/api';
  var body = document.getElementById('fm-body');
  var STATE = null, BUSY = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function j(url, opts) {
    return fetch(url, Object.assign({ credentials: 'same-origin' }, opts || {})).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) { b._status = r.status; b._ok = r.ok; return b; });
    });
  }
  function ic(p) { return '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'; }
  var ICON = {
    medicine: ic('<rect x="4.5" y="9" width="15" height="6.5" rx="3.25" transform="rotate(-35 12 12.25)"/><path d="m9.6 9.6 4.8 4.8"/>'),
    accident: ic('<path d="M12 3.5 3.5 19h17z"/><path d="M12 10v4"/><path d="M12 16.5h.01"/>'),
    summative_report: ic('<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4"/><path d="M9.5 12h6M9.5 15.5h6"/>'),
    two_year_check: ic('<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4"/><path d="m9.5 14 2 2 3.5-4"/>'),
    funding_declaration: ic('<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4"/><path d="M9.5 16.5c1.5-2 2.5-2 3-1s1.4 1 2.5-.5"/>')
  };
  var CHEV = '<svg class="fm-go" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  var TICK = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>';
  function when(iso) { try { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Europe/London' }); } catch (e) { return ''; } }
  function multiChild() { return STATE && (function (a) { var s = {}; a.forEach(function (x) { s[x.child_name] = 1; }); return Object.keys(s).length > 1; })(STATE.waiting.concat(STATE.declarations)); }

  // ── the list ───────────────────────────────────────────────────────────────────────�
  function load(msg) {
    body.innerHTML = '<div class="fm-skel" aria-hidden="true"></div><div class="fm-skel" aria-hidden="true"></div>';
    j(API + '/state').then(function (s) {
      if (!s._ok) throw new Error('HTTP ' + s._status);
      STATE = s; drawList(msg);
    }).catch(function () {
      WrenParentEmpty.render(body, navigator.onLine === false ? 'offline' : 'error', { action: { label: 'Try again', onClick: function () { load(); } } });
    });
  }

  function item(f, isDecl) {
    var kids = multiChild() ? ' · ' + esc(f.child_name) : '';
    var inner = '<span class="fm-ic">' + (ICON[f.kind] || ICON.summative_report) + '</span>' +
      '<span class="fm-main"><span class="fm-kind">' + esc(f.kind_label) + kids + '</span><br><span class="fm-title">' + esc(f.title) + '</span>' +
      (f.subtitle ? '<br><span class="fm-sub">' + esc(f.subtitle) + '</span>' : '') + '</span>' + CHEV;
    return isDecl
      ? '<li><a class="fm-item" href="' + esc(f.href) + '">' + inner + '</a></li>'
      : '<li><button class="fm-item" type="button" data-open="' + f.id + '">' + inner + '</button></li>';
  }

  function drawList(msg) {
    var s = STATE, n = s.count;
    var h = '<p class="fm-lead">Paperwork for you to read and sign. Nothing else in the app waits on it — it is here whenever you have a minute.</p>';
    if (msg) h += '<div class="fm-card fm-ok">' + TICK + '<div><strong>' + esc(msg) + '</strong></div></div>';
    if (n) {
      h += '<h2 class="fm-h">Waiting for you <span class="fm-count" aria-label="' + n + ' waiting">' + n + '</span></h2><ul class="fm-list">' +
        s.declarations.map(function (d) { return item(d, true); }).join('') + s.waiting.map(function (f) { return item(f, false); }).join('') + '</ul>';
    } else {
      h += '<div id="fm-empty"></div>';
    }
    if (s.signed.length) {
      h += '<h2 class="fm-h">Signed recently</h2><ul class="fm-list">' + s.signed.map(function (x) {
        return '<li><div class="fm-item fm-done"><span class="fm-ic">' + ICON[x.kind] + '</span><span class="fm-main"><span class="fm-kind">' + esc(x.kind_label) +
          '</span><br><span class="fm-title">' + esc(x.title || x.kind_label) + '</span><br><span class="fm-sub">Signed by ' + (x.by_you ? 'you' : esc(x.typed_name)) + ' on ' + esc(when(x.signed_at)) + '</span></span></div></li>';
      }).join('') + '</ul>';
    }
    body.innerHTML = h;
    var em = document.getElementById('fm-empty');
    if (em) WrenParentEmpty.render(em, 'generic', { compact: true, title: 'Nothing is waiting for you', text: 'When the nursery has a form for you to read and sign — a medicine form, an accident form, a report — it will appear here.' });
    Array.prototype.forEach.call(body.querySelectorAll('[data-open]'), function (b) {
      b.addEventListener('click', function () { openForm(parseInt(b.getAttribute('data-open'), 10)); });
    });
  }

  // ── one form ───────────────────────────────────────────────────────────────────────�
  function openForm(id) {
    body.innerHTML = '<div class="fm-skel" aria-hidden="true"></div>';
    window.scrollTo(0, 0);
    j(API + '/item/' + id).then(function (r) {
      if (!r._ok) {
        if (r.reason === 'already_signed') return load('That one has already been signed' + (r.signed ? ' by ' + r.signed.typed_name : '') + '.');
        if (r.reason === 'changed' || r.reason === 'gone') return load(r.error);
        return load(r.error || 'We could not open that form.');
      }
      drawForm(r.form);
    }).catch(function () { load('We could not reach Your Nursery — please try again.'); });
  }

  function drawForm(f) {
    var sh = f.shown || {};
    var facts = (sh.facts || []).map(function (x) { return '<dt>' + esc(x.label) + '</dt><dd>' + esc(x.value) + '</dd>'; }).join('');
    var secs = (sh.sections || []).map(function (x) {
      return '<div class="fm-sec">' + (x.heading ? '<h3>' + esc(x.heading) + '</h3>' : '') + '<p>' + esc(x.body) + '</p></div>';
    }).join('');
    var verb = f.mode === 'agree' ? 'Agree and sign' : 'Sign';
    var dupe = (sh.facts || []).some(function (x) { return x.value === sh.subtitle; });      // the subtitle is for the list; don't repeat it under the title
    body.innerHTML =
      '<button class="fm-btn quiet" type="button" id="fm-back" style="margin-top:0;margin-bottom:12px;width:auto;padding:0 16px">‹ All forms</button>' +
      '<section class="fm-card"><div class="fm-kind">' + esc(f.kind_label) + '</div><h2>' + esc(sh.title || f.kind_label) + '</h2>' +
      (sh.subtitle && !dupe ? '<div class="fm-when">' + esc(sh.subtitle) + '</div>' : '') +
      (facts ? '<dl class="fm-facts">' + facts + '</dl>' : '') + secs +
      '<div class="fm-sign">' +
        '<label class="fm-tick"><input type="checkbox" id="fm-agree"><span>' + esc(f.statement) + '</span></label>' +
        '<div class="fm-name"><label for="fm-nm">Type your full name to sign</label><input id="fm-nm" type="text" autocomplete="name" placeholder="Your full name" maxlength="120"></div>' +
        '<div id="fm-name-err"></div>' +
        '<button class="fm-btn" type="button" id="fm-go" disabled>' + verb + '</button>' +
        '<p class="fm-hint">We keep your name, the time, and exactly what is on this page, so there is a record of what you saw when you signed.</p>' +
      '</div><div id="fm-form-err"></div></section>' +
      '<p class="fm-note">Other children are never named on these forms. If something here looks wrong, message the office before you sign.</p>';
    var tick = document.getElementById('fm-agree'), nm = document.getElementById('fm-nm'), go = document.getElementById('fm-go');
    function words() { return nm.value.trim().split(/\s+/).filter(Boolean).length; }
    function ready() { go.disabled = BUSY || !(tick.checked && words() >= 2); }
    tick.addEventListener('change', ready); nm.addEventListener('input', ready);
    document.getElementById('fm-back').addEventListener('click', function () { load(); });
    go.addEventListener('click', function () {
      if (BUSY) return; BUSY = true; go.disabled = true; go.textContent = 'Saving…';
      document.getElementById('fm-name-err').innerHTML = ''; document.getElementById('fm-form-err').innerHTML = '';
      j(API + '/sign', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ request_id: f.id, typed_name: nm.value, agreed: tick.checked }) })
        .then(function (r) {
          BUSY = false;
          if (r._ok) return load('Thank you — signed. ' + (r.remaining ? r.remaining + ' more ' + (r.remaining === 1 ? 'is' : 'are') + ' waiting for you.' : 'Nothing else is waiting for you.'));
          if (r.reason === 'already_signed') return load('That one has already been signed' + (r.signed ? ' by ' + r.signed.typed_name : '') + '.');
          if (r.reason === 'changed' || r.reason === 'gone') return load(r.error);
          go.textContent = verb;
          document.getElementById(r.reason === 'name' ? 'fm-name-err' : 'fm-form-err').innerHTML = '<div class="fm-err">' + esc(r.error || 'That did not work — please try again.') + '</div>';
          ready();
        }).catch(function () {
          BUSY = false; go.textContent = verb;
          document.getElementById('fm-form-err').innerHTML = '<div class="fm-err">We could not reach Your Nursery — please check your connection and try again.</div>'; ready();
        });
    });
    window.scrollTo(0, 0);
  }

  load();
})();
</script>
</body>
</html>
