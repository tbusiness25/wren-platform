<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Nursery — Getting Started</title>
<meta name="lap-title" content="Getting started">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2d5a4a;--green-d:#1e3d31;--orange:#f0a050;--cream:#fefcf8;--cream-d:#f5f0e8;--text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0;--ok:#2d7a4a}
body{font-family:'Nunito',system-ui,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
h1,h2{font-family:'Crimson Pro',Georgia,serif}
a{color:var(--lap-ink,var(--green));text-decoration:none}
.nav{background:var(--green);position:sticky;top:0;z-index:100}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px}
.nav-logo img{height:40px}
.hero{background:var(--green);color:#fff;padding:36px 20px 24px;text-align:center}
.hero h1{font-size:2rem;margin-bottom:8px}
.hero p{opacity:.88;max-width:560px;margin:0 auto}
.container{max-width:700px;margin:0 auto;padding:24px 20px 40px}
.gs-progress{background:var(--surface,#fff);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.gs-progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.gs-progress-label{font-weight:800;color:var(--lap-ink,var(--green))}
.gs-progress-count{font-size:.86rem;color:var(--text-m)}
.gs-bar{height:10px;border-radius:6px;background:var(--cream-d);overflow:hidden}
.gs-bar-fill{height:100%;background:var(--ok);border-radius:6px;transition:width .3s}
.gs-child-name{font-size:1.1rem;color:var(--lap-ink,var(--green));margin:22px 2px 10px}
.gs-card{display:flex;align-items:center;gap:14px;background:var(--surface,#fff);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;min-height:60px;transition:.15s}
.gs-card:hover{border-color:var(--green)}
.gs-icon{flex:0 0 40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:var(--cream-d)}
.gs-card.done .gs-icon{background:color-mix(in srgb, var(--ok) 16%, transparent);color:var(--ok)}
.gs-text{flex:1;min-width:0}
.gs-title{font-weight:700;color:var(--text);font-size:.98rem}
.gs-sub{font-size:.8rem;color:var(--text-m);margin-top:1px}
.gs-chev{color:var(--text-m);font-size:1.3rem;opacity:.6}
.gs-done-tick{color:var(--ok);font-weight:800;font-size:1.1rem}
.gs-all-done{text-align:center;padding:40px 20px;color:var(--text-m)}
.gs-all-done .big{font-size:2.4rem;margin-bottom:10px}
.gs-skel{height:60px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--cream-d) 0%,var(--surface,#fff) 50%,var(--cream-d) 100%);background-size:200% 100%;animation:gssk 1.2s ease-in-out infinite}
@keyframes gssk{to{background-position:-200% 0}}
footer{background:var(--green-d);color:rgba(255,255,255,.7);text-align:center;padding:24px 20px;font-size:.82rem;margin-top:30px}
footer strong{color:#fff}
</style>
<script src="/pwa.js" defer></script>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a href="/welcome" class="nav-logo"><img src="/little-angels-logo.png" alt="Your Nursery"></a>
</div></nav>

<div class="hero">
  <h1>Getting started 🌱</h1>
  <p>A few short steps before your child's first day. Each one takes you straight to where you finish it — and ticks itself off here.</p>
</div>

<div class="container">
  <div id="content"><div class="gs-skel"></div><div class="gs-skel"></div><div class="gs-skel"></div></div>
</div>

<footer>
  <strong>Your Nursery</strong> · 123 Example Lane, Your Town, AB1 2CD<br>
  Nursery: 020 7946 0000 · info@example-nursery.co.uk
</footer>

<script src="/js/wren-parent-empty.js"></script>
<script>
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICONS = {
  app_signup: '📱', family_details: '📋', redbook: '📕', about_me: '💬',
  policies: '📄', consents: '✅', funding: '💰', allergy_plan: '🥜', payment: '🏦',
};

function render(data){
  const el = document.getElementById('content');
  const kids = (data && data.children) || [];
  if (!kids.length) {
    el.innerHTML = window.WrenParentEmpty
      ? window.WrenParentEmpty.render({ title: 'Nothing to do yet', body: 'Check back once your child has a place with us.' })
      : '<p>Nothing to do yet.</p>';
    return;
  }
  let totalDone = 0, totalCount = 0;
  kids.forEach(k => { totalDone += k.progress.done; totalCount += k.progress.total; });

  let html = '';
  if (totalCount > 0) {
    const pct = Math.round(100 * totalDone / totalCount);
    if (totalDone >= totalCount) {
      html += '<div class="gs-all-done"><div class="big">🎉</div><div style="font-weight:700;color:var(--lap-ink,var(--green));margin-bottom:4px">All done!</div>'
        + '<div>Thank you — everything is ready for the first day.</div></div>';
    } else {
      html += '<div class="gs-progress"><div class="gs-progress-top"><span class="gs-progress-label">Getting started</span>'
        + '<span class="gs-progress-count">' + totalDone + ' of ' + totalCount + ' done</span></div>'
        + '<div class="gs-bar"><div class="gs-bar-fill" style="width:' + pct + '%"></div></div></div>';
    }
  }

  kids.forEach(k => {
    const applicable = k.items.filter(it => it.applicable);
    if (!applicable.length) return;
    if (kids.length > 1) html += '<div class="gs-child-name">' + esc(k.first_name) + '</div>';
    applicable.forEach(it => {
      const href = it.path || '/welcome';
      html += '<a class="gs-card' + (it.done ? ' done' : '') + '" href="' + esc(href) + '">'
        + '<span class="gs-icon">' + (ICONS[it.key] || '•') + '</span>'
        + '<span class="gs-text"><span class="gs-title">' + esc(it.label) + '</span></span>'
        + (it.done ? '<span class="gs-done-tick">✓</span>' : '<span class="gs-chev">›</span>')
        + '</a>';
    });
  });
  el.innerHTML = html;
}

fetch('/welcome/getting-started/api/state', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : { children: [] })
  .then(render)
  .catch(() => { document.getElementById('content').innerHTML = '<p style="color:var(--text-m)">Could not load your checklist — please try again shortly.</p>'; });
</script>
</body>
</html>
