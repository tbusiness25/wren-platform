<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Nursery — Your Child's Learning Journey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2d5a4a;--orange:#f0a050;--cream:#fefcf8;--cream-d:#f5f0e8;--text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0}
/* b405 (2026-10-06): the liked-heart state was two hardcoded light-theme literals; now a themed pair (light ~2.4:1 -> meets WCAG AA in both themes),
   the same fix pattern as study-module.html's --sm-bad/--sm-bad-bd. */
/* colour-ok-begin: themed pair for the liked heart, with its dark-mode override */
:root{--lj-liked:#c0392b;--lj-liked-bd:#f2b8c0}
html.lap-dark{--lj-liked:#fca5a5;--lj-liked-bd:#f87171}
/* colour-ok-end */
body{font-family:'Nunito',system-ui,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6;min-height:100vh}
h1,h2,h3{font-family:'Crimson Pro',Georgia,serif}
a{color:var(--lap-ink,var(--green));text-decoration:none}
.nav{background:var(--green);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px}
.nav-logo img{height:40px;display:block}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-link{color:rgba(255,255,255,.8);font-size:.9rem;font-weight:600;padding:6px 12px;border-radius:6px}
.nav-link:hover{background:rgba(255,255,255,.1);color:#fff}.nav-link.active{color:#fff;border-bottom:2px solid var(--orange);border-radius:0;padding-bottom:4px}
.hero{background:var(--green);color:#fff;padding:46px 20px 32px;text-align:center}.hero h1{font-size:2.1rem;margin-bottom:10px}.hero p{opacity:.88;max-width:560px;margin:0 auto}
.container{max-width:820px;margin:0 auto;padding:30px 20px}
.jr-skel{height:150px;margin-bottom:16px;border-radius:14px;background:linear-gradient(90deg,var(--cream-d) 0%,var(--surface,#fff) 50%,var(--cream-d) 100%);background-size:200% 100%;animation:jrsk 1.2s ease-in-out infinite}
@keyframes jrsk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.jr-skel{animation:none}}
.obs{background:var(--surface, #fff);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.obs h3{color:var(--lap-ink,var(--green));font-size:1.2rem;margin-bottom:4px}
.obs .meta{font-size:.8rem;color:var(--text-m);margin-bottom:10px}
.obs .areas{margin-top:10px}.area{display:inline-block;background:var(--cream-d);border-radius:20px;padding:2px 11px;font-size:.76rem;font-weight:700;color:var(--lap-ink,var(--green));margin:2px}
.obs .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.obs .photos img{width:120px;height:120px;object-fit:cover;border-radius:10px;cursor:pointer;transition:transform .12s}.obs .photos img:hover{transform:scale(1.03)}
#lb{position:fixed;inset:0;background:rgba(10,15,25,.92);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
#lb.open{display:flex}
#lb img,#lb video{max-width:96vw;max-height:90vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#lb .lb-close{position:absolute;top:14px;right:18px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.6rem;cursor:pointer;line-height:1}
/* ── b265: download control + withheld-photo notice ───────────────────────── */
#lb .lb-dl{margin-top:14px;text-align:center}
#lb .lb-dl-btn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:10px;padding:11px 20px;font-size:.9rem;font-weight:600;cursor:pointer;min-height:44px}
#lb .lb-dl-btn:hover{background:rgba(255,255,255,.24)}
.withheld{margin-top:10px;font-size:.82rem;line-height:1.55;color:var(--text-m);background:var(--lap-tint-orange, #fdf6e8);
  border:1px solid var(--border);border-radius:9px;padding:9px 12px}
.media-note{margin:18px 0 4px;font-size:.8rem;line-height:1.6;color:var(--text-m);background:var(--lap-tint-neutral, #f7f4ee);
  border:1px solid var(--border);border-radius:10px;padding:12px 15px}
/* Home activities on the journey (item 6, 2026-07-29) */
.ha{background:var(--surface, #fff);border:1px solid var(--border);border-left:4px solid var(--orange);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ha .tag{display:inline-block;background:var(--lap-tint-orange, #fbe9d3);color:var(--orange);font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 10px;border-radius:20px;margin-bottom:8px}
.ha h3{color:var(--lap-ink,var(--green));font-size:1.15rem;margin-bottom:4px}
.ha .meta{font-size:.8rem;color:var(--text-m);margin-bottom:8px}
.ha .atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.att-chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:var(--cream-d);color:var(--lap-ink,var(--green));min-height:38px}
.empty{text-align:center;color:var(--text-m);padding:50px 20px}.empty .big{font-size:2.4rem;margin-bottom:10px}
/* Likes + comments (2026-07-27) */
.eng{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--cream-d)}
.eng button{border:1px solid var(--border);background:var(--surface, #fff);border-radius:20px;padding:6px 14px;font-family:inherit;font-size:.86rem;font-weight:700;color:var(--text-m);cursor:pointer;min-height:38px}
.eng button.liked{background:var(--lap-tint-red, #fdeef0);border-color:var(--lj-liked-bd);color:var(--lj-liked)}
.cmts{margin-top:10px;display:none}.cmts.open{display:block}
.cmt{background:var(--cream-d);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:.9rem}
.cmt .who{font-weight:700;font-size:.78rem;color:var(--lap-ink,var(--green))}.cmt .when{font-size:.72rem;color:var(--text-m);margin-left:6px}
.cmt.staff{background:var(--lap-tint-green, #eaf3ee)}
.cmt-form{display:flex;gap:8px;margin-top:8px}
.cmt-form input{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:16px}
.cmt-form button{background:var(--green);color:#fff;border:0;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer}
</style><script src="/pwa.js" defer></script>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
</head><body>
<nav class="nav"><div class="nav-inner">
  <a href="/welcome" class="nav-logo"><img src="/little-angels-logo.png" alt="Your Nursery"></a>
  <div class="nav-links">
    <a href="/welcome" class="nav-link">Home</a>
      <a href="/welcome/home-activities" class="nav-link">Home Activities</a>
    <a href="/welcome/learning-journey" class="nav-link active">Learning Journey</a>
      <a href="/welcome/baby-log" class="nav-link">Baby Log</a>
    <a href="/welcome/diary" class="nav-link">Diary</a>
    <a href="/welcome/planning" class="nav-link">Planning</a>
    <a href="/welcome/records" class="nav-link">Records</a>
    <a href="/welcome/menu" class="nav-link">Menu</a>
  </div>
</div></nav>
<div class="hero"><h1>Your Child's Learning Journey</h1><p>Observations and special moments your child's key person has shared with you.</p></div>
<!-- b339 (2026-09-18): which child comes from the top bar (LapShell), the same choice the
     Diary uses, so it follows a parent between the two. The row of pills that lived here is gone. -->
<div class="container">
  <div id="feed"><div class="jr-skel"></div><div class="jr-skel"></div></div>
</div>
<div id="lb"><button class="lb-close" aria-label="Close">×</button><div id="lb-media"></div></div>
<script src="/js/wren-parent-empty.js"></script>
<script>
var DATA=null, current=null, TOKEN='';
// Tap-to-preview lightbox for photos & videos (parent feedback 2026-07-30).
(function(){
  function isVideo(u){ return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u||''); }
  function openLb(url){
    var lb=document.getElementById('lb'), m=document.getElementById('lb-media');
    m.innerHTML = isVideo(url) ? '<video src="'+url+'" controls autoplay playsinline></video>' : '<img src="'+url+'" alt="">';
    // b265 — the download button exists only if the nursery has switched
    // downloading on (off by default, matching Famly and Tapestry). The server
    // refuses ?download=1 while it is off regardless, so this is the button
    // agreeing with the gate rather than being the gate.
    var pol = (DATA && DATA.media_policy) || {};
    if (pol.download_enabled && !isVideo(url)) {
      var wrap = document.createElement('div');
      wrap.className = 'lb-dl';
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'lb-dl-btn'; btn.textContent = '⬇ Download this photo';
      btn.addEventListener('click', function () {
        // The warning names the other-children issue in the same terms the
        // registration form uses, at the moment it actually matters.
        if (!window.confirm(pol.download_warning || 'This photo may show other children. Please ask their family before sharing it.')) return;
        var a = document.createElement('a');
        a.href = url + (url.indexOf('?') === -1 ? '?' : '&') + 'download=1';
        a.rel = 'noopener'; a.target = '_blank';
        document.body.appendChild(a); a.click(); a.remove();
      });
      wrap.appendChild(btn);
      m.appendChild(wrap);
    }
    lb.classList.add('open'); document.body.style.overflow='hidden';
  }
  function closeLb(){ var lb=document.getElementById('lb'); lb.classList.remove('open'); document.getElementById('lb-media').innerHTML=''; document.body.style.overflow=''; }
  document.addEventListener('click', function(e){
    var img=e.target.closest && e.target.closest('.lb-media');
    if(img){ e.preventDefault(); openLb(img.getAttribute('data-full')||img.src); return; }
    if(e.target.id==='lb' || (e.target.className&&String(e.target.className).indexOf('lb-close')>=0)) closeLb();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeLb(); });
})();
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(d){try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
// /api/observations/photo/... is an authed route — a plain <img src> can't carry an
// Authorization header, so photos here always 404/401'd (bughunt 2026-07-21; this page
// was missed by the first fix pass since it has no JWT at all, only the CF header). Mint
// one via cf-auto-login (same CF session, credentials:'include') and append it as a
// query param, matching the ?token= fallback the backend already accepts.
// b491 review: photo URLs now arrive signed by the server (short-lived MEDIA_URL_KEY token); a session JWT in ?token= is refused.
function attUrl(p){ return p ? p + (/[?&]token=/.test(p) ? '' : (p.indexOf('?')===-1?'?':'&') + 'token=' + encodeURIComponent(TOKEN||'')) + (function(){try{var _d=localStorage.getItem('wrenDevice')||'';return _d?('&dev='+encodeURIComponent(_d)):'';}catch(e){return '';}})() : p; }
// item 6 (2026-07-29) — the journey now interleaves shared observations with "home
// activities" (curriculum items staff sent home, with any attached resource docs),
// newest first. Observation cards are unchanged (still carry likes/comments); home
// activity cards are read-only with tappable attachment chips.
function obsCard(o){
  var areas=(o.eyfs_areas||[]);if(typeof areas==='string'){try{areas=JSON.parse(areas);}catch(e){areas=[areas];}}
  var ph=(o.photo_urls||[]);if(typeof ph==='string'){try{ph=JSON.parse(ph);}catch(e){ph=[];}}
  return '<div class="obs"><h3>'+esc(o.title||'Observation')+'</h3>'+
    '<div class="meta">'+whoTag(o.child_id)+fmt(o.created_at)+(o.staff?(' · by '+esc(o.staff)):'')+'</div>'+
    '<div>'+esc(o.observation_text||'').replace(/\n/g,'<br>')+'</div>'+
    (areas.length?'<div class="areas">'+areas.map(function(a){return '<span class="area">'+esc(a)+'</span>';}).join('')+'</div>':'')+
    (ph.length?'<div class="photos">'+ph.map(function(u){var uu=esc(attUrl(u));return '<img src="'+uu+'" alt="" loading="lazy" class="lb-media" data-full="'+uu+'">';}).join('')+'</div>':'')+
    // b265 — a picture removed because another family withdrew it is explained,
    // not silently absent. A blank space reads as a bug; this reads as a choice.
    (o.photos_withheld?'<div class="withheld">'+esc(((DATA&&DATA.media_policy&&DATA.media_policy.withheld_notice)||'A photo from this activity is not shown here.'))+'</div>':'')+
    engRow(o.id)+
    '</div>';
}
var HA_LABEL={next_step:'Next step to try at home',phonics:'Phonics',story_session:'Story',activity:'Home activity',play_plan:'Play Plan',other:'For home'};
function haCard(h){
  var atts=Array.isArray(h.attachments)?h.attachments:[];
  return '<div class="ha"><span class="tag">🏠 '+esc(HA_LABEL[h.item_type]||'Home activity')+'</span>'+
    '<h3>'+esc(h.title||'Home activity')+'</h3>'+
    '<div class="meta">'+whoTag(h.child_id)+fmt(h.shared_at)+(h.staff?(' · shared by '+esc(h.staff)):'')+'</div>'+
    (h.description?'<div>'+esc(h.description).replace(/\n/g,'<br>')+'</div>':'')+
    (atts.length?'<div class="atts">'+atts.map(function(a){return '<a class="att-chip" href="'+esc(a.url)+'" target="_blank" rel="noopener">📎 '+esc(a.name||a.url)+'</a>';}).join('')+'</div>':'')+
    '</div>';
}
function render(){
  var feed=document.getElementById('feed');
  function mine(x){return current===null||x.child_id===current;}
  var rows=[];
  (DATA.observations||[]).filter(mine).forEach(function(o){rows.push({at:o.created_at,html:obsCard(o)});});
  (DATA.home_activities||[]).filter(mine).forEach(function(h){rows.push({at:h.shared_at,html:haCard(h)});});
  rows.sort(function(a,b){return new Date(b.at).getTime()-new Date(a.at).getTime();});
  if(!rows.length){
    var who=current!==null?kidName(current):'';
    WrenParentEmpty.render(feed,'journey',{title:who?'No moments shared for '+who+' yet':undefined});
    return;
  }
  feed.innerHTML=rows.map(function(r){return r.html;}).join('');
  wireEng();
}
/* ── Likes + comments (2026-07-27) ── */
var ENG={};
function engRow(id){
  var e=ENG[id]||{likes:0,liked_by_me:false,comments:0};
  return '<div class="eng" data-obs="'+id+'">'+
    '<button type="button" class="like-btn'+(e.liked_by_me?' liked':'')+'" aria-pressed="'+(e.liked_by_me?'true':'false')+'">'+(e.liked_by_me?'❤️':'🤍')+' '+(e.likes||'')+'</button>'+
    '<button type="button" class="cmt-btn">💬 '+(e.comments?e.comments+' ':'')+'Comment</button>'+
    '</div><div class="cmts" id="cmts-'+id+'"></div>';
}
function wireEng(){
  document.querySelectorAll('.eng .like-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var id=this.closest('.eng').dataset.obs, btn=this;
      fetch('/welcome/learning-journey/api/observations/'+id+'/like',{method:'POST',credentials:'include'})
        .then(function(r){return r.json();}).then(function(d){
          if(!d||!d.ok)return;
          ENG[id]=ENG[id]||{};ENG[id].likes=d.likes;ENG[id].liked_by_me=d.liked;
          btn.classList.toggle('liked',d.liked);
          btn.setAttribute('aria-pressed',d.liked?'true':'false');
          btn.innerHTML=(d.liked?'❤️':'🤍')+' '+(d.likes||'');
        }).catch(function(){});
    });
  });
  document.querySelectorAll('.eng .cmt-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var id=this.closest('.eng').dataset.obs, box=document.getElementById('cmts-'+id);
      if(box.classList.contains('open')){box.classList.remove('open');return;}
      box.classList.add('open');loadCmts(id);
    });
  });
}
function loadCmts(id){
  var box=document.getElementById('cmts-'+id);
  box.innerHTML='<div class="cmt">Loading…</div>';
  fetch('/welcome/learning-journey/api/observations/'+id+'/comments',{credentials:'include'})
    .then(function(r){return r.json();}).then(function(d){
      var list=(d&&d.comments)||[];
      box.innerHTML=list.map(function(c){
        return '<div class="cmt'+(c.author_type==='staff'?' staff':'')+'"><span class="who">'+esc(c.author_name||'Parent')+(c.author_type==='staff'?' (staff)':'')+'</span><span class="when">'+fmt(c.created_at)+'</span><br>'+esc(c.body)+'</div>';
      }).join('')+
      '<form class="cmt-form" data-obs="'+id+'"><input type="text" maxlength="2000" placeholder="Write a comment…" aria-label="Write a comment"><button type="submit">Send</button></form>';
      box.querySelector('.cmt-form').addEventListener('submit',function(ev){
        ev.preventDefault();
        var inp=this.querySelector('input'), body=inp.value.trim();
        if(!body)return;
        inp.disabled=true;
        fetch('/welcome/learning-journey/api/observations/'+id+'/comments',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:body})})
          .then(function(r){return r.json();}).then(function(){ENG[id]=ENG[id]||{};ENG[id].comments=(ENG[id].comments||0)+1;loadCmts(id);})
          .catch(function(){inp.disabled=false;});
      });
    }).catch(function(){box.innerHTML='<div class="cmt">Could not load comments.</div>';});
}
function loadEng(){
  var ids=(DATA.observations||[]).map(function(o){return o.id;});
  if(!ids.length)return;
  fetch('/welcome/learning-journey/api/engagement?ids='+ids.join(','),{credentials:'include'})
    .then(function(r){return r.json();}).then(function(d){
      ENG=(d&&d.engagement)||{};render();
    }).catch(function(){});
}
function kidName(id){var k=(DATA.children||[]).filter(function(c){return c.id===id;})[0];return k?k.first_name:'';}
// weeklybugs-20261104 (staff-app:52): with no child picked, mine() shows every one of
// the family's children in one feed (LapShell.child()===null is documented as "all of
// this family's children") — but no card said whose it was, so a sibling's observation
// (e.g. the preschool child's) looked like it had come from "a different setting" by
// mistake. Label a card with the child's name only when there IS more than one to
// confuse it with — a single-child family never sees this.
function whoTag(childId){
  if(current!==null||!DATA||!DATA.children||DATA.children.length<2)return'';
  var n=kidName(childId);
  return n?'<span class="area">'+esc(n)+'</span> ':'';
}
document.addEventListener('DOMContentLoaded',function(){
  if(window.LapShell){current=LapShell.child();LapShell.onChild(function(id){current=id;if(DATA)render();});}
});
function fail(){
  WrenParentEmpty.render(document.getElementById('feed'),navigator.onLine===false?'offline':'error',{action:{label:'Try again',onClick:function(){location.reload();}}});
}
fetch('/api/auth/cf-auto-login',{credentials:'include'}).then(function(r){return r.json();}).then(function(a){TOKEN=(a&&a.token)||'';}).catch(function(){}).then(function(){
  return fetch('/welcome/learning-journey/api/journey',{credentials:'include'});
}).then(function(r){return r.json();}).then(function(d){
  DATA=d;if(!d.children||!d.children.length){WrenParentEmpty.render(document.getElementById('feed'),'nochild');return;}
  if(window.LapShell){LapShell.setKids(d.children);current=LapShell.child();}
  render();loadEng();
}).catch(fail);
</script></body></html>
