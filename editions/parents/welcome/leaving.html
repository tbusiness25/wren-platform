<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leaving us — Your Nursery</title>
<meta name="lap-title" content="Leaving us">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d5a4a;--green-d:#1e3d31;--green-l:#3d7a64;
  --orange:#f0a050;--orange-d:#d8823a;
  --cream:#fefcf8;--cream-d:#f5f0e8;
  --text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0;
}
body{font-family:'Nunito',system-ui,-apple-system,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
a{color:var(--lap-ink,var(--green));text-decoration:none}

/* b341 (2026-09-21) — giving notice. The dates come from the server (src/lib/leaving-notice.js) and are shown BEFORE the
   tick and the typed name, so what a family agrees to is on the screen when they agree. */
.lv{max-width:700px;margin:0 auto;padding:14px 16px 28px}
.lv-lead{font-size:.92rem;line-height:1.5;color:var(--text);margin:2px 2px 14px}
.lv-card{background:var(--surface,#fff);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.lv-card h2{font-size:1.05rem;line-height:1.3;color:var(--text);margin:0 0 4px;font-weight:800}
.lv-card p{font-size:.9rem;line-height:1.5;color:var(--text-m);margin-top:6px}
.lv-card p.lv-strong{color:var(--text)}
.lv-kids{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.lv-kids button{min-height:48px;padding:0 18px;border:1.5px solid var(--border);border-radius:12px;background:var(--cream);color:var(--text);font:800 .92rem Nunito,system-ui,sans-serif;cursor:pointer}
.lv-kids button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.lv-f{margin-top:14px}
.lv-f label{display:block;font-size:.86rem;font-weight:800;color:var(--text);margin-bottom:5px}
.lv-f .lv-opt{font-weight:600;color:var(--text-m)}
.lv-f input[type=date],.lv-f input[type=text],.lv-f select,.lv-f textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--cream);color:var(--text);font:600 1rem Nunito,system-ui,sans-serif}
.lv-f textarea{min-height:88px;resize:vertical}
.lv-f input:focus-visible,.lv-f select:focus-visible,.lv-f textarea:focus-visible,.lv-tick input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.lv-err{font-size:.84rem;color:var(--text);background:var(--lap-tint-orange,#fdf5e8);border-left:3px solid var(--orange);border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.5}
.lv-dates{margin-top:16px;border:1.5px solid var(--border);border-radius:12px;padding:4px 14px 12px}
.lv-dates dl{display:grid;grid-template-columns:1fr;gap:0}
.lv-dates dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text-m);margin-top:10px}
.lv-dates dd{font-size:1.05rem;font-weight:800;color:var(--text)}
.lv-dates .lv-fee{font-size:.9rem;font-weight:600;line-height:1.5;color:var(--text);margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.lv-quote{margin-top:14px;font-size:.84rem;line-height:1.5;color:var(--text-m);border-left:3px solid var(--border);padding:2px 0 2px 12px}
.lv-quote cite{display:block;font-style:normal;font-size:.78rem;margin-top:4px}
.lv-tick{display:flex;gap:12px;align-items:flex-start;margin-top:16px;min-height:48px;cursor:pointer}
.lv-tick input{flex:0 0 auto;width:24px;height:24px;margin-top:2px;accent-color:var(--green)}
.lv-tick span{font-size:.95rem;font-weight:700;color:var(--text)}
.lv-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:14px;padding:0 16px;border:1.5px solid var(--green);border-radius:12px;background:var(--green);color:#fff;font:800 .95rem Nunito,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.lv-btn.quiet{background:var(--cream);color:var(--lap-ink,var(--green));border-color:var(--border)}
.lv-btn:disabled{opacity:.55;cursor:default}
.lv-done{display:flex;gap:10px;align-items:center;color:var(--lap-ink,var(--green))}
.lv-done h2{color:var(--text)}
.lv-i{flex:0 0 auto}
.lv-note{font-size:.86rem;line-height:1.5;color:var(--text);background:var(--lap-tint-orange,#fdf5e8);border-left:3px solid var(--orange);border-radius:8px;padding:10px 12px;margin-top:12px}
.lv .lap-fold{margin:12px 0 0}
.lv .lap-fold-body p{font-size:.86rem;color:var(--text-m);margin:0 0 8px}
.lv-skel{height:140px;margin-top:10px;border-radius:14px;background:linear-gradient(90deg,var(--cream-d) 0%,var(--surface,#fff) 50%,var(--cream-d) 100%);background-size:200% 100%;animation:lvsk 1.2s ease-in-out infinite}
@keyframes lvsk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.lv-skel{animation:none}}
</style>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
<script src="/pwa.js" defer></script>
</head>
<body>

<main class="lv" id="lv">
  <div id="lv-body"><div class="lv-skel" aria-hidden="true"></div><div class="lv-skel" aria-hidden="true"></div></div>
</main>

<script src="/js/wren-parent-empty.js"></script>
<script src="/js/lap-keepsake-card.js"></script>
<script>
(function () {
  'use strict';
  var API = '/welcome/leaving/api';
  var body = document.getElementById('lv-body');
  var CTX = null, SEL = null, PV = null, PV_TIMER = null, BUSY = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function j(url, opts) {
    return fetch(url, Object.assign({ credentials: 'same-origin' }, opts || {})).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) { b._status = r.status; b._ok = r.ok; return b; });
    });
  }
  function child() { return CTX.children.filter(function (c) { return c.id === SEL; })[0]; }
  var ICON_OK = '<svg class="lv-i" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>';

  function load() {
    body.innerHTML = '<div class="lv-skel" aria-hidden="true"></div>';
    j(API + '/context').then(function (c) {
      if (!c._ok) throw new Error('HTTP ' + c._status);
      CTX = c;
      if (!c.children.length) {
        WrenParentEmpty.render(body, 'generic', { title: 'Nothing to show here', text: 'We could not match your login to a child who is currently at the nursery. If that is wrong, please message the office.' });
        return;
      }
      var kept = null;
      try { var v = localStorage.getItem('lap.child'); if (v && v !== 'all') kept = parseInt(v, 10); } catch (e) {}
      SEL = (c.children.some(function (x) { return x.id === kept; }) ? kept : c.children[0].id);
      var q = /[?&]child=(\d+)/.exec(location.search);
      if (q && c.children.some(function (x) { return x.id === parseInt(q[1], 10); })) SEL = parseInt(q[1], 10);
      draw();
    }).catch(function () {
      WrenParentEmpty.render(body, navigator.onLine === false ? 'offline' : 'error', { action: { label: 'Try again', onClick: load } });
    });
  }

  function picker() {
    if (CTX.children.length < 2) return '';                       // never a chooser of one
    return '<div class="lv-kids" role="group" aria-label="Which child">' + CTX.children.map(function (c) {
      return '<button type="button" data-kid="' + c.id + '" aria-pressed="' + (c.id === SEL) + '">' + esc(c.name) + '</button>';
    }).join('') + '</div>';
  }

  function draw() {
    var c = child();
    var h = picker();
    if (c.notice) h += standingCard(c);
    else h += formCard(c);
    body.innerHTML = h;
    wirePicker();
    if (c.notice) { mountKeepsake(c); }
    else { wireForm(c); refreshPreview(c, null, true); }
  }
  function wirePicker() {
    Array.prototype.forEach.call(body.querySelectorAll('[data-kid]'), function (b) {
      b.addEventListener('click', function () { SEL = parseInt(b.dataset.kid, 10); PV = null; try { localStorage.setItem('lap.child', String(SEL)); } catch (e) {} draw(); });
    });
  }

  // ── A notice already stands ──────────────────────────────────────────────────────────────────
  function standingCard(c) {
    var n = c.notice, t = n.text, name = esc(c.name);
    return '<section class="lv-card"><div class="lv-done">' + ICON_OK + '<h2>' + name + '’s notice is recorded</h2></div>' +
      '<div class="lv-dates"><dl>' +
      '<dt>Notice given</dt><dd>' + esc(t.given_on) + '</dd>' +
      '<dt>Notice started</dt><dd>' + esc(t.notice_start) + '</dd>' +
      '<dt>Last day at nursery</dt><dd>' + esc(t.chosen_last_day) + '</dd></dl>' +
      '<p class="lv-fee">Fees run to ' + esc(t.fees_run_to) + '. Earliest last day under your notice: ' + esc(t.earliest_last_day) + '.</p></div>' +
      '<p>The office will be in touch. Nobody needs to approve this — it is already on ' + name + '’s record.</p>' +
      '<button type="button" class="lv-btn quiet" id="lv-change">Change the last day</button>' +
      '<button type="button" class="lv-btn quiet" id="lv-mind">We have changed our mind — message the office</button></section>' +
      '<div id="lv-keepsake"></div>';
  }
  function mountKeepsake(c) {
    document.getElementById('lv-change').addEventListener('click', function () { c.notice = null; c._revising = true; draw(); });
    document.getElementById('lv-mind').addEventListener('click', function () { changedMind(c); });
    LapKeepsakeCard.load().then(function (s) {
      var k = s.children.filter(function (x) { return x.child_id === c.id; })[0];
      if (k) LapKeepsakeCard.render(document.getElementById('lv-keepsake'), k, { onChange: function () { mountKeepsake(c); } });
    }).catch(function () { /* the keepsake page has the same card; nothing to say here */ });
  }
  // Withdrawing a notice is a conversation, not a button: this opens a message to management, ready to send,
  // and clears nothing. The office clears the dates in Roost.
  function changedMind(c) {
    var n = c.notice;
    try {
      sessionStorage.setItem('lap.compose', JSON.stringify({
        subject: 'We have changed our mind about leaving',
        body: 'Hello — we gave notice for ' + c.name + ' on ' + (n ? n.text.given_on : 'a recent date') + ', and we have changed our mind. Please could someone get in touch so we can talk about it?',
        recipient: 'management', child_id: c.id }));
    } catch (e) { /* private mode: the message page simply opens empty */ }
    location.href = '/welcome/messages?compose=1';
  }

  // ── The form ─────────────────────────────────────────────────────────────────────────────────
  function formCard(c) {
    var name = esc(c.name);
    var lead = c._revising
      ? '<p class="lv-lead">You can change ' + name + '’s last day. Your notice keeps running from when it started — changing the date does not restart the six weeks.</p>'
      : '<p class="lv-lead">If ' + name + ' will be leaving Your Nursery, you can give notice here. It counts as written notice, and nobody at the nursery has to approve it.</p>';
    if (c.recorded_by_nursery && !c._revising) {
      lead += '<div class="lv-note">The nursery already has ' + name + '’s last day down as <b>' + esc(c.recorded_leave_text || 'a date to be agreed') + '</b>. You can still give written notice here.</div>';
    }
    return lead +
    '<section class="lv-card"><h2>Give notice for ' + name + '</h2>' +
      '<div class="lv-f"><label for="lv-date">Last day at nursery</label>' +
        '<input type="date" id="lv-date" min="' + esc(CTX.today) + '" aria-describedby="lv-date-err"><div id="lv-date-err" role="alert"></div></div>' +
      '<div class="lv-dates" id="lv-dates" aria-live="polite"><dl><dt>Notice starts</dt><dd>…</dd><dt>Earliest last day</dt><dd>…</dd></dl></div>' +
      '<blockquote class="lv-quote">“' + esc(CTX.terms.clause) + '”<cite>Our terms and conditions' + (CTX.terms.version_label ? ', version ' + esc(CTX.terms.version_label) : '') + '</cite></blockquote>' +
      '<div class="lv-f"><label for="lv-reason">Why are you leaving? <span class="lv-opt">(optional)</span></label>' +
        '<select id="lv-reason"><option value="">Choose one…</option>' + CTX.reasons.map(function (r) { return '<option value="' + esc(r.code) + '">' + esc(r.label) + '</option>'; }).join('') + '</select></div>' +
      '<div class="lv-f"><label for="lv-notes">Anything you would like to tell us? <span class="lv-opt">(optional)</span></label><textarea id="lv-notes" maxlength="1000"></textarea></div>' +
      '<label class="lv-tick"><input type="checkbox" id="lv-tick"><span>I am giving notice for ' + name + '.</span></label>' +
      '<div class="lv-f"><label for="lv-name">Your full name</label><input type="text" id="lv-name" autocomplete="name" maxlength="120" aria-describedby="lv-name-err"><div id="lv-name-err" role="alert"></div></div>' +
      '<div id="lv-form-err" role="alert"></div>' +
      '<button type="button" class="lv-btn" id="lv-go" disabled>Give notice for ' + name + '</button>' +
    '</section>' +
    '<details class="lap-fold"><summary>How the dates are worked out</summary><div class="lap-fold-body">' +
      '<p>Notice given Monday to Friday starts on the Monday of the following week. Six full weeks run from then, ending on a Sunday; the last nursery day of those six weeks is the Friday before.</p>' +
      '<p>The terms do not say what happens to notice given at a weekend. The nursery is closed, so we treat it as received on the Monday and start the notice the Monday after that.</p>' +
      '<p>You can choose an earlier last day if you need to. Fees still run to the end of the notice period. A later last day is simply your last day.</p>' +
    '</div></details>';
  }

  function wireForm(c) {
    var date = document.getElementById('lv-date'), tick = document.getElementById('lv-tick'), nm = document.getElementById('lv-name');
    function ready() {
      var words = nm.value.trim().split(/\s+/).filter(Boolean).length;
      document.getElementById('lv-go').disabled = BUSY || !(PV && !PV._bad && tick.checked && words >= 2);
    }
    date.addEventListener('change', function () { refreshPreview(c, date.value, false); });
    date.addEventListener('input', function () { clearTimeout(PV_TIMER); PV_TIMER = setTimeout(function () { refreshPreview(c, date.value, false); }, 350); });
    tick.addEventListener('change', ready); nm.addEventListener('input', ready);
    document.getElementById('lv-go').addEventListener('click', function () { submit(c); });
    c._ready = ready; ready();
  }

  function showDates(pv) {
    var el = document.getElementById('lv-dates'); if (!el) return;
    el.innerHTML = '<dl><dt>Notice starts</dt><dd>' + esc(longDate(pv.notice_start)) + '</dd>' +
      '<dt>Earliest last day</dt><dd>' + esc(longDate(pv.earliest_last_day)) + '</dd></dl>' +
      (pv.weekend ? '<p class="lv-fee">' + esc(pv.start_text) + '</p>' : '') +
      (pv.is_revision ? '<p class="lv-fee">' + esc(pv.start_text) + '</p>' : '') +
      '<p class="lv-fee">' + esc(pv.fee_text) + '</p>';
  }
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function longDate(ymd) { var p = String(ymd).split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2])); return DOW[d.getUTCDay()] + ' ' + p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + p[0]; }

  function refreshPreview(c, lastDay, setDefault) {
    var q = '?child_id=' + c.id + (lastDay ? '&last_day=' + encodeURIComponent(lastDay) : '');
    j(API + '/preview' + q).then(function (r) {
      var err = document.getElementById('lv-date-err'); if (!err) return;
      if (!r._ok) { PV = { _bad: true }; err.innerHTML = '<div class="lv-err">' + esc(r.error || 'That date does not work.') + '</div>'; if (c._ready) c._ready(); return; }
      err.innerHTML = ''; PV = r.preview;
      if (setDefault) document.getElementById('lv-date').value = PV.chosen_last_day;
      showDates(PV); if (c._ready) c._ready();
    }).catch(function () { var err = document.getElementById('lv-date-err'); if (err) err.innerHTML = '<div class="lv-err">We could not check the dates — please try again.</div>'; });
  }

  function submit(c) {
    if (BUSY || !PV || PV._bad) return;
    BUSY = true; var go = document.getElementById('lv-go'); go.disabled = true; go.textContent = 'Sending…';
    ['lv-name-err', 'lv-form-err'].forEach(function (id) { document.getElementById(id).innerHTML = ''; });
    j(API + '/give', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      child_id: c.id, last_day: document.getElementById('lv-date').value, confirm: document.getElementById('lv-tick').checked,
      typed_name: document.getElementById('lv-name').value, reason_code: document.getElementById('lv-reason').value || null,
      reason_notes: document.getElementById('lv-notes').value,
      shown: { notice_start: PV.notice_start, earliest_last_day: PV.earliest_last_day, fees_run_to: PV.fees_run_to } }) })
    .then(function (r) {
      BUSY = false;
      if (r._ok) return done(c, r);
      go.textContent = 'Give notice for ' + c.name;
      var target = r.field === 'typed_name' ? 'lv-name-err' : (r.field === 'last_day' ? 'lv-date-err' : 'lv-form-err');
      if (r.reason === 'dates_changed' && r.preview) { PV = r.preview; showDates(PV); document.getElementById('lv-date').value = PV.chosen_last_day; }
      document.getElementById(target).innerHTML = '<div class="lv-err">' + esc(r.error || 'That did not work — please try again.') + '</div>';
      if (c._ready) c._ready();
    }).catch(function () {
      BUSY = false; go.textContent = 'Give notice for ' + c.name;
      document.getElementById('lv-form-err').innerHTML = '<div class="lv-err">We could not reach Your Nursery — please check your connection and try again.</div>';
      if (c._ready) c._ready();
    });
  }

  // ── Confirmation ─────────────────────────────────────────────────────────────────────────────
  function done(c, r) {
    var pv = r.preview, name = esc(c.name);
    body.innerHTML = picker() +
      '<section class="lv-card"><div class="lv-done">' + ICON_OK + '<h2>' + (r.revision ? 'Last day changed' : 'Notice recorded') + '</h2></div>' +
      '<div class="lv-dates"><dl>' +
        (pv.is_revision ? '' : '<dt>Notice starts</dt><dd>' + esc(longDate(pv.notice_start)) + '</dd>') +
        '<dt>Last day at nursery</dt><dd>' + esc(longDate(pv.chosen_last_day)) + '</dd></dl>' +
        '<p class="lv-fee">' + esc(pv.fee_text) + '</p></div>' +
      '<p class="lv-strong">Thank you. The office will be in touch about ' + name + '’s last day. Nobody needs to approve this — it is already recorded.</p>' +
      (r.acknowledged_by_email ? '<p>We have also emailed you to say it is recorded.</p>' : '') + '</section>' +
      '<div id="lv-keepsake"></div>';
    Array.prototype.forEach.call(body.querySelectorAll('[data-kid]'), function (b) { b.disabled = true; });
    // The memory book, straight away: they do not have to wait for anybody.
    LapKeepsakeCard.load().then(function (s) {
      var k = s.children.filter(function (x) { return x.child_id === c.id; })[0];
      if (k) LapKeepsakeCard.render(document.getElementById('lv-keepsake'), k, {});
    }).catch(function () {});
    window.scrollTo(0, 0);
  }

  load();
})();
</script>
</body>
</html>
