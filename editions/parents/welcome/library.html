<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reading Room — Your Nursery</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d5a4a;--green-d:#1e3d31;--green-l:#3d7a64;
  --orange:#f0a050;--orange-d:#d8823a;
  --cream:#fefcf8;--cream-d:#f5f0e8;
  --text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0;
  --blue:#4a9abf;
  /* b482 — bridge so the shared public/css/wren-reading-room.css (the new
     bookshelf: covers, facet sidebar, reader — var(--c-*) tokens only, same
     file every portal loads) renders correctly here too, instead of forking a
     parents-only copy of it. Mapped onto this page's OWN already dark-mode-
     aware variables above (--surface/--text/--border/--text-m are set by the
     existing light/dark detection every /welcome/*.html card already relies
     on — see b425b fix #4's own verification of exactly that). */
  --c-bg: var(--cream);
  --c-surface: var(--surface, #fff);
  --c-surface-solid: var(--surface, #fff);
  --c-border: var(--border);
  --c-border-strong: var(--border);
  --c-text: var(--text);
  --c-muted: var(--text-m);
  --c-blue: var(--blue);
  --c-orange: var(--orange);
  --c-on-blue: #ffffff;
  --c-on-orange: #3a2a12;
  --c-on-fill: #ffffff;
  --c-ok: #2d7a4f;
  --c-cat-1: var(--green); --c-cat-2: var(--blue); --c-cat-3: var(--orange);
  --c-cat-4: #c0564a; --c-cat-5: #8e6fc2; --c-cat-6: #3f9bb0;
  --c-cat-7: #c25a94; --c-cat-8: #7a9c3f;
}
body{font-family:'Nunito',system-ui,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
h1,h2{font-family:'Crimson Pro',Georgia,serif}
a{color:var(--lap-ink,var(--green));text-decoration:none}
.nav{background:var(--green);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px}
.nav-logo img{height:40px;display:block}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-link{color:rgba(255,255,255,.8);font-size:.88rem;font-weight:600;padding:6px 12px;border-radius:6px;transition:.15s}
.nav-link:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-link.active{color:#fff;border-bottom:2px solid var(--orange);border-radius:0;padding-bottom:4px}
.hero{background:var(--green);color:#fff;padding:36px 20px 28px;text-align:center}
.hero h1{font-size:1.9rem;margin-bottom:8px}
.hero p{font-size:.95rem;opacity:.88;max-width:600px;margin:0 auto;line-height:1.6}
html.lap-shell .hero{display:none}
.container{max-width:1100px;margin:0 auto;padding:12px 16px 28px}
.wrr-intro{background:var(--cream-d);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  font-size:.85rem;color:var(--text-m);line-height:1.6;margin:12px 0 14px}
.wrr-intro a{color:var(--blue);font-weight:600}
.wrr-areas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.wrr-area{display:flex;align-items:center;gap:8px;background:var(--surface, #fff);border:1px solid var(--border);
  border-radius:999px;padding:7px 13px;font-size:.82rem;color:var(--text);cursor:pointer;font-family:inherit}
.wrr-area.active{background:var(--green);border-color:var(--green);color:#fff}
.wrr-area-count{font-weight:700;font-size:.74rem;background:var(--cream-d);border-radius:999px;padding:1px 7px}
.wrr-area.active .wrr-area-count{background:rgba(255,255,255,.25);color:inherit}
.wrr-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.wrr-search{flex:1 1 180px;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface, #fff);color:var(--text);font-family:inherit}
.wrr-select{min-height:44px;padding:0 10px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface, #fff);color:var(--text);font-family:inherit}
.wrr-list{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.wrr-list{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.wrr-list{grid-template-columns:1fr 1fr 1fr}}
.wrr-card{display:block;background:var(--surface, #fff);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;text-decoration:none;color:inherit}
.wrr-card:active{background:var(--cream-d)}
.wrr-card-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.wrr-type{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-m);font-weight:700}
.wrr-pin{font-size:.85rem}
.wrr-needs{display:none} /* parents never see needs_review items — the server already filters them out */
.wrr-card-title{font-family:'Crimson Pro',Georgia,serif;font-size:1.08rem;color:var(--green);margin-bottom:3px}
.wrr-card-summary{font-size:.85rem;color:var(--text-m);line-height:1.5;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrr-card-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:.76rem;color:var(--text-m)}
.wrr-review{color:var(--orange-d)}
.wrr-empty{color:var(--text-m);font-size:.9rem;font-style:italic;padding:12px 2px;grid-column:1/-1}
.wrr-shelf{margin-top:20px;border-top:1px solid var(--border);padding-top:14px}
.wrr-shelf-link{display:inline-block;font-size:.9rem;color:var(--blue);text-decoration:none;font-weight:700}
</style>
<script src="/pwa.js" defer></script>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<link rel="stylesheet" href="/css/wren-reading-room.css?v=b519">
<script src="/js/lap-boot.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/welcome" class="nav-logo"><img src="/little-angels-logo.png" alt="Your Nursery"></a>
    <div class="nav-links">
      <a href="/welcome" class="nav-link">Home</a>
      <a href="/welcome/home-activities" class="nav-link">Home Activities</a>
      <a href="/welcome/planning" class="nav-link">Planning</a>
      <a href="/welcome/library" class="nav-link active">Reading Room</a>
      <a href="/welcome/resources" class="nav-link">Resources</a>
      <a href="/welcome/records" class="nav-link">Records</a>
    </div>
  </div>
</nav>

<div class="hero">
  <h1>Reading Room</h1>
  <p>Policies, guides, your study modules and more — everything Your Nursery shares with families, in one place.</p>
</div>

<div class="container">
  <div class="wrr-intro">
    Your Study modules have moved here — <a href="/welcome/study">the old Study page</a> now brings you
    straight to this view.
  </div>
  <div id="wrr-root"></div>
</div>

<script src="/js/wren-reading-room.js?v=b519"></script>
<script>
(function () {
  function boot() {
    WrenReadingRoom.init(document.getElementById('wrr-root'), {
      admin: false,
      shelf: { label: 'Children’s storybooks (phonics)', href: '/welcome/phonics', icon: '📚' },
    });
  }
  // Parents' shell (pwa.js) doesn't dispatch wren:ready — it has no dependency
  // on shell-provided user state here, since /api/library already scopes the
  // response to this session's authenticated parent. Boot as soon as the DOM
  // is ready.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}());
</script>
</body>
</html>
