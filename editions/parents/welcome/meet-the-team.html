<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Nursery — Meet the Team</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d5a4a;--green-d:#1e3d31;--green-l:#3d7a64;
  --orange:#f0a050;--orange-d:#d8823a;
  --cream:#fefcf8;--cream-d:#f5f0e8;
  --text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0;
}
body{font-family:'Nunito',system-ui,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
h1,h2,h3{font-family:'Crimson Pro',Georgia,serif}
a{color:var(--lap-ink,var(--green));text-decoration:none}
.nav{background:var(--green);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.12);width:100%;left:0;right:0}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px}
.nav-logo img{height:40px;display:block}
.nav-links{display:flex;gap:4px}
.nav-link{color:rgba(255,255,255,.8);font-size:.9rem;font-weight:600;padding:6px 14px;border-radius:6px}
.nav-link.active{color:#fff;border-bottom:2px solid var(--orange);border-radius:0;padding-bottom:4px}
.page-hero{background:var(--green);color:#fff;padding:52px 20px 36px;text-align:center}
.page-hero h1{font-size:2.1rem;margin-bottom:10px}
.page-hero p{font-size:.95rem;opacity:.85;max-width:540px;margin:0 auto;line-height:1.65}
.container{max-width:760px;margin:0 auto;padding:32px 20px 60px}
.key-card{background:var(--surface,#fff);border:1px solid var(--border);border-radius:18px;padding:24px;text-align:center;margin-bottom:24px}
.key-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;background:var(--cream-d);margin:0 auto 14px;display:block;border:3px solid var(--orange)}
.key-photo.placeholder{display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:var(--green)}
.key-card h2{font-size:1.3rem;color:var(--lap-ink,var(--green))}
.key-card .role{font-size:.85rem;color:var(--text-m);margin-bottom:12px}
.key-card p.about{font-size:.92rem;max-width:460px;margin:6px auto}
.key-card.buddy-card{padding:18px}
.key-card.buddy-card .key-photo{width:84px;height:84px}
.key-card.buddy-card h2{font-size:1.1rem}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.team-card{background:var(--surface,#fff);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.team-photo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--cream-d);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--green)}
.team-photo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.team-card h3{font-size:.9rem}
.team-card .role{font-size:.72rem;color:var(--text-m)}
.section-label{font-size:.95rem;font-weight:800;color:var(--text-m);margin:8px 0 12px}
.empty{background:var(--surface,#fff);border:1px dashed var(--border);border-radius:16px;padding:28px;text-align:center;color:var(--text-m);font-size:.9rem}
footer{background:var(--green-d);color:rgba(255,255,255,.7);text-align:center;padding:24px 20px;font-size:.82rem;margin-top:20px}
</style>
<script src="/pwa.js" defer></script>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/welcome" class="nav-logo"><img src="/little-angels-logo.png" alt="Your Nursery"></a>
    <div class="nav-links">
      <a href="/welcome" class="nav-link">Home</a>
      <a href="/welcome/meet-the-team" class="nav-link active">Meet the team</a>
    </div>
  </div>
</nav>

<div class="page-hero">
  <h1>Meet the team</h1>
  <p>The people looking after your child — in their own words. Staff choose whether to appear here.</p>
</div>

<div class="container" id="mtt-container">
  <p class="empty">Loading…</p>
</div>

<footer>
  <strong>Your Nursery</strong> · 123 Example Lane, Your Town, AB1 2CD
</footer>

<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function token(){ return sessionStorage.getItem('wren_token') || localStorage.getItem('wren_token') || ''; }
  function authFetch(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token() }, opts.headers || {});
    return fetch(path, opts);
  }
  // 2026-10-23 (keyperson): first name only (never a surname), the photo arrives inline as
  // p.photo (a data: URI — /uploads/staff-photos is closed on this portal), p.blurb is the
  // short intro. A key person or buddy who has not published shows name + role only.
  function personCard(p, kind){
    var big = kind === 'key';
    var photo = p.photo
      ? '<img class="'+(big?'key-photo':'team-photo')+'" src="'+esc(p.photo)+'" alt="">'
      : '<div class="'+(big?'key-photo placeholder':'team-photo')+'">'+esc((p.first_name||'?').charAt(0))+'</div>';
    if (kind === 'key' || kind === 'buddy'){
      var bits = [];
      if (p.blurb) bits.push('<p class="about">'+esc(p.blurb)+'</p>');
      if (p.years_here) bits.push('<p class="about"><strong>'+esc(p.years_here)+'</strong> at Your Nursery</p>');
      if (p.likes_about_job) bits.push('<p class="about">'+esc(p.likes_about_job)+'</p>');
      if (p.enjoys_doing) bits.push('<p class="about">Loves: '+esc(p.enjoys_doing)+'</p>');
      if (p.favourite_song) bits.push('<p class="about">Favourite song: '+esc(p.favourite_song)+'</p>');
      if (p.why_little_angels) bits.push('<p class="about">'+esc(p.why_little_angels)+'</p>');
      return '<div class="key-card'+(big?'':' buddy-card')+'">'+photo+'<h2>'+esc(p.first_name)+'</h2>'
        + '<div class="role">'+(big ? 'Your child\'s key person' : 'Your child\'s buddy')+(p.role_label ? ' · '+esc(p.role_label) : '')+'</div>'
        + bits.join('') + '</div>';
    }
    return '<div class="team-card">'+photo+'<h3>'+esc(p.first_name)+'</h3><div class="role">'+esc(p.role_label||'')+'</div></div>';
  }

  function childId(){
    if (window.LapShell && typeof LapShell.child === 'function'){ var c = LapShell.child(); if (c && c !== 'all') return c; }
    return null;
  }

  function render(){
    var cid = childId();
    var box = document.getElementById('mtt-container');
    if (!cid){ box.innerHTML = '<p class="empty">Choose a child from the switcher above to see their team.</p>'; return; }
    authFetch('/api/parents/child/' + encodeURIComponent(cid) + '/meet-the-team').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if (!d || (!d.key_person && !d.buddy && !(d.team||[]).length)){
        box.innerHTML = '<div class="empty">No one on the team has shared their profile yet — check back soon.</div>';
        return;
      }
      var html = '';
      if (d.key_person) html += personCard(d.key_person, 'key');
      if (d.buddy) html += personCard(d.buddy, 'buddy');
      if ((d.team||[]).length){
        html += '<div class="section-label">The rest of the room</div><div class="team-grid">'
          + d.team.map(function(p){ return personCard(p, 'team'); }).join('') + '</div>';
      }
      box.innerHTML = html;
    }).catch(function(){ box.innerHTML = '<p class="empty">Could not load the team right now.</p>'; });
  }

  document.addEventListener('DOMContentLoaded', function(){
    render();
    if (window.LapShell && typeof LapShell.onChild === 'function') LapShell.onChild(render);
  });
})();
</script>
</body>
</html>
