<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Nursery — Messages</title>
<meta name="lap-title" content="Messages">
<meta name="lap-action" content="+ New">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#2d5a4a;--orange:#f0a050;--cream:#fefcf8;--cream-d:#f5f0e8;--text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0}
body{font-family:'Nunito',system-ui,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
h1,h3{font-family:'Crimson Pro',Georgia,serif}a{color:var(--lap-ink,var(--green));text-decoration:none}
.nav{background:var(--green);position:sticky;top:0;z-index:100}.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px}
.nav-logo img{height:40px}.nav-links{display:flex;gap:4px;flex-wrap:wrap}.nav-link{color:rgba(255,255,255,.8);font-size:.9rem;font-weight:600;padding:6px 12px;border-radius:6px}
.nav-link.active{color:#fff;border-bottom:2px solid var(--orange);border-radius:0;padding-bottom:4px}.nav-link:hover{background:rgba(255,255,255,.1);color:#fff}
.hero{background:var(--green);color:#fff;padding:36px 20px 24px;text-align:center}.hero h1{font-size:2rem;margin-bottom:8px}.hero p{opacity:.88;max-width:560px;margin:0 auto}
.container{max-width:700px;margin:0 auto;padding:22px 20px}
.cta{display:block;text-align:center;background:var(--orange);color:var(--lap-on-orange,#3a2a12);border:0;width:100%;border-radius:12px;padding:12px;font-weight:800;margin-bottom:18px;cursor:pointer;font-size:1rem;min-height:48px}
/* b339: "New message" is the header action now (meta lap-action). This big button stays in the file only as the
   fallback if the shell script never loads — the script below reveals it in that one case. */
#newBtn{display:none}#newBtn.lap-fallback{display:block}
.thread{background:var(--surface, #fff);border:1px solid var(--border);border-radius:14px;padding:11px 12px 11px 13px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px}
.thread:hover{border-color:var(--green)}
.thread .ic{flex:0 0 42px;height:42px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;background:var(--lap-tint-green,#e4f3ea);color:var(--lap-ink,var(--green))}
.thread .ic svg{width:22px;height:22px}
.thread .body{flex:1;min-width:0}
.thread .subj{font-weight:700;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;line-height:1.3}
.thread.unread .subj{font-weight:800;color:var(--lap-ink,var(--green))}
.thread .meta{font-size:.78rem;color:var(--text-m)}
.badge{background:var(--orange);color:var(--lap-on-orange,#3a2a12);font-size:.72rem;font-weight:800;border-radius:12px;padding:2px 9px;min-width:22px;text-align:center}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--lap-ink,var(--green));font-weight:700;cursor:pointer}
.msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;position:relative}
.msg.them{background:var(--surface, #fff);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg.you{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .who{font-size:.72rem;font-weight:700;color:var(--text-m);margin-bottom:2px}
.msg .tm{font-size:.68rem;color:var(--text-m);margin-top:3px;text-align:right}
.msg.you .who,.msg.you .tm{color:#fff}
.msg img.att{max-width:100%;border-radius:8px;margin-top:6px;display:block}
.msg .ai{font-size:.66rem;font-weight:700;color:var(--lap-ink,var(--green));margin-left:6px}
/* the reply box sits above the fixed tab bar (60px + safe area), not behind it. The floating help button
   (wren-tour.js: fixed, right 14px, bottom 86px) would sit on top of Send, so it steps aside while a reply box is docked;
   the tour stays reachable from More. */
html.lap-composing #wren-help-btn{display:none !important}
.composer{background:var(--surface, #fff);border:1px solid var(--border);border-radius:12px;padding:12px;position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px))}
.composer textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px;font-family:inherit;font-size:.95rem;resize:vertical;min-height:52px}
.composer .row{display:flex;gap:8px;align-items:center;margin-top:8px}
.composer button.send{background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:800;cursor:pointer;min-height:44px}
.composer .attach{color:var(--lap-ink,var(--green));font-weight:700;cursor:pointer;font-size:1.5rem;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.composer .fname{font-size:.8rem;color:var(--text-m);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field{margin-bottom:11px}.field label{display:block;font-weight:700;font-size:.85rem;margin-bottom:4px;color:var(--lap-ink,var(--green))}
.field select,.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px;font-family:inherit;font-size:.95rem}
.card{background:var(--surface, #fff);border:1px solid var(--border);border-radius:12px;padding:16px}
.list-tools{display:flex;justify-content:flex-end;margin-bottom:8px}
.arch-toggle{background:var(--surface, #fff);border:1px solid var(--border);border-radius:18px;color:var(--text-m);font-weight:700;font-size:.82rem;padding:0 14px;min-height:36px;cursor:pointer;font-family:inherit}
.arch-toggle.active{background:var(--green);color:#fff;border-color:var(--green)}
.thread-arch{flex-shrink:0;background:transparent;border:1px solid var(--border);color:var(--text-m);border-radius:8px;font-size:.74rem;font-weight:700;padding:0 10px;min-height:44px;cursor:pointer;font-family:inherit}
.thread-arch:hover{border-color:var(--green);color:var(--lap-ink,var(--green))}
.hidden{display:none}
.note{font-size:.78rem;color:var(--text-m);text-align:center;margin-top:14px}
/* loading skeletons — the shape of a row, so nothing jumps when the list lands */
.ms-skel{height:66px;margin-bottom:9px;border-radius:14px;background:linear-gradient(90deg,var(--cream-d) 0%,var(--surface,#fff) 50%,var(--cream-d) 100%);background-size:200% 100%;animation:mssk 1.2s ease-in-out infinite}
.ms-skel.bub{height:54px;width:70%}.ms-skel.bub.r{margin-left:auto;width:58%}
@keyframes mssk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.ms-skel{animation:none}}
</style><script src="/pwa.js" defer></script>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
</head><body>
<nav class="nav"><div class="nav-inner">
  <a href="/welcome" class="nav-logo"><img src="/little-angels-logo.png" alt="Your Nursery"></a>
  <div class="nav-links">
    <a href="/welcome" class="nav-link">Home</a>
      <a href="/welcome/home-activities" class="nav-link">Home Activities</a>
    <a href="/welcome/diary" class="nav-link">Diary</a>
    <a href="/welcome/messages" class="nav-link active">Messages</a>
    <a href="/welcome/community" class="nav-link">Community</a>
    <a href="/welcome/learning-journey" class="nav-link">Learning Journey</a>
  </div>
</div></nav>
<div class="hero"><h1>Messages</h1><p>Talk to your child's key person and the nursery team. Attach a photo if it helps.</p></div>
<div class="container">
  <!-- b339 (2026-09-18) — the list is the screen. "New message" lives in the top bar (meta lap-action ->
       the 'lap:action' event below); the empty state carries its own "New message" button. Every call,
       endpoint and body is unchanged. -->
  <!-- List view -->
  <div id="listView">
    <button class="cta" id="newBtn">＋ New message</button>
    <div class="list-tools"><button class="arch-toggle" id="archToggle" type="button" aria-pressed="false">🗄️ Archived</button></div>
    <div id="threads"><div class="ms-skel"></div><div class="ms-skel"></div><div class="ms-skel"></div></div>
  </div>

  <!-- New-thread view -->
  <div id="newView" class="hidden">
    <span class="back" data-to="list">← Back</span>
    <div class="card">
      <div class="field" id="nChildField" style="display:none"><label>Which child is this about?</label>
        <select id="nChild"></select></div>
      <div class="field"><label>Who would you like to message?</label>
        <select id="nRecipient">
          <option value="room_leader">My child's room leader (the deputy / the room leader)</option>
          <option value="key_person">My child's key person</option>
          <option value="management">Management (the office manager / Toby)</option>
        </select></div>
      <div class="field"><label>Subject</label><input id="nSubject" maxlength="120" placeholder="e.g. Picking up early on Friday"></div>
      <div class="field"><label>Message</label><textarea id="nBody" rows="5" placeholder="Type your message…"></textarea></div>
      <button class="cta" id="nSend" style="margin-bottom:0">Send message</button>
    </div>
  </div>

  <!-- Thread view -->
  <div id="threadView" class="hidden">
    <span class="back" data-to="list">← All messages</span>
    <h3 id="tSubject" style="color:var(--lap-ink,var(--green));margin:2px 0 12px"></h3>
    <div class="msgs" id="tMsgs"></div>
    <div class="composer">
      <textarea id="rBody" placeholder="Write a reply…"></textarea>
      <div class="row">
        <label class="attach" title="Attach a photo">📎<input type="file" id="rFile" accept="image/*" class="hidden"></label>
        <span class="fname" id="rFname"></span>
        <button class="send" id="rSend">Send</button>
      </div>
    </div>
  </div>
  <div class="note">Messages are logged. The nursery aims to reply during opening hours (Mon–Fri, 8am–6pm).</div>
</div>
<script src="/js/wren-parent-empty.js"></script>
<script>
var TOKEN=null, CHILD=null, CHILDREN=[], CUR=null, SHOW_ARCHIVED=false, SIGNED_OUT=false;
var CHAT_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12.2c0 3.9-3.8 7-8.5 7a9.8 9.8 0 0 1-2.6-.35L4.5 20.5l1.2-3.4A6.6 6.6 0 0 1 3.5 12.2c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7z"/></svg>';
function populateChildPicker(){
  var field=document.getElementById('nChildField'), sel=document.getElementById('nChild');
  if(!CHILDREN||CHILDREN.length<2){field.style.display='none';return;}
  sel.innerHTML=CHILDREN.map(function(c){return '<option value="'+c.id+'">'+esc((c.first_name||'')+' '+(c.last_name||'')).trim()+'</option>';}).join('');
  field.style.display='';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function H(){return{'Authorization':'Bearer '+TOKEN};}
function api(path,opts){opts=opts||{};opts.headers=Object.assign(H(),opts.headers||{});return fetch('/api/messages'+path,opts).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function show(v){['listView','newView','threadView'].forEach(function(id){document.getElementById(id).classList.toggle('hidden',id!==v);});document.documentElement.classList.toggle('lap-composing',v==='threadView');window.scrollTo(0,0);}
function fmt(ts){if(!ts)return '';var d=new Date(ts);var now=new Date();var sameDay=d.toDateString()===now.toDateString();return sameDay?d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
// a failed fetch: the offline picture if the phone says so, otherwise the generic one — both with Try again
function fail(el,retry,compact){WrenParentEmpty.render(el,navigator.onLine===false?'offline':'error',{compact:!!compact,action:{label:'Try again',onClick:retry}});}

function openCompose(){
  if(!TOKEN)return;                                       // not signed in / no child linked: nothing to compose for
  var nv=document.getElementById('newView');
  if(!nv.classList.contains('hidden')){document.getElementById('nSubject').focus();return;}   // already open: keep the draft
  document.getElementById('nSubject').value='';document.getElementById('nBody').value='';
  if(window.LapShell&&CHILDREN.length>1){var c=LapShell.child();if(c!=null)document.getElementById('nChild').value=String(c);}   // the child chosen in the top bar
  show('newView');
}

// b340 — "Tell us if this is a problem" on the consents page hands over a ready-to-edit message to the office.
// It travels in sessionStorage (same tab, same origin), and only when the URL also says ?compose=1, so a link
// from anywhere else cannot pre-write a message for a parent. Read once, then cleared.
function applyComposeHandoff(){
  try{
    if(!/[?&]compose=1(&|$)/.test(location.search))return;
    var raw=sessionStorage.getItem('lap.compose');
    if(!raw)return;
    sessionStorage.removeItem('lap.compose');
    if(window.history&&history.replaceState)history.replaceState(null,'',location.pathname);   // a refresh must not reopen it
    var h=JSON.parse(raw);
    openCompose();
    document.getElementById('nSubject').value=String(h.subject||'').slice(0,120);
    document.getElementById('nBody').value=String(h.body||'').slice(0,2000);
    var r=document.getElementById('nRecipient');
    if(h.recipient&&r.querySelector('option[value="'+String(h.recipient).replace(/[^a-z_]/g,'')+'"]'))r.value=String(h.recipient);
    var cs=document.getElementById('nChild');
    if(h.child_id!=null&&CHILDREN.length>1&&cs.querySelector('option[value="'+parseInt(h.child_id,10)+'"]'))cs.value=String(parseInt(h.child_id,10));
    document.getElementById('nBody').focus();
  }catch(e){}
}

function loadThreads(){
  var el=document.getElementById('threads');
  api('/threads'+(SHOW_ARCHIVED?'?archived=1':'')).then(function(rows){
    if(!rows.length){
      if(SHOW_ARCHIVED)WrenParentEmpty.render(el,'messages',{title:'No archived messages',text:'Conversations you archive from your list are kept here.'});
      else WrenParentEmpty.render(el,'messages',{action:{label:'New message',onClick:openCompose}});
      return;
    }
    el.innerHTML=rows.map(function(t){
      var sub=[t.child_name||'',fmt(t.last_message_at)].filter(Boolean).join(' · ');
      return '<div class="thread'+(t.unread_count>0?' unread':'')+'" data-id="'+t.id+'"><span class="ic">'+CHAT_ICON+'</span><div class="body"><div class="subj">'+esc(t.subject||'Message')+'</div><div class="meta">'+esc(sub)+'</div></div>'+(t.unread_count>0?'<span class="badge">'+t.unread_count+'</span>':'')+'<button class="thread-arch" data-id="'+t.id+'" data-archived="'+(t.archived?1:0)+'">'+(t.archived?'Unarchive':'Archive')+'</button></div>';
    }).join('');
    el.querySelectorAll('.thread').forEach(function(r){r.addEventListener('click',function(){openThread(parseInt(this.dataset.id));});});
    el.querySelectorAll('.thread-arch').forEach(function(b){b.addEventListener('click',function(ev){ev.stopPropagation();toggleArchive(parseInt(this.dataset.id),this.dataset.archived==='1');});});
  }).catch(function(){fail(el,loadThreads);});
}

function toggleArchive(id,isArchived){
  api('/thread/'+id+'/'+(isArchived?'unarchive':'archive'),{method:'POST'})
    .then(function(){loadThreads();})
    .catch(function(){alert('Could not update — please try again.');});
}

function loadAttachment(m,img){
  fetch(m.attachment_path,{headers:H()}).then(function(r){return r.ok?r.blob():null;}).then(function(b){if(b)img.src=URL.createObjectURL(b);});
}
function openThread(id){
  CUR=id;show('threadView');
  var box=document.getElementById('tMsgs');
  box.innerHTML='<div class="ms-skel bub"></div><div class="ms-skel bub r"></div><div class="ms-skel bub"></div>';
  api('/thread/'+id).then(function(d){
    document.getElementById('tSubject').textContent=d.thread.subject||'Message';
    // Hide staff photos still pending review
    var msgs=(d.messages||[]).filter(function(m){return !(m.sender_type==='staff'&&m.pending_review&&m.review_decision!=='approved');});
    if(!msgs.length){WrenParentEmpty.render(box,'messages',{compact:true,title:'Nothing here yet',text:'Write the first message below.'});}
    else box.innerHTML=msgs.map(function(m){
      var you=m.sender_type==='parent';
      var who=you?'You':(m.staff_name||'Your Nursery');
      // 2026-10-28: documents (PDF, Word, Excel) open as a file; photos show inline.
      var isImg=m.attachment_path&&(/^image\//.test(m.attachment_mime||'')||/\.(jpe?g|png|webp|gif)$/i.test(m.attachment_path));
      var att=!m.attachment_path?'':isImg?'<img class="att" data-src="'+esc(m.attachment_path)+'" alt="attachment">'
        :'<a href="#" class="att-doc" data-src="'+esc(m.attachment_path)+'" style="display:inline-block;margin-top:6px;font-weight:700">📄 Open attachment ('+esc((String(m.attachment_path).match(/\.(\w+)$/)||['',''])[1].toUpperCase())+')</a>';
      var aiTag=(!you&&m.ai_draft)?'<span class="ai">✨ AI-assisted</span>':'';
      return '<div class="msg '+(you?'you':'them')+'"><div class="who">'+esc(who)+aiTag+'</div>'+(m.body?esc(m.body).replace(/\n/g,'<br>'):'')+att+'<div class="tm">'+fmt(m.created_at)+'</div></div>';
    }).join('');
    box.querySelectorAll('img.att').forEach(function(img){loadAttachment({attachment_path:img.dataset.src},img);});
    box.querySelectorAll('a.att-doc').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();
      fetch(a.dataset.src,{headers:H()}).then(function(r){return r.ok?r.blob():null;}).then(function(b){if(b)window.open(URL.createObjectURL(b),'_blank');});});});
    box.scrollIntoView(false);
    api('/thread/'+id+'/read',{method:'POST'}).catch(function(){});
  }).catch(function(){fail(box,function(){openThread(id);},true);});
}

// New thread — opened from the top-bar "+ Message" (the 'lap:action' event the shell fires), the empty state's
// button, or the fallback button below
document.addEventListener('lap:action',openCompose);
document.getElementById('newBtn').addEventListener('click',openCompose);
document.getElementById('nSend').addEventListener('click',function(){
  var body=document.getElementById('nBody').value.trim();
  if(!body){document.getElementById('nBody').focus();return;}
  var btn=this;btn.disabled=true;btn.textContent='Sending…';
  api('/thread',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    subject:document.getElementById('nSubject').value.trim()||'Message',
    body:body,recipient_type:document.getElementById('nRecipient').value,
    child_id:(CHILDREN.length>1?parseInt(document.getElementById('nChild').value,10):undefined)
  })}).then(function(t){btn.disabled=false;btn.textContent='Send message';openThread(t.id);loadThreads();})
  .catch(function(){btn.disabled=false;btn.textContent='Send message';alert('Could not send — please try again.');});
});

// Reply + attach
document.getElementById('rFile').addEventListener('change',function(){document.getElementById('rFname').textContent=this.files[0]?this.files[0].name:'';});
document.getElementById('rSend').addEventListener('click',function(){
  var body=document.getElementById('rBody').value.trim();
  var file=document.getElementById('rFile').files[0];
  if(!body&&!file)return;
  var btn=this;btn.disabled=true;
  var done=function(){btn.disabled=false;document.getElementById('rBody').value='';document.getElementById('rFile').value='';document.getElementById('rFname').textContent='';openThread(CUR);loadThreads();};
  var fail2=function(){btn.disabled=false;alert('Could not send — please try again.');};
  if(file){
    var fd=new FormData();fd.append('photo',file);if(body)fd.append('body',body);
    fetch('/api/messages/thread/'+CUR+'/reply-photo',{method:'POST',headers:H(),body:fd}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(done).catch(fail2);
  }else{
    api('/thread/'+CUR+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:body})}).then(done).catch(fail2);
  }
});

document.querySelectorAll('.back').forEach(function(b){b.addEventListener('click',function(){show('listView');loadThreads();});});

document.getElementById('archToggle').addEventListener('click',function(){
  SHOW_ARCHIVED=!SHOW_ARCHIVED;
  this.classList.toggle('active',SHOW_ARCHIVED);
  this.setAttribute('aria-pressed',SHOW_ARCHIVED?'true':'false');
  this.textContent=SHOW_ARCHIVED?'🗄️ Viewing archived':'🗄️ Archived';
  loadThreads();
});

// No child linked / sign-in failed: there is nothing to compose, so the top-bar action goes too.
function noAction(){
  SIGNED_OUT=true;
  function go(){if(window.LapShell)LapShell.setAction(null);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(go,0);});else go();
}
// If the shell script never built the top bar, the old big button is the way in. (And the short "+ New" in the top
// bar is named in full for a screen reader.)
document.addEventListener('DOMContentLoaded',function(){setTimeout(function(){
  var act=document.querySelector('.lap-top .lap-act');if(act)act.setAttribute('aria-label','New message');
  if(!document.querySelector('.lap-top')&&!SIGNED_OUT)document.getElementById('newBtn').classList.add('lap-fallback');
},0);});

// Boot: mint parent token from CF Access session, then load
function boot(){
  var el=document.getElementById('threads');
  fetch('/api/auth/cf-auto-login',{credentials:'include'}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});}).then(function(res){
    if(!res.ok||!res.j.token){
      noAction();WrenParentEmpty.render(el,'nochild');return;
    }
    TOKEN=res.j.token;CHILD=res.j.child;CHILDREN=res.j.children||(res.j.child?[res.j.child]:[]);populateChildPicker();loadThreads();applyComposeHandoff();
  }).catch(function(){noAction();fail(el,function(){location.reload();});});
}
boot();
</script>  <script src="/js/wren-lightbox.js" defer></script>
<script src="/js/welcome-msg-badge.js" defer></script>
</body></html>
