<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Nursery — My reports</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* colour-ok-begin: the parents-app light-mode palette defaults — the same :root block every /welcome page carries; parents-app.css overrides every one of these in dark mode */
:root{
  --green:#2d5a4a;--green-d:#1e3d31;--green-l:#3d7a64;
  --orange:#f0a050;--orange-d:#d8823a;
  --cream:#fefcf8;--cream-d:#f5f0e8;
  --text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0;
  --on-green:#fff;
}
/* colour-ok-end */
body{font-family:'Nunito',system-ui,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
h1,h2,h3{font-family:'Crimson Pro',Georgia,serif}
a{color:var(--lap-ink,var(--green));text-decoration:none}
.nav{background:var(--green);position:sticky;top:0;z-index:100;width:100%;left:0;right:0}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px}
.nav-logo img{height:40px;display:block}
.nav-links{display:flex;gap:4px}
.nav-link{color:color-mix(in srgb, var(--on-green) 80%, transparent);font-size:.9rem;font-weight:600;padding:6px 14px;border-radius:6px}
.nav-link.active{color:var(--on-green);border-bottom:2px solid var(--orange);border-radius:0;padding-bottom:4px}
.page-hero{background:var(--green);color:var(--on-green);padding:52px 20px 36px;text-align:center}
.page-hero h1{font-size:2.1rem;margin-bottom:10px}
.page-hero p{font-size:.95rem;opacity:.85;max-width:540px;margin:0 auto;line-height:1.65}
.container{max-width:640px;margin:0 auto;padding:32px 20px 60px}
.mr-card{background:var(--surface,var(--cream-d));border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.mr-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.mr-pill{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:3px 9px;border:1px solid var(--border);color:var(--text-m)}
.mr-pill.status-fixed{background:var(--green);border-color:var(--green);color:var(--lap-on-accent,var(--on-green))}
.mr-pill.status-wont_fix{background:var(--border);color:var(--text-m)}
.mr-date{font-size:.76rem;color:var(--text-m);margin-left:auto}
.mr-body{font-size:.94rem;color:var(--text)}
.mr-release{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:.82rem;color:var(--text-m)}
.empty{background:var(--surface,var(--cream-d));border:1px dashed var(--border);border-radius:16px;padding:28px;text-align:center;color:var(--text-m);font-size:.9rem}
.err{color:var(--orange-d);font-size:.9rem;text-align:center;padding:20px}
footer{background:var(--green-d);color:color-mix(in srgb, var(--on-green) 70%, transparent);text-align:center;padding:24px 20px;font-size:.82rem;margin-top:20px}
</style>
<script src="/pwa.js" defer></script>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/welcome" class="nav-logo"><img src="/little-angels-logo.png" alt="Your Nursery"></a>
    <div class="nav-links">
      <a href="/welcome" class="nav-link">Home</a>
      <a href="/welcome/my-reports" class="nav-link active">My reports</a>
    </div>
  </div>
</nav>

<div class="page-hero">
  <h1>My reports</h1>
  <p>Everything you've told us — bugs you've spotted and things you'd like us to change. We fix reported
    problems every week; updates go live early Friday morning.</p>
</div>

<div class="container" id="mr-container">
  <p class="empty">Loading…</p>
</div>

<footer>
  <strong>Your Nursery</strong> · 123 Example Lane, Your Town, AB1 2CD
</footer>

<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  // Every call here is bearer-only (src/middleware/auth.js, or parentAuth in src/routes/parents.js).
  // 'wren_token' is never set on the parents portal, so this used to send an empty bearer, get a
  // 401, and lap-boot.js bounced the parent to /login. Use the shell's one-per-tab token, as
  // working-on.html does; with no token, don't make the call at all — a 401 here would be ours,
  // not a signed-out parent. pwa.js is deferred, so a call made while the page is still parsing
  // waits for DOMContentLoaded, by which point LapShell exists.
  function shellToken(){
    if (window.LapShell && LapShell.token) return LapShell.token();
    if (document.readyState !== 'loading') return Promise.resolve(null);
    return new Promise(function(done){
      document.addEventListener('DOMContentLoaded', function(){ done(window.LapShell && LapShell.token ? LapShell.token() : null); });
    });
  }
  function authFetch(path, opts){
    return shellToken().then(function(t){
      if (!t) throw new Error('no token');
      opts = opts || {};
      opts.credentials = 'include';
      opts.headers = Object.assign({ 'Authorization': 'Bearer ' + t }, opts.headers || {});
      return fetch(path, opts);
    });
  }
  function fmtDate(d){ return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }

  // Two stores, b395: "Report a bug" (feedback_reports, portal='parents') and
  // "Tell us what to change" (parent_app_feedback) — see src/routes/feedback.js
  // GET /mine and src/routes/parent-app-feedback.js GET /mine. One list here,
  // not two bug stores.
  var STATUS_LABEL = {
    new: 'Received', triaged: 'Looking into it', in_progress: 'Looking into it',
    fixed: 'Fixed', wont_fix: 'Not something we’ll change',
  };

  function card(r) {
    var label = STATUS_LABEL[r.status] || 'Received';
    var pillClass = r.status === 'fixed' ? 'status-fixed' : r.status === 'wont_fix' ? 'status-wont_fix' : '';
    var title = r.title || (String(r.body || '').split('\n')[0].slice(0, 80)) || 'Report';
    return '<div class="mr-card"><div class="mr-top">'
      + '<span class="mr-pill ' + pillClass + '">' + esc(label) + '</span>'
      + '<span class="mr-date">' + esc(fmtDate(r.created_at)) + '</span>'
      + '</div><div class="mr-body">' + esc(title) + '</div>'
      + (r.status === 'fixed' && r.fixed_at
          ? '<div class="mr-release">Fixed in the update on ' + esc(fmtDate(r.fixed_at)) + '</div>'
          : '')
      + '</div>';
  }

  function noTokenOrEmpty(e){ if (e && e.message === 'no token') throw e; return []; }

  function load() {
    var box = document.getElementById('mr-container');
    Promise.all([
      // One store failing must not hide the other — but no token at all is the page's error state, not an empty list.
      authFetch('/api/parent-app-feedback/mine').then(function(r){ return r.ok ? r.json() : []; }).catch(noTokenOrEmpty),
      authFetch('/api/feedback/mine').then(function(r){ return r.ok ? r.json() : []; }).catch(noTokenOrEmpty),
    ]).then(function(results){
      var rows = [].concat(results[0] || [], results[1] || []);
      rows.sort(function(a, b){ return new Date(b.created_at) - new Date(a.created_at); });
      if (!rows.length) { box.innerHTML = '<p class="empty">Nothing yet. Whatever you send us will be listed here.</p>'; return; }
      box.innerHTML = rows.map(function(r){ return card({
        title: r.title, body: r.body, created_at: r.created_at,
        status: r.triage_status || r.status, fixed_at: r.fixed_at,
      }); }).join('');
    }).catch(function(){ box.innerHTML = '<p class="err">Could not load your reports just now.</p>'; });
  }

  document.addEventListener('DOMContentLoaded', load);
})();
</script>
</body>
</html>
