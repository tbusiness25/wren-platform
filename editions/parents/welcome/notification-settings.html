<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notification settings — Your Nursery</title>
<meta name="lap-title" content="Notifications">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d5a4a;--green-d:#1e3d31;--green-l:#3d7a64;
  --orange:#f0a050;--orange-d:#d8823a;
  --cream:#fefcf8;--cream-d:#f5f0e8;
  --text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0;
}
body{font-family:'Nunito',system-ui,-apple-system,Arial,sans-serif;background:var(--cream);color:var(--text);line-height:1.6}
a{color:var(--lap-ink,var(--green));text-decoration:none}

/* ── b340 (2026-09-18) — how we tell you. One card for push on THIS phone, then one row per category with the
   four choices. Each choice is a 48px target; the row says what it does today and, when a choice needs something
   that is not set up (a phone for push), says so in the same place rather than saving it silently. */
.ns{max-width:700px;margin:0 auto;padding:14px 16px 28px}
.ns-lead{font-size:.92rem;line-height:1.5;color:var(--text);margin:2px 2px 14px}
.ns-h{font-family:'Crimson Pro',Georgia,serif;font-size:1.15rem;line-height:1.25;color:var(--lap-ink,var(--green));margin:22px 2px 8px}
.ns-card{background:var(--surface,#fff);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ns-card h3{font-size:1rem;line-height:1.3;color:var(--text);margin:0 0 4px}
.ns-card p{font-size:.88rem;color:var(--text-m);margin-top:6px}
.ns-card p.ns-state{color:var(--text)}
.ns-note{font-size:.84rem;color:var(--text);background:var(--lap-tint-orange,#fdf5e8);border-left:3px solid var(--orange);border-radius:8px;padding:9px 11px;margin-top:10px;line-height:1.5}
.ns-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;padding:0 16px;border:1.5px solid var(--green);border-radius:12px;background:var(--green);color:#fff;font:800 .92rem Nunito,system-ui,sans-serif;cursor:pointer}
.ns-btn.quiet{background:var(--cream);color:var(--lap-ink,var(--green));border-color:var(--border)}
.ns-btn:disabled{opacity:.6;cursor:default}
.ns-dev{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:8px;padding:8px 0;border-top:1px solid var(--border);font-size:.86rem}
.ns-dev span{min-width:0;overflow-wrap:anywhere}
.ns-dev button{flex:0 0 auto;min-height:44px;padding:0 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--cream);color:var(--lap-ink,var(--green));font:800 .82rem Nunito,system-ui,sans-serif;cursor:pointer}
.ns-row{background:var(--surface,#fff);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ns-row h3{font-size:1rem;line-height:1.3;color:var(--text);margin:0}
.ns-row p{font-size:.86rem;color:var(--text-m);margin-top:4px}
.ns-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ns-seg button{min-height:48px;padding:0 10px;border:1.5px solid var(--border);border-radius:12px;background:var(--cream);color:var(--text);font:800 .9rem Nunito,system-ui,sans-serif;cursor:pointer}
.ns-seg button:hover{border-color:var(--green)}
.ns-seg button[aria-checked="true"]{background:var(--green);border-color:var(--green);color:#fff}
.ns-seg button:disabled{opacity:.5;cursor:default}
.ns-src{font-size:.76rem;color:var(--text-m);margin-top:8px;font-style:italic}
.ns-warn{font-size:.82rem;color:var(--text);background:var(--lap-tint-orange,#fdf5e8);border-left:3px solid var(--orange);border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.5}
.ns-foot{font-size:.84rem;color:var(--text-m);margin:12px 2px 0}
.ns .lap-fold{margin:14px 0 0}
.ns .lap-fold-body p{font-size:.86rem;color:var(--text-m);margin:0 0 8px}
.ns .lap-fold-body p b{color:var(--text)}
.ns-skel{height:120px;margin-top:10px;border-radius:14px;background:linear-gradient(90deg,var(--cream-d) 0%,var(--surface,#fff) 50%,var(--cream-d) 100%);background-size:200% 100%;animation:nssk 1.2s ease-in-out infinite}
@keyframes nssk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.ns-skel{animation:none}}
#toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--green-d);color:#fff;padding:10px 20px;border-radius:10px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:200;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1}
</style>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
<script src="/pwa.js" defer></script>
</head>
<body>

<main class="ns" id="ns">
  <p class="ns-lead">Choose how we tell you about things. Everything always appears under the bell 🔔 in the app — this only decides whether we <em>also</em> nudge you, by push on your phone or by email.</p>
  <div id="ns-body"><div class="ns-skel" aria-hidden="true"></div><div class="ns-skel" aria-hidden="true"></div></div>
</main>
<div id="toast" role="status"></div>

<script src="/js/wren-parent-empty.js"></script>
<script>
(function () {
  'use strict';
  var API = '/welcome/notifications/api';
  var body = document.getElementById('ns-body');
  var DATA = null, THIS_ENDPOINT = null, PUSH_MSG = null, TOAST_T;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(TOAST_T); TOAST_T = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  function call(method, path, payload) {
    return fetch(API + path, { method: method, credentials: 'same-origin',
      headers: payload ? { 'Content-Type': 'application/json' } : undefined, body: payload ? JSON.stringify(payload) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || r.status); e.status = r.status; throw e; } return j; }); });
  }
  function urlB64ToUint8(b64) {
    var pad = '='.repeat((4 - b64.length % 4) % 4), raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/')), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // ── What this phone can do, said in plain words ────────────────────────────────────────────────
  function isIos() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function isInstalled() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function supported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }

  // → { kind: 'unsupported'|'ios-install'|'denied'|'not-configured'|'off'|'on', text }
  function pushState() {
    if (isIos() && !isInstalled()) return { kind: 'ios-install',
      text: 'On an iPhone or iPad, push only works once Your Nursery is added to your Home Screen. Tap the Share button, choose Add to Home Screen, open Your Nursery from there, and come back to this page. Until then you can choose email instead.' };
    if (!supported()) return { kind: 'unsupported', text: 'This browser cannot receive push notifications. You can choose email instead.' };
    if (!DATA.push.configured) return { kind: 'not-configured', text: 'Push is not switched on for the nursery yet. You can choose email instead.' };
    if (Notification.permission === 'denied') return { kind: 'denied',
      text: 'Notifications are blocked for Your Nursery on this phone. To turn them on, open your browser or phone settings, allow notifications for this site, then come back here. Or choose email instead.' };
    var mine = THIS_ENDPOINT && DATA.push.devices.some(function (d) { return d.endpoint === THIS_ENDPOINT; });
    return mine ? { kind: 'on', text: 'Push is on for this phone.' } : { kind: 'off', text: 'Push is off on this phone.' };
  }

  function pushCard() {
    var st = pushState(), h = '<section class="ns-card" id="ns-push"><h3>Push on this phone</h3>';
    h += '<p class="ns-state">' + esc(PUSH_MSG || st.text) + '</p>';
    if (st.kind === 'off') h += '<button type="button" class="ns-btn" id="ns-on">Turn on push on this phone</button>';
    if (st.kind === 'on') h += '<button type="button" class="ns-btn quiet" id="ns-off">Turn off on this phone</button>';
    if (st.kind === 'ios-install' || st.kind === 'unsupported' || st.kind === 'denied' || st.kind === 'not-configured')
      h += '<button type="button" class="ns-btn quiet" id="ns-goemail">Choose email instead</button>';
    var others = DATA.push.devices.filter(function (d) { return d.endpoint !== THIS_ENDPOINT; });
    if (others.length) {
      h += '<p style="margin-top:12px">Other phones with push turned on:</p>';
      h += others.map(function (d) { return '<div class="ns-dev"><span>' + esc(d.label) + '</span><button type="button" data-rm="' + d.id + '">Remove</button></div>'; }).join('');
    }
    return h + '</section>';
  }

  // ── One row per category ───────────────────────────────────────────────────────────────────────
  var CHOICE = { push: 'Push', email: 'Email', both: 'Push + email', off: 'Off' };
  function hasDevice() { return DATA.push.devices.length > 0; }

  function catRow(c) {
    var h = '<section class="ns-row" data-cat="' + esc(c.id) + '"><h3>' + esc(c.label) + '</h3><p>' + esc(c.help) + '</p>';
    h += '<div class="ns-seg" role="radiogroup" aria-label="' + esc(c.label) + '">';
    ['push', 'email', 'both', 'off'].forEach(function (ch) {
      if (c.channels.indexOf(ch) < 0) return;
      h += '<button type="button" role="radio" aria-checked="' + (c.channel === ch) + '" data-ch="' + ch + '">' + CHOICE[ch] + '</button>';
    });
    h += '</div>';
    if ((c.channel === 'push' || c.channel === 'both') && !hasDevice())
      h += '<div class="ns-warn">No phone is set up for push yet, so nothing will be sent. Turn it on at the top of this page.</div>';
    if (c.channel === 'email' || c.channel === 'both') h += '<div class="ns-src">' + esc(c.email_help) + '</div>';
    h += '<div class="ns-src">' + (c.chosen ? 'You chose this.' : 'You have not chosen — this is how it works today.') + '</div>';
    return h + '</section>';
  }

  function paint() {
    var h = pushCard() + '<h2 class="ns-h">How we tell you</h2>' + DATA.categories.map(catRow).join('');
    h += '<p class="ns-foot" id="ns-mail">Email goes to <b>' + esc(DATA.email_hint || 'the address you signed in with') + '</b>.</p>';
    if (DATA.not_yet && DATA.not_yet.length) {
      h += '<details class="lap-fold"><summary>Also in the app — no separate alert yet</summary><div class="lap-fold-body">'
        + DATA.not_yet.map(function (n) { return '<p><b>' + esc(n.label) + '.</b> ' + esc(n.note) + '</p>'; }).join('') + '</div></details>';
    }
    body.innerHTML = h;
  }

  // ── Actions ────────────────────────────────────────────────────────────────────────────────────
  function turnOn() {
    var btn = document.getElementById('ns-on'); if (btn) btn.disabled = true;
    // Notification.requestPermission() is called straight from the tap, which is the only moment a phone allows it.
    Notification.requestPermission().then(function (perm) {
      if (perm === 'denied') { PUSH_MSG = null; return paint(); }
      if (perm !== 'granted') { PUSH_MSG = 'You did not allow notifications, so push is still off. Tap the button again when you are ready.'; return paint(); }
      return call('GET', '/push/config').then(function (cfg) {
        if (!cfg.configured || !cfg.key) throw new Error('not_configured');
        return navigator.serviceWorker.ready.then(function (reg) {
          return reg.pushManager.getSubscription().then(function (sub) {
            return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(cfg.key) });
          });
        });
      }).then(function (sub) {
        THIS_ENDPOINT = sub.endpoint;
        return call('POST', '/push/subscribe', { subscription: sub.toJSON() });
      }).then(function (d) { DATA = d; PUSH_MSG = null; paint(); toast('Push is on for this phone'); });
    }).catch(function (e) {
      PUSH_MSG = e && e.message === 'not_configured'
        ? 'Push is not switched on for the nursery yet. You can choose email instead.'
        : 'We could not turn push on for this phone. You can try again, or choose email instead.';
      paint();
    });
  }

  function turnOff() {
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      var ep = sub ? sub.endpoint : THIS_ENDPOINT;
      return (sub ? sub.unsubscribe() : Promise.resolve()).then(function () { return call('POST', '/push/unsubscribe', { endpoint: ep }); });
    }).then(function (d) { DATA = d; THIS_ENDPOINT = null; PUSH_MSG = null; paint(); toast('Push is off on this phone'); })
      .catch(function () { toast('Could not turn it off — please try again'); });
  }

  function choose(catId, ch) {
    var c = DATA.categories.filter(function (x) { return x.id === catId; })[0]; if (!c || c.channel === ch && c.chosen) return;
    var before = { channel: c.channel, chosen: c.chosen };
    c.channel = ch; c.chosen = true; paint();          // instant, like the consent choices
    call('PUT', '/prefs', { category: catId, channel: ch }).then(function (d) { DATA = d; paint(); toast('Saved'); })
      .catch(function () { c.channel = before.channel; c.chosen = before.chosen; paint(); toast('Could not save — please try again'); });
  }

  body.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.id === 'ns-on') return turnOn();
    if (t.id === 'ns-off') return turnOff();
    if (t.id === 'ns-goemail') { var first = body.querySelector('.ns-row'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (t.hasAttribute('data-rm')) {
      return call('DELETE', '/push/devices/' + t.getAttribute('data-rm')).then(function (d) { DATA = d; paint(); toast('Removed'); })
        .catch(function () { toast('Could not remove it — please try again'); });
    }
    var row = t.closest('.ns-row');
    if (row && t.hasAttribute('data-ch')) choose(row.getAttribute('data-cat'), t.getAttribute('data-ch'));
  });

  function fail() { WrenParentEmpty.render(body, navigator.onLine === false ? 'offline' : 'error', { action: { label: 'Try again', onClick: function () { location.reload(); } } }); }

  call('GET', '/prefs').then(function (d) {
    DATA = d;
    var p = supported() ? navigator.serviceWorker.getRegistration().then(function (reg) { return reg ? reg.pushManager.getSubscription() : null; }).catch(function () { return null; }) : Promise.resolve(null);
    return p.then(function (sub) { THIS_ENDPOINT = sub ? sub.endpoint : null; paint(); });
  }).catch(fail);
})();
</script>
</body>
</html>
