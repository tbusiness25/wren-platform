<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Survey — Your Nursery</title>
<meta name="lap-title" content="Survey">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* b339 (2026-09-18) — this page used to be a navy dark theme of its own (#0f172a, hex throughout),
   which sat under the shell's green top bar as a different app. It now reads the same tokens as the
   rest of /welcome, so it is light in the light theme and dark in the dark one. */
:root{
  --green:#2d5a4a;--green-d:#1e3d31;--orange:#f0a050;--orange-d:#d8823a;
  --cream:#fefcf8;--cream-d:#f5f0e8;--text:#2a2a2a;--text-m:#5a5a5a;--border:#e8e0d0;
  --sv-ok:#1f7a45;--sv-no:#b42318;--star-off:#8a8a8a;--star-on:#b7791f;
}
html.lap-dark{--sv-ok:#5fcf9a;--sv-no:#ff9a90;--star-off:#7c8c83;--star-on:#f5b52e}
body{font-family:system-ui,Arial,sans-serif;background:var(--cream);color:var(--text);padding:14px 14px 40px;min-height:100vh;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-top:10px}
/* the logo block: the shell's top bar already carries the logo and the screen name, so inside the app
   this is hidden (it stays in the markup as the fallback if the shell script does not load) */
.header{text-align:center;margin-bottom:28px;padding-top:8px}
html.lap-shell .header{display:none}
.logo-wrap{background:#fff;border-radius:12px;display:inline-block;padding:10px 18px;margin-bottom:16px}
.logo-wrap img{height:44px}
h1{font-family:'Arial Rounded MT Bold','Nunito',Arial,sans-serif;font-size:1.25rem;margin-bottom:6px}
.blue{color:var(--lap-ink,var(--green))}.orange{color:var(--lap-on-orange,#3a2a12)}
.subtitle{color:var(--text-m);font-size:.85rem;line-height:1.5}

/* The survey's own name — small, because the top bar says "Survey" and the first question is what matters */
.sv-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:2px 2px 10px}
.sv-head h2{font-family:'Arial Rounded MT Bold','Nunito',Arial,sans-serif;font-size:1.1rem;line-height:1.25;color:var(--lap-ink,var(--green))}
.sv-chip{display:inline-block;background:var(--lap-tint-blue,#e8f4fd);color:var(--text);border-radius:999px;font-size:.74rem;font-weight:700;padding:2px 10px}
.sv-chip[hidden]{display:none}
#sv-about .lap-fold-body p{margin:0}

/* Questions */
.section{background:var(--surface,#fff);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.q-label{font-size:.95rem;color:var(--text);margin-bottom:10px;font-weight:600;line-height:1.45}
.q-required{color:var(--sv-no);margin-left:3px}
input[type=text],input[type=email],textarea,select{width:100%;background:var(--surface,#fff);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 13px;font-size:16px;font-family:inherit;outline:none;transition:.2s}
input[type=text]:focus,input[type=email]:focus,textarea:focus,select:focus{border-color:var(--green)}
textarea{min-height:90px;resize:vertical}
.radio-group,.check-group{display:flex;flex-direction:column;gap:7px}
.radio-item,.check-item{display:flex;align-items:center;gap:10px;padding:9px 13px;min-height:44px;background:var(--cream-d);color:var(--text);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.2s}
.radio-item:hover,.check-item:hover{border-color:var(--green)}
.radio-item input,.check-item input{width:18px;height:18px;accent-color:var(--green);flex-shrink:0}
/* Star rating — every star is a 44px target; the unlit star is a mid grey that holds 3:1 on the card */
.star-row{display:flex;gap:2px;margin:-4px 0 -4px -8px}
.star{font-size:1.8rem;cursor:pointer;color:var(--star-off);line-height:1;transition:.1s;user-select:none;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.star.lit{color:var(--star-on)}
/* Yes/No */
.yn-row{display:flex;gap:10px}
.yn-btn{flex:1;min-height:46px;padding:12px;border-radius:10px;border:2px solid var(--border);background:var(--cream-d);color:var(--text-m);font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit}
.yn-btn:hover{border-color:var(--green);color:var(--text)}
.yn-btn.selected-yes{border-color:var(--sv-ok);background:var(--lap-tint-green,#e4f3ea);color:var(--sv-ok)}
.yn-btn.selected-no{border-color:var(--sv-no);background:var(--lap-tint-red,#fbe4e0);color:var(--sv-no)}

/* Single-choice radios reuse .radio-item; "Other" free-text reveal */
.other-text{margin-top:8px;display:none}
/* NPS 0-10 — six to a row, each one a 50px target */
.nps-row{display:flex;flex-wrap:wrap;gap:6px}
.nps-btn{flex:0 0 calc((100% - 30px)/6);min-height:46px;padding:10px 0;text-align:center;border-radius:10px;border:2px solid var(--border);background:var(--cream-d);color:var(--text-m);font-size:.95rem;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
.nps-btn:hover{border-color:var(--green);color:var(--text)}
.nps-btn.sel{border-color:var(--orange);background:var(--lap-tint-orange,#fdeede);color:var(--text)}
.nps-scale{display:flex;justify-content:space-between;font-size:.74rem;color:var(--text-m);margin-top:6px}
/* Anonymity notice (now inside the "About this survey" fold) */
.anon-note{background:var(--lap-tint-blue,#e8f4fd);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:.85rem;color:var(--text);line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.anon-note b{color:var(--lap-ink,var(--green))}
/* Submit */
.btn{width:100%;background:var(--orange);color:var(--lap-on-orange,#3a2a12);border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;min-height:48px;transition:.2s;font-family:inherit}
.btn:hover{background:var(--orange-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.success{background:var(--lap-tint-green,#e4f3ea);border:1px solid var(--sv-ok);border-radius:12px;padding:32px;text-align:center;display:none;color:var(--text)}
.success h2{color:var(--sv-ok);font-size:1.2rem;margin-bottom:8px}
.error-msg{background:var(--lap-tint-red,#fbe4e0);border:1px solid var(--sv-no);border-radius:10px;padding:12px 16px;font-size:.88rem;color:var(--text);margin-bottom:14px;display:none}
/* loading skeleton — the shape of the survey (a title, then question cards) so the page does not jump */
.sv-skel{height:110px;margin-bottom:12px;border-radius:12px;background:linear-gradient(90deg,var(--cream-d) 0%,var(--surface,#fff) 50%,var(--cream-d) 100%);background-size:200% 100%;animation:svsk 1.2s ease-in-out infinite}
.sv-skel.short{height:28px;width:60%}
@keyframes svsk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sv-skel{animation:none}}
</style>
<script src="/pwa.js" defer></script>
<link rel="stylesheet" href="/css/parents-app.css" data-parents-app-css="1">
<script src="/js/lap-boot.js"></script>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo-wrap"><img src="/little-angels-logo.png" alt="Your Nursery"></div>
    <h1><span class="blue">Your Nursery</span> <span class="orange">Day Nursery</span></h1>
  </div>

  <div id="loading" class="sv-loading" aria-busy="true"><div class="sv-skel short"></div><div class="sv-skel"></div><div class="sv-skel"></div></div>
  <div id="not-found" style="display:none"></div>

  <div id="survey-wrap" style="display:none">
    <div class="sv-head">
      <h2 id="sv-name"></h2>
      <span id="sv-chip" class="sv-chip" hidden>🔒 Anonymous</span>
    </div>
    <!-- b339 (2026-09-18) — the description (and the anonymity note) sit in a fold, closed, so the first
         question is on the first screen; the words are the survey's own, unchanged. -->
    <details class="lap-fold" id="sv-about" hidden>
      <summary>About this survey</summary>
      <div class="lap-fold-body">
        <p id="sv-desc" class="subtitle"></p>
        <div id="sv-anon"></div>
      </div>
    </details>

    <div id="error-msg" class="error-msg" role="alert"></div>
    <div id="questions"></div>

    <div style="margin-top:16px">
      <button class="btn" id="submit-btn">Submit Survey</button>
    </div>
  </div>

  <div id="success-msg" class="success">
    <h2>Thank you!</h2>
    <p>Your response has been recorded. We really appreciate you taking the time to share your thoughts.</p>
  </div>
</div>

<script src="/js/wren-parent-empty.js"></script>
<script>
(function(){
  const slug = (window.location.pathname.match(/\/surveys\/([^/?#]+)/) || [])[1];
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t') || '';

  if (!slug) { showNotFound(); return; }

  // Fetch template from API
  const apiUrl = '/api/survey/render/' + slug + (token ? '?t=' + encodeURIComponent(token) : '');
  function loadSurvey() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('not-found').style.display = 'none';
    fetch(apiUrl)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(template => renderSurvey(template))
      .catch(code => {
        document.getElementById('loading').style.display = 'none';
        // 400/403/404/410 = this link or survey is not there; anything else (a 5xx, or no network) is
        // worth another try, so it gets a Try again rather than being called "not found".
        if (code === 400 || code === 403 || code === 404 || code === 410) showNotFound();
        else showLoadError();
      });
  }

  function showNotFound() {
    const nf = document.getElementById('not-found');
    nf.style.display = 'block';
    WrenParentEmpty.render(nf, 'surveys', {
      title: 'Survey not found',
      text: 'This link may have expired or the survey is no longer available.',
      action: { label: 'See all surveys', href: '/welcome/surveys' }
    });
  }
  function showLoadError() {
    const nf = document.getElementById('not-found');
    nf.style.display = 'block';
    WrenParentEmpty.render(nf, navigator.onLine === false ? 'offline' : 'error', {
      action: { label: 'Try again', onClick: loadSurvey }
    });
  }

  function renderSurvey(t) {
    document.getElementById('loading').style.display = 'none';
    document.title = t.name + ' — Your Nursery';
    document.getElementById('sv-name').textContent = t.name;
    const descEl = document.getElementById('sv-desc');
    if (t.description) { descEl.textContent = t.description; } else { descEl.style.display = 'none'; }

    const qContainer = document.getElementById('questions');
    const answers = {};

    // Anonymity notice — reassure respondents on staff/anonymous surveys. The one-word badge is on the
    // title line; the full wording is in the fold, where the description is.
    if (t.anonymous) {
      document.getElementById('sv-chip').hidden = false;
      const note = document.createElement('div');
      note.className = 'anon-note';
      note.innerHTML = '<span aria-hidden="true">🔒</span><div><b>Anonymous</b> — your answers can’t be traced back to you. We only ever see combined results, and never break them down for small groups.</div>';
      document.getElementById('sv-anon').appendChild(note);
    }
    if (t.description || t.anonymous) document.getElementById('sv-about').hidden = false;

    (t.questions || []).forEach((q, idx) => {
      const section = document.createElement('div');
      section.className = 'section';
      const label = document.createElement('div');
      label.className = 'q-label';
      label.innerHTML = `${idx+1}. ${q.label}${q.required ? '<span class="q-required">*</span>' : ''}`;
      section.appendChild(label);

      if (q.type === 'rating') {
        const row = document.createElement('div');
        row.className = 'star-row';
        answers[q.id] = 0;
        for (let s = 1; s <= 5; s++) {
          const star = document.createElement('span');
          star.className = 'star';
          star.textContent = '★';
          star.dataset.val = s;
          star.addEventListener('click', () => {
            answers[q.id] = s;
            row.querySelectorAll('.star').forEach((st, i) => st.classList.toggle('lit', i < s));
          });
          row.appendChild(star);
        }
        section.appendChild(row);
      } else if (q.type === 'yes_no') {
        answers[q.id] = null;
        const row = document.createElement('div');
        row.className = 'yn-row';
        ['Yes', 'No'].forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'yn-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => {
            answers[q.id] = opt.toLowerCase();
            row.querySelectorAll('.yn-btn').forEach(b => {
              b.classList.remove('selected-yes', 'selected-no');
            });
            btn.classList.add(opt === 'Yes' ? 'selected-yes' : 'selected-no');
          });
          row.appendChild(btn);
        });
        section.appendChild(row);
      } else if (q.type === 'multi_choice') {
        answers[q.id] = [];
        const group = document.createElement('div');
        group.className = 'check-group';
        (q.options || []).forEach(opt => {
          const item = document.createElement('label');
          item.className = 'check-item';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.value = opt;
          cb.addEventListener('change', () => {
            if (cb.checked) { if (!answers[q.id].includes(opt)) answers[q.id].push(opt); }
            else answers[q.id] = answers[q.id].filter(v => v !== opt);
          });
          item.appendChild(cb);
          item.appendChild(document.createTextNode(opt));
          group.appendChild(item);
        });
        section.appendChild(group);
      } else if (q.type === 'single_choice') {
        answers[q.id] = null;
        const group = document.createElement('div');
        group.className = 'radio-group';
        const other = document.createElement('input');
        other.type = 'text'; other.className = 'other-text'; other.placeholder = 'Please tell us…';
        (q.options || []).forEach(opt => {
          const item = document.createElement('label');
          item.className = 'radio-item';
          const rb = document.createElement('input');
          rb.type = 'radio'; rb.name = q.id; rb.value = opt;
          rb.addEventListener('change', () => {
            const isOther = q.allow_other && /^other$/i.test(opt);
            other.style.display = isOther ? 'block' : 'none';
            answers[q.id] = isOther ? (other.value.trim() || opt) : opt;
          });
          item.appendChild(rb);
          item.appendChild(document.createTextNode(opt));
          group.appendChild(item);
        });
        other.addEventListener('input', () => { answers[q.id] = other.value.trim() || 'Other'; });
        section.appendChild(group);
        if (q.allow_other) section.appendChild(other);
      } else if (q.type === 'nps') {
        answers[q.id] = null;
        const row = document.createElement('div');
        row.className = 'nps-row';
        for (let s = 0; s <= 10; s++) {
          const btn = document.createElement('button');
          btn.type = 'button'; btn.className = 'nps-btn'; btn.textContent = s;
          btn.addEventListener('click', () => {
            answers[q.id] = s;
            row.querySelectorAll('.nps-btn').forEach(b => b.classList.remove('sel'));
            btn.classList.add('sel');
          });
          row.appendChild(btn);
        }
        section.appendChild(row);
        const scale = document.createElement('div');
        scale.className = 'nps-scale';
        scale.innerHTML = '<span>Not at all likely</span><span>Extremely likely</span>';
        section.appendChild(scale);
      } else if (q.type === 'email') {
        answers[q.id] = '';
        const inp = document.createElement('input');
        inp.type = 'email'; inp.placeholder = 'you@example.com';
        inp.addEventListener('input', () => { answers[q.id] = inp.value.trim(); });
        section.appendChild(inp);
      } else if (q.type === 'room') {
        answers[q.id] = '';
        const sel = document.createElement('select');
        sel.innerHTML = '<option value="">Prefer not to say</option><option>Baby Room</option><option>Pre-school</option>';
        sel.addEventListener('change', () => { answers[q.id] = sel.value; });
        section.appendChild(sel);
      } else if (q.type === 'text') {
        answers[q.id] = '';
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.placeholder = 'Your answer…';
        inp.addEventListener('input', () => { answers[q.id] = inp.value; });
        section.appendChild(inp);
      } else if (q.type === 'long_text') {
        answers[q.id] = '';
        const ta = document.createElement('textarea');
        ta.placeholder = 'Your answer…';
        ta.addEventListener('input', () => { answers[q.id] = ta.value; });
        section.appendChild(ta);
      }

      qContainer.appendChild(section);
    });

    document.getElementById('survey-wrap').style.display = 'block';

    document.getElementById('submit-btn').addEventListener('click', function() {
      // Validate required questions
      const questions = t.questions || [];
      for (const q of questions) {
        if (!q.required) continue;
        const val = answers[q.id];
        // NPS: 0 is a valid score — only null/undefined counts as unanswered.
        const missing = (q.type === 'nps')
          ? (val === null || val === undefined)
          : (val === null || val === undefined || val === '' || val === 0 || (Array.isArray(val) && val.length === 0));
        if (missing) {
          showError('Please answer all required questions (marked with *).');
          return;
        }
      }

      this.disabled = true;
      this.textContent = 'Submitting…';

      fetch('/api/survey/submit-template', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: t.slug, responses: answers, token })
      })
      .then(r => r.ok ? r.json() : r.json().then(d => Promise.reject(d)))
      .then(() => {
        document.getElementById('survey-wrap').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
        window.scrollTo(0, 0);
      })
      .catch(e => {
        this.disabled = false;
        this.textContent = 'Try again';
        showError((e && e.error) || 'Something went wrong. Please try again.');
      });
    });
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  loadSurvey();
})();
</script>
  <script src="/js/wren-lightbox.js" defer></script>
</body>
</html>
