<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="wren-edition" content="primary">
  <title>Lesson — Wren Primary</title>
  <link rel="stylesheet" href="/css/wren.css">
  <link rel="stylesheet" href="/css/wren-shell-v2.css">
<script src="/icons/wren-icons.js?v=b146" defer></script>
<script src="/js/wren-shell-v2.js" defer></script>
<style>
  /* b257 — the lesson plan, readable without PowerPoint. The .pptx IS the plan;
     this renders its slides, its speaker notes (which is where the actual
     teaching guidance lives) and the images each slide carries, and still lets
     a teacher download the original deck. */
  .les-wrap { max-width: 900px; }

  .les-head {
    background: var(--c-card); border: 1px solid var(--c-border);
    border-left: 4px solid var(--c-orange);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  .les-crumb { font-size: .76rem; color: var(--c-muted); margin-bottom: 6px; }
  .les-crumb a { color: var(--c-blue); text-decoration: none; }
  .les-head h2 { margin: 0 0 6px; font-size: 1.3rem; color: var(--c-text); }
  .les-sub { color: var(--c-muted); font-size: .9rem; margin: 0; }

  /* Staff-prep films are marked hard. A teacher who plays a 538 MB
     teacher-briefing video to a class has been failed by this page. */
  .les-staff {
    background: var(--c-surface); border: 1px solid var(--c-amber);
    border-left: 4px solid var(--c-amber);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
  }
  .les-staff .ls-title { font-weight: 700; color: var(--c-amber); font-size: .82rem;
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .les-staff .ls-note { font-size: .8rem; color: var(--c-muted); margin-bottom: 10px; }

  .les-block {
    background: var(--c-card); border: 1px solid var(--c-border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
  }
  .les-block > h3 {
    margin: 0 0 10px; font-size: .78rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--c-blue); font-weight: 700;
  }
  .vid-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .vid-item video { width: 100%; border-radius: 8px; background: var(--c-navy); display: block; }
  .vid-label { font-size: .82rem; color: var(--c-text); margin-top: 7px; }
  .vid-size  { font-size: .72rem; color: var(--c-muted); }

  .dl-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    background: var(--c-surface); border: 1px solid var(--c-border);
    border-radius: 10px; padding: 10px 14px; color: var(--c-text); font-size: .84rem;
  }
  .dl-btn:hover { border-color: var(--c-blue); }
  .dl-btn .dl-size { color: var(--c-muted); font-size: .72rem; }

  /* Slides */
  .slide-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 22px 0 12px; }
  .slide-toolbar .st-count { font-size: .78rem; color: var(--c-muted); margin-left: auto; }
  .slide {
    background: var(--c-card); border: 1px solid var(--c-border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 12px;
    display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: start;
  }
  .slide-n {
    font-size: .74rem; font-weight: 700; color: var(--c-muted);
    background: var(--c-surface); border: 1px solid var(--c-border);
    border-radius: 8px; padding: 6px 0; text-align: center;
  }
  .slide-title { font-size: 1rem; font-weight: 700; color: var(--c-text); margin-bottom: 8px; line-height: 1.35; }
  .slide-body p { margin: 0 0 7px; font-size: .87rem; color: var(--c-text); line-height: 1.55; white-space: pre-line; }
  .slide-body p:last-child { margin-bottom: 0; }
  .slide-notes {
    margin-top: 11px; background: var(--c-surface);
    border-left: 3px solid var(--c-green); border-radius: 0 8px 8px 0;
    padding: 10px 13px;
  }
  .slide-notes .sn-title {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--c-green); font-weight: 700; margin-bottom: 4px;
  }
  .slide-notes p { margin: 0; font-size: .83rem; color: var(--c-muted); line-height: 1.6; white-space: pre-line; }
  .slide-imgs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 11px; }
  .slide-imgs img {
    height: 74px; width: auto; max-width: 150px; object-fit: contain;
    background: var(--c-surface); border: 1px solid var(--c-border);
    border-radius: 8px; padding: 4px; cursor: zoom-in;
  }
  @media (max-width: 620px) { .slide { grid-template-columns: 1fr; } .slide-n { width: 54px; } }

  .les-attrib {
    margin-top: 26px; padding: 13px 15px; border-radius: 10px;
    background: var(--c-surface); border: 1px solid var(--c-border);
    font-size: .74rem; line-height: 1.55; color: var(--c-muted);
  }
  /* Full-size image viewer */
  #img-zoom {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
    align-items: center; justify-content: center; z-index: 900; padding: 20px; cursor: zoom-out;
  }
  #img-zoom.open { display: flex; }
  #img-zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>
<div id="wren-content">
  <div class="page-header">
    <div class="page-title">📖 Lesson</div>
    <a class="btn btn-secondary" href="/curriculum-programmes.html">← All programmes</a>
  </div>
  <div class="les-wrap" id="les-area">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>
</div>
<div id="img-zoom"><img alt=""></div>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function fileSize(n){
  n = Number(n)||0;
  if (n >= 1073741824) return (n/1073741824).toFixed(1) + ' GB';
  if (n >= 1048576)    return (n/1048576).toFixed(n>=10485760?0:1) + ' MB';
  if (n >= 1024)       return Math.round(n/1024) + ' KB';
  return n + ' B';
}

var TICKET = '';
function mediaUrl(p, download){
  return '/api/setting-content/file?path=' + encodeURIComponent(p)
       + (download ? '&download=1' : '') + (TICKET ? '&t=' + encodeURIComponent(TICKET) : '');
}

function videoBlock(v, base){
  return '<div class="vid-item">' +
           '<video controls preload="metadata" playsinline src="' + mediaUrl(base + '/' + v.file) + '"></video>' +
           '<div class="vid-label">' + esc(v.label) +
             ' <span class="vid-size">· ' + fileSize(v.bytes) + '</span></div>' +
         '</div>';
}

function render(les){
  var base = les.media_base || '';                       // media/toothbrushing
  var mediaRoot = base.replace(/\/lessons$/, '');
  var slidesBase = les.slides_base || '';
  var html = '';

  html += '<div class="les-head">' +
            '<div class="les-crumb"><a href="/curriculum-programmes.html">' +
              esc(les.programme_title || 'Programme') + '</a> · Lesson ' + esc(les.lesson_number) + '</div>' +
            '<h2>' + esc(les.title) + '</h2>' +
            (les.subtitle ? '<p class="les-sub">' + esc(les.subtitle) + '</p>' : '') +
          '</div>';

  // Staff prep — deliberately first, and deliberately unmissable.
  if ((les.videos_staff||[]).length) {
    html += '<div class="les-staff">' +
              '<div class="ls-title">⚠ For you, not for the class</div>' +
              '<div class="ls-note">These films brief the adult teaching the lesson. Watch before you teach — do not play them to children.</div>' +
              '<div class="vid-row">' +
                les.videos_staff.map(function(v){ return videoBlock(v, mediaRoot); }).join('') +
              '</div></div>';
  }

  if ((les.videos_class||[]).length) {
    html += '<div class="les-block"><h3>Play these to the class</h3><div class="vid-row">' +
              les.videos_class.map(function(v){ return videoBlock(v, mediaRoot); }).join('') +
            '</div></div>';
  }

  var deckAndRewards = [];
  if (les.deck && les.deck.file) {
    deckAndRewards.push('<a class="dl-btn" href="' + mediaUrl(mediaRoot + '/' + les.deck.file, true) +
      '" target="_blank" rel="noopener">🎬 Original slides (.pptx) <span class="dl-size">' +
      fileSize(les.deck.bytes) + '</span></a>');
  }
  (les.rewards||[]).forEach(function(r){
    if (!r || !r.path) return;
    deckAndRewards.push('<a class="dl-btn" href="' + mediaUrl(r.path, true) +
      '" target="_blank" rel="noopener">🏅 ' + esc(r.label) + ' <span class="dl-size">' +
      fileSize(r.bytes) + '</span></a>');
  });
  if (deckAndRewards.length) {
    html += '<div class="les-block"><h3>Downloads</h3><div class="dl-row">' +
            deckAndRewards.join('') + '</div></div>';
  }

  var slides = les.slides || [];
  var withNotes = slides.filter(function(s){ return s.notes; }).length;
  html += '<div class="slide-toolbar">' +
            '<button class="btn btn-sm btn-secondary" id="toggle-notes">Show notes only</button>' +
            '<span class="st-count">' + slides.length + ' slides · ' + withNotes + ' carry teaching notes</span>' +
          '</div>';

  html += '<div id="slide-list">' + slides.map(function(s){
    var body = (s.blocks||[]).slice(1).map(function(b){ return '<p>' + esc(b) + '</p>'; }).join('');
    var imgs = (s.images||[]).map(function(f){
      return '<img src="' + mediaUrl(slidesBase + '/' + f) + '" alt="" loading="lazy">';
    }).join('');
    return '<div class="slide' + (s.notes ? ' has-notes' : '') + '">' +
             '<div class="slide-n">' + s.n + '</div>' +
             '<div>' +
               '<div class="slide-title">' + esc(s.title) + '</div>' +
               (body ? '<div class="slide-body">' + body + '</div>' : '') +
               (imgs ? '<div class="slide-imgs">' + imgs + '</div>' : '') +
               (s.notes ? '<div class="slide-notes"><div class="sn-title">Teaching notes</div><p>' +
                          esc(s.notes) + '</p></div>' : '') +
             '</div>' +
           '</div>';
  }).join('') + '</div>';

  if (les.attribution) html += '<div class="les-attrib">' + esc(les.attribution) + '</div>';
  return html;
}

async function loadLesson(){
  var area = document.getElementById('les-area');
  var slug = new URLSearchParams(location.search).get('lesson') || '';
  if (!slug) { area.innerHTML = '<div class="alert alert-danger">No lesson specified.</div>'; return; }
  try {
    try {
      var t = await Wren.api('/api/setting-content/media-ticket');
      TICKET = (t && t.ticket) || '';
    } catch (e) { /* downloads still work through the session header */ }
    var les = await Wren.api('/api/setting-content/lessons/' + encodeURIComponent(slug));
    if (!les || les.error) throw new Error('not found');
    document.title = les.title + ' — Wren Primary';
    var t2 = document.querySelector('.page-title');
    if (t2) t2.textContent = '📖 Lesson ' + les.lesson_number + ' — ' + les.title;
    area.innerHTML = render(les);

    var onlyNotes = false;
    var btn = document.getElementById('toggle-notes');
    if (btn) btn.addEventListener('click', function(){
      onlyNotes = !onlyNotes;
      btn.textContent = onlyNotes ? 'Show every slide' : 'Show notes only';
      document.querySelectorAll('#slide-list .slide').forEach(function(el){
        el.style.display = (onlyNotes && !el.classList.contains('has-notes')) ? 'none' : '';
      });
    });

    var zoom = document.getElementById('img-zoom');
    area.addEventListener('click', function(ev){
      var img = ev.target.closest('.slide-imgs img');
      if (!img) return;
      zoom.querySelector('img').src = img.src;
      zoom.classList.add('open');
    });
    zoom.addEventListener('click', function(){ zoom.classList.remove('open'); });
  } catch (e) {
    area.innerHTML = '<div class="alert alert-danger">Could not load this lesson.</div>';
  }
}

document.addEventListener('wren:ready', loadLesson);
</script>
</body>
</html>
