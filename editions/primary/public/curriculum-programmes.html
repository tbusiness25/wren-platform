<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="wren-edition" content="primary">
  <title>Teaching Programmes — Wren Primary</title>
  <link rel="stylesheet" href="/css/wren.css">
  <link rel="stylesheet" href="/css/wren-shell-v2.css">
<script src="/icons/wren-icons.js?v=b146" defer></script>
<script src="/js/wren-shell-v2.js" defer></script>
<style>
  /* b257 — teaching programmes. A programme is a taught sequence with a front
     door, several lessons and its own materials; the Curriculum page next door
     is where a teacher writes their own weekly plans. Different things, so they
     look different: this one is a reading surface, not a form. */
  .prog-wrap { max-width: 1100px; }
  .prog-hero {
    background: var(--c-card); border: 1px solid var(--c-border);
    border-left: 4px solid var(--c-blue);
    border-radius: 12px; padding: 20px 22px; margin-bottom: 18px;
  }
  .prog-hero h2 { margin: 0 0 6px; font-size: 1.35rem; color: var(--c-text); }
  .prog-sub    { color: var(--c-muted); font-size: .92rem; margin: 0 0 12px; }
  .prog-tags   { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .prog-tag {
    font-size: .72rem; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--c-border); color: var(--c-muted); background: var(--c-surface);
  }
  .prog-front {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--c-blue); color: var(--c-navy); font-weight: 700;
    padding: 9px 16px; border-radius: 10px; text-decoration: none; font-size: .88rem;
  }
  .prog-front:hover { background: var(--c-blue-dark); }

  .prog-section-title {
    font-size: .78rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--c-orange); margin: 22px 0 10px; font-weight: 700;
  }
  .lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .lesson-card {
    display: block; text-decoration: none;
    background: var(--c-card); border: 1px solid var(--c-border);
    border-top: 4px solid var(--c-orange);
    border-radius: 12px; padding: 16px; transition: border-color .15s, transform .15s;
  }
  .lesson-card:hover { border-color: var(--c-blue); transform: translateY(-2px); }
  .lesson-n {
    display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--c-orange); margin-bottom: 6px;
  }
  .lesson-title { font-size: 1rem; font-weight: 700; color: var(--c-text); margin-bottom: 6px; }
  .lesson-sub   { font-size: .82rem; color: var(--c-muted); margin-bottom: 10px; line-height: 1.45; }
  .lesson-meta  { display: flex; gap: 10px; flex-wrap: wrap; font-size: .72rem; color: var(--c-muted); }
  .lesson-meta span { display: inline-flex; align-items: center; gap: 4px; }

  .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .file-row {
    display: flex; align-items: center; gap: 10px; text-decoration: none;
    background: var(--c-surface); border: 1px solid var(--c-border);
    border-radius: 10px; padding: 11px 13px; color: var(--c-text); font-size: .84rem;
  }
  .file-row:hover { border-color: var(--c-blue); }
  .file-row .fr-size { margin-left: auto; font-size: .7rem; color: var(--c-muted); white-space: nowrap; }

  .poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .poster-tile {
    display: block; text-decoration: none; background: var(--c-surface);
    border: 1px solid var(--c-border); border-radius: 10px; overflow: hidden;
  }
  .poster-tile:hover { border-color: var(--c-blue); }
  .poster-tile img { display: block; width: 100%; height: 110px; object-fit: cover; object-position: top left; background: var(--c-navy-light); }
  .poster-tile .pt-label { padding: 9px 11px; font-size: .78rem; color: var(--c-text); line-height: 1.35; }

  .prog-attrib {
    margin-top: 26px; padding: 13px 15px; border-radius: 10px;
    background: var(--c-surface); border: 1px solid var(--c-border);
    font-size: .74rem; line-height: 1.55; color: var(--c-muted);
  }
  .prog-empty { color: var(--c-muted); padding: 30px; text-align: center; }
</style>
</head>
<body>
<div id="wren-content">
  <div class="page-header">
    <div class="page-title">📖 Teaching Programmes</div>
  </div>
  <p style="color:var(--c-muted);font-size:.88rem;margin:-6px 0 18px;max-width:640px">
    Taught sequences the school has been given or bought in — the lessons, the slides and
    the films that go with them. Your own weekly plans live on
    <a href="/curriculum.html" style="color:var(--c-blue)">Curriculum</a>.
  </p>

  <div class="prog-wrap" id="prog-area">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function fileSize(n){
  n = Number(n)||0;
  if (n >= 1073741824) return (n/1073741824).toFixed(1) + ' GB';
  if (n >= 1048576)    return (n/1048576).toFixed(n>=10485760?0:1) + ' MB';
  if (n >= 1024)       return Math.round(n/1024) + ' KB';
  return n + ' B';
}

var TICKET = '';
function mediaUrl(p, download){
  return '/api/setting-content/file?path=' + encodeURIComponent(p)
       + (download ? '&download=1' : '') + (TICKET ? '&t=' + encodeURIComponent(TICKET) : '');
}

function fileRow(f, icon){
  if (!f || !f.path) return '';
  return '<a class="file-row" href="' + mediaUrl(f.path, true) + '" target="_blank" rel="noopener">' +
         '<span>' + (icon || '📄') + '</span>' +
         '<span>' + esc(f.label || f.path.split('/').pop()) + '</span>' +
         (f.bytes ? '<span class="fr-size">' + fileSize(f.bytes) + '</span>' : '') +
         '</a>';
}

function renderProgramme(p){
  var lessons = (p.lessons || []).filter(function(l){ return l.available !== false; });
  var html = '';

  html += '<div class="prog-hero">' +
            '<h2>' + esc(p.title || p.slug) + '</h2>' +
            (p.subtitle ? '<p class="prog-sub">' + esc(p.subtitle) + '</p>' : '') +
            '<div class="prog-tags">' +
              (p.age_range ? '<span class="prog-tag">' + esc(p.age_range) + '</span>' : '') +
              (p.subjects||[]).map(function(s){ return '<span class="prog-tag">' + esc(s) + '</span>'; }).join('') +
              '<span class="prog-tag">' + lessons.length + ' lesson' + (lessons.length===1?'':'s') + '</span>' +
            '</div>' +
            (p.front_door ? '<a class="prog-front" href="' + mediaUrl(p.front_door.path, true) +
                            '" target="_blank" rel="noopener">📘 ' + esc(p.front_door.label) +
                            (p.front_door.pages ? ' (' + p.front_door.pages + ' pages)' : '') + '</a>' : '') +
          '</div>';

  if (lessons.length) {
    html += '<div class="prog-section-title">The lessons, in order</div><div class="lesson-grid">';
    lessons.forEach(function(l){
      var vids = (l.videos_class||[]).length + (l.videos_staff||[]).length;
      html += '<a class="lesson-card" href="/curriculum-lesson.html?lesson=' + encodeURIComponent(l.slug) + '">' +
                '<span class="lesson-n">Lesson ' + esc(l.n) + '</span>' +
                '<div class="lesson-title">' + esc(l.title) + '</div>' +
                (l.subtitle ? '<div class="lesson-sub">' + esc(l.subtitle) + '</div>' : '') +
                '<div class="lesson-meta">' +
                  '<span>🖼 ' + (l.slide_count||0) + ' slides</span>' +
                  '<span>📝 ' + (l.notes_count||0) + ' with notes</span>' +
                  '<span>🎬 ' + vids + ' film' + (vids===1?'':'s') + '</span>' +
                '</div>' +
              '</a>';
    });
    html += '</div>';
  }

  if ((p.posters||[]).length) {
    html += '<div class="prog-section-title">Posters — print the one you want</div><div class="poster-grid">';
    p.posters.forEach(function(po){
      html += '<a class="poster-tile" href="' + mediaUrl(po.file, true) + '" target="_blank" rel="noopener">' +
                (po.thumb ? '<img src="' + mediaUrl(po.thumb) + '" alt="' + esc(po.title) + '" loading="lazy">' : '') +
                '<div class="pt-label">' + esc(po.title) + '</div>' +
              '</a>';
    });
    html += '</div>';
  }

  if ((p.printables||[]).length) {
    html += '<div class="prog-section-title">Printables</div><div class="file-grid">' +
            p.printables.map(function(f){ return fileRow(f, '📄'); }).join('') + '</div>';
  }

  if ((p.rewards||[]).length) {
    html += '<div class="prog-section-title">At the end of the programme</div><div class="file-grid">' +
            p.rewards.map(function(f){ return fileRow(f, '🏅'); }).join('') + '</div>';
  }

  if (p.attribution) html += '<div class="prog-attrib">' + esc(p.attribution) + '</div>';
  return html;
}

async function loadProgrammes(){
  var area = document.getElementById('prog-area');
  try {
    var list = await Wren.api('/api/setting-content/programmes');
    if (!Array.isArray(list) || !list.length) {
      area.innerHTML = '<div class="prog-empty">' +
        '<div style="font-size:2rem;margin-bottom:8px">📖</div>' +
        '<div>No teaching programmes have been added for this school yet.</div></div>';
      return;
    }
    try {
      var t = await Wren.api('/api/setting-content/media-ticket');
      TICKET = (t && t.ticket) || '';
    } catch (e) { /* files still open in a new tab with the session header */ }

    var full = await Promise.all(list.map(function(p){
      return Wren.api('/api/setting-content/programmes/' + encodeURIComponent(p.slug)).catch(function(){ return null; });
    }));
    area.innerHTML = full.filter(Boolean).map(renderProgramme).join('<hr style="border:0;border-top:1px solid var(--c-border);margin:28px 0">');
  } catch (e) {
    area.innerHTML = '<div class="alert alert-danger">Could not load teaching programmes.</div>';
  }
}

document.addEventListener('wren:ready', loadProgrammes);
</script>
</body>
</html>
