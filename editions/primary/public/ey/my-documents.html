<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="wren-edition"   content="ladn">
  <meta name="wren-app-page"  content="more">
  <meta name="wren-app-title" content="My Documents">
  <meta name="wren-app-chat"  content="off">
  <title>My Documents · Wren</title>
  <link rel="stylesheet" href="/css/wren.css">
  <script src="/js/wren-theme.js"></script>
  <link rel="stylesheet" href="/css/wren-app-shell.css?v=20260727">
  <style>
    #ey-mydocs-page { padding: 12px 12px env(safe-area-inset-bottom, 16px); }
    .md-intro {
      background: rgba(74,154,191,.12); border: 1px solid rgba(74,154,191,.3);
      border-radius: 14px; padding: 16px; margin-bottom: 16px;
    }
    .md-intro .lbl { font-size: 11px; color: #4a9abf; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .md-intro .big { font-size: 17px; font-weight: 800; color: var(--c-text); margin-top: 2px; }
    .md-intro .sub { font-size: 13px; color: var(--c-text-dim, #94a3b8); margin-top: 4px; }
  </style>
</head>
<body data-portal="ey">

<div id="ey-mydocs-page">
  <div class="md-intro">
    <div class="lbl">Your file</div>
    <div class="big" id="md-name">My Documents</div>
    <div class="sub">Your certificates, contract and other documents. Upload your own files here (e.g. a new first-aid certificate) — they'll be visible to managers.</div>
  </div>
  <div id="mydocs-panel"><div style="color:#94a3b8;font-size:.85rem;padding:8px 0">Loading…</div></div>
</div>

<script src="/js/wren-core.js?v=20260704"></script>
<script src="/icons/wren-icons.js?v=b146" defer></script>
<script src="/js/wren-app-shell.js?v=20260717" defer></script>
<script src="/js/person-documents-panel.js?v=b104" defer></script>
<script>
  document.addEventListener('wren:ready', function () {
    var user = Wren.getUser ? Wren.getUser() : (Wren.user || null);
    if (!user || !user.id || !window.WrenPersonDocs) {
      document.getElementById('mydocs-panel').innerHTML = '<div style="color:#ef4444;padding:12px">Could not identify the logged-in user.</div>';
      return;
    }
    if (user.name) document.getElementById('md-name').textContent = user.name;
    var isMgr = ['manager','deputy_manager','headteacher','business_manager'].includes(user.role);
    WrenPersonDocs.mount({
      el: '#mydocs-panel',
      subjectType: 'staff',
      subjectId: user.id,
      getToken: function () { return Wren.getToken ? Wren.getToken() : sessionStorage.getItem('wrenToken'); },
      mode: isMgr ? 'admin' : 'staff',
      canManage: isMgr,
      canUpload: true,
      canDeleteOwn: true,
    });
  });
</script>
</body>
</html>
