<link rel="stylesheet" href="games.css">
<script>
/* set the theme before first paint, so there is never a white flash on a dark tablet */
(function () {
  try {
    var d = JSON.parse(localStorage.getItem('wren-kids.v1') || 'null');
    var t = d && d.settings && d.settings.theme;
    if (t) document.documentElement.setAttribute('data-kids-theme', t);
  } catch (e) { /* storage blocked: the media query decides */ }
})();
</script>
</head>
<body>

<main id="view" tabindex="-1">
  <div class="k-wrap"><p class="k-empty">Loading the games…</p></div>
</main>

<noscript>
  <div class="k-wrap">
    <h1>Wren Kids</h1>
    <p>These games need JavaScript. Everything about them — what each one teaches, and which part of the
       curriculum it covers — is on the <a href="curriculum.html">curriculum page</a>, and our free
       printable resources at <a href="https://getwren.co.uk/resources">getwren.co.uk/resources</a>
       need no JavaScript at all.</p>
  </div>
</noscript>
